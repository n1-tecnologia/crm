# Limite de taxa e máscara de segredo das rotas públicas do apps/api.
#
# Instalado por preparar-vps.sh em /etc/nginx/conf.d/n1-crm-limites.conf, que o
# nginx.conf padrão inclui no contexto `http`. Zonas e mapas são do contexto
# `http`: o mesmo arquivo serve produção e homologação, e os baldes por IP são
# compartilhados entre os dois sites (aceitável: a passada exploratória não faz
# carga). Quem USA as zonas é o `location /v1/public/` de nginx-n1-crm-api.conf.
# Roteiro e prova: apps/api/deploy/CONTEXT.md, seção "Limite e máscara no nginx".
#
# POR IP SÓ O POST (D-19, D-20)
#   Uploads e submissões (`POST`) vêm direto do navegador de quem preenche o
#   Formulário: o IP é o do visitante, e 30 por minuto (burst 10) barra a
#   enumeração de segredo e a enxurrada. O `GET` de /f/<segredo> e /p/<segredo>
#   é feito pelo SERVIDOR da Vercel (duas vezes por visita) e chega de um IP só:
#   com 30r/m todos os visitantes dividiriam um balde de ~15 visitas por minuto.
#   Por isso o `GET`/`HEAD` tem zona própria, com teto de 120r/m e burst 60 —
#   acima dos limites em memória do apps/api (30/min no Formulário, 60/min na
#   Tarefa pública), de modo que o nginx só corta enxurrada antes do Node e o
#   limite em memória segue como segunda camada. A chave vazia não conta: um
#   método fora da zona (`OPTIONS` do preflight) não entra em balde nenhum.
#
# MÁSCARA DO SEGREDO (D-18)
#   O segmento depois de /v1/public/forms/ e /v1/public/tasks/ é o segredo do
#   link. O `log_format` abaixo troca esse segmento por `***` — a mesma regra de
#   `mascararSegredoDeUrl` em @n1/dominio. Fica de fora do formato tudo o que
#   carrega a URI crua: `$request` (contém a URI) e `$http_referer` (pode trazer
#   /f/<segredo>).

# Chave por método: vazia = não conta no balde.
map $request_method $n1_chave_de_envio {
    default "";
    POST    $binary_remote_addr;
}

map $request_method $n1_chave_de_leitura {
    default "";
    GET     $binary_remote_addr;
    HEAD    $binary_remote_addr;
}

limit_req_zone $n1_chave_de_envio   zone=n1_publico:10m rate=30r/m;
limit_req_zone $n1_chave_de_leitura zone=n1_publico_leitura:10m rate=120r/m;

map $request_uri $n1_uri_mascarada {
    default $request_uri;
    ~^(?<antes>/v1/public/(?:forms|tasks)/)[^/?]+(?<depois>.*)$ "${antes}***${depois}";
}

log_format n1_mascarado '$remote_addr [$time_local] "$request_method $n1_uri_mascarada $server_protocol" $status $body_bytes_sent $request_time';
