# apps/api na VPS — instalado por preparar-vps.sh em /etc/nginx/sites-available/n1-crm-api.
# O certbot acrescenta o bloco 443 e o redirecionamento de http na primeira emissão;
# depois disso o arquivo da VPS é a fonte, e preparar-vps.sh não o reescreve:
# esta mudança (limite e máscara das rotas públicas) vai à mão (09-20) — ver
# deploy/CONTEXT.md, seção "Limite e máscara no nginx". As zonas, o map e o
# log_format que este arquivo usa moram em n1-crm-limites.conf (conf.d).
#
# Todas as rotas passam: com a interface na Vercel, é o navegador que chama
# /estado e /operacoes direto. Quem barra é o JWT (e o CORS por allowlist),
# não o nginx — ver docs/08-migracao-financeiro/05-topologia-e-regiao.md §3.
# Só /v1/public/ (sem login) tem limite de taxa na borda.
server {
    listen 80;
    server_name __DOMINIO__;

    # O extrato (POST /financeiro/extratos/:origem) aceita até 25 MiB.
    client_max_body_size 26M;

    # O formato mascarado troca o segredo do link por *** (n1-crm-limites.conf).
    access_log /var/log/nginx/__SITE__.access.log n1_mascarado;
    error_log  /var/log/nginx/__SITE__.error.log;

    # Rotas públicas (Formulário e Tarefa por link): limite por IP e sem o
    # segredo em nenhum log.
    #   - POST: 30/min por IP, burst 10. GET/HEAD: teto próprio de 120/min, burst 60
    #     (a Vercel chama o GET por um IP só — ver n1-crm-limites.conf).
    #   - O limit_req escreve a linha do pedido (com o segredo) no error_log a cada
    #     rejeição, e um erro de proxy escreve a mesma: `limit_req_log_level info`
    #     tira as rejeições do log e `error_log … crit` tira os erros de proxy
    #     desta rota. Custo: erro de proxy aqui não aparece no log do nginx (a api
    #     registra os dela).
    location /v1/public/ {
        limit_req zone=n1_publico burst=10 nodelay;
        limit_req zone=n1_publico_leitura burst=60 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        error_log /var/log/nginx/__SITE__.publico.error.log crit;

        proxy_pass         http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # O apps/api só confia no X-Forwarded-For vindo do loopback
        # (TRUST_PROXY=loopback) e lê da direita: vale o IP que este nginx viu.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass         http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # O apps/api só confia no X-Forwarded-For vindo do loopback
        # (TRUST_PROXY=loopback) e lê da direita: vale o IP que este nginx viu.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
