# Evolution API — instalado por preparar-vps-evolution.sh em
# /etc/nginx/sites-available/evolution-api (a VPS é só da Evolution).
# O certbot acrescenta o bloco 443 e o redirecionamento de http na primeira
# emissão; depois disso o arquivo da VPS é a fonte.
server {
    listen 80;
    server_name __DOMINIO__;

    # Mídia (imagem, áudio, documento) chega pelos webhooks e pelo envio.
    client_max_body_size 50M;

    access_log /var/log/nginx/evolution-api.access.log;
    error_log  /var/log/nginx/evolution-api.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
