<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma do CRM N1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a casca do CRM N1 (cabeçalho fixo, barra de filtros, um corpo que rola) com peças soltas de contorno fino; o card de detalhe abre à direita (no celular, de baixo). Tema escuro da marca N1. */
:root {
  color-scheme: dark;
  --page: #0f0f10;
  --card: #17171a;
  --card-alto: #1d1d21;
  --lav-3: rgba(255,255,255,.03);
  --lav-5: rgba(255,255,255,.05);
  --lav-8: rgba(255,255,255,.08);
  --linha: rgba(255,255,255,.09);
  --linha-forte: rgba(255,255,255,.18);
  --texto: #ffffff;
  --texto-1: #e6e6e8;
  --texto-2: #c8c8cc;
  --texto-3: #98989f;
  --texto-4: #7c7c84;
  --acento: #c084fc;
  --acento-lav: rgba(192,132,252,.14);
  --acento-borda: rgba(192,132,252,.5);
  --degrade: linear-gradient(135deg, #7a00a3, #9601c5);
  --aviso: #fbbf24;
  --sucesso: #4ade80;
  --sucesso-lav: rgba(74,222,128,.12);
  --aviso-lav: rgba(251,191,36,.12);
  --fim-semana: rgba(255,255,255,.025);
  --feriado: rgba(251,191,36,.07);
  --veu: rgba(0,0,0,.55);
  --c-dom: #7dd3fc;
  --c-banco: #f9a8d4;
  --c-api: #86efac;
  --c-web: #fcd34d;
  --c-infra: #a5b4fc;
  --c-dec: #fca5a5;
  --c-voce: #fdba74;
  --fonte-corpo: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --fonte-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --sombra: 0 6px 18px rgba(0,0,0,.35);
  --dia: 16px;
  --rotulo: 300px;
}
@media (max-width: 720px) { :root { --dia: 12px; --rotulo: 150px; } }

* { box-sizing: border-box; }
/* O que está marcado como oculto fica oculto, mesmo com display definido (o card e o véu). */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--texto-1);
  font-family: var(--fonte-corpo);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--fonte-mono); font-variant-numeric: tabular-nums; }

/* Casca */
.app { display: flex; flex-direction: column; height: 100%; }
.cabecalho {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--page); border-bottom: 1px solid var(--linha);
  padding-inline: 16px;
}
.cabecalho-linha {
  max-width: 1440px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 14px 10px;
}
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marca-selo {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: var(--degrade); display: grid; place-items: center;
  font-weight: 700; font-size: 12px; color: #fff; letter-spacing: -.02em;
}
h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; color: var(--texto); text-wrap: balance; }
.resumo { color: var(--texto-3); font-size: 12.5px; }
.resumo b { color: var(--texto-1); font-weight: 600; }
.espaco { flex: 1 1 auto; }
.segmentos { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--linha); border-radius: 10px; background: var(--lav-3); }
.segmentos button {
  border: 0; background: transparent; cursor: pointer; padding: 5px 12px; border-radius: 7px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-3);
}
.segmentos button[aria-pressed="true"] { background: var(--lav-8); color: var(--texto); }
.segmentos button:hover { color: var(--texto); }
.filtros { max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 0 12px; }
.busca {
  flex: 1 1 220px; max-width: 320px; min-width: 0; height: 32px; padding: 0 12px; border-radius: 9px;
  border: 1px solid var(--linha); background: var(--lav-3); color: var(--texto-1); font: inherit; font-size: 13px;
}
.busca::placeholder { color: var(--texto-4); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--linha); background: transparent; font-size: 12px; color: var(--texto-2);
}
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--cor); flex: none; }
.chip[aria-pressed="true"] { border-color: var(--cor); color: var(--texto); background: color-mix(in srgb, var(--cor) 12%, transparent); }
.btn {
  height: 28px; padding: 0 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--linha); background: var(--lav-3);
  font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-2);
}
.btn:hover { color: var(--texto); border-color: var(--linha-forte); }
.corpo { flex: 1 1 auto; overflow: auto; padding-inline: 16px; padding-block: 16px 48px; }
.conteudo { max-width: 1440px; margin: 0 auto; }

/* Lista */
.pilha { display: flex; flex-direction: column; gap: 8px; }
.peca { border: 1px solid var(--linha); border-radius: var(--r); background: var(--card); box-shadow: var(--sombra); }
.linha {
  display: grid; grid-template-columns: 28px minmax(0,1fr) auto; align-items: center; gap: 10px;
  padding: 10px 14px 10px 8px; cursor: pointer; border-radius: var(--r); transition: background .15s;
}
.linha:hover { background: var(--lav-3); }
.linha[data-ativa="true"] { background: var(--acento-lav); }
.seta { width: 28px; height: 28px; border-radius: 7px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--texto-3); }
.seta:hover { background: var(--lav-8); color: var(--texto); }
.seta svg { width: 14px; height: 14px; transition: transform .18s; }
.seta[aria-expanded="true"] svg { transform: rotate(90deg); }
.seta[disabled] { visibility: hidden; }
.linha-principal { display: flex; align-items: center; gap: 10px; min-width: 0; }
.num { font-family: var(--fonte-mono); font-size: 11.5px; font-weight: 600; color: var(--acento); min-width: 34px; flex: none; }
.titulo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--texto); font-weight: 560; }
.sessao > .linha .titulo { font-size: 14.5px; }
.lado { display: flex; align-items: center; gap: 10px; flex: none; color: var(--texto-3); font-size: 12.5px; }
.selo { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--linha); color: var(--texto-3); white-space: nowrap; }
.selo.aviso { color: var(--aviso); border-color: color-mix(in srgb, var(--aviso) 40%, transparent); background: var(--aviso-lav); }
.selo.acento { color: var(--acento); border-color: var(--acento-borda); background: var(--acento-lav); }
.camadas { display: flex; gap: 4px; flex-wrap: wrap; }
.cam { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; padding: 1px 6px; border-radius: 5px; color: var(--cor); background: color-mix(in srgb, var(--cor) 13%, transparent); white-space: nowrap; }
.peso { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.peso.produto { color: var(--aviso); background: var(--aviso-lav); }
.peso.arrumacao { color: var(--texto-3); background: var(--lav-5); }
.peso.decidida { color: var(--sucesso); background: var(--sucesso-lav); }
.selo.ok { color: var(--sucesso); border-color: color-mix(in srgb, var(--sucesso) 40%, transparent); background: var(--sucesso-lav); }
.caixa.decidido { border: 1px solid color-mix(in srgb, var(--sucesso) 45%, transparent); background: var(--sucesso-lav); }
.filhos { padding: 0 10px 10px 36px; display: flex; flex-direction: column; gap: 6px; }
.tarefa { border: 1px solid var(--linha); border-radius: 11px; background: var(--lav-3); }
.tarefa > .linha { padding-block: 7px; border-radius: 11px; }
.subs { padding: 2px 10px 8px 46px; display: flex; flex-direction: column; gap: 2px; }
.sub { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 6px 8px; border-radius: 8px; cursor: pointer; color: var(--texto-2); }
.sub:hover { background: var(--lav-5); color: var(--texto); }
.sub[data-ativa="true"] { background: var(--acento-lav); color: var(--texto); }
.sub-texto { min-width: 0; }
.sub-lado { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.vazio { color: var(--texto-4); font-size: 12.5px; padding: 6px 8px; }
.sem-resultado { color: var(--texto-3); padding: 40px 0; text-align: center; }
@media (max-width: 720px) {
  .linha { grid-template-columns: 28px minmax(0,1fr); }
  .linha .lado { grid-column: 2; flex-wrap: wrap; }
  .filhos { padding-left: 12px; }
  .subs { padding-left: 20px; }
  .sub { grid-template-columns: minmax(0,1fr); }
  .sub-lado { justify-content: flex-start; }
  .esconde-celular { display: none; }
}

/* Gantt */
.gantt-caixa { border: 1px solid var(--linha); border-radius: var(--r); background: var(--card); overflow: auto; max-height: calc(100vh - 190px); position: relative; }
.gantt { position: relative; width: max-content; min-width: 100%; }
.g-cab { position: sticky; top: 0; z-index: 3; display: flex; background: var(--card-alto); border-bottom: 1px solid var(--linha); }
.g-cab-rotulo {
  position: sticky; left: 0; z-index: 4; width: var(--rotulo); flex: none; background: var(--card-alto); border-right: 1px solid var(--linha);
  padding: 8px 12px; color: var(--texto-3); font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; display: flex; align-items: flex-end;
}
.g-escala { position: relative; height: 46px; flex: none; }
.g-mes, .g-semana { position: absolute; white-space: nowrap; }
.g-mes { top: 6px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--texto-2); padding-left: 6px; border-left: 1px solid var(--linha-forte); height: 16px; line-height: 16px; }
.g-semana { top: 26px; font-family: var(--fonte-mono); font-size: 10.5px; color: var(--texto-4); padding-left: 4px; border-left: 1px solid var(--linha); height: 16px; line-height: 16px; }
.g-corpo { position: relative; }
.g-fundo { position: absolute; top: 0; bottom: 0; left: var(--rotulo); pointer-events: none; }
.g-fundo span { position: absolute; top: 0; bottom: 0; width: var(--dia); }
.g-fundo .fds { background: var(--fim-semana); }
.g-fundo .fer { background: var(--feriado); }
.g-fundo .seg { border-left: 1px solid var(--lav-5); width: 0; }
.g-hoje { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed var(--aviso); }
.g-hoje b { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--aviso); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.g-linha { display: flex; position: relative; border-bottom: 1px solid var(--lav-5); }
.g-linha:hover { background: var(--lav-3); }
.g-rotulo {
  position: sticky; left: 0; z-index: 2; width: var(--rotulo); flex: none; background: var(--card); border-right: 1px solid var(--linha);
  display: flex; align-items: center; gap: 4px; padding: 0 10px 0 4px; min-width: 0; cursor: pointer;
}
.g-linha:hover .g-rotulo { background: #1a1a1d; }
.g-rotulo .titulo { font-size: 12.5px; }
.g-rotulo .num { min-width: 30px; font-size: 11px; }
.g-tarefa .g-rotulo { padding-left: 34px; }
.g-tarefa .g-rotulo .titulo { color: var(--texto-2); font-weight: 450; }
.g-trilho { position: relative; height: 34px; flex: none; }
.g-tarefa .g-trilho { height: 28px; }
.barra {
  position: absolute; top: 7px; height: 20px; border-radius: 6px; cursor: pointer;
  background: var(--acento-lav); border: 1px solid var(--acento-borda);
  display: flex; align-items: center; padding: 0 7px; overflow: hidden;
  font-size: 10.5px; font-weight: 600; color: var(--texto); white-space: nowrap;
}
.barra:hover { background: color-mix(in srgb, var(--acento) 26%, transparent); }
.barra.meta { border-color: color-mix(in srgb, var(--aviso) 60%, transparent); }
.barra.trilha { background: transparent; border-style: dashed; color: var(--acento); }
.g-tarefa .barra { top: 6px; height: 16px; background: var(--lav-5); border-color: var(--linha-forte); color: var(--texto-2); font-weight: 500; }
.g-tarefa .barra:hover { background: var(--lav-8); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; color: var(--texto-3); font-size: 12px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }

/* Card */
.veu { position: fixed; inset: 0; background: var(--veu); z-index: 20; }
.card {
  position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(480px, 100%);
  background: var(--card-alto); border-left: 1px solid var(--linha); box-shadow: -12px 0 40px rgba(0,0,0,.45);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (max-width: 720px) { .card { top: auto; width: 100%; max-height: 88vh; border-left: 0; border-top: 1px solid var(--linha); border-radius: 18px 18px 0 0; } }
.card-topo { display: flex; align-items: center; gap: 8px; padding: 14px 16px 0; }
.trilha-nav { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; flex: 1; font-size: 12px; color: var(--texto-4); }
.trilha-nav button { border: 0; background: none; cursor: pointer; color: var(--texto-3); padding: 2px 4px; border-radius: 5px; }
.trilha-nav button:hover { color: var(--texto); background: var(--lav-8); }
.fechar { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--linha); background: var(--lav-3); cursor: pointer; display: grid; place-items: center; color: var(--texto-2); flex: none; }
.fechar:hover { color: var(--texto); }
.card-corpo { overflow: auto; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--acento); }
.card h2 { margin: 4px 0 0; font-size: 20px; line-height: 1.25; font-weight: 650; letter-spacing: -.015em; color: var(--texto); text-wrap: balance; }
.subtitulo { margin-top: 6px; color: var(--texto-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.descricao { color: var(--texto-1); font-size: 14px; line-height: 1.6; max-width: 62ch; margin: 0; }
.info { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 8px 16px; margin: 0; font-size: 13px; }
.info dt { color: var(--texto-4); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
.info dd { margin: 0; color: var(--texto-1); min-width: 0; }
.bloco h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-3); }
.bloco ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; color: var(--texto-2); }
.caixa { border-radius: 10px; padding: 10px 12px; color: var(--texto-1); line-height: 1.55; }
.caixa.pronto { border: 1px solid var(--acento-borda); background: var(--acento-lav); }
.caixa.nota { border: 1px solid color-mix(in srgb, var(--aviso) 40%, transparent); background: var(--aviso-lav); }
.caixa.neutra { border: 1px solid var(--linha); background: var(--lav-3); color: var(--texto-2); }
.bloco .opcoes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.opcoes li { border: 1px solid var(--linha); background: var(--lav-3); border-radius: 9px; padding: 8px 10px; color: var(--texto-1); }
.itens { display: flex; flex-direction: column; gap: 4px; }
.item {
  display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: start; text-align: left;
  border: 1px solid var(--linha); background: var(--lav-3); border-radius: 9px; padding: 8px 10px; cursor: pointer;
}
.item:hover { border-color: var(--linha-forte); background: var(--lav-5); }
.item .num { min-width: 0; }
.item-texto { color: var(--texto-1); font-size: 13px; }
.item-meta { color: var(--texto-4); font-size: 11.5px; white-space: nowrap; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.vocab { display: flex; flex-direction: column; gap: 6px; }
.vocab-linha { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 2px 12px; border: 1px solid var(--linha); background: var(--lav-3); border-radius: 9px; padding: 8px 10px; }
.vocab-linha b { color: var(--texto); font-weight: 600; grid-row: span 2; }
.vocab-linha span { color: var(--texto-1); font-size: 13px; }
.vocab-linha em { font-style: normal; color: var(--texto-3); font-size: 12px; }
code { font-family: var(--fonte-mono); font-size: .86em; background: var(--lav-8); color: var(--texto-1); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.titulo code, .sub-texto code, .item-texto code { font-size: .84em; }
.bloco ol.passos { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; color: var(--texto-1); line-height: 1.55; }
.bloco ol.passos li::marker { color: var(--acento); font-family: var(--fonte-mono); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="cabecalho">
    <div class="cabecalho-linha">
      <div class="marca">
        <span class="marca-selo" aria-hidden="true">N1</span>
        <div>
          <h1>Cronograma do CRM N1</h1>
          <div class="resumo" id="resumo"></div>
        </div>
      </div>
      <span class="espaco"></span>
      <div class="segmentos" role="group" aria-label="Prazos">
        <button type="button" id="modo-plano" aria-pressed="true">Plano</button>
        <button type="button" id="modo-ajuste" aria-pressed="false">Com ajustes</button>
      </div>
      <div class="segmentos" role="group" aria-label="Visualização">
        <button type="button" id="vista-lista" aria-pressed="true">Lista</button>
        <button type="button" id="vista-gantt" aria-pressed="false">Gantt</button>
      </div>
    </div>
    <div class="filtros">
      <input class="busca" id="busca" type="search" placeholder="Buscar tarefa, subtarefa ou arquivo" aria-label="Buscar">
      <div class="chips" id="chips"></div>
      <span class="espaco"></span>
      <button type="button" class="btn" id="expandir">Expandir tudo</button>
    </div>
  </header>
  <main class="corpo">
    <div class="conteudo">
      <div id="lista" class="pilha"></div>
      <div id="gantt-area" hidden>
        <div class="gantt-caixa" id="gantt-caixa"></div>
        <div class="legenda">
          <span><i style="background:var(--acento-lav);border:1px solid var(--acento-borda)"></i>Sessão</span>
          <span><i style="border:1px dashed var(--acento)"></i>Reunião e levantamento de escopo da IA</span>
          <span><i style="background:var(--acento-lav);border:1px solid var(--aviso)"></i>Depende de aprovação da Meta</span>
          <span><i style="background:var(--fim-semana);border:1px solid var(--linha)"></i>Fim de semana</span>
          <span><i style="background:var(--feriado);border:1px solid var(--linha)"></i>Feriado</span>
          <span>As datas das tarefas são uma divisão estimada dentro da sessão.</span>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="veu" id="veu" hidden></div>
<aside class="card" id="card" hidden role="dialog" aria-modal="true" aria-labelledby="card-titulo"></aside>

<script>
(function () {
  "use strict";

  // Gerado por docs/09-planejamento/gerar.mjs a partir de dados/tarefas.mjs. Não edite à mão.
  var SESSOES = /*DADOS:INICIO*/[{"id":"0","n":"Fechar o v1.0 e abrir o novo marco","dias":[1,1],"dep":[],"desc":"O GSD (a ferramenta de planejamento que vive em `.planning/`) está no marco v1.0, com 9 fases (0 a 8): 6 concluídas e 3 abertas. A Fase 08 (Canais) terminou o código e espera a UAT do dono; a Fase 02 (Solicitação de pagamento) tem o ensaio de duas semanas e o corte do ClickUp por fazer; a Fase 04 (telas do Financeiro) tem o corte do painel `financeiro-tria.vercel.app` só preparado. Esta sessão fecha a 08, dá destino às 02 e 04 e abre o v2.0 com as sessões deste plano.","partida":["`.planning/STATE.md`: `status: verifying`, Fase 08, 147 de 148 planos com resumo; o único sem resumo é `02-28-PLAN.md`.","`08-UAT.md` (em `.planning/phases/08-canais-de-comunica-o-conex-o-e-omnichannel-preparado/`): 4 testes, todos `[pending]`. `08-VERIFICATION.md`: `status: human_needed`, 13 de 13 verdades verificadas no código, nenhum gap.","`.planning/WINDOWS.md`: `open_count: 2` (a UAT da 08 e um teste instável); o `/gsd-ship` fica bloqueado enquanto houver janela aberta.","Fase 02: `02-27-PLAN.md` com as Tasks 1 e 2 feitas e a Task 3 (o ensaio real de 14 dias) aberta; `02-28-PLAN.md` (o corte) nunca executado.","Fase 04: `04-14-PLAN.md` parou antes do passo irreversível, por decisão do dono; `04-UAT.md` com 13 de 13 testes aprovados."],"pronto":"`.planning/WINDOWS.md` com `open_count: 0`; `.planning/ROADMAP.md` com o v1.0 arquivado e o v2.0 listando as 17 sessões deste plano como fases; o destino das Fases 02 e 04 escrito em `.planning/STATE.md`.","tarefas":[{"id":"0.1","n":"Verificar e fechar a Fase 08","objetivo":"A Fase 08 tem todo o código verificado, mas a UAT de fim de fase nunca rodou no app real: as 4 linhas de `08-UAT.md` estão `[pending]` e a coluna “Resultado” do roteiro de `08-PROVAS.md` está em branco. Esta tarefa faz a UAT com você, corrige o que ela apontar, fecha as observações baratas da revisão de código e marca a fase concluída.","pronto":"`08-UAT.md` co de o plano `02-14` (`/ia/aprovacoes` e o cartão de Aprovação na Tarefa).","pronto":"Cada uma das duas fases tem o destino escrito em `.planning/STATE.md`, e o que ficou para depois virou fase ou item de backlog do v2.0.","subs":[{"n":"Escrever a lista do que falta na Fase 02","cam":[],"hoje":"`02-27-SUMMARY.md`: Tasks 1 e 2 feitas (código de integração Omie determinístico, `ConsultarContaPagar` antes de `IncluirContaPagar`, `npm run reconciliar`); Task 3 aberta: escrever `docs/08-migracao-financeiro/06-ensaio-e-coortes.md` e operar 14 dias de ensaio. Ninguém produz ainda o `--resumo=\u003cjson>` diário que `npm run reconciliar` precisa para o lado do `automation/`. `02-28-PLAN.md` (corte: runbook `07-runbook-corte-e-rollback.md`, desligar os webhooks Tria do ClickUp, arquivar a Lista de Solicitação, reavaliar a decisão D12, fechar SOL-01 a SOL-09) nunca rodou. Em `REQUIREMENTS.md`, SOL-01, 02, 03, 04, 07 e 08 seguem sem `[x]`, embora o código exista.","fazer":["Copiar para `STATE.md`, numa seção “Fase 02 — o que falta”, os quatro itens acima, cada um com dono (você ou o time) e tempo de calendário.","Listar os pré-requisitos do ensaio que o `STATE.md` já cita: emitir a credencial de serviço do `automation/` (`npm run credencial -w @n1/api`), ligar `PAYMENT_REQUEST_SOURCE=plataforma` para a coorte nova e fixar `FALLBACK_COMENTARIO_ATE` no deploy."],"pronto":"A seção existe em `STATE.md`, com dono e prazo por item."},{"n":"Escrever a lista do que falta na Fase 04","cam":[],"hoje":"`04-14-SUMMARY.md` e `STATE.md`: o runbook `docs/08-migracao-financeiro/06-runbook-corte-painel-financeiro.md` está escrito; a migração `../financeiro-tria/supabase/migrations/20261001120000_remove_anon_read_painel.sql` existe e nunca foi aplicada. Faltam: uma semana de uso real das oito telas pelo Financeiro; rodar as duas consultas de RLS no Supabase Studio e colar o resultado no runbook; pausar (não apagar) `financeiro-tria.vercel.app` por 30 dias; só então remover as rotas legadas e o `AuthContext` e aplicar a migração. A policy de `conciliador_contas` se chama `anon read conciliador_contas`, com espaços: um `drop policy anon_read` literal não a remove.","fazer":"Copiar esses cinco passos para `STATE.md`, numa seção “Fase 04 — o que falta”, com dono e data de cada um.","pronto":"A seção existe em `STATE.md`, com dono e data por passo."},{"n":"Listar as pendências de fases já marcadas como concluídas","cam":[],"hoje":"O `ROADMAP.md` marca `[x]` em fases que ainda têm passos abertos: `05-05` (corte de Marcos Paulo e Family Office: deploy, webhooks, 48 h e arquivamento pendentes), `05-10` Task 4 (ligar o relógio de Contas a receber: ensaio, ler o relato e `npm run automacoes:liberar`), e RES-03 da Fase 6 (verificação humana do passo 2B em `lancar`). PERS-08 (onde o `apps/api` roda) segue sem `[x]` em `REQUIREMENTS.md`, mas o `apps/api` já está na VPS (`apps/api/deploy/CONTEXT.md`).","fazer":["Marcar PERS-08 como concluído em `REQUIREMENTS.md`, com a prova `apps/api/deploy/CONTEXT.md`.","Juntar `05-05`, `05-10` Task 4 e RES-03 à mesma decisão da subtarefa seguinte."],"pronto":"Nenhum requisito do v1.0 fica sem status quando o `/gsd-audit-milestone` rodar."},{"n":"O que fazer com o que falta do Financeiro?","cam":["dec"],"decisao":true,"hoje":"O código das Fases 02 e 04 está pronto. O que falta é operação com dado real e dois cortes irreversíveis. Somado: cerca de 1,5 dia de trabalho do time e 3 a 6 semanas de calendário com o Financeiro usando.","opcoes":["(A) Terminar antes de começar o v2.0","(B) Levar para o v2.0 como uma trilha paralela “Financeiro: ensaio e cortes”, sem bloquear as sessões","(C) Encerrar as duas fases como estão e registrar o que ficou de fora como backlog"],"muda":"(A) adia o início da Sessão 1 em 3 a 6 semanas. (B) acrescenta uma trilha no cronograma, com cerca de 1,5 dia de trabalho espalhado e o resto em tempo de calendário; o time não para. (C) não muda as datas, mas o ClickUp e o painel antigo continuam ligados sem data para tem RLS e o `apps/api` conecta como `postgres`; não há onde guardar token de provedor; o log grava o segredo que vai na URL das rotas públicas; o limite de taxa vive só na memória do processo; e só existe produção, sem alerta de erro.","partida":["O token do Supabase é verificado em toda requisição (`verificarTokenDoSupabase`, `apps/api/src/autenticacao/verificar-token.ts`, por `auth.getClaims`).","O Espaço de Trabalho vem de `WORKSPACE_ID` no servidor, nunca do cliente (`apps/api/src/plugins/autenticacao.ts:78`).","O ator de uma operação é o Membro da sessão, e os argumentos passam por schema zod próprio de cada operação (`apps/api/src/rotas/operacoes.ts:284`).","`GET /estado` já recorta Espaço, Pasta, Lista, Tarefa, Atividade, Aprovação e Arquivo pelo alcance do Membro (`visibilidadePara`, `packages/dominio/src/derive-visibilidade.ts:36`).","As rotas do CRM novo leem o Papel no banco a cada chamada (`exigir`, `apps/api/src/servicos/crm/acesso.ts:39`).","Os segredos dos links públicos são aleatórios (`crypto.getRandomValues`, `packages/dominio/src/operations/scale.ts:46`).","Anexos ficam em bucket privado e saem por URL assinada, autorizada por Tarefa (`GET /anexos/:fileId/url`, `apps/api/src/rotas/estado.ts:70`).","A tela não consulta o banco: usa o Supabase só para login (não há `.from(` nem `.storage` em `apps/web/src`)."],"pronto":"Um teste em `apps/api` prova que o Membro A não recebe Sessão de Chat, Memória de Usuário, e-mail de convite nem segredo de link do Membro B, nem por `GET /estado` nem por `POST /operacoes`; `select has_schema_privilege('anon','plataforma','USAGE')` responde `false`; a `009` está aplicada em homologação e em produção; uma credencial gravada pelo cofre aparece cifrada no banco; nenhum log tem segredo de URL; homologação responde com login; um erro forçado chega como alerta.","tarefas":[{"id":"1.1","n":"Fechar o que o `GET /estado` envia a mais","objetivo":"`visibilidadePara` (`packages/dominio/src/derive-visibilidade.ts:36`) só recorta a Estrutura; o resto do `DataState` vai inteiro para todo Membro logado, inclusive o que é pessoal de outro Membro e segredos de link. O recorte passa a tirar o que é pessoal e a esconder campos de segredo, e a mesma regra vale para a resposta de `POST /operacoes`.","pronto":"Um teste em `apps/api/src/rotas/estado.test.ts`, com dois Membros reais no Postgres local, prova que nenhum recebe a Sessão de Chat, a pasta de chat, a Memória de Usuário nem a Visão pessoal do outro, e que um Membro sem administrar a Lista não recebe `publicShare.secret` nem `Form.secret`.","subs":[{"n":"Filtrar as Sessões de Chat e as pastas de chat no recorte de visibilidade","cam":["dom"],"hoje":"`visibilidadePara` devolve `state.chatSessions` e `state.chatFolders` inteiros (o comentário em `derive-visibilidade.ts:18-20` diz que IA não é recortada). Quem esconde é a tela: `apps/web/src/features/shell/app-shell.tsx:915-920` filtra por `ownerMemberId`, e a regra de quem pode ler uma Sessão (DO-CHT-09: só o dono e quem a recebeu compartilhada) mora só na página `apps/web/src/app/(shell)/ia/chat/[sessao]/page.tsx:126-132`.","fazer":["Criar `membroVeSessaoDeChat(state, memberId, sessao)` em `packages/dominio/src/derive.ts`, com a regra da página: dono, ou `sharedWithMemberIds` contém o Membro, ou uma Equipe de `sharedWithTeamIds` o contém.","Em `visibilidadePara`, manter só as Sessões que passam nessa regra e só as `chatFolders` com `ownerMemberId` igual ao Membro; pôr os ids que saem em `ocultos`.","A página `ia/chat/[sessao]/page.tsx` passa a chamar `membroVeSessaoDeChat` em vez da conta própria."],"pronto":"Teste em `packages/dominio/src/derive-visibilidade.test.ts`: o Membro A não recebe a Sessão do Membro B; recebe quando B a compartilha com A ou com uma Equipe de A; nunca recebe a pasta de chat de B.","nota":"O diálogo de remover Membro (`apps/web/src/app/(shell)/configuracoes/membros/page.tsx`) usa `previewSuccession`, que conta as Sessões de Chat do outro Membro (`packages/dominio/src/operations/members.ts:93`). Com o recorte, a tela passa a contar zero: tirar esse número do texto do diálogo."},{"n":"Esconder a Memória de Usuário, os e-mails de convite e as Visões pessoais dos outros Membros","cam":["dom"],"hoje":"Cada `Member` vai com `userMemory` (`packages/dominio/src/types/workspace.ts:126`) e, se pendente, `invitedIdentity` (`:114`). O convite grava o e-mail também em `displayName` (`members.ts:521`), então esconder só `invitedIdentity` não basta. As Visões com `ownerKind: “member”` (Visão pessoal, `packages/dominio/src/types/structure.ts:113`) também vão para todos.","fazer":["Criar `recortarRegistro(colecao, dados, state, memberId)` em `derive-visibilidade.ts`, que devolve uma cópia sem os campos que o Membro não pode ler.","Para `members`: nos outros Membros, `userMemory` vira `{ enabled, items: [] }`; para quem não tem Papel base Administrador ou Proprietário, um Membro `pendente` perde `invitedIdentity` e o `displayName` vira “Convite pendente”.","Para `views`: tirar as Visões `ownerKind: “member”` de outro Membro e pôr os ids em `ocultos`.","`visibilidadePara` aplica `recortarRegistro` a cada coleção antes de devolver."],"pronto":"Teste em `derive-visibilidade.test.ts`: um Membro comum vê a própria `userMemory` com itens e a de outro vazia, não vê o e-mail de um convite pendente e não recebe a Visão pessoal de outro; um Administrador vê o e-mail do convite."},{"n":"Esconder os segredos dos links públicos de quem não administra a Lista","cam":["dom"],"hoje":"`Task.publicShare.secret` (`packages/dominio/src/types/structure.ts:349`) e `Form.secret` (`:148`) vão para todo Membro que vê a Tarefa ou para todos, no caso dos Formulários. Quem pode criar ou renovar esses links é quem administra a Lista (`containerAdminRefusal`, `packages/dominio/src/derive.ts:1053`, usado em `shareTaskPublicly`, `scale.ts:604`, e `rotateFormSecret`, `scale.ts:413`). Os Formulários de Listas que o Membro não alcança também vão.","fazer":["Em `recortarRegistro`: para `tasks`, tirar `publicShare.secret` quando `containerAdminRefusal(state, memberId, “list”, task.listId)` recusa; para `forms`, fazer o mesmo com `secret`.","Em `visibilidadePara`, tirar os Formulários cuja `listId` está em `ocultos`."],"pronto":"Teste em `derive-visibilidade.test.ts`: um Membro de base Membro vê a Tarefa com link público, mas sem `publicShare.secret`; o Administrador da Lista vê o segredo; o Formulário de uma Lista privada não chega a quem não a alcança.","nota":"Conferir antes, com `grep`, que nenhuma tela de quem não administra lê `publicShare.secret` ou `form.secret`; se ler, a tela precisa mostrar “Só quem administra a Lista vê o link”."},{"n":"O que mais o `GET /estado` deve esconder?","cam":["dec","dom"],"decisao":true,"hoje":"Agentes, Automações, Documentos de Conhecimento, Coleções e o CRM antigo (`contacts`, `deals`, `conversations`) vão inteiros para todos, inclusive para Convidados. Não existe regra de quem vê um Agente ou Documento: a concessão de Coleção é dada a Agente, não a Membro (`CollectionGrant`, `packages/dominio/src/types/ai.ts:606`). O CRM antigo sai do código na Sessão 3.","opcoes":["(A) Convidado não recebe nenhuma coleção de IA (`agents`, `automations`, `documents`, `collections`, `skills`); os demais Papéis recebem tudo, como hoje","(B) Criar agora uma regra de visibilidade por registro para Documentos e Agentes (dono, Equipe, compartilhamento)","(C) Deixar como está até as Sessões 13 a 18 (IA)"],"muda":"(A) custa cerca de meio dia, em `visibilidadePara`. (B) custa cerca de 2 dias e pede que você diga quem vê cada Documento. (C) não custa nada agora, mas um Convidado continua lendo os Documentos de Conhecimento. Nas três, o CRM antigo fica como está até a Sessão 3 removê-lo.","recomendo":"(A) agora, e a regra fina de (B) na Sessão 17 (Conhecimento indexado).","peso":"produto"},{"n":"Aplicar o mesmo recorte à resposta de `POST /operacoes`","cam":["api","dom"],"hoje":"`apps/api/src/rotas/operacoes.ts:364-365` filtra o diff só por id (`filtrarDiferenca`, `derive-visibilidade.ts:109`), mas cada `gravados[]` carrega `dados` com o registro inteiro (`RegistroGravado`, `packages/dominio/src/diferenca.ts:17`). Gravar a própria Tarefa devolve o `publicShare.secret`; gravar qualquer coisa que toque outro Membro devolve a `userMemory` dele. E `inviteMember`, que passa por `SERVICOS` (`operacoes.ts:234`), volta sem recorte nenhum, porque `depois` fica indefinido (`operacoes.ts:302-303`). `GET /estado/revisao` devolve só um número e não precisa de recorte.","fazer":["Criar `recortarDiferenca(diferenca, state, memberId)` em `derive-visibilidade.ts`: tira os ids de `ocultos` e passa cada `gravados[].dados` por `recortarRegistro`.","Em `operacoes.ts`, trocar `filtrarDiferenca` por `recortarDiferenca`.","No caminho de `SERVICOS`, recortar também: `convidarMembro` (`apps/api/src/servicos/convidar-membro.ts`) passa a devolver o estado depois da operação, e a rota aplica `recortarDiferenca`."],"pronto":"Teste em `apps/api/src/rotas/operacoes.test.ts`: um Membro sem administrar a Lista grava um Campo de uma Tarefa com link público e a resposta não contém o segredo."},{"n":"Escrever o teste de vazamento de ponta a ponta","cam":["api"],"hoje":"`apps/api/src/rotas/estado.test.ts:140` prova só o recorte da Estrutura (PRIV-03); não há teste de dado pessoal.","fazer":"Em `estado.test.ts` (Postgres local, pula sem `DATABASE_URL`), semear dois Membros, cada um com Sessão de Chat, pasta de chat, item de Memória de Usuário e Visão pessoal, um convite pendente e uma Tarefa com link público; chamar `GET /estado` como cada um e procurar no corpo os ids e segredos do outro.","pronto":"O teste roda no `npm run check` e falha se qualquer um desses dados do outro Membro aparecer."}]},{"id":"1.2","n":"Fechar as escritas sem conferência","objetivo":"Toda operação que grava deveria conferir quem chama, mas a conferência mora dentro de cada uma das cerca de 200 operações de `packages/dominio/src/operations/registro.ts`, e falta em parte delas, sobretudo no CRM antigo. Além disso, um Membro `suspenso` passa pela autenticação (`apps/api/src/plugins/autenticacao.ts:85`) e chega a `POST /operacoes`, onde só é barrado pelas operações que conferem o estado.","pronto":"Um Membro suspenso recebe 403 em qualquer `POST /operacoes`; um Convidado recebe `ok: false` em `trashContact`, `sendMessage` e `winDeal`; a tabela de quem confere o quê cobre todas as operações do registro.","subs":[{"n":"Barrar o Membro suspenso em `POST /operacoes`","cam":["api"],"hoje":"O hook de autenticação deixa passar `ativo` e `suspenso` (`plugins/autenticacao.ts:85`), de propósito: o suspenso consulta. O CRM novo barra a escrita dele (`podeNoCrm`, `packages/dominio/src/crm/permissoes.ts:71`), mas as operações do registro que não olham o estado do Membro gravam, por exemplo `trashContact` (`packages/dominio/src/operations/contacts.ts:333`).","fazer":"Em `apps/api/src/rotas/operacoes.ts`, logo depois de `ehNomeDeOperacao(nome)` (linha 252), responder 403 com “Seu acesso está suspenso: você consulta, mas não altera.” quando `request.membro.state !== “ativo”`. Toda operação do registro grava (regra de inclusão, `registro.ts:7-13`), então a recusa vale para todas.","pronto":"Teste em `operacoes.test.ts`: um Membro suspenso chama `trashContact` e recebe 403, e o Contato continua `ativo` no banco."},{"n":"Pôr a conferência nas operações do CRM antigo","cam":["dom"],"hoje":"`contacts.ts` tem uma conferência de Papel em 19 operações (perto da linha 981); `conversations.ts`, uma em 11 (perto da linha 700); `deals.ts` tem `mayWriteDeal` (`deals.ts:34`) mas não o chama em `moveDealToStage` (`:131`), `winDeal` (`:194`), `loseDeal` (`:236`), `removeStage` e `migrateDealsToFunnel`. Exemplos sem nada: `trashContact` (`contacts.ts:333`), `addContactNote` (`contacts.ts:761`), `sendMessage` (`conversations.ts:164`), `resolveConversation` (`conversations.ts:257`). O plano anterior dizia que `collaboration.ts` não confere nada: confere, por `activeTask` (`collaboration.ts:15`), que chama `taskWriteRefusal`.","fazer":["Mover `mayWriteDeal` para um arquivo novo `packages/dominio/src/operations/crm-antigo.ts`, com o nome `recusaDeEscritaNoCrmAntigo` (Membro `ativo` e Papel base diferente de Convidado, a mesma regra de `podeNoCrm` para escrita).","Chamar essa recusa na primeira linha de toda operação de `contacts.ts`, `conversations.ts` e `deals.ts` que ainda não confere."],"pronto":"Um teste por arquivo (`contacts.test.ts`, `conversations.test.ts`, `deals.test.ts`, criando os que não existem): um Convidado chama `trashContact`, `sendMessage` e `winDeal`, recebe `ok: false` e o estado não muda.","nota":"A Sessão 3 apaga essas operações; isto custa cerca de meio dia e fecha a porta até lá."},{"n":"Pôr a conferência nas outras operações que gravam sem olhar quem chama","cam":["dom"],"hoje":"Fora do CRM antigo, a varredura achou duas: `restoreList` (`packages/dominio/src/operations/tasks.ts:816`) restaura sem conferir quem chama, enquanto `restoreContainer` (`structure.ts:776`) e `restoreTask` (`tasks.ts:694`, via `mayWriteTask`) conferem; `createReceivableSeries` (`financeiro.ts:1807`) cria parcelas sem conferir escrita na Lista de Contas a receber.","fazer":["`restoreList` passa a chamar `restoreContainer(state, actingMemberId, “list”, listId)` ou a mesma recusa que ele usa.","`createReceivableSeries` passa a chamar `listWriteRefusal(state, actingMemberId, CR.listId)` (`tasks.ts:1373`) antes de criar."],"pronto":"Dois testes: um Convidado chama cada uma e recebe `ok: false`."},{"n":"Escrever a tabela de quem confere o quê","cam":["dom"],"hoje":"Não existe. A varredura rápida desta revisão olhou 167 das cerca de 200 operações; as outras têm assinatura que a busca não pegou.","fazer":"Em `packages/dominio/CONTEXT.md`, uma seção “Quem pode” com uma linha por operação de `REGISTRO`: o arquivo, a função de recusa que ela chama (`taskWriteRefusal`, `containerAdminRefusal`, `listWriteRefusal`, `recusaDeEscritaNoCrmAntigo`, dono do registro) ou a justificativa de não ter.","pronto":"Toda chave de `REGISTRO` aparece na tabela, e nenhuma linha diz “sem conferência” sem justificativa."}]},{"id":"1.3","n":"Fechar o banco para que só o `apps/api` o acesse","objetivo":"Nenhuma migração (`apps/api/migracoes/001` a `008`) liga RLS, cria policy ou faz `grant`/`revoke`, e o `apps/api` conecta com `DATABASE_URL` (`apps/api/src/persistencia/conexao.ts:135`), que no `.env.example` é o usuário `postgres` do pooler, dono de tudo. Toda a proteção está no `apps/api`. Esta tarefa confere se a chave pública do navegador alcança o schema `plataforma` e troca o usuário do `apps/api` por um usuário de banco com só o que ele precisa.","pronto":"`select has_schema_privilege('anon','plataforma','USAGE')` e o mesmo para `authenticated` respondem `false`; o `apps/api` de produção conecta como `n1_api`; a `009` está aplicada.","subs":[{"n":"Conferir se o schema `plataforma` está exposto à chave pública","cam":["infra","voce"],"hoje":"A tela carrega a chave pública (`NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY`, `apps/web/.env.example:2`). Se `plataforma` estiver em “Exposed schemas” e `anon` tiver `USAGE` nele, qualquer pessoa com essa chave lê o banco pela API REST do Supabase. Não consegui conferir daqui: o conector do Supabase não tem permissão no projeto.","fazer":["No SQL Editor do Supabase, rodar `select has_schema_privilege('anon','plataforma','USAGE') as anon, has_schema_privilege('authenticated','plataforma','USAGE') as autenticado;`.","Em Project Settings › Data API › Exposed schemas, conferir que `plataforma` não está na lista; se estiver, tirar.","Em Authentication › Sign In / Providers, desligar “Allow new users to sign up”: usuário só nasce por convite (Sessão 12)."],"pronto":"As duas colunas voltam `false`, e `curl` em `https://\u003cref>.supabase.co/rest/v1/registros` com a chave pública e o cabeçalho `Accept-Profile: plataforma` responde erro.","nota":"É o item mais urgente do plano: leva minutos e vale fazer hoje, antes de começar a sessão."},{"n":"Como proteger o banco?","cam":["dec"],"decisao":true,"hoje":"O banco confia em quem conecta. A mesma `DATABASE_URL`, do usuário `postgres`, serve o `apps/api` e roda as migrações no deploy (`apps/api/deploy/instalar-release.sh:42`).","opcoes":["(A) Banco fechado: revogar tudo de `anon` e `authenticated` no schema `plataforma` e criar um usuário de banco `n1_api`, sem superusuário, só com leitura e escrita nas tabelas de `plataforma`; as migrações seguem com o usuário dono, numa variável nova `DATABASE_URL_MIGRACAO`","(B) Tudo de (A), mais RLS em todas as tabelas, com policy por `workspace_id` lido de `current_setting('app.workspace_id')`, que o `apps/api` fixa a cada transação"],"muda":"(A) custa cerca de 1 dia. (B) soma cerca de 2 dias: `executar` (`apps/api/src/persistencia/unidade-de-trabalho.ts`) e os repositórios do CRM passam a abrir toda transação com `set_config('app.workspace_id', …)`, e um erro de Espaço vira recusa do banco, não só do código.","recomendo":"(A) agora; (B) quando houver mais de uma empresa no sistema (decisão 12.1 da Sessão 12).","peso":"arrumacao"},{"n":"Escrever a migração `009`","cam":["banco"],"hoje":"A `008` é a última e é imutável. O deploy aplica sozinho toda migração nova a cada merge na `main` (`instalar-release.sh:42`), então a `009` chega em produção no primeiro deploy depois do merge.","fazer":["Criar `apps/api/migracoes/009-seguranca-e-cofre.sql` com: `revoke all on schema plataforma from public, anon, authenticated`; `revoke all on all tables in schema plataforma from anon, authenticated`; `alter default privileges in schema plataforma revoke all on tables from anon, authenticated`.","Na mesma migração, se o papel `n1_api` existir (bloco `do $$ … if exists (select 1 from pg_roles where rolname = 'n1_api') …`), dar `usage` no schema e `select, insert, update, delete` em todas as tabelas, e o mesmo em `alter default privileges` para tabelas futuras.","Na mesma migração, a tabela do cofre (tarefa 1.4).","Criar o papel à mão, uma vez por banco, no SQL Editor: `create role n1_api login password '\u003csenha forte>'`. A senha nunca entra no arquivo.","Aplicar primeiro em homologação (tarefa 1.7) e só depois fazer o merge."],"pronto":"`npm run migrar -w @n1/api -- --seco` lista `pendente 009-seguranca-e-cofre.sql`; depois de aplicada, `select has_table_privilege('n1_api','plataforma.registros','SELECT')` é `true` e o mesmo para `anon` é `false`."},{"n":"Trocar a conexão do `apps/api` para o usuário `n1_api`","cam":["api","infra"],"hoje":"`conexao.ts:135` lê só `DATABASE_URL`, e `migrar.cli.ts` usa o mesmo pool. Na VPS, o ambiente fica em `/opt/n1-crm/shared/api.env`. Em desenvolvimento, `DATABASE_SSL_INSECURE=true` desliga a verificação de TLS (decisão da Fase 2, `08-PROVAS.md` item 5); fora do notebook, `DATABASE_CA_CERT` ou `DATABASE_CA_PATH` é obrigatório.","fazer":["Em `apps/api/src/persistencia/migrar.cli.ts`, usar `DATABASE_URL_MIGRACAO` quando existir, e `DATABASE_URL` quando não.","Pôr `DATABASE_URL_MIGRACAO` no `apps/api/.env.example`, com a explicação.","No `api.env` de produção: `DATABASE_URL` com o usuário `n1_api`, `DATABASE_URL_MIGRACAO` com o dono, e conferir que há `DATABASE_CA_CERT` ou `DATABASE_CA_PATH` e não há `DATABASE_SSL_INSECURE`."],"pronto":"Depois de reiniciar `n1-crm-api`, `/saude` e `GET /estado` respondem em produção, e um `drop table plataforma.migracoes` feito com o usuário `n1_api` é recusado."}]},{"id":"1.4","n":"Criar o cofre de credenciais","objetivo":"As Sessões 4, 7, 8 e 9 vão guardar tokens de provedor (Evolution, Meta, e-mail). Hoje não há tabela nem utilitário de cifra: a `008` não tem coluna de segredo, de propósito, e `Integration.omie` guarda só o rótulo da conta (`packages/dominio/src/types/workspace.ts:203`). O cofre guarda o segredo cifrado com uma chave que fica fora do banco.","pronto":"Um teste grava uma credencial, lê de volta o mesmo valor e prova que a coluna no banco só tem bytes cifrados; nenhuma rota devolve o segredo.","subs":[{"n":"Criar a tabela `plataforma.credenciais` na `009`","cam":["banco"],"hoje":"Não existe. A única tabela de credencial é `plataforma.service_credentials` (`003-integracao-e-importacao.sql:99`), que guarda hash da credencial do `automation/`, não segredo que se lê de volta.","fazer":"Na `009`: `plataforma.credenciais` com `id`, `workspace_id`, `dono_tipo` (`canal` ou `integracao`), `dono_id`, `tipo` (por exemplo `token_de_acesso`), `segredo_cifrado bytea`, `iv bytea`, `etiqueta bytea`, `versao_da_chave int`, `criado_em`, `atualizado_em`, `revogado_em`; índice único em (`workspace_id`, `dono_tipo`, `dono_id`, `tipo`) onde `revogado_em is null`.","pronto":"`\\d plataforma.credenciais` no banco de homologação mostra as colunas e o índice."},{"n":"Cifrar e decifrar no `apps/api`","cam":["api"],"hoje":"Não há `createCipheriv` nem `pgcrypto` em nenhum lugar do repositório.","fazer":["Criar `apps/api/src/servicos/cofre.ts` com `guardarCredencial(cliente, { workspaceId, donoTipo, donoId, tipo, segredo })` e `lerCredencial(cliente, …)`, usando AES-256-GCM do `node:crypto`, com IV novo a cada gravação.","A chave vem de `COFRE_CHAVE` (32 bytes em base64) e a versão de `COFRE_CHAVE_VERSAO`; pôr as duas no `.env.example` e no `api.env` de homologação e de produção, cada ambiente com a sua.","Só os serviços de provedor (Sessões 4, 7, 8 e 9) chamam `lerCredencial`; nenhuma rota devolve o valor."],"pronto":"Teste em `apps/api/src/servicos/cofre.test.ts` (Postgres local): grava, lê o mesmo texto, e um `select segredo_cifrado` direto não contém o texto; com a chave errada, `lerCredencial` lança erro.","nota":"Escolhi chave fora do banco em vez do Supabase Vault: quem levar uma cópia do banco não leva os segredos."}]},{"id":"1.5","n":"Tirar segredos dos logs","objetivo":"O `apps/api` sobe com o logger padrão do Fastify (`apps/api/src/index.ts:97`, `buildApp({ logger: true })`), sem `redact`, e o nginx grava toda URL no log de acesso. As rotas públicas levam o segredo na URL (`/v1/public/forms/:secret`, `formularios-publicos.ts:193`; `/v1/public/tasks/:secret`, `tarefas-publicas.ts:50`), então o segredo vai para os dois logs.","pronto":"Uma chamada a `/v1/public/forms/\u003csegredo>` não deixa o segredo nem no log do `apps/api` nem em `/var/log/nginx/n1-crm-api.access.log`.","subs":[{"n":"Configurar `redact` e mascarar a URL no logger do `apps/api`","cam":["api"],"hoje":"`index.ts:97` passa `logger: true`; `app.ts:108` repassa ao Fastify. `LOG_LEVEL` está em `apps/api/.env.example:24`, mas nenhum código o lê.","fazer":["Criar `apps/api/src/observabilidade/log.ts` com `opcoesDoLogger()`: `level` de `LOG_LEVEL` (padrão `info`); `redact` com `req.headers.authorization` e os caminhos `*.segredo`, `*.secret`, `*.token`, `*.senha`, censura “[oculto]”; serializador de `req` que troca o segmento depois de `/v1/public/forms/` e `/v1/public/tasks/` por `***`.","`index.ts` passa `buildApp({ logger: opcoesDoLogger() })`, e `OpcoesDoApp.logger` (`app.ts:61`) passa a aceitar o objeto."],"pronto":"Teste em `apps/api/src/observabilidade/log.test.ts`: com o logger escrevendo num fluxo de memória, `GET /v1/public/forms/abc123` produz linha sem `abc123`."},{"n":"Mascarar o segredo no log de acesso do nginx","cam":["infra"],"hoje":"`apps/api/deploy/nginx-n1-crm-api.conf` usa `access_log` com o formato padrão, que grava a URL inteira.","fazer":["Num arquivo `conf.d` do nginx, criar um `map` sobre `$request_uri` que troca o segmento depois de `/v1/public/forms/` e `/v1/public/tasks/` por `***`, e um `log_format` próprio que usa a variável do `map` no lugar da URL.","Trocar o `access_log` do site para esse formato, no repositório e à mão na VPS."],"pronto":"Depois de `nginx -s reload`, `curl` em `/v1/public/forms/teste123` e `grep teste123 /var/log/nginx/n1-crm-api.access.log` não acha nada.","nota":"Depois da primeira emissão do certificado, o arquivo da VPS é a fonte e `preparar-vps.sh` não o reescreve (cabeçalho de `nginx-n1-crm-api.conf`): a mudança precisa ser feita também na VPS."}]},{"id":"1.6","n":"Proteger as rotas públicas contra abuso","objetivo":"O Formulário e a Tarefa pública aceitam chamada sem login. O limite de taxa vive na memória do processo e zera a cada reinício, e o comentário de `limite-de-taxa.ts:7-8` diz que o nginx limita na borda, mas `nginx-n1-crm-api.conf` não tem `limit_req`. O limite passa a valer no nginx, antes do `apps/api`.","pronto":"50 chamadas seguidas do mesmo IP a `/v1/public/forms/x` recebem `429` a partir de cerca da 40ª.","subs":[{"n":"Pôr `limit_req` no nginx para `/v1/public/`","cam":["infra"],"hoje":"`criarLimiteDeTaxa` (`apps/api/src/servicos/limite-de-taxa.ts:43`) conta em memória: 30 por minuto por IP e 60 por segredo no Formulário (`formularios-publicos.ts:188-189`), 60 por minuto por IP na Tarefa pública (`tarefas-publicas.ts:48`). O `apps/api` roda num processo só (`n1-crm-api.service`).","fazer":["Em `/etc/nginx/conf.d/n1-crm-limites.conf`: `limit_req_zone $binary_remote_addr zone=n1_publico:10m rate=30r/m;`.","No site, um `location /v1/public/` com `limit_req zone=n1_publico burst=10 nodelay;`, `limit_req_status 429;` e os mesmos `proxy_*` do `location /`.","Manter o limite em memória como segunda camada e corrigir o comentário de `limite-de-taxa.ts`."],"pronto":"Um laço de 50 `curl` contra `https://crm-n1-api.85.155.186.214.nip.io/v1/public/forms/x` mostra `429` nas últimas respostas.","nota":"Uma contagem no banco só vale a pena quando o `apps/api` rodar em mais de um processo."},{"n":"Documentar o `TRUST_PROXY`","cam":["api"],"hoje":"`app.ts:106` lê `TRUST_PROXY`, e o serviço da VPS o fixa em `loopback` (`apps/api/deploy/n1-crm-api.service:23`), mas o `apps/api/.env.example` não tem a variável. Sem ela, o limite por IP conta o IP do nginx para todo mundo.","fazer":"Acrescentar `TRUST_PROXY=` ao `.env.example`, explicando: vazio em desenvolvimento, `loopback` atrás do nginx.","pronto":"`grep TRUST_PROXY apps/api/.env.example` acha a linha com a explicação."}]},{"id":"1.7","n":"Ambientes, backup e monitoramento","objetivo":"Só existe produção: uma VPS compartilhada com nginx para o `apps/api` e a Vercel para a web, e o workflow `.github/workflows/deploy-api.yml` só conhece o ambiente `production`. Não há onde validar uma sessão antes de produção, nenhum backup testado no repositório e nenhum alerta de erro (não há Sentry nem outro serviço em `apps/api` ou `apps/web`).","pronto":"Homologação no ar com login e banco próprios, uma restauração de backup feita e anotada, e um erro forçado em homologação chegando como alerta.","subs":[{"n":"Onde fica o banco de homologação?","cam":["dec"],"decisao":true,"hoje":"Há um projeto Supabase (o de produção), com Postgres, Auth e Storage.","opcoes":["(A) Um segundo projeto Supabase só para homologação","(B) O mesmo projeto, com um Espaço de Trabalho de teste (outro `WORKSPACE_ID`)"],"muda":"(A) custa a mensalidade de mais um projeto e separa banco, usuários e arquivos. (B) não custa nada, mas uma migração errada em homologação já é em produção, e a `009` não pode ser testada antes.","recomendo":"(A).","peso":"arrumacao"},{"n":"Subir o ambiente de homologação","cam":["infra"],"hoje":"Produção: serviço `n1-crm-api` em `127.0.0.1:3020`, código em `/opt/n1-crm`, site `crm-n1-api.85.155.186.214.nip.io` (`apps/api/deploy/CONTEXT.md`); a web lê `NEXT_PUBLIC_API_URL`, `NEXT_PUBLIC_SUPABASE_URL` e `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY`.","fazer":["Criar o banco de homologação conforme a decisão anterior, rodar `npm run migrar -w @n1/api` e `npm run bootstrap:gestao -w @n1/api` nele.","Na VPS, um segundo serviço `n1-crm-api-hml` (cópia de `n1-crm-api.service` com `PORT=3021` e pasta `/opt/n1-crm-hml`) e um site nginx `crm-n1-api-hml.85.155.186.214.nip.io` com certificado próprio.","Em `deploy-api.yml`, um job para a branch `homologacao` com `environment: homologacao` e os segredos desse ambiente.","Na Vercel, as três variáveis `NEXT_PUBLIC_*` do ambiente Preview apontando para a homologação."],"pronto":"Um push na branch `homologacao` publica a api; a URL de Preview da Vercel abre `/entrar`, aceita um login de homologação e carrega o Início."},{"n":"Ligar o backup diário e testar uma restauração","cam":["infra"],"hoje":"Não há script de backup nem registro de restauração no repositório. Não conferi o que o plano do Supabase guarda.","fazer":["Conferir em Database › Backups o que o plano do Supabase guarda e por quantos dias.","Na VPS, um `systemd timer` diário `n1-crm-backup` que roda `pg_dump --schema=plataforma` com `DATABASE_URL_MIGRACAO`, cifra o arquivo e o copia para fora da VPS, guardando 14 dias.","Restaurar o último arquivo no banco de homologação."],"pronto":"Depois da restauração, `select count(*) from plataforma.registros` em homologação bate com o número de produção na hora do backup, e a data fica anotada em `apps/api/deploy/CONTEXT.md`."},{"n":"Ligar o monitoramento de erros na api e na web","cam":["api","web","infra"],"hoje":"Erro inesperado no `apps/api` só vai ao log do processo (`app.ts:137`, `request.log.error(erro)`); a web não registra erro em lugar nenhum.","fazer":["No `apps/api`: `@sentry/node`, iniciado em `index.ts` antes de `buildApp`, com `SENTRY_DSN` do ambiente; `Sentry.captureException(erro)` no `setErrorHandler` de `app.ts`; `beforeSend` que apaga corpo, cabeçalhos e a parte da URL com segredo.","Na web: `@sentry/nextjs` pelo arquivo de instrumentação do Next 16 (ler antes o guia em `node_modules/next/dist/docs/`).","No Sentry, uma regra de alerta por e-mail para erro novo em produção e em homologação."],"pronto":"Um erro forçado em homologação (uma rota de teste que lança, removida depois) gera alerta por e-mail em até 5 minutos."},{"n":"Preparar o servidor da Evolution API","cam":["infra","voce"],"hoje":"O `automation/` do `financeiro-tria` já usa uma instância própria da Evolution para os avisos do Financeiro (Sessão 4, decisão 4.3). Não há servidor da Evolution para o CRM N1.","fazer":["Escolher o servidor: a mesma Evolution do `automation/`, a VPS compartilhada (Docker, com Postgres e Redis próprios) ou uma VPS nova.","Deixar a Evolution respondendo atrás de HTTPS, com a chave de API guardada para o cofre da tarefa 1.4."],"pronto":"O painel da Evolution responde por HTTPS e a chave de API está anotada para a Sessão 4."}]}],"ajuste":"+2 dias: são 7 frentes (recorte do `GET /estado`, conferências de permissão, migração `009` com usuário de banco próprio, cofre, logs, nginx, homologação com backup e monitoramento)."},{"id":"2","n":"Clone ClickUp: ajustes e lacunas","dias":[3,8],"dep":["1"],"desc":"Fecha a Estrutura de Trabalho (Espaço, Pasta, Lista e Tarefa) antes da mensageria. Entra aqui o que você pediu (limpar as telas, gravar mais rápido, converter item do checklist, tirar a Carga) e o que falta no modelo em relação ao artefato “Estrutura de Trabalho N1” e à ontologia (`ontologia/02-estrutura-de-trabalho/`). A lista dos seus testes da Estrutura precisa fechar até a véspera do início; o que vier dela entra na 2.7.","partida":["Espaço, Pasta e Lista têm criar, editar, arquivar, desarquivar, enviar à lixeira e restaurar (`packages/dominio/src/operations/structure.ts`). Não existe mover nem reordenar contêiner.","Toda gravação passa por `POST /operacoes/:nome` (`apps/api/src/rotas/operacoes.ts`), que hidrata o Espaço de Trabalho inteiro de `plataforma.registros` (`hidratar`, `apps/api/src/persistencia/repositorio.ts:63`) e disputa a revisão de `plataforma.workspaces` (`executar`, `apps/api/src/persistencia/unidade-de-trabalho.ts:116`).","A página da Lista (`apps/web/src/app/(shell)/estrutura/listas/[lista]/page.tsx`) tem 1.404 linhas e 6 abas: Lista, Quadro, Calendário, Tabela, Linha do tempo e Carga.","`convertChecklistItem` (`packages/dominio/src/operations/tasks.ts:590`) funciona. A única tela que o chama é `apps/web/src/features/estrutura/tarefa-completa.tsx`, a mesma peça usada na página da Tarefa, no popup (`task-panel.tsx`) e no drawer do Financeiro (`financeiro/conta-drawer.tsx`).","O bloqueio por aspecto (`blocks`) existe no tipo e é conferido por `blockedAbove` (`packages/dominio/src/operations/configuration.ts:42`), mas só o seed o preenche (`packages/dominio/src/seed.ts:290`, Espaço Marketing)."],"pronto":"Você aprova as telas da Lista, do Espaço, da Pasta e das Configurações depois da limpeza; os tempos de gravação antes e depois estão anotados na 2.2; mover uma Lista para outra Pasta funciona pela árvore; nenhuma Lista oferece a Carga; e `npm run check` passa com os testes novos de bloqueio, visualizações padrão, menções na descrição e tempo registrado.","tarefas":[{"id":"2.1","n":"Limpar a UI das subpáginas","objetivo":"As telas da Estrutura ainda têm peças de protótipo: um botão de depuração, frases que explicam a regra, códigos internos como “(B25)” e uma tabela didática nas Configurações. A página da Lista tem 1.404 linhas, com dois componentes inteiros dentro dela. Depois desta tarefa, cada tela mostra só o que a pessoa usa.","pronto":"Você abre a Lista, o Espaço, a Pasta e as Configurações e aprova cada uma; a página da Lista fica abaixo de 1.000 linhas.","subs":[{"n":"Tirar o botão “Rodar agenda da Lista (hoje)” e o item “Rodar automações por vencimento (hoje)”","cam":["web"],"hoje":"`RunScheduledButton` (`apps/web/src/features/estrutura/bulk-status-bar.tsx:189`) aparece em duas barras da página da Lista (`listas/[lista]/page.tsx:716`, Lista conversacional, e `:784`, Lista comum) sempre que a Lista tem Automação por vencimento ou Tarefa recorrente por calendário. Ele roda `runScheduledAutomations` e `runCalendarRecurrences` na hora, pelo navegador. No Financeiro, o menu “Automatizar” tem o mesmo gesto (`features/estrutura/financeiro/contas-view.tsx:381`). O agendador do servidor (`apps/api/src/automacoes/scheduler-worker.ts`) já roda as duas coisas sozinho.","fazer":["Cumprir antes a decisão abaixo, para nenhuma Lista perder a recorrência.","Apagar `RunScheduledButton` de `bulk-status-bar.tsx` e as duas chamadas em `listas/[lista]/page.tsx`.","Apagar o item “Rodar automações por vencimento (hoje)” do menu “Automatizar” em `contas-view.tsx`; se o menu ficar vazio, apagar o menu."],"pronto":"Numa Lista com Tarefa recorrente por calendário, o botão não aparece; `grep -rn 'Rodar agenda' apps/web/src` e `grep -rn 'Rodar automações por vencimento' apps/web/src` não acham nada."},{"n":"O que roda a recorrência das Listas sem Automação depois que o botão sair?","cam":["dec","api"],"decisao":true,"hoje":"O agendador só visita as Listas que têm uma Automação publicada com gatilho `condicaoTemporal` (`scheduler-worker.ts:268–302`). Uma Lista que só tem Tarefa recorrente por calendário (`recurrence.triggerMode = porCalendario`) depende do botão para gerar a próxima ocorrência. A Sessão 19 (19.1, “Lixeira e recorrência em todas as Listas”) resolve isso, mas vem bem depois.","opcoes":["(A) Trazer para cá a subtarefa da 19.1: o agendador passa a visitar também as Listas com Tarefa recorrente por calendário e as com Tarefa vencida na lixeira","(B) Tirar o botão da barra e deixá-lo só no menu “…” da Lista, para quem administra, até a Sessão 19","(C) Tirar o botão e aceitar que a recorrência por calendário fique parada nessas Listas até a Sessão 19"],"muda":"(A) soma cerca de meio dia aqui e tira meio dia da 19.1: muda a consulta que monta os pares (Espaço de Trabalho, Lista) em `scheduler-worker.ts`. (B) custa uma hora e deixa um gesto manual escondido. (C) não custa nada, mas Tarefas recorrentes deixam de nascer sem aviso.","recomendo":"(A): é a mesma consulta que a 19.1 mudaria, e o botão sai de vez.","peso":"produto"},{"n":"Confirmar que o agendador está ligado em produção","cam":["infra","voce"],"hoje":"O agendador só sobe com `AUTOMACOES_WORKER_ATIVO=true` (`apps/api/src/index.ts:192`); o exemplo de ambiente traz `false` (`apps/api/.env.example:101`). A primeira volta de cada Lista roda em ensaio e não grava até alguém liberar (`scheduler-worker.ts:39`).","fazer":["Conferir no ambiente de produção do `apps/api` que `AUTOMACOES_WORKER_ATIVO=true`.","Liberar cada Lista em ensaio com `npm run automacoes:liberar -w @n1/api -- \u003cworkspaceId> \u003clistId>`."],"pronto":"O log de produção do `apps/api` mostra “scheduler de Automações ativo” (`apps/api/src/index.ts:217`) e, no dia seguinte, uma linha nova em `plataforma.automacao_agenda` para cada Lista com agenda."},{"n":"Juntar as duas barras de seleção em lote numa só","cam":["web"],"hoje":"`BulkStatusBar` é montada em dois lugares da página da Lista: dentro da barra do Financeiro, no lugar de `FinanceToolbar`, só com itens marcados (`listas/[lista]/page.tsx:795`), e no corpo da página nas outras Listas (`:849`). O botão “Selecionar várias” está escrito duas vezes (`:702` e `:770`), e a lente financeira tem um terceiro botão, “Sair da seleção” (`:805`).","fazer":["Criar `apps/web/src/features/estrutura/selecao-em-lote.tsx` com o componente `SelecaoEmLote`: recebe `tasks`, `definitions`, `selecionadas`, `onSelecionar`, `onRelatorio` e `report`; desenha o botão “Selecionar várias” / “Sair da seleção” e, com itens marcados, a `BulkStatusBar`.","A página monta `SelecaoEmLote` uma vez, logo abaixo das abas, nas três lentes (comum, conversacional e financeira). A barra do Financeiro passa a mostrar sempre `FinanceToolbar`.","O relatório do lote continua guardado fora da seleção (`relatorioDeLote`, `page.tsx:173`), como hoje."],"pronto":"Os testes de `bulk-status-bar.test.tsx` passam; na Lista comum e em Contas a pagar, marcar duas Tarefas mostra a mesma barra no mesmo lugar; `listas/[lista]/page.tsx` não importa mais `BulkStatusBar`."},{"n":"Tirar da Lista as frases de explicação e o botão que nasce desligado","cam":["web"],"hoje":"A página da Lista tem: a nota sob o Quadro “Arrastar altera o Status. As validações da Lista continuam valendo…” (`listas/[lista]/page.tsx:1268`); o complemento “— o filtro vale em todas as Visualizações” depois da contagem filtrada (`:893`); as frases de ajuda ao lado do botão principal nas Listas de Meus negócios (`:680`) e na conversacional (`:697`); e o botão “De modelo” da Lista conversacional, que nasce sempre desligado com o motivo `TAREFA_SEM_CONTATO` (`:698`).","fazer":["Apagar a nota do Quadro e as duas frases de ajuda.","Trocar a frase da contagem por “Mostrando X de Y Tarefas.”","Apagar o botão “De modelo” da barra conversacional."],"pronto":"Na Lista conversacional (Pós-venda) a barra mostra só “Nova Tarefa” e “Selecionar várias”; no Quadro de qualquer Lista não há texto abaixo das colunas."},{"n":"Tirar `Quadro`, `Tabela` e as barras de criação de dentro da página da Lista","cam":["web"],"hoje":"As funções `Quadro` (`listas/[lista]/page.tsx:1175`, cerca de 100 linhas) e `Tabela` (`:1282`, cerca de 120 linhas) moram no arquivo da página. As três barras de criação (Meus negócios, conversacional e comum, `:668–788`) estão escritas em sequência no JSX.","fazer":["Mover `Quadro` para `apps/web/src/features/estrutura/quadro-de-tarefas.tsx` e `Tabela` para `apps/web/src/features/estrutura/tabela-plana.tsx`, sem mudar o comportamento.","Mover as três barras de criação para `apps/web/src/features/estrutura/barra-de-criacao.tsx`, um componente `BarraDeCriacao` que recebe a lente (`comum`, `conversacional`, `espelhoComercial`, `financeira`) e os callbacks que a página já tem (`create`, `setNovaConversacional`, `setIniciandoConversa`)."],"pronto":"`wc -l` da página dá menos de 1.000; `npm run check` passa; criar uma Tarefa pela barra e arrastar um cartão no Quadro funcionam como antes."},{"n":"Manter as abas Lista e Tabela separadas?","cam":["dec","web"],"decisao":true,"hoje":"As 6 abas da Lista (`listas/[lista]/page.tsx:658`): Lista (`TabelaDeTarefas`, `tabela-de-tarefas.tsx`: grupos por Status, “+” por grupo, seleção e ações rápidas; no Financeiro, `FinanceTable` e `FinanceCards`); Quadro (colunas por Status, arrastar muda o Status; na conversacional, `QuadroNegocios`); Calendário (`CalendarioMensal`); Tabela (`Tabela`: lista plana com 6 colunas fixas — Título, Status, Categoria, Prioridade, Vencimento, Responsáveis — e edição na linha de Status, Prioridade e Vencimento, sem Campos); Linha do tempo (`LinhaDoTempo`, `planning-views.tsx`); Carga (sai na 2.5). A Lista financeira esconde a Carga; a conversacional esconde a Carga e a Linha do tempo (`:660–662`). Lista e Tabela mostram quase o mesmo.","opcoes":["(A) Manter as duas como estão","(B) Tirar a aba Tabela","(C) Fazer a Tabela virar planilha: sem grupos, uma coluna por Campo da Lista, editável na célula, como a visualização Tabela do ClickUp"],"muda":"(A) não custa nada. (B) custa uma hora; as Visualizações salvas do tipo `tabela` passam a abrir na aba Lista. (C) custa cerca de 1,5 dia e entraria na 2.7 ou numa sessão própria.","recomendo":"(A) nesta sessão; (C) depois, se você sentir falta dos Campos na Tabela durante os testes.","peso":"produto"},{"n":"Organizar as Configurações do contêiner em abas","cam":["web"],"hoje":"`ContainerSettings` (`apps/web/src/features/estrutura/container-settings.tsx:91`) empilha tudo numa rolagem só, nesta ordem: a tabela “Aspectos configuráveis” (`:220`, 6 linhas com a explicação da regra e as colunas “Neste nível”, “Origem do valor” e “Como compõe”); a grade com Conjunto de Status efetivo, Funcionalidades efetivas, Definições de Campo acumuladas, Formulários (só Lista) e Tipos de Tarefa acumulados (`:274–364`); Modelo de Tarefa (só Lista, `:370`); Canais de atendimento (só Lista conversacional, `:400`); e, por último, Identidade e Ciclo de vida (`:430`). A tabela lista Visualizações padrão e Automações, que não têm editor nesta tela.","fazer":["Trocar a rolagem por `Abas` (`features/shell/ui`), com a aba ativa na URL (`?aba=`): Geral (Identidade, Privado, quem criou e Ciclo de vida), Status, Funcionalidades, Campos, Tipos de Tarefa, Visualizações (o editor nasce na 2.6) e, só na Lista, Formulários e “Modelo e canais”.","Apagar a tabela “Aspectos configuráveis”, a constante `ASPECTS` e `REGRA_DOS_MODOS`.","No topo de cada aba de aspecto, uma linha curta: “Herdado de Espaço Comercial” ou “Definido aqui”. Se um ancestral bloqueia o aspecto, “Bloqueado por Pasta X” e os editores desligados com esse motivo. O botão de bloquear nasce na 2.6."],"pronto":"Abrir `/estrutura/listas/\u003cid>/configuracoes?aba=campos` cai direto na aba Campos; o texto “Aspectos configuráveis” não aparece em nenhuma tela."},{"n":"Deixar a página do Espaço no mesmo formato da página da Pasta","cam":["web"],"hoje":"A página do Espaço (`apps/web/src/app/(shell)/estrutura/espacos/[espaco]/page.tsx`) usa caixas (`Painel`): Listas diretas e atalhos, Pastas, Painéis (sempre, mesmo vazio, com a dica “Um Painel é criado em Painéis…”) e o painel lateral “Atributos” (`:147`), que só mostra Criado por e Privado. Não tem botão de criar. A página da Pasta (`pastas/[pasta]/page.tsx`) já usa seções com `ReguaDeSecao`, mostra as Tarefas abertas de cada Lista e tem o menu “Criar” (`useCreateContainerDialog`).","fazer":["Reescrever a página do Espaço no formato da Pasta: seções Listas (com os atalhos e a contagem de abertas) e Pastas, e o menu “Criar” com Pasta e Lista, pelo `openCreate` de `useCreateContainerDialog`.","Apagar o painel “Atributos”: Privado vira um selo ao lado do título (`Pilula` “Privado”), e Criado por vai para a aba Geral das Configurações.","Mostrar a seção Painéis só quando houver Painel ancorado no Espaço."],"pronto":"Num Espaço sem Painel, a página mostra só Listas e Pastas; “Criar › Lista” abre o diálogo com o Espaço já escolhido."},{"n":"Tirar os códigos de regra dos textos da Estrutura","cam":["web","dom"],"hoje":"Há 9 códigos em texto visível em `apps/web/src/features/estrutura`: `create-container-dialog.tsx:383` (A3.4), `:428` (B38), `:441` (RN-ESP-03) e `:442` (B25); `tarefa-completa.tsx:1496` (INV-CP-01), `:1524` (RN-CR-02) e `:1537` (RN-CR-07); `financeiro/serie-dialog.tsx:117` (RN-CR-01) e `:150` (RN-CR-07). Mais 4 em recusas do domínio que chegam às telas da Estrutura: `packages/dominio/src/operations/structure.ts:430` (B47) e `operations/financeiro.ts:1810`, `:1824` e `:1827`. O de `pastas/[pasta]/page.tsx:167` está num comentário e não aparece.","fazer":["Apagar o código entre parênteses de cada um dos 13 textos, sem mudar o resto da frase.","Criar o teste `apps/web/src/features/estrutura/sem-codigo-de-regra.test.ts`: lê os `.tsx` de `features/estrutura` e de `app/(shell)/estrutura`, descarta comentários e falha se achar `(RN-…)`, `(INV-…)`, `(B\u003cnúmero>)` ou `(A\u003cnúmero>.\u003cnúmero>)`."],"pronto":"O teste novo passa; o diálogo “Criar Espaço” mostra a ajuda sem “(RN-ESP-03)”; criar uma série de parcelas sem Centro de Custo mostra “Centro de Custo é obrigatório.”"}]},{"id":"2.2","n":"Otimizar o backend do CRUD de Espaço, Pasta e Lista","objetivo":"Cada gravação, de um nome de Lista a um Status de Tarefa, carrega o Espaço de Trabalho inteiro, roda a operação e disputa uma única revisão por Espaço de Trabalho: duas pessoas gravando ao mesmo tempo, mesmo em coisas diferentes, fazem uma delas recomeçar do zero. A tela só mostra a mudança quando o servidor responde. Nunca se mediu quanto disso pesa; esta tarefa mede, decide e corta o custo onde ele está.","pronto":"Os tempos de `createList`, `updateContainer`, `trashContainer` e `changeTaskStatus` medidos em produção antes e depois estão anotados; criar uma Lista aparece na árvore antes da resposta do servidor; duas gravações simultâneas no mesmo Espaço de Trabalho não hidratam de novo.","subs":[{"n":"Medir quanto leva cada etapa de uma gravação","cam":["api","banco"],"hoje":"`executar()` (`apps/api/src/persistencia/unidade-de-trabalho.ts:116`) faz, por tentativa: `hidratar` (um `select` de todo `plataforma.registros` do Espaço de Trabalho, `repositorio.ts:63`), `syncIdSequence`, a operação, o `update plataforma.workspaces set revisao = revisao + 1 where revisao = $2` e `gravar` (diff por JSON canônico de todos os registros, `repositorio.ts:161`). Nada disso é medido. O único número é o comentário de `repositorio.ts:9`, “cerca de 900 registros e 475 KB”, de antes do Financeiro e do CRM.","fazer":["Em `executar()`, medir com `performance.now()` a duração de `hidratar`, da operação, da trava da revisão e de `gravar`, mais o número de tentativas e de linhas lidas, e devolver isso num campo `medicao` de `ResultadoTransacao`.","Em `rotasDeOperacoes` (`apps/api/src/rotas/operacoes.ts`), registrar `medicao` com `request.log.info` junto do nome da operação.","Rodar em produção, 10 vezes cada: criar Lista, renomear Lista, enviar à lixeira um Espaço com Listas e mudar o Status de uma Tarefa. Anotar mediana e pior caso de cada etapa.","Rodar no banco de produção: `select colecao, count(*), pg_size_pretty(sum(pg_column_size(dados))::bigint) from plataforma.registros where workspace_id = '\u003cid>' group by colecao order by sum(pg_column_size(dados)) desc;` e anotar o total."],"pronto":"Uma tabela com os quatro gestos e as etapas (hidratar, operação, trava, gravar, tentativas), mais o tamanho real de `plataforma.registros`, anotada nesta tarefa antes da decisão abaixo."},{"n":"Como otimizar?","cam":["dec","banco","api","web"],"decisao":true,"hoje":"Gravar um contêiner custa o mesmo que gravar uma Tarefa: hidratar tudo, operar e comparar tudo. Mas contêiner se edita pouco; o que se grava o tempo todo é Tarefa. As operações de contêiner também escrevem fora dele: `createSpace` cria Tipo de Tarefa, Pasta e concessões (`structure.ts:103–135`); `trashContainer` e `archiveContainer` fecham cronômetros das Tarefas abaixo (`structure.ts:552`). E 23 arquivos do domínio e cerca de 22 da tela leem `state.spaces`, `state.folders` e `state.lists` direto do `DataState`.","opcoes":["(A) Tabelas próprias só para Espaço, Pasta e Lista, com rotas REST como as do CRM e uma projeção que os devolve ao `DataState`","(B) Ficar em `plataforma.registros` e cortar o custo onde ele está: travar no começo em vez de repetir, encadear as chamadas de um gesto e mostrar a mudança na hora","(C) Tabelas próprias para a Estrutura inteira (contêineres e Tarefas), numa sessão nova depois desta"],"muda":"(A) custa 4 a 5 dias: migração, repositório, serviço, rotas, projeção de leitura e escrita (como a dos Canais) e troca das telas. Só acelera a gravação de contêiner, que é rara; a de Tarefa continua igual. (B) custa cerca de 2 dias e vale para toda gravação, Tarefa inclusive. (C) é o que resolve de vez, mas são 8 a 10 dias e mexe na maior parte do domínio.","recomendo":"(B) agora. Se a medição mostrar `hidratar` acima de 300 ms na mediana, planejar (C) como sessão própria. (A) não compensa: paga o preço de uma migração para acelerar o gesto menos usado.","peso":"produto"},{"n":"Travar o Espaço de Trabalho no começo da transação em vez de repetir a gravação","cam":["api"],"hoje":"`executar()` lê a revisão, hidrata, roda a operação e só no fim tenta `update plataforma.workspaces … where revisao = $2` (`unidade-de-trabalho.ts:162`). Se outra gravação entrou no meio, desfaz e recomeça, até 3 vezes: quem perde hidrata o Espaço de Trabalho de novo, e no terceiro conflito a tela recebe 409 e re-hidrata tudo por `GET /estado` (`apps/web/src/dados/store.ts:172`).","fazer":["Logo depois de `inicioDaTransacao()`, rodar `select revisao from plataforma.workspaces where workspace_id = $1 for update` e só então `hidratar`.","O `update … revisao = revisao + 1` deixa de conferir a revisão (a linha já está travada). O `55P03` do `lock_timeout` continua virando conflito, como manda `apps/api/src/persistencia/CONTEXT.md`.","Atualizar a seção “Os prazos do servidor e a trava esgotada” do `CONTEXT.md` da persistência."],"pronto":"Um teste novo em `unidade-de-trabalho-trava.test.ts` dispara duas `executar()` ao mesmo tempo no mesmo Espaço de Trabalho: as duas gravam com uma tentativa cada e `hidratar` roda exatamente 2 vezes (pula sem `DATABASE_URL`, como os outros).","nota":"Só com (B)."},{"n":"Aplicar todas as respostas de um gesto com várias chamadas, sem re-hidratar","cam":["web"],"hoje":"Quando um `run` chama mais de uma operação, `transporteHttp.gravar` (`apps/web/src/dados/transporte.ts:171`) manda as chamadas em sequência, todas com a mesma `pedido.revisao`, e devolve só a última resposta. O store compara a `revisaoAnterior` dessa última com a sua (`store.ts:129`), elas não batem, e ele re-hidrata o Espaço de Trabalho inteiro. O caso conhecido é `(shell)/page.tsx` (cria a Sessão de Chat e manda a mensagem). A ação em lote de Status não entra aqui: é uma operação só, `alterarStatusEmLote`.","fazer":["`gravar` passa a devolver a lista de respostas, uma por chamada, parando na primeira que não for `diferenca`.","`enviar` (`store.ts:123`) aplica as diferenças em ordem: cada uma só se a `revisaoAnterior` dela for a revisão atual do store; se uma não encaixar, aí sim re-hidrata."],"pronto":"Um teste em `apps/web/src/dados/store.test.ts` com transporte falso: um `run` com duas chamadas aplica as duas diferenças e não chama `hidratar`.","nota":"Só com (B)."},{"n":"Mostrar a mudança na tela antes da resposta do servidor","cam":["web"],"hoje":"`rodarNaCopia` (`apps/web/src/dados/store.ts:205`) roda a operação numa cópia, manda as chamadas e descarta a cópia: o `data` real só muda quando a diferença volta (`store.ts:142`). Criar uma Lista pelo diálogo (`features/estrutura/create-container-dialog.tsx:217`) espera essa volta para navegar.","fazer":["O store guarda dois estados: `confirmado` (o que o servidor já devolveu) e `data` (o que a tela mostra). Uma operação aceita localmente vira o novo `data` na hora.","Quando a diferença volta, aplicá-la em `confirmado` e refazer por cima as chamadas ainda pendentes, pelo registro `OPERACOES` (`@n1/dominio/operations/registro`), para obter o novo `data`.","Se o servidor recusar, `data` volta a ser `confirmado` mais as pendentes, e `lastResult` mostra o erro, como hoje.","O diálogo de criação continua esperando o id do servidor para navegar (`runConfirmado`), mas a árvore
