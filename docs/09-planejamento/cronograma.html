em.","nota":"A Sessão 15.3 (PDF anexado no Chat) precisa do mesmo extrator. Quem fizer primeiro cria; a outra reaproveita."},{"n":"PDF escaneado entra no Conhecimento?","cam":["dec"],"decisao":true,"hoje":"Não há extração de texto, então a pergunta nunca apareceu. Um PDF que é só imagem não tem texto para extrair.","opcoes":["(A) Recusar com o aviso “PDF sem texto” e pedir outro arquivo","(B) Ler a imagem com o modelo (visão do Claude) e guardar a transcrição","(C) Usar um serviço de OCR à parte"],"muda":"(A) não custa nada. (B) soma cerca de 1 dia e custo de modelo por página. (C) soma cerca de 1 dia e mais um fornecedor.","recomendo":"(A) agora; (B) quando aparecer o primeiro caso real.","peso":"produto"},{"n":"Fatiar por tamanho, guardando a página","cam":["dom"],"hoje":"`fragmentarTexto` (`derive-ia.ts:405`) corta só em linha em branco e dá o localizador `p\u003cn>`. Um PDF extraído vira poucos trechos gigantes.","fazer":["Mudar `fragmentarTexto(texto, opcoes?)` para cortar em parágrafos e juntar até `maxCaracteres` (padrão 2.000), com `sobreposicao` (padrão 200) entre um trecho e o seguinte.","Aceitar `paginas?: string[]`: o localizador vira `pag\u003cn>§\u003cm>` (página e trecho dentro da página).","Texto colado curto continua dando um trecho por parágrafo; os testes atuais de `fragmentarTexto` continuam passando."],"pronto":"Teste em `derive-ia.test.ts`: um texto de 9.000 caracteres vira 5 trechos de até 2.000, com sobreposição, e um texto de 3 páginas tem localizadores `pag1§1`, `pag2§1`, `pag3§1`."},{"n":"Gravar o resultado do processamento no domínio","cam":["dom"],"hoje":"Não existe operação que leve uma Versão de `pendente` para `processado`. `derivedRepresentations` é `readonly` em `DocumentVersion` (`packages/dominio/src/types/ai.ts:561`).","fazer":["Criar em `conhecimento.ts` `registrarProcessamentoDaVersao(state, documentId, numero, resultado)`, em que `resultado` é `{ ok: true, texto, paginas? }` ou `{ ok: false, motivo }`. O ator é o Sistema (`kind: system`, `types/primitives.ts:36`), porque o Fragmento só é criado pelo Sistema (B97).","Com sucesso: acrescentar a representação `{ kind: extracao, text, by: Sistema, at }`, gerar os Fragmentos com o novo `fragmentarTexto` e marcar `processado`. Com falha: marcar `comErro` e registrar o motivo na Atividade do Documento.","Recusar quando a Versão já não está `pendente`, para duas voltas do processador não gravarem duas vezes.","Tirar o `readonly` de `derivedRepresentations` em `types/ai.ts:561`."],"pronto":"Teste em `conhecimento.test.ts`: a Versão `pendente` vira `processado` com N Fragmentos; a segunda chamada é recusada; a falha deixa `comErro` com o motivo."},{"n":"Criar o processador de Documentos pendentes","cam":["api"],"hoje":"Não existe. O `apps/api` já tem trabalhadores em segundo plano no mesmo processo: o outbox e o agendador, ligados em `apps/api/src/index.ts:187`.","fazer":["Criar `apps/api/src/conhecimento/processador-de-documentos.ts` com `criarProcessadorDeDocumentos()`, no molde de `criarOutboxWorker`, e ligá-lo em `apps/api/src/index.ts`.","A cada volta (padrão 30 s): achar por SQL em `plataforma.registros` (coleção `documents`) os Documentos cuja Versão corrente está `pendente`; para cada um, baixar o objeto do bucket (arquivo) ou chamar `capturarUrl` (URL), extrair o texto e gravar com `registrarProcessamentoDaVersao` dentro de `executar()`.","Depois de gravar, chamar a indexação da 17.4 para os Fragmentos novos.","Áudio e vídeo continuam `pendente` (transcrição fica fora desta sessão) e o processador os ignora."],"pronto":"Teste de integração `processador-de-documentos.test.ts` (pula sem `DATABASE_URL`): um Documento enviado fica `processado` depois de uma volta do processador."}]},{"id":"17.4","n":"Índice por significado","objetivo":"Hoje não existe nenhum vetor, então não há como achar o trecho “parecido” com a pergunta. Cada trecho ganha um embedding, guardado numa tabela própria com `pgvector`, e toda Versão nova é indexada sozinha.","pronto":"Depois de enviar um Documento, `select count(*) from plataforma.fragmentos_indexados where documento_id = '\u003cid>'` devolve o mesmo número de Fragmentos da Versão corrente.","subs":[{"n":"Qual modelo gera os embeddings?","cam":["dec"],"decisao":true,"hoje":"Nenhum. A Anthropic, que é o modelo de conversa da Sessão 13, não oferece embeddings; é preciso outro fornecedor.","opcoes":["(A) Voyage AI `voyage-2.5` (1.024 dimensões, indicado pela Anthropic, bom em português)","(B) OpenAI `text-embedding-3-small` (1.536 dimensões)","(C) Modelo aberto rodando no nosso servidor (por exemplo `multilingual-e5`)"],"muda":"Fixa o tamanho da coluna `embedding` e cria mais uma chave de API no servidor. (A) e (B) cobram por volume, cerca de centavos por mil páginas. (C) não cobra por uso, mas soma cerca de 1 dia de infraestrutura e precisa de máquina com mais memória.","recomendo":"(A).","peso":"produto"},{"n":"Criar a tabela de trechos com `pgvector`","cam":["banco"],"hoje":"Não existe. Os Fragmentos vivem dentro do JSON do Documento, em `plataforma.registros`; nenhuma migração liga extensão (a última é a `008-canais-conversas-mensagens.sql`).","fazer":["Migração nova em `apps/api/migracoes/` com `create extension if not exists vector with schema extensions;`.","Tabela `plataforma.fragmentos_indexados`: `workspace_id text`, `fragmento_id text`, `documento_id text`, `colecao_id text`, `versao int`, `localizador text`, `conteudo text`, `embedding extensions.vector(\u003cdimensão da decisão>)`, `modelo text`, `criado_em timestamptz default now()`; chave primária `(workspace_id, fragmento_id)`.","Índice `hnsw (embedding vector_cosine_ops)` e índice comum em `(workspace_id, colecao_id)` para o filtro de acesso.","Conferir antes com `npm run migrar -w @n1/api -- --seco`."],"pronto":"`npm run migrar -w @n1/api -- --seco` lista a migração nova, e depois de aplicada em homologação `select extname from pg_extension where extname = 'vector'` devolve uma linha.","nota":"Confirmado na reunião de 19/10: banco vetorial padrão."},{"n":"Gerar e guardar os embeddings","cam":["api"],"hoje":"Não existe.","fazer":["Criar `apps/api/src/conhecimento/embeddings.ts` com `gerarEmbeddings(textos): number[][]`, falando com o fornecedor da decisão; chave numa variável de ambiente nova (por exemplo `VOYAGE_API_KEY`) documentada em `apps/api/.env.example`.","Criar `apps/api/src/conhecimento/indexar.ts` com `indexarVersao(workspaceId, documento, versao)`: manda os Fragmentos em lotes de até 100, grava em `plataforma.fragmentos_indexados` e apaga as linhas das Versões anteriores do mesmo Documento (só a corrente é consultável, B98).","Chamado pelo processador da 17.3 depois de `registrarProcessamentoDaVersao`, e também quando texto colado cria ou restaura Versão (essas já nascem `processado`): o processador procura Versões `processado` sem linha na tabela.","Documento enviado à lixeira, arquivado ou movido de Coleção: apagar ou atualizar `colecao_id` das linhas na mesma volta."],"pronto":"Teste de integração `indexar.test.ts` (pula sem `DATABASE_URL`, com o fornecedor trocado por um falso): restaurar a Versão 1 troca as linhas da Versão 2 pelas da Versão 3 nova."}]},{"id":"17.5","n":"Busca e citação","objetivo":"Hoje o ensaio pega o primeiro trecho de até três Documentos (`referenciasDoEnsaio`), sem olhar a pergunta. A Ferramenta `consultar_conhecimento` passa a buscar os trechos mais próximos da pergunta, só nas Coleções que o Agente e a pessoa podem ler, e a resposta mostra de onde veio cada trecho.","pronto":"Num Espaço com a Política de reembolso e a Tabela de preços, a pergunta “posso devolver depois de 10 dias?” traz o trecho da Política em primeiro lugar, e a citação abre o Documento nesse trecho.","subs":[{"n":"Buscar por significado nas Coleções permitidas","cam":["api"],"hoje":"A Ferramenta `consultar_conhecimento` está só no catálogo (`packages/dominio/src/seed.ts:2604`). O ensaio usa `referenciasDoEnsaio` (`packages/dominio/src/operations/ia/agentes.ts:400`), que devolve o primeiro Fragmento dos três primeiros Documentos.","fazer":["Criar `apps/api/src/conhecimento/buscar.ts` com `buscarConhecimento({ workspaceId, agentId, membroId?, pergunta, k = 6 })`.","Coleções permitidas: as de `conhecimentoAcessivel(state, agentId)` (`derive-ia.ts:242`); quando uma pessoa aciona o Agente, cruzar com as Coleções que ela vê (`recusaNaColecao(..., 'ver')`), a regra de “permissão de quem aciona” da Sessão 16.1.","Gerar o embedding da pergunta e consultar `plataforma.fragmentos_indexados where workspace_id = $1 and colecao_id = any($2) order by embedding \u003c=> $3 limit $4`.","Devolver os trechos e as `KnowledgeReference` (`types/ai.ts:232`) já montadas, com `fragmentIds` dos trechos usados.","Ligar como executor da Ferramenta `consultar_conhecimento` no mecanismo de Ferramentas da Sessão 16.1."],"pronto":"Teste `buscar.test.ts` (pula sem `DATABASE_URL`, embeddings falsos e determinísticos): um Agente sem Concessão na Coleção B nunca recebe trecho de B, mesmo quando é o mais próximo."},{"n":"Ensaio com a busca real","cam":["dom"],"hoje":"`ensaiarAgente` (`agentes.ts:428`) chama `referenciasDoEnsaio` (`agentes.ts:510`) e não recebe nada de fora.","fazer":["Acrescentar ao `EnsaioInput` o campo opcional `referencias: KnowledgeReference[]`, preenchido pelo `apps/api` com o resultado de `buscarConhecimento`.","Quando vier, `ensaiarAgente` usa essas referências; quando não vier, nenhuma (e não mais os primeiros trechos).","Apagar `referenciasDoEnsaio`."],"pronto":"Teste em `operations/ia/agentes.test.ts`: o ensaio grava em `contextComposition.fragmentRefs` exatamente os trechos recebidos."},{"n":"Citar o trecho, não só o Documento","cam":["web"],"hoje":"O Chat (`ia/chat/[sessao]/page.tsx:355-363`) e a Execução (`ia/execucoes/[execucao]/page.tsx:267-290`) já ligam para `/ia/conhecimento/documentos/\u003cid>`, mas sem dizer qual trecho. A lista de Fragmentos da ficha (`documento-completo.tsx:255-266`) não tem âncora.","fazer":["Em `documento-completo.tsx`, dar a cada item de Fragmento o `id` HTML `frg-\u003cfragmentId>` e destacar o que vier no endereço.","No Chat e na Execução, o link passa a ser `/ia/conhecimento/documentos/\u003cid>?versao=\u003cn>#frg-\u003cprimeiro fragmentId>`, com o localizador (`pag3§2`) ao lado do título.","Quando a referência tem `marker` (Documento na lixeira, Versão eliminada…), mostrar o marcador em vez do link, como a Execução já faz."],"pronto":"Você clica na citação de uma resposta e a ficha do Documento abre rolada até o trecho, destacado."}]},{"id":"17.6","n":"Atualização das Fontes de URL","objetivo":"Uma Fonte de URL guarda a política “periódica a cada N horas”, mas nada roda (P16 em `docs/PENDENCIAS-FRONTEND.md:409`). Passa a existir “Atualizar agora” e uma rotina que revisita as Fontes no prazo.","pronto":"Mudar o texto da página de uma Fonte periódica de 1 hora gera, na volta seguinte, uma Versão nova com origem “atualização” no Documento.","subs":[{"n":"Operação de atualizar a Fonte","cam":["dom"],"hoje":"`adicionarFonte` (`conhecimento.ts:175`) grava `updatePolicy`, `state` e os campos `lastUpdateAt` e `lastUpdateResult` (`types/ai.ts:537-549`), que ninguém preenche. A origem `atualizacao` de Versão (`DocumentVersion.origin`) nunca é usada.","fazer":["Criar `registrarAtualizacaoDaFonte(state, colecaoId, fonteId, resultado)`, com ator Sistema: se o texto mudou, cria a Versão N+1 com `origin.kind: atualizacao` e `processing: pendente`; se não mudou, só atualiza `lastUpdateAt`; se falhou, põe a Fonte em `comErro` com o motivo em `lastUpdateResult`.","Criar `pedirAtualizacaoDaFonte(state, membroId, colecaoId, fonteId)`, registrada em `operations/registro.ts` e com esquema em `apps/api/src/rotas/esquemas/ia-conhecimento.ts`: marca a Fonte para a próxima volta (exige `editar` na Coleção).","Comparar pelo `originVersionMark` (já existe no tipo): guardar ali um hash do texto capturado."],"pronto":"Testes em `conhecimento.test.ts` para os três casos: mudou, não mudou e falhou."},{"n":"Rotina que revisita as Fontes","cam":["api"],"hoje":"Não existe.","fazer":["No processador de Documentos da 17.3, acrescentar uma etapa: achar as Fontes `url` ativas com `updatePolicy.kind: periodica` cujo `lastUpdateAt + intervalHours` já passou, ou marcadas por `pedirAtualizacaoDaFonte`; capturar com `capturarUrl` e gravar com `registrarAtualizacaoDaFonte`.","Fontes de Integração ficam de fora: nenhuma Integração real traz documentos hoje; a Fonte continua mostrando “sem sincronização” na tela."],"pronto":"Teste de integração com relógio injetado: uma Fonte de 1 hora não roda aos 59 minutos e roda aos 61."},{"n":"Botão “Atualizar agora” na Fonte","cam":["web"],"hoje":"A Coleção lista as Fontes (`apps/web/src/features/ia/conhecimento/colecao-completa.tsx`) sem nenhuma ação de atualizar.","fazer":["Pôr “Atualizar agora” em cada Fonte de URL, chamando `pedirAtualizacaoDaFonte` pelo `run`, e mostrar `lastUpdateAt` e `lastUpdateResult`."],"pronto":"Você clica em “Atualizar agora”, e em até um minuto a data da última atualização muda."}]}],"ajuste":"+2 dias: seis frentes (armazenamento real, extração de texto, embeddings, busca, citação do trecho e Fontes)."},{"id":"18","n":"IA: Automações em código e Plugins","dias":[4,6],"dep":["14","17"],"ajuste":"+2 dias: o tamanho depende da lista de Automações, que ainda não chegou.","desc":"As Automações deixam de ser criadas pela tela e passam a ser rotinas escritas em código pelo time, que o Agente pode acionar. Entram também os Plugins: pacotes de Skills, Conhecimento e Automações que se instalam num Agente de uma vez. Esta sessão supõe as escolhas recomendadas no levantamento (T2.6). Fica bloqueada até a lista de Automações chegar.","partida":["Editor visual de Automações em `apps/web/src/features/ia/automacoes/editor-de-automacao.tsx` (1.310 linhas), aberto em `/ia/automacoes/[automacao]`.","Motor no domínio (`runListAutomations`, `packages/dominio/src/operations/automations.ts:696`) que já roda as Automações do Financeiro por evento e por horário.","A aba “Plugins” (`apps/web/src/features/ia/personalizar/secoes.ts:19`) só lista as Ferramentas; não existe tipo Plugin."],"pronto":"Ninguém cria Automação pela tela; as do Financeiro continuam rodando; o Agente aciona uma Automação do catálogo; um Plugin instalado num Agente traz as Skills, o Conhecimento e as Automações dele.","tarefas":[{"id":"18.1","n":"Tirar o editor visual","objetivo":"Na reunião de 19/10 ficou decidido que Automação não se cria pela tela. O editor sai, sem parar o que já roda.","pronto":"Não há como criar ou editar Automação pela tela, e as do Financeiro continuam disparando.","subs":[{"n":"Tirar o editor e os botões de criar e editar","cam":["web"],"hoje":"O editor existe em `apps/web/src/features/ia/automacoes/editor-de-automacao.tsx`, com rota em `/ia/automacoes/[automacao]` e botão de criar na lista de IA › Personalizar › Automação.","fazer":["Apagar o editor e a rota de edição.","Manter a lista em IA › Personalizar › Automação, só de leitura: nome, o que faz, quando roda e a última execução."],"pronto":"A lista abre, sem botão de criar nem de editar."},{"n":"Manter as Automações do Financeiro rodando","cam":["dom"],"hoje":"As Automações do Financeiro são registros em `plataforma.registros`, rodados por `runListAutomations` e pelo agendador (`apps/api/src/automacoes/scheduler-worker.ts`).","fazer":["Não mexer no motor nesta sessão.","Tirar do domínio as operações do editor que ficam sem uso (`packages/dominio/src/operations/ia/automacoes-editor.ts`), mantendo as que o motor usa."],"pronto":"Uma Solicitação de pagamento nova continua disparando as Automações do Financeiro em homologação."}]},{"id":"18.2","n":"Catálogo de Automações em código","objetivo":"Ter um lugar no código onde cada Automação nova é escrita, descrita para o Agente e registrada.","pronto":"Uma Automação de exemplo no catálogo roda por horário e aparece na lista.","subs":[{"n":"Criar o formato do catálogo","cam":["dom"],"hoje":"Não existe.","fazer":["Criar `packages/dominio/src/automacoes/catalogo/`, com um arquivo por Automação.","Cada arquivo diz: id, nome, descrição (que o Agente lê), parâmetros com tipos, efeito (leitura, escrita ou externo), gatilho opcional (evento ou horário) e a função que executa.","Cada execução gera um registro de Execução de Automação, como hoje."],"pronto":"Teste da Automação de exemplo."},{"n":"Rodar as Automações com gatilho","cam":["api"],"hoje":"O agendador só conhece as Automações gravadas no banco.","fazer":"O agendador e o motor de eventos passam a rodar também as Automações do catálogo que têm gatilho.","pronto":"A Automação de exemplo roda sozinha no horário marcado."}]},{"id":"18.3","n":"O Agente aciona Automações","objetivo":"Na reunião de 19/10 ficou decidido que o Agente consegue acessar as Automações. Cada Automação do catálogo vira um poder que o Agente pode receber.","pronto":"No Chat, o Agente aciona a Automação de exemplo e a Execução aparece registrada.","subs":[{"n":"Transformar cada Automação em Ferramenta do Agente","cam":["api"],"hoje":"Não existe.","fazer":["Cada Automação do catálogo vira uma Ferramenta com o nome, a descrição e os parâmetros dela.","O Agente só vê as Automações que recebeu como poder no Construtor (Sessão 14).","Automação de efeito externo passa pela aprovação da Sessão 14."],"pronto":"Teste: o Agente sem o poder não vê a Automação; com o poder, aciona e a Execução é registrada."}]},{"id":"18.4","n":"Implementar as Automações da lista","objetivo":"Escrever no catálogo as Automações que você listar. Esta tarefa ganha uma subtarefa por Automação quando a lista chegar.","pronto":"Todas as Automações da lista no catálogo, cada uma com teste.","subs":[{"n":"Escrever cada Automação da lista no catálogo","cam":["dom","api"],"hoje":"A lista ainda não chegou (item T2.6.3 do levantamento).","fazer":"Uma subtarefa por Automação, criada quando a lista chegar, no padrão da 18.2.","pronto":"Cada Automação com teste e aparecendo na lista.","nota":"Bloqueada até a lista chegar."}]},{"id":"18.5","n":"Plugins","objetivo":"Um Plugin junta Skills, Conhecimento e Automações e se instala num Agente de uma vez.","pronto":"Instalar um Plugin num Agente faz aparecer na ficha dele, de uma vez, as Skills, as Coleções e as Automações do Plugin.","subs":[{"n":"Criar o tipo Plugin no domínio","cam":["dom"],"hoje":"Não existe tipo Plugin; “Plugins” é só o nome da aba que lista Ferramentas.","fazer":["Criar `Plugin` em `packages/dominio/src/types/ai.ts`: nome, descrição, Skills, Coleções de Conhecimento e Automações do catálogo.","Operações: criar, editar, arquivar, instalar num Agente e desinstalar.","Instalar concede as Skills, o acesso às Coleções e o acionamento das Automações. Desinstalar retira só o que veio do Plugin, sem mexer no que o Agente já tinha."],"pronto":"Testes de instalar e desinstalar, incluindo um Agente que já tinha uma das Skills."},{"n":"Telas de Plugins","cam":["web"],"hoje":"A aba “Plugins” (`apps/web/src/features/ia/personalizar/secoes.ts:19`) lista Ferramentas.","fazer":["A aba atual passa a se chamar “Ferramentas”.","Nova aba “Plugins”, com a lista de pacotes e a tela de montar um Plugin escolhendo Skills, Coleções e Automações.","No Construtor (Sessão 14), o passo Plugins instala e desinstala."],"pronto":"Você monta um Plugin pela tela e o instala num Agente."},{"n":"Quem pode criar um Plugin?","cam":["dec"],"decisao":true,"hoje":"Não existe Plugin.","opcoes":["(A) Administrador, pela tela, juntando Skills, Coleções e Automações que já existem","(B) Só o time, no código"],"muda":"(A) é a tela da tarefa anterior. (B) tira a tela de montar e deixa só a de instalar.","recomendo":"(A): o Plugin só junta peças que já existem, então não há risco de criar algo que o time não escreveu.","peso":"arrumacao"}]}],"bloqueio":"Só começa com a lista de Automações (item T2.6.3 do levantamento)."},{"id":"19","n":"Saída do protótipo: LGPD, rotinas e dados reais","dias":[3,5],"dep":["1","3","18"],"desc":"O que separa o protótipo do produto em produção. As rotinas de limpeza da lixeira e de recorrência só rodam nas Listas que, por acaso, têm uma Automação de vencimento; só Tarefa expira na lixeira; não há como exportar nem anonimizar os dados de um Contato; a porta fictícia `/login` e vários avisos de “protótipo” continuam na tela; e o teste no navegador cobre só a tela de entrar e o formulário público.","partida":["Expurgo da lixeira (`purgeExpiredTasks`, `packages/dominio/src/operations/tasks.ts:780`) e recorrência por calendário (`runCalendarRecurrences`, `packages/dominio/src/operations/collaboration.ts:546`) já existem e rodam no `agendaDoDia` do agendador (`apps/api/src/automacoes/scheduler-worker.ts:184`).","Produção já nasce sem dados de demonstração: `bootstrap:gestao` (`packages/dominio/src/bootstrap-gestao.ts`) parte de um estado vazio e aplica só os processos do Financeiro.","As rotas públicas `/f/\u003csegredo>` e `/p/\u003csegredo>` já leem do servidor (`GET /v1/public/forms/:secret` e `GET /v1/public/tasks/:secret`); o `apps/web/CONTEXT.md:39-41` ainda diz o contrário.","A tabela `plataforma.mensagens` (008) já tem as colunas `anonimizada` e `carga_bruta`, e uma regra que aceita mensagem anonimizada sem conteúdo.","7 testes ponta a ponta na API (`apps/api/src/e2e/`) e 3 testes Playwright na web (`apps/web/e2e/fumaca.spec.ts` e `formulario-publico.spec.ts`), fora do CI."],"pronto":"Em produção: uma Lista sem Automação expurga a lixeira e cria as recorrências do dia; um Contato enviado à lixeira some depois do prazo; um Administrador exporta e anonimiza um Contato pela ficha; `/login` dá 404; e o CI roda os testes de navegador dos fluxos principais contra homologação.","tarefas":[{"id":"19.1","n":"Rotinas diárias em todas as Listas","objetivo":"Hoje o agendador só visita as Listas que têm uma Automação ativa com gatilho de vencimento; numa Lista comum, a lixeira nunca esvazia e a recorrência por calendário nunca cria a próxima Tarefa. A manutenção passa a ser uma rotina própria, que visita todas as Listas uma vez por dia.","pronto":"Numa Lista sem nenhuma Automação, uma Tarefa na lixeira há 31 dias é eliminada e a Tarefa recorrente de amanhã é criada, sem ninguém abrir a tela.","subs":[{"n":"Separar a manutenção da agenda de Automações","cam":["dom","api"],"hoje":"`agendaDoDia` (`scheduler-worker.ts:184-197`) roda Automações, recorrência e expurgo juntos, mas só para os pares de `catalogoDeListasComAgenda` (`scheduler-worker.ts:278-303`): Listas com Automação ativa de escopo Lista e Versão publicada com gatilho `condicaoTemporal`. `semear` (`scheduler-worker.ts:413`) semeia só esses pares. As duas operações exigem administrar a Lista (`containerAdminRefusal`).","fazer":["Criar `packages/dominio/src/operations/manutencao.ts` com `manutencaoDoDia(state, dia)`, ator Sistema: percorre todas as Listas ativas do Espaço e chama o miolo de `runCalendarRecurrences` e de `purgeExpiredTasks` sem a checagem de administrador (a checagem fica só nas versões chamadas por pessoa). Não registrar em `operations/registro.ts`.","Criar `apps/api/src/rotinas/manutencao-diaria.ts`: uma vez por dia civil e por Espaço de Trabalho, hidrata, chama `manutencaoDoDia` dentro de `executar()` e grava que rodou.","Migração nova com `plataforma.rotinas_do_dia (workspace_id, rotina, dia_civil, iniciada_em, concluida_em, erro)`, chave `(workspace_id, rotina, dia_civil)`, para não rodar duas vezes com dois processos.","Tirar `runCalendarRecurrences` e `purgeExpiredTasks` de `agendaDoDia`, que volta a cuidar só de Automações.","Ligar a rotina em `apps/api/src/index.ts`, ao lado do agendador."],"pronto":"Teste `manutencao-diaria.test.ts` (pula sem `DATABASE_URL`): uma Lista sem Automação, com uma Tarefa na lixeira há 31 dias e uma recorrência vencida, termina a volta sem a Tarefa e com a ocorrência nova; rodar duas vezes no mesmo dia não duplica nada."},{"n":"Quais famílias expiram na lixeira?","cam":["dec"],"decisao":true,"hoje":"Só Tarefa expira (`previsaoDeEliminacao`, `tasks.ts:768`). Documento, Agente, Automação, Pasta, Lista e, no CRM, Contato, Empresa, Negócio, Funil e Conversa ficam na lixeira para sempre.","opcoes":["(A) Tarefa e as entidades do CRM (Contato, Empresa, Negócio, Funil, Conversa)","(B) Todas as famílias que têm lixeira"],"muda":"(A) é a subtarefa seguinte. (B) soma cerca de 1 dia para Documento, Agente, Automação, Pasta e Lista.","recomendo":"(A) agora: é onde há dado pessoal. (B) depois.","peso":"produto"},{"n":"Expirar as entidades do CRM na lixeira","cam":["banco","api","dom"],"hoje":"As tabelas do CRM têm `estado = 'na_lixeira'` (`apps/api/migracoes/007-crm.sql:72`, `:148`, `:326`, `:422`; `plataforma.conversas` na `008:104`), mas nenhuma guarda quando entrou na lixeira. `excluirPermanentemente` do Contato (`apps/api/src/servicos/crm/contatos.ts:424`) recusa quando há Negócio ou Conversa.","fazer":["Migração nova: coluna `na_lixeira_em timestamptz` em `plataforma.contatos`, `empresas`, `negocios`, `funis` e `conversas`, preenchida com `atualizado_em` para quem já está na lixeira.","Nos repositórios de `apps/api/src/repositorios/crm/` (`definirEstado`, `contatos.ts:299`, e os equivalentes), gravar `na_lixeira_em = now()` ao entrar e `null` ao sair.","No domínio, criar a função pura `vencidoNaLixeira(naLixeiraEm, retentionDays, hoje)` ao lado de `previsaoDeEliminacao` e usar nas duas.","Na rotina diária, excluir o que venceu pelos mesmos serviços de `apps/api/src/servicos/crm/` (respeitando as recusas). Contato vencido que não pode ser excluído por ter Conversa é anonimizado (19.2)."],"pronto":"Teste de integração: um Negócio na lixeira há 31 dias some na volta da rotina; um Contato com Conversa vencido fica anonimizado, com a Conversa preservada."},{"n":"Conferir a saúde dos Canais conectados","cam":["api"],"hoje":"Nada confere se um Canal `conectada` continua conectado; a queda só aparece quando uma mensagem falha.","fazer":["Na rotina, a cada hora, chamar o estado da conexão de cada Canal `conectada` pela interface de provedor da Sessão 2.3 e, se caiu, gravar `desconectada` em `plataforma.canais.conexao` e avisar o dono do Canal.","As sincronizações de Grupos (6.3), modelos de mensagem (7.3) e Fontes (17.6) ficam nas sessões delas; aqui não se repete."],"pronto":"Teste com um provedor falso que responde “desconectado”: o Canal muda de estado e o aviso nasce."}]},{"id":"19.2","n":"LGPD: exportar e anonimizar um Contato","objetivo":"Hoje não há como atender a um pedido de dados pessoais: nada exporta o que existe de um Contato, e a exclusão permanente é recusada quando ele tem Conversa. Um Administrador passa a exportar tudo do Contato num arquivo e a anonimizá-lo, apagando os dados pessoais dele e das mensagens, sem perder as contagens.","pronto":"Pela ficha do Contato, um Administrador baixa o arquivo com os dados e depois anonimiza o Contato; a Conversa continua na Caixa de Entrada como “Contato anonimizado”, sem texto, e os Painéis contam a mesma quantidade de mensagens.","subs":[{"n":"Exportar os dados de um Contato","cam":["dom","api","web"],"hoje":"Não existe. As rotas do Contato (`apps/api/src/rotas/crm/contatos.ts:108-161`) vão de listar a excluir permanentemente.","fazer":["No domínio, criar o tipo `ExportacaoDeContato` e a função pura `montarExportacaoDoContato(...)` em `packages/dominio/src/operations/lgpd.ts`, com a lista fechada do que entra.","Criar `GET /contatos/:id/exportacao` em `apps/api/src/rotas/crm/contatos.ts` e o serviço `exportarDadosDoContato` em `apps/api/src/servicos/crm/contatos.ts`, só para Administrador.","O serviço junta: a linha de `plataforma.contatos`, `contato_identificadores`, `contato_empresa`, os Negócios em que ele está, as Conversas e Mensagens dele (texto, data, Canal e o link assinado de cada anexo), e as Tarefas com Vínculo a ele em `plataforma.registros`.","Devolver JSON como download (`Content-Disposition: attachment`) e registrar na Atividade quem exportou e quando.","Na ficha do Contato (`apps/web/src/app/(shell)/crm/contatos/[contato]/page.tsx`), botão “Exportar dados (LGPD)”, visível só para Administrador."],"pronto":"Teste do serviço em `contatos.test.ts`: o arquivo de um Contato com uma Conversa de 3 mensagens traz as 3 mensagens e os identificadores; um Membro comum recebe 403."},{"n":"Anonimizar um Contato","cam":["dom","api","web"],"hoje":"Não existe. `excluirPermanentemente` recusa Contato com Conversa (`apps/api/src/servicos/crm/contatos.ts:441-449`). A 008 já preparou `plataforma.mensagens.anonimizada` e o aviso de que `carga_bruta` precisa ser zerada (`008-canais-conversas-mensagens.sql:131`).","fazer":["No domínio (`operations/lgpd.ts`), escrever a regra do que se apaga e do que fica: apaga nome, sobrenome, nascimento, foto, descrição, endereços, campos adicionais e identificadores; fica o id, a Origem, a Qualificação, as datas e os vínculos com Negócio e Conversa.","Criar `POST /contatos/:id/anonimizar` e o serviço `anonimizarContato`, numa transação: limpar as colunas pessoais de `plataforma.contatos` e gravar o nome “Contato anonimizado”; apagar as linhas de `contato_identificadores`; em `plataforma.mensagens` do Contato, gravar `conteudo = null`, `anexos = '[]'`, `carga_bruta = null`, `remetente_externo = null` e `anonimizada = true`; apagar do bucket os objetos dos anexos.","Uma migração nova acrescenta `anonimizado_em` em `plataforma.contatos`, para a tela e para a exportação saberem.","Na ficha, botão “Anonimizar (LGPD)” com confirmação que exige digitar o nome do Contato; depois disso a ficha fica só leitura."],"pronto":"Teste em `apps/api/src/e2e/` (pula sem `DATABASE_URL`): depois de anonimizar, `select count(*) from plataforma.mensagens where conteudo is not null and conversa_id in (\u003cconversas do Contato>)` devolve 0, e a contagem total de mensagens não muda."},{"n":"Por quanto tempo guardar as mensagens?","cam":["dec"],"decisao":true,"hoje":"Sem prazo: mensagem nunca é apagada. O prazo dos registros de Execução da IA é decidido na T.4.","opcoes":["(A) 1 ano","(B) 5 anos","(C) Para sempre, só anonimizando sob pedido"],"muda":"Com (A) ou (B), a rotina diária da 19.1 anonimiza as mensagens que passarem do prazo (cerca de meio dia a mais). Com (C), nada muda.","recomendo":"(B): cobre prazos de cobrança e disputa comercial.","peso":"produto"},{"n":"Aplicar os prazos de guarda","cam":["api"],"hoje":"Não existe.","fazer":["Na rotina diária da 19.1, anonimizar as mensagens mais velhas que o prazo decidido acima e apagar as Execuções de IA mais velhas que o prazo da T.4 (coleções `agentExecutions` e `automationExecutions` em `plataforma.registros`)."],"pronto":"Teste com relógio injetado: uma mensagem um dia além do prazo é anonimizada; uma um dia antes, não."}]},{"id":"19.3","n":"Tirar o protótipo da tela","objetivo":"Uma pessoa que usa o produto ainda encontra a porta fictícia `/login` (“qualquer usuário e senha entram”) e frases como “neste protótipo”. Tudo isso sai, e a documentação para de dizer que as rotas públicas estão em memória.","pronto":"`/login` responde 404, `grep -rni 'protótipo' apps/web/src --include=*.tsx` só acha comentários de código, e você aprova a revisão final.","subs":[{"n":"Apagar a porta fictícia `/login`","cam":["web"],"hoje":"`apps/web/src/app/login/page.tsx` aceita qualquer usuário e senha (aviso na linha 85). A porta real é `/entrar` (`apps/web/src/app/entrar/page.tsx`), e o `proxy.ts` (`apps/web/src/proxy.ts:17`) nem lista `/login` como pública.","fazer":["Apagar a pasta `apps/web/src/app/login/` e o CSS dela (`.login-marca` em `componentes.css`, se só ela usar)."],"pronto":"Teste novo em `apps/web/e2e/fumaca.spec.ts`: sem sessão, `/login` leva a `/entrar`; com sessão, dá 404."},{"n":"Trocar os avisos de protótipo","cam":["web"],"hoje":"Avisos na tela: descrição do site (`apps/web/src/app/layout.tsx:18`); Chat (`ia/chat/[sessao]/page.tsx:221`); chamada de vídeo (`crm/reunioes/[reuniao]/page.tsx:375`); Minha conta (`minha-conta/page.tsx:212`); Lixeira (`configuracoes/lixeira/page.tsx:325`); anexar e gravar no Construtor (`features/ia/agent-builder/chat-composer.tsx:36` e `:64`); Automações (`features/ia/rotulos.ts:53-54`, `automacao-spec.ts:298-322`, `:411`, `:506`, `editor-de-automacao.tsx:334`, `:1120`); Conhecimento (`adicionar-documento-dialog.tsx:160`, `colecao-completa.tsx:629`).","fazer":["Para cada aviso: se a função ficou pronta numa sessão anterior (Chat na 11, Automações na 15, Conhecimento na 14), apagar; se não ficou, trocar por texto de produto (por exemplo “Em breve”) e esconder o botão.","`layout.tsx`: descrição “Plataforma de trabalho, CRM e IA”."],"pronto":"O `grep` do pronto da tarefa só acha comentários."},{"n":"Corrigir a documentação das rotas públicas","cam":["web"],"hoje":"`apps/web/CONTEXT.md:39-41` diz que `/f` e `/p` “continuam em memória, com o seed do produto”, mas as duas páginas já são Server Components que chamam o `apps/api` por `transportePublico` (`apps/web/src/app/(publico)/f/[segredo]/page.tsx` e `(publico)/p/[segredo]/page.tsx`).","fazer":["Reescrever o trecho de `apps/web/CONTEXT.md` e conferir o mesmo erro no `CONTEXT.md` da raiz (“`store.ts` ainda monta o seed”)."],"pronto":"Os dois `CONTEXT.md` descrevem o que o código faz."},{"n":"Tirar o seed de demonstração do caminho de produção","cam":["dom"],"hoje":"`buildSeed()` (`packages/dominio/src/seed.ts:118`) e `buildProductSeed()` (`seed-produto.ts:18`) não são mais usados pela tela nem pela API em produção, mas `seed.ts` também exporta o catálogo real (`TOOLS`, `MODELOS_DA_PLATAFORMA`), importado por `bootstrap-gestao.ts:21`. Cerca de 156 arquivos de teste usam `buildSeed`.","fazer":["Mover o catálogo para `packages/dominio/src/catalogo-da-plataforma.ts`.","Mover `seed.ts`, `seed-produto.ts`, `seed-comercial.ts`, `seed-pos-venda.ts` e `seed-ferramentas.ts` para `packages/dominio/src/testes/` e tirá-los do `exports` de `packages/dominio/package.json`, deixando só para os testes.","`MEUS_NEGOCIOS_ID`, importado pela tela de `@n1/dominio/seed-comercial` (`apps/web/src/app/(shell)/crm/meus-negocios/page.tsx:13`), vira constante de produto num arquivo próprio.","Manter `seed-financeiro.ts` e `seed-contas-a-receber.ts`: são os processos reais que o `bootstrap:gestao` aplica."],"pronto":"`grep -rn '@n1/dominio/seed' apps/web/src apps/api/src | grep -v test` só acha `seed-financeiro` e `seed-contas-a-receber`, e `npm run check` passa."}]},{"id":"19.4","n":"Testes no navegador dos fluxos principais","objetivo":"Hoje o Playwright abre a tela de entrar e o formulário público, e nem roda no CI (`.github/workflows/check.yml` só roda `npm run check` e `npm run test`). Passam a existir testes dos cinco fluxos principais, rodando no CI contra homologação.","pronto":"O CI tem um passo de Playwright verde com os cinco fluxos, e um teste quebrado de propósito deixa o passo vermelho.","subs":[{"n":"Usuário de teste e login no Playwright","cam":["web","infra"],"hoje":"`apps/web/playwright.config.ts` sobe `next start` local e nenhum teste faz login. Homologação nasce na Sessão 1.6.","fazer":["Criar em homologação um usuário de teste do Supabase, com senha nos segredos do GitHub (`E2E_EMAIL`, `E2E_SENHA`).","Criar `apps/web/e2e/autenticar.setup.ts`, que entra por `/entrar` e guarda a sessão (`storageState`) para os outros testes; ligar como projeto de setup em `playwright.config.ts`, usando `E2E_BASE_URL` de homologação."],"pronto":"Rodar `npm run test:e2e -w @n1/web` com `E2E_BASE_URL` de homologação passa o setup."},{"n":"Escrever os cinco fluxos","cam":["web"],"hoje":"Só `fumaca.spec.ts` (1 teste) e `formulario-publico.spec.ts` (2 testes).","fazer":["`e2e/tarefa.spec.ts`: criar Tarefa, mudar Status, comentar, anexar arquivo.","`e2e/caixa-de-entrada.spec.ts`: abrir uma Conversa de teste, responder, ver a mensagem no fio.","`e2e/chat.spec.ts`: perguntar ao Agente e ver a resposta chegar (modelo de homologação).","`e2e/superadmin.spec.ts`: convidar um usuário e dar acesso a um módulo (Sessão 12).","`e2e/entrar.spec.ts`: entrar, sair e ser levado a `/entrar` ao abrir uma página protegida."],"pronto":"Os cinco arquivos passam contra homologação."},{"n":"Rodar no CI","cam":["infra"],"hoje":"`.github/workflows/check.yml` não instala navegador nem roda Playwright.","fazer":["Criar o job `e2e` em `.github/workflows/check.yml`, depois do `check`: `npx playwright install --with-deps chromium` e `npm run test:e2e -w @n1/web`, com os segredos de homologação."],"pronto":"Um pull request mostra o job `e2e` verde."}]}],"ajuste":"+2 dias: rotinas em todas as Listas, lixeira do CRM com coluna nova, LGPD e testes no navegador."},{"id":"20","n":"Painel","dias":[4,5],"dep":["3","19"],"desc":"Por último porque o Painel lê dados de todo o resto. Hoje o modelo é rico, mas as telas são só leitura dos 4 Painéis de demonstração, não existe operação de criar ou editar, a leitura só conhece 4 das 11 fontes e 2 das 8 contas (contar e somar), ignora o período e a posição dos Widgets, e lê o CRM antigo, que a Sessão 3 tira do código. Um dia para desenhar com você e o resto para construir.","partida":["Tipos em `packages/dominio/src/types/panels.ts`: `Panel` (`panels.ts:137`), `Widget` (`panels.ts:103`), 11 fontes (`DataSourceTarget`, `panels.ts:9`), 9 tipos de visualização (`DataViewType`, `panels.ts:23`) e 8 contas (`Aggregation`, `panels.ts:60`).","A leitura `widgetReading` (`packages/dominio/src/derive.ts:592`) confere se quem olha alcança o escopo e devolve número, valor por moeda, série ou “sem acesso”; `recordsOfTarget` (`derive.ts:734-764`) só conhece `deal`, `conversation`, `task` e `contact`.","Telas `apps/web/src/app/(shell)/paineis/page.tsx` e `paineis/[painel]/page.tsx`; gráficos `Barras`, `Colunas`, `Funil` e `Rosca` em `apps/web/src/features/paineis/graficos.tsx`.","Os 4 Painéis (SDR, Closer, Atendimento, Operações) existem só no seed de demonstração (`packages/dominio/src/seed.ts:1953-1982`); produção não tem nenhum."],"pronto":"O Painel desenhado com você está no ar em produção, montado pela tela, com números que batem com as telas do CRM e das Listas.","tarefas":[{"id":"20.1","n":"Desenhar com você","objetivo":"Sem saber quem olha e o que precisa ver, a sessão constrói fontes e gráficos que ninguém usa. Fechar no primeiro dia o primeiro Painel real e como ele é montado.","pronto":"Um esboço aprovado por você, com a lista de Widgets (título, fonte, conta, dimensão, período e gráfico).","subs":[{"n":"O que o primeiro Painel mostra e para quem?","cam":["dec"],"decisao":true,"hoje":"Quatro Painéis de demonstração (SDR, Closer, Atendimento, Operações), só leitura, que não existem em produção.","opcoes":["(A) Um Painel de gestão: vendas (Negócios por Etapa, valor ganho no mês) e atendimento (Conversas abertas por Fila, tempo de primeira resposta)","(B) Um Painel por pessoa: as minhas Tarefas, os meus Negócios e as minhas Conversas","(C) Os dois"],"muda":"Define quais fontes de dados e gráficos a 20.3 e a 20.4 constroem primeiro. (C) soma cerca de 1 dia.","recomendo":"(A).","peso":"produto"},{"n":"Como se posicionam os Widgets?","cam":["dec"],"decisao":true,"hoje":"O Painel guarda `layout` com x, y, largura e altura por Widget (`LayoutCell`, `panels.ts:121`), mas a tela ignora e põe os Widgets numa grade fixa (`paineis/[painel]/page.tsx:112` e `:125`).","opcoes":["(A) Grade de 12 colunas com larguras fixas (um terço, metade, inteira) e ordem por arrastar na lista","(B) Arrastar e redimensionar livre, como no ClickUp"],"muda":"(A) cabe na sessão. (B) soma cerca de 1 dia e uma biblioteca de grade.","recomendo":"(A).","peso":"arrumacao"}]},{"id":"20.2","n":"Criar e editar Painel no domínio","objetivo":"Não existe nenhuma operação de Painel: o único lugar que grava em `state.panels` é a transferência de dono ao remover um Membro (`operations/members.ts:246`). Passam a existir as operações de criar, editar, arquivar e montar Widgets, com as regras do documento 21.","pronto":"Testes cobrem criar, editar, arquivar e montar Widgets, e as recusas por permissão e por Widget inválido.","subs":[{"n":"Operações de Painel e Widget","cam":["dom","api"],"hoje":"Não existem; `docs/PENDENCIAS-FRONTEND.md:383` lista Painel e Widget entre o que continua sem criação.","fazer":["Criar `packages/dominio/src/operations/paineis.ts` com `criarPainel`, `editarPainel` (nome, descrição, âncora), `arquivarPainel`, `restaurarPainel`, `enviarPainelALixeira`, `adicionarWidget`, `editarWidget`, `removerWidget` e `posicionarWidgets` (grava `layout`).","Regras: o dono é sempre um Membro (A7); só o dono ou um Administrador edita; `texto` não tem Fonte e os outros têm exatamente uma (INV-PAI-03); a conta só usa atributo da entidade-alvo (RN-PAI-08); um Widget por célula de `layout`.","Registrar todas em `operations/registro.ts` e criar `apps/api/src/rotas/esquemas/paineis.ts` com os esquemas de argumento."],"pronto":"Testes em `operations/paineis.test.ts`, incluindo a recusa de um Membro que não é dono nem Administrador."},{"n":"Validar o Widget por quem olha","cam":["dom"],"hoje":"`WidgetValidity` (`panels.ts:148`) existe, mas nada o calcula.","fazer":["Criar `validadeDoWidget(state, widget)` em `derive.ts`: Fonte eliminada, Funil ou Lista arquivados, atributo que não existe mais; a tela mostra a causa no lugar do gráfico (RN-PAI-20)."],"pronto":"Teste: arquivar o Funil de um Widget o deixa inválido com a causa “Funil arquivado”."}]},{"id":"20.3","n":"Leitura com dados reais","objetivo":"A leitura de hoje só conta e soma, ignora o período, devolve vazio para 7 das 11 fontes e lê `state.deals`, `state.contacts` e `state.conversations`, o modelo antigo que a Sessão 3 apaga. Ela passa a ser feita no servidor, por uma rota própria, com a regra de conta no domínio e a busca dos registros nas tabelas novas.","pronto":"O Widget “Negócios por Etapa” do Painel de gestão mostra os mesmos números da tela do Funil, e muda quando um Negócio muda de Etapa.","subs":[{"n":"Separar o plano da leitura do cálculo","cam":["dom"],"hoje":"`widgetReading` (`derive.ts:592`) faz tudo junto sobre o `DataState`: escolhe os registros (`recordsOfTarget`, `derive.ts:734`), filtra, agrupa e soma.","fazer":["Criar em `packages/dominio/src/paineis/leitura.ts` duas funções puras: `planoDaLeitura(state, widget, membroId, agora)`, que devolve alvo, escopos, filtros fixos, período resolvido (por exemplo `esteMes` vira datas) e a conta, ou “sem acesso”; e `calcularLeitura(plano, linhas)`, que recebe as linhas já buscadas e devolve o `WidgetReading`.","`calcularLeitura` implementa as 8 contas de `Aggregation`: contagem, soma, média, mínimo, máximo, taxa, duração e percentual (hoje `valueOf`, `derive.ts:679-689`, só trata contagem e soma de `value` e `estimate`).","Aplicar o `period` do Widget, que hoje nem entra no tipo aceito por `widgetReading` (`derive.ts:594-611`).","Manter a regra de moedas (RN-PAI-13) que já existe em `derive.ts:653-675`."],"pronto":"Testes em `paineis/leitura.test.ts` para cada conta e para `esteMes`, com linhas montadas no teste.","nota":"A Sessão 3 (tarefa 3.4) deixa uma ponte para o Painel ler as tabelas novas pela tela. Esta tarefa substitui a ponte pela leitura no servidor."},{"n":"Buscar os registros de cada fonte","cam":["api"],"hoje":"Não existe; os Painéis vêm inteiros no `GET /estado` e são lidos na tela.","fazer":["Criar `apps/api/src/servicos/paineis/linhas.ts` com uma função por fonte: `deal` em `plataforma.negocios`, `contact` em `plataforma.contatos`, `company` em `plataforma.empresas`, `conversation` em `plataforma.conversas`, `message` em `plataforma.mensagens`; `task`, `agentExecution`, `automationExecution`, `approvalRequest`, `activityRecord` e `knowledgeDocument` do `DataState` hidratado.","Filtrar por quem olha, registro a registro: Tarefa por `memberSeesTask`, Negócio e Contato pela regra de acesso das rotas do CRM (`apps/api/src/servicos/crm/acesso.ts`). Hoje `widgetReading` só confere o escopo, e um escopo `workspace` devolve todas as Tarefas, mesmo as que a pessoa não vê.","Fazer as contas simples no SQL     SESSOES.forEach(function (s) { s.tarefas.forEach(function (t) {
      if (tipo === "t" && t.id === id) out = { tipo: tipo, s: s, t: t };
      if (tipo === "u") t.subs.forEach(function (su) { if (su.id === id) out = { tipo: tipo, s: s, t: t, u: su }; });
    }); });
    return out;
  }
  function depTexto(s) {
    var l = s.dep.map(function (d) { var x = porId[d]; return x.trilha ? x.n : "Sessão " + x.id + " · " + x.n; });
    if (s.meta) l.push("Aprovação da Meta");
    return l.length ? l.map(esc).join("<br>") : "—";
  }
  function caixaPrazo(u) {
    var alvo = u.bloqueia && porId[u.bloqueia] ? ' · destrava a Sessão ' + esc(u.bloqueia) + ' · ' + rico(porId[u.bloqueia].n) : '';
    return bloco("Prazo", '<div class="caixa nota">Decidir até ' + esc(curta(D(u.prazo))) + alvo + '.' + (u.decisao && !u.decidido ? ' Ainda não decidido: quando decidir, mande a resposta para registrar aqui.' : '') + '</div>');
  }
  function bloco(titulo, conteudo) { return '<div class="bloco"><h3>' + titulo + '</h3>' + conteudo + '</div>'; }
  function itemSub(su) {
    return '<button type="button" class="item" data-ref="u:' + su.id + '"><span class="num">' + esc(su.id.split(".").pop()) + '</span><span class="item-texto">' + rico(su.n) + '</span><span class="item-meta">' + pesoHtml(su) + camHtml(su.cam) + '</span></button>';
  }
  function abrirCard(ref) {
    var a = acha(ref); if (!a) return;
    estado.card = ref;
    var s = a.s, h = [];
    var nav = ['<button type="button" data-ref="s:' + s.id + '">' + esc(rotuloSessao(s)) + '</button>'];
    if (a.t) nav.push('<span>/</span><button type="button" data-ref="t:' + a.t.id + '">Tarefa ' + esc(a.t.id) + '</button>');
    h.push('<div class="card-topo"><nav class="trilha-nav" aria-label="Caminho">' + nav.join("") + '</nav><button type="button" class="fechar" id="fechar" aria-label="Fechar">' +
      '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>');
    h.push('<div class="card-corpo">');

    if (a.tipo === "s") {
      var nSubs = s.tarefas.reduce(function (m, t) { return m + t.subs.length; }, 0);
      var nDec = s.tarefas.reduce(function (m, t) { return m + t.subs.filter(function (x) { return x.decisao; }).length; }, 0);
      h.push('<div><div class="eyebrow">' + esc(rotuloSessao(s)) + '</div><h2 id="card-titulo">' + esc(s.n) + '</h2><div class="subtitulo">' + esc(faixa(s.ini, s.fim)) + ' · ' + diasTxt(s.k) + '</div></div>');
      h.push(texto(s.desc));
      h.push('<dl class="info"><dt>Depende de</dt><dd>' + depTexto(s) + '</dd><dt>Tamanho</dt><dd>' + s.tarefas.length + ' tarefas · ' + nSubs + ' subtarefas' + (nDec ? ' · ' + nDec + (nDec === 1 ? ' decisão' : ' decisões') : '') + '</dd>' +
        (s.dias ? '<dt>Prazo</dt><dd>Plano: ' + diasTxt(s.dias[0]) + (s.dias[0] !== s.dias[1] ? ' · com ajustes: ' + diasTxt(s.dias[1]) : '') + '</dd>' : '') + '</dl>');
      if (s.bloqueio) h.push(bloco("Bloqueada", '<div class="caixa nota">' + rico(s.bloqueio) + '</div>'));
      if (s.ajuste) h.push('<div class="caixa nota">' + rico(s.ajuste) + '</div>');
      if (s.nota) h.push('<div class="caixa nota">' + rico(s.nota) + '</div>');
      h.push(bloco("A sessão fica pronta quando", '<div class="caixa pronto">' + rico(s.pronto) + '</div>'));
      if (s.preparo) h.push(bloco("Antes da reunião, abra", '<ul>' + s.preparo.map(function (p) { return '<li>' + rico(p) + '</li>'; }).join("") + '</ul>'));
      if (s.vocab) h.push(bloco("Vocabulário", '<div class="vocab">' + s.vocab.map(function (v) { return '<div class="vocab-linha"><b>' + esc(v[0]) + '</b><span>' + esc(v[1]) + '</span><em>' + esc(v[2]) + '</em></div>'; }).join("") + '</div>'));
      h.push(bloco("Ponto de partida no código", '<ul>' + s.partida.map(function (p) { return '<li>' + rico(p) + '</li>'; }).join("") + '</ul>'));
      h.push(bloco("Tarefas", '<div class="itens">' + s.tarefas.map(function (t) {
        return '<button type="button" class="item" data-ref="t:' + t.id + '"><span class="num">' + esc(t.id) + '</span><span class="item-texto">' + rico(t.n) + '</span><span class="item-meta">' + esc(faixa(t.ini, t.fim)) + '</span></button>';
      }).join("") + '</div>'));

    } else if (a.tipo === "t") {
      var t = a.t;
      h.push('<div><div class="eyebrow">Tarefa ' + esc(t.id) + '</div><h2 id="card-titulo">' + rico(t.n) + '</h2><div class="subtitulo">' + esc(rotuloSessao(s) + " · " + s.n) + '</div></div>');
      h.push(bloco("O problema e o objetivo", texto(t.objetivo)));
      h.push(bloco("A tarefa fica pronta quando", '<div class="caixa pronto">' + rico(t.pronto) + '</div>'));
      h.push('<dl class="info">' + (s.trilha && !t.inicio ? (t.tempo ? '<dt>Tempo</dt><dd>' + t.tempo + ' min de reunião</dd>' : '') : t.inicio ? '<dt>Período</dt><dd>' + esc(faixa(t.ini, t.fim)) + '</dd>' : '<dt>Datas</dt><dd>' + esc(faixa(t.ini, t.fim)) + ' <span style="color:var(--texto-4)">(estimadas dentro da sessão)</span></dd>') +
        '<dt>Camadas</dt><dd>' + (t.cam.length ? camHtml(t.cam) : "—") + '</dd></dl>');
      h.push(bloco("Subtarefas", t.subs.length ? '<div class="itens">' + t.subs.map(itemSub).join("") + '</div>' : '<div class="vazio">Nenhuma subtarefa ainda. Os itens dos seus testes entram aqui.</div>'));

    } else {
      var u = a.u;
      h.push('<div><div class="eyebrow">' + (u.decisao ? (u.decidido ? "Decisão tomada " : "Decisão ") : "Subtarefa ") + esc(u.id) + '</div><h2 id="card-titulo">' + rico(u.n) + '</h2>' +
        '<div class="subtitulo"><span>' + esc("Tarefa " + a.t.id + " · " + a.t.n) + '</span>' + pesoHtml(u) + camHtml(u.cam) + '</div></div>');
      if (u.decisao && u.decidido) {
        h.push(bloco("Decidido na reunião", '<div class="caixa decidido">' + rico(u.decidido) + '</div>'));
        if (tem(u.muda)) h.push(bloco("O que muda no plano", texto(u.muda)));
        if (tem(u.atencao)) h.push(bloco("Ponto de atenção", '<div class="caixa nota">' + rico(u.atencao) + '</div>'));
      } else if (u.decisao) {
        if (u.prazo) h.push(caixaPrazo(u));
        if (tem(u.ver)) h.push(bloco("Para ver na tela", texto(u.ver, "var(--texto-2)")));
        if (tem(u.hoje)) h.push(bloco("Como é hoje", texto(u.hoje)));
        if (tem(u.pesquisar)) h.push(bloco("O que pesquisar", Array.isArray(u.pesquisar) && u.pesquisar.length > 1 ? texto(u.pesquisar) : texto(u.pesquisar)));
        h.push(bloco("Você decide", '<ul class="opcoes">' + u.opcoes.map(function (o) { return '<li>' + rico(o) + '</li>'; }).join("") + '</ul>'));
        h.push(bloco("O que muda depois", texto(u.muda)));
        h.push(bloco("Recomendo", '<div class="caixa pronto">' + rico(u.recomendo) + '</div>'));
        h.push('<div class="caixa neutra">' + esc(PESO_D[u.peso]) + '</div>');
        if (tem(u.tecnico)) h.push(bloco("Detalhe técnico", '<div class="caixa neutra" style="font-size:12.5px">' + rico(u.tecnico) + '</div>'));
      } else {
        if (u.prazo) h.push(caixaPrazo(u));
        if (tem(u.hoje)) h.push(bloco("Como está hoje", texto(u.hoje, "var(--texto-2)")));
        h.push(bloco("O que fazer", texto(u.fazer)));
        h.push(bloco("Pronto quando", '<div class="caixa pronto">' + rico(u.pronto) + '</div>'));
        if (u.nota) h.push('<div class="caixa nota">' + rico(u.nota) + '</div>');
      }
      h.push('<dl class="info">' + (u.cam.length && !u.decidido ? '<dt>Camada</dt><dd>' + u.cam.map(function (c) { return camHtml([c]) + ' <span style="color:var(--texto-3)">' + esc(CAMADAS[c].d) + '</span>'; }).join("<br>") + '</dd>' : '') +
        '<dt>Janela</dt><dd>' + esc(faixa(a.t.ini, a.t.fim)) + ' <span style="color:var(--texto-4)">(da tarefa, estimada)</span></dd></dl>');
      var irmas = a.t.subs.filter(function (x) { return x !== u; });
      if (irmas.length) h.push(bloco("Outras subtarefas da tarefa " + esc(a.t.id), '<div class="itens">' + irmas.map(itemSub).join("") + '</div>'));
    }
    h.push('</div>');
    var card = $("card");
    card.innerHTML = h.join("");
    card.hidden = false; $("veu").hidden = false;
    card.querySelector(".card-corpo").scrollTop = 0;
    $("fechar").focus({ preventScroll: true });
    marcarAtivo();
  }
  function fecharCard() { $("card").hidden = true; $("veu").hidden = true; estado.card = null; marcarAtivo(); }
  function marcarAtivo() {
    document.querySelectorAll("#lista [data-ref]").forEach(function (el) {
      if (el.dataset.ref === estado.card) el.setAttribute("data-ativa", "true"); else el.removeAttribute("data-ativa");
    });
  }

  // ---------- cabeçalho ----------
  function renderTudo() {
    var r = agendar(estado.modo), nT = 0, nS = 0, nD = 0;
    SESSOES.forEach(function (s) { nT += s.tarefas.length; s.tarefas.forEach(function (t) { nS += t.subs.length; t.subs.forEach(function (x) { if (x.decisao) nD++; }); }); });
    $("resumo").innerHTML = '<b>' + r.n + ' sessões</b> + reunião e levantamento de escopo da IA · <b>' + nT + '</b> tarefas · <b>' + nS + '</b> subtarefas, ' + nD + ' de decisão · <span class="mono">' + esc(curta(D(INICIO))) + ' → ' + esc(curta(r.fim)) + '</span> · <b>' + r.total + '</b> dias úteis';
    $("modo-plano").setAttribute("aria-pressed", estado.modo === 0);
    $("modo-ajuste").setAttribute("aria-pressed", estado.modo === 1);
    $("vista-lista").setAttribute("aria-pressed", estado.vista === "lista");
    $("vista-gantt").setAttribute("aria-pressed", estado.vista === "gantt");
    $("lista").hidden = estado.vista !== "lista";
    $("gantt-area").hidden = estado.vista !== "gantt";
    var prefixo = estado.vista === "lista" ? ["s", "t"] : ["g"];
    var algum = Object.keys(estado.abertos).some(function (k) { return estado.abertos[k] && prefixo.indexOf(k[0]) >= 0; });
    $("expandir").textContent = algum ? "Recolher tudo" : "Expandir tudo";
    $("expandir").hidden = filtrando();
    if (estado.vista === "lista") renderLista(); else renderGantt();
    if (estado.card) abrirCard(estado.card);
  }
  function chips() {
    $("chips").innerHTML = Object.keys(CAMADAS).map(function (k) {
      return '<button type="button" class="chip" data-camada="' + k + '" aria-pressed="' + (estado.camadas.indexOf(k) >= 0) + '" style="--cor:' + CAMADAS[k].c + '" title="' + esc(CAMADAS[k].d) + '"><i></i>' + CAMADAS[k].n + '</button>';
    }).join("");
  }

  // ---------- eventos ----------
  document.addEventListener("click", function (e) {
    if (e.target.closest("#fechar")) { fecharCard(); return; }
    var alt = e.target.closest("[data-alterna]");
    if (alt) { e.stopPropagation(); var k = alt.dataset.alterna; estado.abertos[k] = !estado.abertos[k]; renderTudo(); return; }
    var cam = e.target.closest("[data-camada]");
    if (cam) { var c = cam.dataset.camada, i = estado.camadas.indexOf(c); if (i >= 0) estado.camadas.splice(i, 1); else estado.camadas.push(c); chips(); renderTudo(); return; }
    var ref = e.target.closest("[data-ref]");
    if (ref) abrirCard(ref.dataset.ref);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && estado.card) { fecharCard(); return; }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button][data-ref]")) { e.preventDefault(); abrirCard(e.target.dataset.ref); }
  });
  $("veu").addEventListener("click", fecharCard);
  $("busca").addEventListener("input", function (e) { estado.busca = e.target.value; renderTudo(); });
  $("modo-plano").addEventListener("click", function () { estado.modo = 0; salvar(); renderTudo(); });
  $("modo-ajuste").addEventListener("click", function () { estado.modo = 1; salvar(); renderTudo(); });
  $("vista-lista").addEventListener("click", function () { estado.vista = "lista"; salvar(); renderTudo(); });
  $("vista-gantt").addEventListener("click", function () { estado.vista = "gantt"; salvar(); renderTudo(); });
  $("expandir").addEventListener("click", function () {
    var prefixos = estado.vista === "lista" ? ["s", "t"] : ["g"];
    var algum = Object.keys(estado.abertos).some(function (k) { return estado.abertos[k] && prefixos.indexOf(k[0]) >= 0; });
    SESSOES.forEach(function (s) {
      if (estado.vista === "lista") { estado.abertos["s" + s.id] = !algum; s.tarefas.forEach(function (t) { estado.abertos["t" + t.id] = !algum; }); }
      else estado.abertos["g" + s.id] = !algum;
    });
    renderTudo();
  });
  window.addEventListener("resize", function () { if (estado.vista === "gantt") renderGantt(); });

  chips();
  renderTudo();
})();
</script>
