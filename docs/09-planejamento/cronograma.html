rsa já aberta. Aqui nasce o caminho único (webhook, fila de entrada, recebimento) que as Sessões 4, 7, 8 e 9 só precisam ligar.","pronto":"Uma chamada do provedor de teste ao webhook, com o worker ligado, cria Contato, Conversa e Mensagem nas tabelas; a mesma chamada repetida não grava nada novo.","subs":[{"n":"Definir a interface do provedor de mensageria","cam":["api"],"hoje":"Não existe interface de provedor de mensagens. As Ferramentas têm um provedor simulado próprio só para Grupos (`packages/dominio/src/operations/ferramentas/provedor-simulado.ts`).","fazer":["Arquivo novo `apps/api/src/mensageria/provedor.ts` com `interface ProvedorDeMensageria`. Mora no `apps/api` porque é entrada e saída de rede; os tipos que ela usa vêm do domínio (`TipoIdentificadorContato`, `StatusDeEntrega`, `ConexaoDoCanal`).","`readonly provedor: ProvedorDeCanal`: `whatsapp-cloud`, `whatsapp-nao-oficial`, `instagram-graph` ou `email-imap-smtp`.","`verificarChamada(chamada: { cabecalhos: Record\u003cstring, string>; corpoCru: Buffer }, segredo: string): boolean`: confere a assinatura ou o token da chamada ao webhook.","`interpretarChamada(corpo: unknown): readonly EventoDoProvedor[]`, com três formas: `{ tipo: 'mensagem', idExterno, criadoEm, remetente: { tipo: TipoIdentificadorContato, valor, nomeExibido? }, conteudo?, anexos?: { referenciaNoProvedor, tipoDeMidia, nome }[], emRespostaAIdExterno?, assunto?, cargaBruta }`; `{ tipo: 'status', idExterno, status: StatusDeEntrega, em, motivo? }`; `{ tipo: 'conexao', conexao: ConexaoDoCanal, motivo? }`.","`enviar(canal: CanalParaProvedor, envio: EnvioAoProvedor): Promise\u003cResultadoDoEnvio>` (ver 3.7), `baixarMidia(canal, referenciaNoProvedor): Promise\u003c{ bytes: Uint8Array; tipoDeMidia: string; nome?: string }>` (ver 3.9) e `estadoDaConexao(canal): Promise\u003cConexaoDoCanal>`.","`CanalParaProvedor` = o `Canal` de `crm/canais.ts` mais a credencial decifrada do cofre (Sessão 1, 1.4). Só existe dentro do `apps/api` e nunca vai para log.","`apps/api/src/mensageria/registro.ts`: `provedorDoCanal(canal)` devolve o provedor de teste quando `conexao_simulada = true`, senão a implementação do `canal.provedor`; sem implementação, erro `PROVEDOR_INDISPONIVEL`.","Provedor de teste `apps/api/src/mensageria/provedores/teste.ts`: guarda em memória o que recebeu em `enviar`, aceita o segredo fixo de teste e lê um JSON simples em `interpretarChamada`."],"pronto":"`apps/api/src/mensageria/provedor.test.ts` é um conjunto de testes que recebe uma implementação e passa com o provedor de teste; as Sessões 4, 7, 8 e 9 rodam o mesmo conjunto contra a sua."},{"n":"Fazer o recebimento completo: Contato, Conversa e Mensagem","cam":["dom","api"],"hoje":"`registrarRecebida` (`apps/api/src/servicos/crm/mensagens.ts:141`) exige `conversaId` e não muda a situação da Conversa. A regra completa só existe no modelo antigo: `receiveMessage` (`packages/dominio/src/operations/conversations.ts:315`) entra na Conversa aberta, reabre a resolvida dentro da janela da Caixa (`inbox.reopenWindowHours`), senão abre outra (RN-CXE-09), e devolve a `ativo` o Contato arquivado ou na lixeira (RN-CON-13).","fazer":["Domínio, `packages/dominio/src/crm/recebimento.ts` (novo): `destinoDaRecebida({ aberta, ultimaResolvida, janelaDeReaberturaHoras, agora })` → `{ acao: 'usar', conversaId } | { acao: 'reabrir', conversaId } | { acao: 'abrir' }`, com a regra de `receiveMessage` (pendente volta a aberta); e `contatoDaRecebida(estado)` para RN-CON-13 (`mesclado` segue para o sobrevivente).","Serviço `apps/api/src/servicos/crm/recebimento.ts` (novo): `receberMensagem(workspaceId, canalId, evento)`, numa transação.","Passo 1: se `obterPorIdExterno` (`repositorios/crm/mensagens.ts:236`) já acha a Mensagem, devolve `repetida: true` sem tocar em nada.","Passo 2: normaliza o remetente (`normalizarIdentificadorDeContato`, `packages/dominio/src/crm/normalizacao.ts:118`) e acha o Contato por `detentorDoIdentificador` (`repositorios/crm/contatos.ts:380`), ou cria com `modo_criacao = 'automatico_mensagem'`, dono `canal.proprietario_padrao_id`, senão `canal.configurado_por`, e `origem = canal.origem_padrao_id`.","Passo 3: aplica `destinoDaRecebida` com a janela de `inbox.reopenWindowHours` (lida de `plataforma.registros`, coleção `inbox`); Conversa nova nasce com `fila_id = canal.fila_padrao_id` e sem atribuído.","Passo 4: grava a Mensagem com o `inserirRecebida` atual.","Devolve `{ mensagem, conversa, contato, contatoNovo, conversaNova, conversaReaberta, repetida }`: é o que a Sessão 5 (Tarefa) e a Sessão 16 (Agente) usam para o passo seguinte.","`registrarRecebida` sai da interface `ServicoDeMensagens` e vira o passo 4."],"pronto":"Testes de serviço contra o Postgres real: Contato novo; Contato arquivado volta a `ativo`; Conversa aberta reaproveitada; resolvida dentro da janela reabre (`reaberturas` soma 1); resolvida fora da janela abre outra; a mesma Mensagem duas vezes grava uma linha só."},{"n":"Criar a rota de webhook por Canal","cam":["api"],"hoje":"Não existe. As rotas públicas de hoje (`apps/api/src/rotas/formularios-publicos.ts`) mostram o molde: fora do hook de JWT, com limite de taxa.","fazer":["`POST /webhooks/mensageria/:canalId` em `apps/api/src/rotas/webhooks-de-mensageria.ts` (novo), registrada fora do hook de JWT, com limite de taxa e o corpo cru preservado para conferir assinatura.","Acha o Canal pelo id (o Espaço vem do Canal, não da chamada) e pede ao provedor `verificarChamada` com o segredo do webhook guardado no cofre.","Canal inexistente, arquivado ou chamada não verificada: a mesma resposta 401, sem dizer o motivo, para não revelar quais Canais existem.","Verificada: grava a chamada em `plataforma.webhooks_recebidos` e responde 200 na hora; nada é processado dentro da requisição."],"pronto":"Testes de rota: sem assinatura → 401 e nada gravado; com a do provedor de teste → 200 e uma linha `pendente` em `webhooks_recebidos`."},{"n":"Processar a fila de entrada","cam":["api"],"hoje":"Não existe fila de entrada. O worker do outbox (`apps/api/src/persistencia/outbox-worker.ts`) já tem o molde de reivindicar, tentar de novo e desistir.","fazer":["Tabela `plataforma.webhooks_recebidos` (migração nova da 3.1): `id`, `workspace_id`, `canal_id`, `provedor`, `corpo jsonb`, `recebido_em`, `estado` (`pendente`, `processando`, `processado`, `falhou`), `tentativas`, `locked_at`, `locked_by`, `ultimo_erro`.","Worker `apps/api/src/mensageria/processador-de-entrada.ts`: reivindica com `for update skip locked` (molde de `reivindicar`, `outbox-worker.ts:157`), roda `interpretarChamada` e trata cada evento: `mensagem` → `receberMensagem`; `status` → subtarefa seguinte; `conexao` → `definirConexao` do Canal (`repositorios/crm/canais.ts:209`).","Falha → volta a `pendente` com `backoff` (`outbox-worker.ts:84`); `processando` com `locked_at` vencido volta a `pendente`. Reprocessar é seguro porque `receberMensagem` reconhece a repetida.","Ligado em `apps/api/src/index.ts` por `MENSAGERIA_WORKER_ATIVO=true`, como o worker do outbox (`index.ts:175`).","O `corpo` tem dado pessoal: as linhas `processado` são apagadas no prazo de retenção da Sessão 19."],"pronto":"Teste: gravar uma chamada, simular queda do worker no meio (`locked_at` vencido) e religar processa a Mensagem uma vez só."},{"n":"Gravar o status de entrega que o provedor informa","cam":["dom","api"],"hoje":"`plataforma.mensagens` tem `status_entrega`, `status_entrega_em` e `motivo_falha`, mas só o envio preenche (`statusInicialDeEnvio`, `packages/dominio/src/crm/mensagens.ts:192`).","fazer":["Domínio: `proximoStatusDeEntrega(atual, novo)` em `crm/mensagens.ts`, que só avança (`pendente` → `enviada` → `entregue` → `lida`; `falhou` só a partir de `pendente` ou `enviada`).","Repositório: `atualizarStatusDeEntrega(workspaceId, canalId, idExterno, status, em, motivo?)` em `repositorios/crm/mensagens.ts`, chamado pelo processador para eventos `status`."],"pronto":"Teste: um `lida` seguido de um `entregue` atrasado continua `lida`.","nota":"A Sessão 4 (4.2, “Status, reações e mensagens apagadas”) só traduz o formato da Evolution para este evento."}]},{"id":"3.7","n":"Porta de saída de mensagens","objetivo":"Hoje a Mensagem enviada fica gravada como `enviada` e não sai para lugar nenhum. Aqui ela passa pela fila de saída que já existe (outbox) e é entregue pelo provedor do Canal, com tentativas e status.","pronto":"Uma resposta escrita na Caixa, num Canal simulado, chega ao provedor de teste e fica `enviada` com `id_externo`; com erro transitório, a fila tenta de novo.","subs":[{"n":"Enfileirar o envio na mesma transação da Mensagem","cam":["dom","api","banco"],"hoje":"`ServicoDeMensagens.enviar` (`apps/api/src/servicos/crm/mensagens.ts:91`) grava a Mensagem com `statusInicialDeEnvio` (`enviada` se o Canal está `conectada`, `pendente` se não) e para aí.","fazer":["Evento novo `mensagem.enviar.v1` em `EVENTOS` (`apps/api/src/persistencia/outbox.ts:33`), com payload `{ mensagemId, conversaId, canalId }`: sem texto e sem telefone, como os outros eventos.","`statusInicialDeEnvio` passa a devolver sempre `pendente` para `enviada`: só o provedor diz que saiu.","Em `enviar`, se a direção é `enviada` e o Canal está `conectada`, gravar o evento com `gravarEventos(cliente, …)` no mesmo cliente da Mensagem.","Índice único (migração nova da 3.1) `(workspace_id, aggregate_type, aggregate_id, event_type) where event_type = 'mensagem.enviar.v1'`: a mesma Mensagem nunca entra duas vezes na fila.","Quando o Canal volta a `conectada` (evento `conexao` da 3.6), enfileirar as Mensagens `pendente` dele: nada é descartado (B69)."],"pronto":"Teste de serviço: enviar grava a Mensagem `pendente` e uma linha `mensagem.enviar.v1` no outbox; se o insert do evento falha, a Mensagem também não fica."},{"n":"Entregar pelo provedor em vez de HTTP","cam":["api"],"hoje":"O worker (`entregar`, `apps/api/src/persistencia/outbox-worker.ts:230`) só faz POST no serviço `automation/`, pelo caminho de `CAMINHO_POR_EVENTO` (`:63`), e só liga com `OUTBOX_DESTINO_URL` e `OUTBOX_TOKEN` (`apps/api/src/index.ts:175`).","fazer":["`OpcoesOutboxWorker` (`outbox-worker.ts:116`) ganha `tiposDeEvento?: readonly NomeDeEvento[]` (`reivindicar` filtra por `event_type`) e `entregador?: (linha) => Promise\u003cResultadoDeEntrega>`, usado no lugar do POST.","Entregador `apps/api/src/mensageria/entregar-mensagem.ts`: carrega Mensagem, Conversa, Canal e o Identificador do Contato do tipo que o Canal resolve (`TIPO_DE_IDENTIFICADOR_DO_CANAL`, `packages/dominio/src/crm/conversas.ts:92`), monta o envio e chama `provedorDoCanal(canal).enviar`.","`EnvioAoProvedor` = `{ mensagemId, destino: { tipo, valor }, conteudo?, anexos?: { urlAssinada, tipoDeMidia, nome }[], emRespostaAIdExterno?, assunto?, modelo?: { idNoProvedor, idioma, variaveis } }`. `ResultadoDoEnvio` = `{ ok: true, idExterno } | { ok: false, transitorio: boolean, motivo }`.","Aceito: grava `id_externo`, `status_entrega = 'enviada'` e `status_entrega_em`. Recusa permanente: `falhou` com `motivo_falha`. Transitória: a linha volta a `pending` com o backoff de hoje.","Um segundo worker em `index.ts`, ligado por `MENSAGERIA_WORKER_ATIVO`, só com `mensagem.enviar.v1`; o worker atual passa `tiposDeEvento` com os quatro eventos de hoje."],"pronto":"Teste em `apps/api/src/e2e/mensageria.test.ts`: enviar por `POST /mensagens` num Canal simulado faz o provedor de teste receber uma chamada e a Mensagem ficar `enviada` com `id_externo`; com o provedor devolvendo erro transitório duas vezes, a terceira tentativa entrega."},{"n":"Mostrar a entrega no fio e deixar tentar de novo","cam":["api","web"],"hoje":"O fio antigo mostra `deliveryStatus` da Mensagem antiga; não há como reenviar uma que falhou.","fazer":["Rota `POST /mensagens/:id/reenviar`: só para `falhou`; volta a `pendente` e enfileira de novo.","No fio (`features/crm/conversation-thread.tsx`), cada Mensagem enviada mostra pendente, enviada, entregue ou lida; `falhou` mostra o `motivo_falha` e o botão “Tentar de novo”."],"pronto":"Com o provedor de teste recusando de vez, a Mensagem aparece “falhou” com o motivo; “Tentar de novo” com o provedor aceitando a deixa “enviada”."}]},{"id":"3.8","n":"Tempo real","objetivo":"Hoje a tela pergunta a cada 5 s se a revisão do Espaço mudou, e as tabelas do CRM não mexem nessa revisão: uma Mensagem que chega não aparece sem recarregar. Aqui o servidor passa a avisar a tela.","pronto":"Com duas abas abertas na mesma Conversa, a Mensagem que chega pelo webhook aparece nas duas em menos de 2 s.","subs":[{"n":"Como mandar as novidades para a tela?","cam":["dec"],"decisao":true,"hoje":"`AcompanhanteDaRevisao` (`apps/web/src/dados/store.ts:319`) chama `GET /estado/revisao` (`apps/api/src/rotas/estado.ts:63`) a cada `INTERVALO_DA_REVISAO_MS` = 5 s (`store.ts:312`) e, se mudou, recarrega o Espaço inteiro. As telas do CRM leem por SWR e não são avisadas.","opcoes":["(A) Supabase Realtime, que já vem com o banco","(B) Canal próprio no `apps/api` (SSE), alimentado por `LISTEN/NOTIFY` do Postgres"],"muda":"(A) exige expor o schema `plataforma` ao Realtime com regras por linha, o contrário do que a Sessão 1 fecha. (B) cerca de 1 dia, e a regra de acesso continua no `apps/api`, onde já está.","recomendo":"(B).","peso":"produto"},{"n":"Publicar os eventos do CRM no banco","cam":["api"],"hoje":"Nenhuma escrita do CRM avisa ninguém; só a escrita de Canal soma a revisão do Espaço (`avancarRevisaoDoEspaco`, `repositorios/crm/referencias.ts`).","fazer":["`apps/api/src/mensageria/avisar.ts`: `avisarCrm(cliente, evento)` faz `pg_notify('crm_eventos', json)` no mesmo cliente da transação; o Postgres só entrega no `commit`.","Payload só com ids: `{ workspaceId, tipo: 'mensagem.nova' | 'mensagem.status' | 'conversa.mudou', conversaId, mensagemId? }`.","Chamado por `receberMensagem`, `enviar`, `atualizarStatusDeEntrega` e pelos gestos da Conversa (resolver, reabrir, atribuir, mover, lixeira)."],"pronto":"Teste: uma conexão em `LISTEN crm_eventos` recebe o evento depois do `commit` e nada depois de um `rollback`."},{"n":"Abrir a rota de eventos para a tela","cam":["api"],"hoje":"Não existe.","fazer":["`GET /eventos` em `apps/api/src/rotas/eventos.ts` (novo), `text/event-stream`, com o JWT no `Authorization`, como as outras rotas.","Uma conexão `LISTEN crm_eventos` por processo, fora do pool; cada assinante recebe só os eventos do próprio Espaço e só se pode `ler` `conversa` (`exigir`, `apps/api/src/servicos/crm/acesso.ts:39`).","Batida a cada 25 s, para o proxy não cortar a conexão."],"pronto":"Teste de rota: um Membro de outro Espaço conectado em `/eventos` não recebe o evento; sem token, 401."},{"n":"Ouvir na tela","cam":["web"],"hoje":"Só a releitura a cada 5 s.","fazer":["`apps/web/src/dados/tempo-real.ts`: `fetch` com o token e leitura do corpo em fluxo (o `EventSource` do navegador não manda `Authorization`).","Montado no `StoreProvider` (`store.ts:296`), ao lado de `AcompanhanteDaRevisao`.","A cada evento, `mutate` das chaves de `useConversas`, `useMensagens(conversaId)` e do resumo das Tarefas conversacionais.","Reconecta com espera crescente; sem conexão, volta à releitura de 5 s."],"pronto":"Duas abas na mesma Conversa: a recebida simulada pelo webhook aparece nas duas em menos de 2 s; derrubar a api e religar reconecta sozinho."}]},{"id":"3.9","n":"Mídia nas mensagens","objetivo":"Hoje a Mensagem nova só tem texto: o anexo é uma referência externa sem arquivo, o upload não aceita áudio nem vídeo e a Caixa só envia texto. Aqui áudio, imagem, vídeo e documento passam a ir e vir guardados no bucket.","pronto":"Um áudio recebido pelo provedor de teste toca na Conversa mesmo depois de o link do provedor expirar, e uma imagem anexada na Caixa chega ao provedor de teste com a URL assinada.","subs":[{"n":"Ligar o anexo da Mensagem a um arquivo guardado","cam":["dom"],"hoje":"`AnexoDaMensagem` (`packages/dominio/src/crm/mensagens.ts:61`) tem só `tipoDeMidia`, `nome` e `referenciaExterna`; `validarNovaMensagem` (`:128`) exige texto e não aceita anexo.","fazer":["`AnexoDaMensagem` ganha `objectKey?: string` (o arquivo no bucket), `tamanhoBytes?: number` e `baixado: boolean` (falso enquanto só há a referência do provedor). A coluna `mensagens.anexos` já é jsonb: não muda o schema.","`NovaMensagem` ganha `anexos?: readonly { objectKey, nome, tipoDeMidia }[]`; `validarNovaMensagem` aceita texto ou anexo (INV-CXE-07) e confere o tipo contra `sendableMediaTypes` das capacidades do Canal."],"pronto":"Testes de domínio: Mensagem só com anexo é aceita; vídeo num Canal de e-mail (que não envia vídeo) é recusado."},{"n":"Aceitar áudio e vídeo nos anexos de Mensagem","cam":["api"],"hoje":"`TIPOS_ACEITOS` (`apps/api/src/servicos/storage-uploads.ts:53`) tem só PDF, XML, JPEG, PNG e WebP, e é a mesma lista do Formulário público (`rotas/formularios-publicos.ts:46`).","fazer":["Lista própria `TIPOS_ACEITOS_NA_MENSAGEM` (os de hoje mais `audio/ogg`, `audio/mpeg`, `audio/mp4`, `audio/aac`, `video/mp4`, `video/3gpp`), sem alargar o Formulário.","`assinaturaConfereComTipo` (`storage-uploads.ts:114`) ganha as assinaturas de OGG (`OggS`), MP3 (`ID3` ou `0xFF 0xFB`) e MP4/3GP (`ftyp` no byte 4).","Teto de tamanho próprio para vídeo, por variável de ambiente, como `UPLOAD_MAX_BYTES`."],"pronto":"Teste: um OGG verdadeiro é aceito, um arquivo de texto renomeado para `.ogg` é recusado, e o Formulário público continua recusando áudio."},{"n":"Rotas de upload e download de anexo de Mensagem","cam":["api"],"hoje":"O anexo de Tarefa já faz isso (`apps/api/src/rotas/anexos-da-tarefa.ts:108`, com `formIdDaTarefa`); para Mensagem não existe.","fazer":["`POST /mensagens/anexos` com `{ conversaId, nome, tipoDeMidia, tamanhoBytes }`: abre a sessão (`abrirSessaoDeUpload` com `formId = conversa-\u003cid>`) e emite o ticket; a chave segue `workspace/\u003cws>/conversas/\u003cconversaId>/\u003cuuid>`.","`POST /mensagens` aceita `anexos` com o `objectKey` confirmado (`confirmarObjeto`) e consome a sessão na mesma transação.","`GET /mensagens/:id/anexos/:indice` confere o acesso à Conversa e devolve `urlDeDownload` (`storage-uploads.ts:289`)."],"pronto":"Teste de rota: um `objectKey` de outra Conversa é recusado; o download de um Membro sem acesso volta 403."},{"n":"Baixar a mídia do provedor ao receber","cam":["api"],"hoje":"Não existe: a recebida guarda só o que vier em `anexos`.","fazer":["No processador de entrada, antes da transação: para cada anexo com `referenciaNoProvedor`, chamar `baixarMidia`, subir ao bucket com a chave da subtarefa anterior e gravar `objectKey` com `baixado: true`.","Se o download falhar, a Mensagem é gravada assim mesmo com `baixado: false` e a referência; uma nova tentativa roda na próxima passada do worker."],"pronto":"Teste com o provedor de teste: o link do provedor deixa de responder depois do recebimento e o anexo continua abrindo pela URL assinada."},{"n":"Anexar e tocar mídia no fio","cam":["web"],"hoje":"O compositor de `features/crm/conversation-thread.tsx` envia só texto; `apps/web/src/dados/envio-ao-bucket.ts` já sobe arquivo por URL assinada para Formulário e Tarefa.","fazer":["Botão de anexar no compositor, usando `envio-ao-bucket.ts`; só oferece os tipos que o Canal envia (`sendableMediaTypes`).","No fio: `\u003caudio>`, `\u003cvideo>`, `\u003cimg>` e link de documento, com a URL de `GET /mensagens/:id/anexos/:indice`."],"pronto":"Anexar uma imagem pela Caixa mostra a imagem no fio e o provedor de teste recebe a URL assinada."},{"n":"Ligar a limpeza de arquivos órfãos","cam":["api"],"hoje":"`coletarOrfaos` (`apps/api/src/servicos/storage-uploads.ts:305`) apaga do bucket o que foi enviado e nunca virou anexo, mas só o teste a chama.","fazer":["Rodar uma vez por dia a partir de `apps/api/src/index.ts`, ligado por `COLETA_DE_ORFAOS_ATIVA=true`, protegido por `pg_try_advisory_lock` para só uma instância rodar.","Logar só as contagens (`sessoesExpiradas`, `objetosRemovidos`)."],"pronto":"Teste: uma sessão expirada criada no teste some do bucket na rodada seguinte."}]}],"ajuste":"+9 dias: o modelo antigo do CRM é usado por cerca de 70 arquivos da tela e 33 do domínio, e a sessão recebeu a Tarefa conversacional (que estava na Sessão 5) e a ponte do Painel."},{"id":"4","n":"WhatsApp não oficial (Evolution API)","dias":[1,2],"dep":["3"],"desc":"Liga o primeiro provedor real: números comuns de WhatsApp, conectados por QR code pela Evolution API. A Evolution é um servidor que conversa com o WhatsApp como se fosse um aparelho conectado ao celular. Cada número vira um Canal `whatsapp-nao-oficial` com a sua própria instância na Evolution (instância = uma sessão de WhatsApp lá dentro). Vem antes dos outros provedores porque destrava a Lista conversacional (Sessão 5) e as Ferramentas (Sessão 6).","partida":["O Canal `whatsapp-nao-oficial` já nasce `desconectada` em `plataforma.canais` pela página `/crm/caixa-de-entrada/configuracoes/canais/conectar/whatsapp-nao-oficial` (`apps/web/src/features/crm/conectar-provedor.tsx`).","A única conexão é o botão “Simular conexão” da ficha do Canal (`apps/web/src/app/(shell)/crm/caixa-de-entrada/configuracoes/canais/[canal]/page.tsx:318-326`), que chama `POST /canais/:id/simular-conexao` (`apps/api/src/rotas/crm/canais.ts:93`) e grava `conexao_simulada = true` pela regra `proximaConexao` (`packages/dominio/src/crm/canais.ts:131`).","As capacidades do não oficial já estão certas: sem janela de 24 h e sem modelo (`capacidadesDoCanal`, `packages/dominio/src/operations/conversations.ts:115`).","Da Sessão 1: o cofre de credenciais cifradas e o servidor onde a Evolution vai rodar.","Da Sessão 3: a interface de provedor, a rota de webhook por provedor com fila de entrada, a porta de saída pela outbox, o tempo real, a mídia nas mensagens e o CRM unificado nas tabelas novas.","Os avisos das Automações do Financeiro já saem por uma Evolution, mas de fora: o evento `automacao.notificar-canal.v1` vai pela outbox ao serviço externo `automation/` (`/webhooks/plataforma/notificar-canal`, `apps/api/src/persistencia/outbox-worker.ts:67`), que envia pela instância fixa `numeropvmarcos`."],"pronto":"Dois números conectados por QR code pela ficha do Canal recebem e respondem texto, imagem e áudio pela Caixa de Entrada, cada um nas suas Conversas; os tiques de entregue e lida aparecem; desligar o celular muda o estado do Canal sem ninguém clicar nada; e “Simular conexão” não existe mais em produção.","tarefas":[{"id":"4.1","n":"Pré-requisitos","objetivo":"Ter os números e a Evolution prontos antes de escrever código. Hoje não há número escolhido nem Evolution instalada, e sem os dois nada desta sessão pode ser testado.","pronto":"A lista de números está anotada e a Evolution responde no servidor.","subs":[{"n":"Separar os números e os celulares","cam":["voce"],"hoje":"Nenhum número escolhido.","fazer":["Escolher pelo menos dois números para testar. Um deles pode ser o que vai para produção.","Cada número precisa estar ativo no WhatsApp (de preferência o WhatsApp Business) num celular que fique ligado e com internet: a Evolution funciona como um aparelho conectado a ele.","Não usar o número da instância `numeropvmarcos`: ela é do `automation/` (ver a decisão de 4.5).","Anotar nesta tarefa, para cada número: o número, o nome do Canal (ex.: “Comercial”) e quem fica com o celular."],"pronto":"A lista está anotada nesta tarefa.","nota":"A API não oficial vai contra os termos do WhatsApp: um número pode ser bloqueado se mandar muita mensagem para quem não o tem salvo. Use números que aguentem esse risco."},{"n":"Instalar a Evolution API no servidor da Sessão 1","cam":["infra"],"hoje":"A Sessão 1 (1.6) deixa o servidor pronto, sem a Evolution.","fazer":["Subir a Evolution API v2 por Docker, com um Postgres só dela (variáveis `DATABASE_PROVIDER=postgresql` e `DATABASE_CONNECTION_URI`). Nunca o banco da plataforma.","Definir a chave global `AUTHENTICATION_API_KEY` e o endereço público `SERVER_URL`, atrás de HTTPS.","Fechar o painel `/manager` da Evolution para fora (só por VPN ou por IP liberado).","Gravar no `.env` do `apps/api` duas variáveis novas, `EVOLUTION_URL` e `EVOLUTION_API_KEY`, e documentá-las em `apps/api/.env.example`."],"pronto":"Uma chamada a `GET /instance/fetchInstances` na Evolution, com a chave global no cabeçalho `apikey`, responde 200 com a lista vazia.","nota":"Conferir no repositório oficial (`EvolutionAPI/evolution-api`) o nome atual da imagem Docker e das variáveis antes de instalar."}]},{"id":"4.2","n":"Conexão por QR code","objetivo":"Conectar um número de verdade lendo um QR code na ficha do Canal. Hoje a ficha só tem “Simular conexão”, que marca o Canal como conectado sem falar com ninguém.","pronto":"Criar um Canal não oficial, clicar em “Conectar” e ler o QR code com o celular deixa o Canal “conectada” na tela, sem recarregar.","subs":[{"n":"Ensinar a conexão real ao domínio","cam":["dom"],"hoje":"`AcaoDeConexao` (`packages/dominio/src/crm/canais.ts:129`) só tem `simular_conexao` e `desconectar`, e `proximaConexao` (`:131`) só trata essas duas. `AcaoCrm` (`packages/dominio/src/crm/permissoes.ts:47`) não tem “conectar”.","fazer":["Acrescentar a `AcaoDeConexao` três ações: `conectar` (a pessoa pede o QR code), `conexao_confirmada` (o provedor avisou que conectou) e `conexao_perdida` (o provedor avisou que caiu). `desconectar` fica.","Em `proximaConexao`: `conexao_confirmada` leva a `conectada` com `conexaoSimulada` falso; `conexao_perdida` leva a `com_erro`; `conectar` é recusado num Canal arquivado ou já conectado e não muda a conexão.","Acrescentar `conectar` a `AcaoCrm` em `permissoes.ts`, com a mesma regra de quem pode `simular_conexao` hoje.","Nova função `conferirNumeroConectado(canal, numeroDoProvedor)` em `canais.ts`: compara o número que o provedor diz ter conectado com o `identificadorExterno` do Canal e recusa se forem diferentes."],"pronto":"Testes em `packages/dominio/src/crm/canais.test.ts` cobrem as quatro ações e o caso do número diferente."},{"n":"Criar o cliente da Evolution no apps/api","cam":["api"],"hoje":"Nenhum código do `apps/api` chama a Evolution. O único que chama está no `automation/` (`adapters/evolution.ts`, fora deste repositório).","fazer":["Criar `apps/api/src/provedores/evolution/cliente.ts` (dentro da pasta de provedores que a Sessão 3 criar), com `fetch`, cabeçalho `apikey` e tempo limite em toda chamada.","Uma função por chamada da Evolution v2: `criarInstancia` (`POST /instance/create`, com `integration: WHATSAPP-BAILEYS` e `qrcode: true`), `pedirQrCode` (`GET /instance/connect/{instancia}`), `estadoDaConexao` (`GET /instance/connectionState/{instancia}`), `configurarWebhook` (`POST /webhook/set/{instancia}`), `sairDaSessao` (`DELETE /instance/logout/{instancia}`), `apagarInstancia` (`DELETE /instance/delete/{instancia}`), `enviarTexto` (`POST /message/sendText/{instancia}`), `enviarMidia` (`POST /message/sendMedia/{instancia}`), `enviarAudio` (`POST /message/sendWhatsAppAudio/{instancia}`) e `baixarMidia` (`POST /chat/getBase64FromMediaMessage/{instancia}`).","Nome da instância: `n1-\u003cworkspaceId>-\u003ccanalId>`, para nunca colidir entre Espaços de Trabalho nem com a `numeropvmarcos`.","Os erros da Evolution viram os erros da interface de provedor da Sessão 3 (transitório ou permanente) e passam por `sanitizarErro` (`apps/api/src/persistencia/outbox-worker.ts:108`) antes de ir para o log."],"pronto":"Testes em `apps/api/src/provedores/evolution/cliente.test.ts` contra `criarServidorFalso` (`apps/api/src/testes/servidor-falso.ts`) cobrem cada função, uma resposta 401 e um tempo esgotado.","nota":"Os caminhos acima são os da Evolution API v2. Conferir na documentação da versão instalada antes de codificar."},{"n":"Criar a rota de conectar","cam":["api"],"hoje":"`POST /canais/:id/simular-conexao` (`apps/api/src/rotas/crm/canais.ts:93`) chama `simularConexao` (`apps/api/src/servicos/crm/canais.ts:255`), que só grava a marca no banco.","fazer":["Nova rota `POST /canais/:id/conectar` em `rotas/crm/canais.ts`, servida por uma função nova `conectar` em `servicos/crm/canais.ts`.","O serviço confere o Papel com `exigir` e a ação `conectar`. Para `whatsapp-nao-oficial`: cria a instância se ainda não existe; guarda no cofre da Sessão 1 o token da instância que a Evolution devolve; aponta o webhook da instância para a rota de webhook da Sessão 3 (ver 4.4); devolve o QR code (imagem em base64) e o código de pareamento.","Se a instância já existe e está desconectada, só pede um QR code novo (`pedirQrCode`).","Nada grava `conectada` aqui: o Canal só muda quando a Evolution confirmar (4.3)."],"pronto":"Teste em `apps/api/src/rotas/crm/canais.test.ts`: `POST /canais/:id/conectar` devolve o QR code, a credencial fica cifrada no cofre e o Canal continua `desconectada`."},{"n":"Mostrar o QR code na ficha do Canal","cam":["web"],"hoje":"A página de conectar mostra um quadro tracejado “disponível quando a integração chegar” (`apps/web/src/features/crm/conectar-provedor.tsx:136-145`, texto em `apps/web/src/features/crm/conectar-canal.ts:40-43`). Depois de criar, ela só abre a ficha (`conectar-provedor.tsx:91`). A ficha mostra “Simular conexão” (`[canal]/page.tsx:318-326`).","fazer":["Na ficha `[canal]/page.tsx`, para o provedor `whatsapp-nao-oficial`, trocar “Simular conexão” por “Conectar”. O clique chama `conectarCanal(id)` (nova, em `apps/web/src/dados/crm/canais.ts`) e abre um painel com o QR code e os passos de `ORIENTACAO_DO_PROVEDOR` (`conectar-canal.ts:33`).","O QR code expira em poucos segundos: trocar a imagem a cada QR novo que chegar pelo tempo real (evento `QRCODE_UPDATED`, 4.3) ou, na falta, pedir outro a cada 30 s enquanto o painel estiver aberto.","Quando o Canal chegar `conectada` pelo tempo real da Sessão 3, mostrar “Conectado” e fechar o painel.","Na página de conectar, depois de criar o Canal, abrir a ficha já com o painel do QR code.","Trocar o texto do quadro reservado em `conectar-canal.ts` por “Depois de criar o Canal, o QR code aparece aqui.”"],"pronto":"Criar um Canal não oficial e ler o QR code com o celular põe o Canal em “conectada” na tela, sem recarregar."}]},{"id":"4.3","n":"Estado da conexão","objetivo":"O Canal mostra o estado real do número. Hoje o estado só muda pelos botões da ficha: se o celular desliga, a tela continua dizendo “conectada” e as mensagens somem sem aviso.","pronto":"Desligar a internet do celular muda o Canal para “com erro”; remover o aparelho no celular muda para “desconectada”.","subs":[{"n":"Tratar os eventos de conexão da Evolution","cam":["api"],"hoje":"Nenhum evento de fora chega ao Canal.","fazer":["No tratador da Evolution na rota de webhook da Sessão 3, tratar `CONNECTION_UPDATE`: estado `open` gera `conexao_confirmada`; `close` com o motivo de sessão encerrada (o aparelho foi removido no celular) gera `desconectar`; `close` por outro motivo gera `conexao_perdida`; `connecting` não muda nada.","Na confirmação, ler o número conectado (vem no evento ou em `GET /instance/fetchInstances`) e passar por `conferirNumeroConectado`. Se for outro número: sair da sessão (`sairDaSessao`), pôr o Canal em `com_erro` e mostrar “Este QR code foi lido por outro número.”","Gravar pela `definirConexao` de `apps/api/src/repositorios/crm/canais.ts:209`, avançar a revisão do Espaço e avisar a tela pelo tempo real.","Tratar `QRCODE_UPDATED` repassando o QR novo à tela pelo tempo real."],"pronto":"Teste em `apps/api` com eventos `CONNECTION_UPDATE` de exemplo: `open` deixa o Canal `conectada` com `conexao_simulada = false`; `close` por queda deixa `com_erro`; número diferente deixa `com_erro`."},{"n":"Conferir a conexão de tempos em tempos","cam":["api"],"hoje":"Não existe. Um webhook perdido deixaria o estado errado para sempre.","fazer":["Rotina no `apps/api`, no mesmo molde de `apps/api/src/automacoes/scheduler-worker.ts`, que a cada 5 min chama `estadoDaConexao` para cada Canal `whatsapp-nao-oficial` ativo e corrige o banco quando diverge.","Ligada pela variável `EVOLUTION_CONFERENCIA_ATIVA`, desligada no ambiente local, e iniciada em `apps/api/src/index.ts` como os outros workers."],"pronto":"Com o celular desligado, mudar à mão `conexao` para `conectada` no banco: em até 5 min ela volta para `com_erro`."},{"n":"Desconectar e arquivar de verdade","cam":["api"],"hoje":"`desconectar` e `arquivar` (`apps/api/src/servicos/crm/canais.ts:257` e `:259`) só mudam o banco; o celular continua conectado à Evolution.","fazer":["`desconectar` chama `sairDaSessao` antes de gravar `desconectada`.","`arquivar` chama `sairDaSessao` e `apagarInstancia` e apaga a credencial do Canal no cofre.","Se a Evolution falhar, nada é gravado e a rota devolve “Não foi possível falar com o WhatsApp. Tente de novo.”"],"pronto":"Desconectar pela ficha faz o aparelho sumir de “Aparelhos conectados” no celular."},{"n":"Tirar “Simular conexão” da produção","cam":["api","web"],"hoje":"A rota `POST /canais/:id/simular-conexao`, o serviço `simularConexao`, o botão da ficha e a marca `MarcaDeConexaoSimulada` (`apps/web/src/features/crm/selo-do-provedor.tsx`) valem para todo mundo.","fazer":["Registrar a rota só quando a variável `PERMITIR_CONEXAO_SIMULADA=true` (homologação e testes; nunca em produção).","O botão da ficha só aparece quando a api diz que a simulação está ligada (um campo novo na resposta de `GET /estado`).","Os testes que simulam conexão ligam a variável: `apps/api/src/e2e/canais-fluxo.test.ts`, `apps/api/src/rotas/crm/canais.test.ts`, `apps/api/src/servicos/crm/canais.test.ts` e `apps/web/src/features/crm/ficha-do-canal.test.tsx`.","A coluna `conexao_simulada` fica: ela marca os Canais simulados que já existem."],"pronto":"Em produção, `POST /canais/:id/simular-conexao` devolve 404 e o botão não aparece; `npm run check` passa."}]},{"id":"4.4","n":"Mensagens","objetivo":"Receber e responder pela Caixa de Entrada. Hoje a Sessão 3 deixa pronta a porta de entrada e de saída, mas nada entende o formato da Evolution, nem tiques, reações ou mensagens apagadas.","pronto":"Uma mensagem mandada do celular aparece na Caixa de Entrada; a resposta chega no celular; os tiques e as reações aparecem na tela.","subs":[{"n":"Proteger o webhook da Evolution","cam":["api"],"hoje":"A rota de webhook da Sessão 3 confere a origem por provedor. A Evolution não assina o webhook como a Meta assina.","fazer":["Ao configurar o webhook da instância (`configurarWebhook`), usar um endereço com um segredo aleatório por Canal, guardado no cofre: `/webhooks/evolution/\u003ccanalId>/\u003csegredo>`, dentro da rota da Sessão 3.","A rota confere o segredo em tempo constante e confere que o campo `instance` do corpo é a instância daquele Canal. Senão, 401 sem processar.","Assinar só os eventos usados: `QRCODE_UPDATED`, `CONNECTION_UPDATE`, `MESSAGES_UPSERT`, `MESSAGES_UPDATE` e `MESSAGES_DELETE`. Os de grupo entram na Sessão 6."],"pronto":"Teste: uma chamada com segredo errado, ou com a instância de outro Canal, recebe 401 e não grava nada na fila de entrada."},{"n":"Traduzir a mensagem recebida da Evolution","cam":["api"],"hoje":"O recebimento completo (achar ou criar Contato e Conversa) vem da Sessão 3; ele recebe `MensagemRecebidaDoProvedor` (`packages/dominio/src/crm/mensagens.ts:110`) e nada traduz o formato da Evolution para ela.","fazer":["Criar `apps/api/src/provedores/evolution/traduzir.ts`, que transforma o evento `MESSAGES_UPSERT` na entrada do recebimento.","Mapear: `key.id` para `idExterno`; `key.remoteJid` para o número do Contato; `pushName` para o nome sugerido do Contato novo; `messageTimestamp` para `criadoEm`; o texto de `message.conversation` ou `message.extendedTextMessage.text` para `conteudo`; imagem, vídeo, áudio, documento e figurinha para anexo, baixado por `baixarMidia` e guardado pela mídia da Sessão 3; a mensagem citada (`contextInfo.stanzaId`) para `emRespostaAId`, quando a citada existir aqui.","`key.fromMe` verdadeiro (digitada no próprio celular): gravar como `enviada`, ator `integration` (o Canal), status `enviada`. Se o `key.id` já existe porque a plataforma enviou, o índice `mensagens_id_externo_uq` (008, linha 194) descarta a repetida.","Guardar o evento inteiro em `carga_bruta`.","Ignorar por enquanto as mensagens de grupo (`remoteJid` terminado em `@g.us`) e de status (`status@broadcast`): grupos são da Sessão 6."],"pronto":"Testes em `apps/api/src/provedores/evolution/traduzir.test.ts` com eventos reais gravados: texto, imagem, áudio, resposta citada, `fromMe` e mensagem de grupo ignorada.","nota":"Para ter eventos reais: apontar o webhook da instância de teste para um endereço de captura e salvar os corpos em `apps/api/src/provedores/evolution/exemplos/`, sem dados de clientes. Conferir se a versão instalada entrega o remetente como `@lid` (identificador oculto do WhatsApp, sem número) em vez do número; se entregar, tratar antes de ligar em produção."},{"n":"Juntar o número com e sem o nono dígito","cam":["dom"],"hoje":"`normalizarWhatsapp` (`packages/dominio/src/crm/normalizacao.ts:72`) só repassa para `normalizarTelefone` (`:57`), que aceita +55 com 12 ou 13 dígitos sem juntar os dois. O WhatsApp entrega muitos celulares antigos sem o nono dígito (`551187654321`), e o mesmo Contato pode estar cadastrado com ele (`+5511987654321`): viraria um Contato repetido.","fazer":["Nova função `variantesDoNumeroBrasileiro(numero)` em `normalizacao.ts`: para +55 com DDD e celular, devolve as duas formas, com e sem o 9.","O recebimento da Sessão 3 procura o Contato pelas duas formas antes de criar um novo. Contato novo grava a forma com o 9 como `valor` do identificador `whatsapp`.","O envio usa o número como o WhatsApp o conhece: o `remoteJid` da última mensagem recebida na Conversa."],"pronto":"Teste: uma mensagem de `551187654321@s.whatsapp.net` cai no Contato cadastrado com `+5511987654321`, sem criar outro."},{"n":"Enviar texto e mídia pela Evolution","cam":["api"],"hoje":"A porta de saída da Sessão 3 entrega a um provedor de teste; não há provedor Evolution.","fazer":["Implementar `enviar` da interface de provedor em `apps/api/src/provedores/evolution/`: texto por `enviarTexto`; imagem, vídeo e documento por `enviarMidia`, com a URL assinada do arquivo; áudio por `enviarAudio` (chega como mensagem de voz).","Resposta citada: mandar o `idExterno` da Mensagem respondida no campo de citação.","Na volta, gravar o `key.id` devolvido em `id_externo` da Mensagem `enviada`: é ele que liga os tiques depois.","Canal fora de `conectada`: não tentar. A Mensagem fica `pendente` (regra B69) e a outbox tenta de novo quando o Canal voltar."],"pronto":"Pela Caixa de Entrada, um texto, uma imagem e um áudio chegam ao celular, e no banco as três Mensagens têm `id_externo` preenchido."},{"n":"Gravar tiques, reações, edições e mensagens apagadas","cam":["dom","api","web"],"hoje":"As colunas `status_entrega`, `status_entrega_em`, `reacoes`, `marcacao_exclusao` e `edicoes_externas` existem em `plataforma.mensagens` (008, linhas 153-159), mas o repositório (`apps/api/src/repositorios/crm/mensagens.ts`) só insere e lê, e o tipo `Mensagem` as declara como `unknown` (`packages/dominio/src/crm/mensagens.ts:96-99`).","fazer":["No domínio: tipar `Reacao` (`autor`, `emoji`, `em`), `MarcacaoDeExclusao` (`porQuem`, `em`) e `EdicaoExterna` (`conteudoAnterior`, `em`), e criar `proximoStatusDeEntrega(atual, novo)`, que só avança (`enviada`, depois `entregue`, depois `lida`); `falhou` é final.","No repositório: `atualizarStatusDeEntrega`, `registrarReacao`, `marcarExclusao` e `registrarEdicaoExterna`, achando a Mensagem por (`canal_id`, `id_externo`).","No tratador da Evolution: `MESSAGES_UPDATE` vira status (`DELIVERY_ACK` = entregue; `READ` e `PLAYED` = lida; `ERROR` = falhou); a reação (`reactionMessage` dentro de `MESSAGES_UPSERT`) vira reação na Mensagem citada, nunca uma Mensagem nova; `MESSAGES_DELETE` vira marcação de exclusão (o conteúdo fica guardado); a edição (`editedMessage`) vira edição externa.","No fio da Conversa (`apps/web/src/features/crm/conversation-thread.tsx`): mostrar os tiques, as reações embaixo da Mensagem e “mensagem apagada”."],"pronto":"Ler no celular uma mensagem enviada pela plataforma vira tique de lida na tela, e reagir a ela no celular mostra a reação embaixo dela; um teste em `apps/api` cobre os quatro eventos."}]},{"id":"4.5","n":"Vários números","objetivo":"Dois ou mais números ao mesmo tempo, cada um com as suas Conversas. Hoje isso só foi testado com Canais simulados, e os avisos do Financeiro seguem por uma Evolution de fora.","pronto":"Dois números conectados em homologação, sem misturar Conversas, e a decisão dos avisos do Financeiro tomada.","subs":[{"n":"Testar com dois números reais","cam":["voce"],"hoje":"Testado só com Canais simulados (`apps/api/src/e2e/canais-fluxo.test.ts`).","fazer":["Conectar em homologação os dois números da lista de 4.1.","Do mesmo celular, mandar mensagem para os dois números e responder pelos dois na Caixa de Entrada.","Conferir que o mesmo Contato tem uma Conversa por Canal e que cada resposta sai pelo número da Conversa."],"pronto":"A consulta `select canal_id, count(*) from plataforma.conversas where contato_id = '\u003cid do Contato>' group by canal_id` devolve duas linhas, e cada resposta chegou pelo número certo."},{"n":"Os avisos do Financeiro passam a sair por um Canal daqui?","cam":["dec","api"],"decisao":true,"hoje":"As Automações do Financeiro gravam o evento `automacao.notificar-canal.v1` (`apps/api/src/persistencia/eventos-de-canal.ts`). O worker da outbox o entrega ao `automation/`, que busca o número na Tarefa e envia pela instância `numeropvmarcos` (`sendText` e `sendListMessage`). Os textos dos avisos (`gasto-novo` e `relatorio`) moram no `automation/`. A mesma instância recebe os extratos que chegam por WhatsApp (`/webhook/receber-whatsapp-doc/:origem`).","opcoes":["(A) Sim: o worker monta a Mensagem e envia pela porta de saída, por um Canal conectado aqui","(B) Não: continuam pelo `automation/` como estão"],"muda":"(A) tira a dependência do `automation/` para avisar, mas exige trazer os textos `gasto-novo` e `relatorio` para o domínio, escolher qual Canal envia e abrir a Conversa com o solicitante na Caixa de Entrada: cerca de 1 dia. E o número `numeropvmarcos` não pode virar Canal aqui sem antes tirar do `automation/` a recepção de extratos, porque cada instância da Evolution tem um endereço de webhook configurado. (B) não muda nada.","recomendo":"(B) nesta sessão. (A) numa sessão do Financeiro, depois de duas semanas com os números estáveis, usando um número novo e não o `numeropvmarcos`.","peso":"arrumacao"}]}],"ajuste":"+1 dia: provisionar a instância é rápido, mas a sessão também liga o QR code na tela, o webhook, o envio de texto e mídia, os tiques de entrega e o número com e sem o nono dígito."},{"id":"5","n":"Lista conversacional","dias":[2,2],"dep":["4"],"desc":"Liga a Lista conversacional ao WhatsApp real: a mensagem que chega cria ou atualiza a Tarefa, e a resposta escrita na Tarefa sai pelo WhatsApp. Depende da Evolution (Sessão 4) e da porta de entrada da Sessão 3. Levar a Tarefa conversacional para as tabelas novas saiu daqui e foi para a Sessão 3 (tarefa 3.3).","partida":["A Tarefa conversacional cria, troca o Canal e liga o Negócio pelas tabelas novas (Sessão 3, 3.3).","`receberMensagem` (Sessão 3, 3.6) devolve `{ contato, conversa, contatoNovo, conversaNova, conversaReaberta, repetida }` para o passo seguinte.","A ficha da Tarefa mostra o fio com o mesmo `ConversationThread` da Caixa (`apps/web/src/features/estrutura/tarefa-completa.tsx:2189`), e o envio sai pela fila de saída (Sessão 3, 3.7).","Um número conectado pela Evolution (Sessão 4)."],"pronto":"Uma mensagem de um celular para o número conectado cria (ou atualiza) a Tarefa na Lista conversacional certa, e a resposta escrita na ficha da Tarefa chega no celular.","tarefas":[{"id":"5.1","n":"Entrada automática pela Lista conversacional","objetivo":"Hoje a Tarefa conversacional só nasce quando alguém a cria. Com o WhatsApp real, a mensagem de um Contato novo cai só na Caixa de Entrada. Aqui se decide e se constrói o que a mensagem faz na Lista.","pronto":"A primeira mensagem de um número novo cria Contato, Conversa e uma Tarefa na Lista; as seguintes não criam outra.","subs":[{"n":"Mensagem nova cria Tarefa?","cam":["dec"],"decisao":true,"hoje":"A Tarefa conversacional só nasce pelo diálogo da Lista ou pelo botão do fio.","opcoes":["(A) Sim: mensagem de um Contato sem Tarefa aberta na Lista cria uma; com Tarefa aberta, só atualiza o cartão","(B) Não: a mensagem só aparece na Caixa de Entrada, e alguém cria a Tarefa"],"muda":"Com (A), a Lista vira a fila de atendimento. Com (B), a Caixa de Entrada continua sendo a fila e esta tarefa encolhe para meio dia.","recomendo":"(A), porque é o propósito da Lista conversacional.","peso":"produto"},{"n":"E se o Canal estiver em mais de uma Lista conversacional?","cam":["dec"],"decisao":true,"hoje":"`validarCanaisDeAtendimento` (`packages/dominio/src/operations/canais.ts:133`) deixa o mesmo Canal em várias Listas.","opcoes":["(A) Um Canal só pode estar em uma Lista conversacional: marcar em outra é recusado","(B) A Tarefa nasce na primeira Lista, pela ordem da Estrutura","(C) Nasce uma Tarefa em cada Lista"],"muda":"(A) é uma recusa a mais na configuração e deixa a regra óbvia. (B) esconde de onde a Tarefa veio. (C) duplica o atendimento.","recomendo":"(A).","peso":"produto"},{"n":"E se a Tarefa do Contato já estiver concluída?","cam":["dec"],"decisao":true,"hoje":"Nada acontece com a Tarefa quando chega mensagem.","opcoes":["(A) Reabre a Tarefa concluída, voltando ao Status inicial da Lista","(B) Cria uma Tarefa nova e deixa a concluída como histórico","(C) Segue a Conversa: se a Conversa reabriu (dentro da janela da Caixa), reabre a Tarefa; se nasceu Conversa nova, cria Tarefa nova"],"muda":"(A) junta atendimentos diferentes na mesma Tarefa. (B) cria Tarefa até para um “obrigado” logo depois de concluir. (C) usa a mesma janela que já decide a Conversa.","recomendo":"(C).","peso":"produto"},{"n":"Decidir no domínio o que a mensagem faz com a Tarefa","cam":["dom"],"hoje":"Não existe regra; `tarefasConversacionaisDoContato` (`packages/dominio/src/derive-conversacional.ts:137`) já acha as Tarefas do Contato.","fazer":["`tarefaDaRecebida(state, { canalId, contatoId, conversaId, conversaNova, conversaReaberta })` em `packages/dominio/src/operations/tarefas-conversacionais.ts` → `{ acao: 'nada' } | { acao: 'criar', listId } | { acao: 'atualizar', taskId, statusId? }`.","Acha a Lista conversacional cujo `canaisDeAtendimento` tem o Canal, as Tarefas ativas dela com Vínculo para o Contato, e aplica as três decisões acima.","Se a decisão de “mais de uma Lista” for (A), `validarCanaisDeAtendimento` passa a recusar Canal já usado em outra Lista conversacional."],"pronto":"Testes de domínio de cada caso: Contato sem Tarefa; com Tarefa aberta; com Tarefa concluída e Conversa reaberta; com Tarefa concluída e Conversa nova; Canal fora de qualquer Lista."},{"n":"Criar ou atualizar a Tarefa quando a mensagem chega","cam":["api"],"hoje":"O processador de entrada (Sessão 3, `apps/api/src/mensageria/processador-de-entrada.ts`) para em `receberMensagem`.","fazer":["Depois de `receberMensagem` com `repetida: false`, chamar `executar()` com `tarefaDaRecebida` e, conforme o resultado, `criarTarefaConversacional` (com Contato, Canal e Conversa já lidos, sem abrir Conversa) ou a troca de Status.","Ator: o Membro “Agente do pipeline” (`resolverMembroAgenteDoPipeline`, `apps/api/src/persistencia/credenciais-de-servico.ts:96`), como as integrações já fazem. Responsável da Tarefa nova: o atribuído da Conversa, se houver; senão nenhum.","Roda depois do `commit` da Mensagem: falhar aqui não perde a Mensagem. A linha de `webhooks_recebidos` volta a `pendente`, e reprocessar é seguro porque `tarefaDaRecebida` acha a Tarefa já criada."],"pronto":"Teste em `apps/api` com o provedor de teste: a primeira chamada de um número novo cria Contato, Conversa e Tarefa; a segunda não cria outra Tarefa; repetir a mesma chamada do webhook não duplica nada."},{"n":"Mostrar a Tarefa nova na Lista sem recarregar","cam":["web"],"hoje":"A Tarefa criada pelo servidor só aparece na próxima releitura da revisão (até 5 s), e o cartão não sabe que chegou mensagem.","fazer":["Em `apps/web/src/dados/tempo-real.ts` (Sessão 3), um evento `mensagem.nova` também chama `verificarRevisao()` do store.","O resumo das Tarefas conversacionais (`useResumoDasTarefas`) é revalidado no mesmo evento."],"pronto":"Com a Lista aberta, a Tarefa nova aparece em menos de 2 s, e o cartão mostra o trecho da última mensagem."}]},{"id":"5.2","n":"Responder pela Tarefa pelo WhatsApp","objetivo":"A ficha da Tarefa já embute o fio da Caixa. Depois da Sessão 3 o envio sai pela fila; falta garantir que, na Tarefa, a resposta vai pela Conversa da Tarefa e que quem atende vê se chegou.","pronto":"A resposta escrita na ficha da Tarefa chega no WhatsApp e mostra “entregue” na ficha.","subs":[{"n":"Responder sempre pela Conversa da Tarefa","cam":["web"],"hoje":"No fio, “Responder por” escolhe o Canal pelo padrão do Contato (`canalPadraoDeResposta`, `packages/dominio/src/derive-conversacional.ts:271`); dentro da Tarefa, pode cair num Canal que não é o da Lista.","fazer":["`ConversationThread` ganha a prop `conversaFixaId`, passada pela ficha (`tarefa-completa.tsx:2189`) com a Conversa do Vínculo “conversa da Tarefa”.","Com ela, “Responder por” mostra só os Canais da Lista (`canaisDaLista`), com o da Tarefa marcado; escolher outro chama a troca de Canal da Tarefa (Sessão 3, 3.3)."],"pronto":"Teste de componente: responder na ficha grava a Mensagem com o `conversaId` do Vínculo, e o seletor não mostra Canal fora da Lista."},{"n":"Testar a resposta contra a Evolution de homologação","cam":["api"],"hoje":"Os testes de envio da Sessão 3 usam o provedor de teste.","fazer":["Teste em `apps/api/src/e2e/` que roda só com as variáveis da Evolution de homologação: cria a Tarefa conversacional num Canal Evolution, envia por `POST /mensagens` e espera a Mensagem ficar `enviada` com `id_externo` e depois `entregue` pelo webhook."],"pronto":"O teste passa contra a Evolution de homologação e é pulado sem as variáveis."}]},{"id":"5.3","n":"Validar de ponta a ponta com número real","objetivo":"Ver o fluxo inteiro com um celular de verdade, antes de liberar para a equipe.","pronto":"Você aprova os seis passos do roteiro.","subs":[{"n":"Percorrer o roteiro com um celular","cam":["voce"],"hoje":"—","fazer":["1. Conectar o número de teste pela Evolution (Sessão 4) e marcá-lo como Canal da Lista conversacional.","2. Do seu celular, mandar “oi” para o número.","3. Conferir: a Tarefa nasce na Lista com o nome do Contato (ou o número), e o cartão mostra “oi”.","4. Abrir a Tarefa e responder; conferir no celular e ver “entregue” na ficha.","5. Mandar um áudio do celular; conferir que ele toca na ficha.","6. Concluir a Tarefa e mandar outra mensagem; conferir que acontece o que a decisão da 5.1 manda."],"pronto":"Os seis passos funcionam; o que falhar vira subtarefa nesta tarefa."}]}]},{"id":"6","n":"Ferramentas: Grupos e Comunidades","dias":[3,5],"dep":["4"],"nota":"Os Flows foram para a Sessão 7: são recurso da API oficial da Meta, e a Evolution não os suporta.","desc":"Grupos e Comunidades de WhatsApp deixam de ser simulados e passam a ser os grupos reais dos números conectados pela Evolution na Sessão 4. Hoje o domínio e as telas estão prontos, mas o “provedor” é uma lista fixa em código, e toda operação grava direto em `plataforma.registros` sem falar com ninguém. Esta sessão separa a regra (domínio) da chamada ao WhatsApp (api), cria rotas próprias para os gestos que mexem no WhatsApp e põe um seletor de número no topo da seção.","partida":["Domínio pronto: 23 operações de Grupo (`packages/dominio/src/operations/ferramentas/grupos.ts`), 13 de Comunidade (`comunidades.ts`), captação (`captacao.ts`), participações (`participacoes.ts`) e notas; tipos em `packages/dominio/src/types/ferramentas.ts`.","O provedor é simulado e mora dentro das operações: `GRUPOS_NO_PROVEDOR`, `gerarJid` e `gerarEnderecoDeConvite` (`provedor-simulado.ts`) são chamados em `grupos.ts:156`, `:165`, `:298`, `:382` e `:528` e em `comunidades.ts:70` e `:89`.","Toda operação roda pelo `run()` da tela e por `POST /operacoes/:nome`, gravando em `plataforma.registros`.","As capacidades são por tipo de Canal, não por provedor: `CAPACIDADES_DE_ATIVOS.whatsapp` (`capacidades.ts:36`) dá grupos e Flows a qualquer WhatsApp, oficial ou não.","Telas prontas em `apps/web/src/app/(shell)/ferramentas/` e `apps/web/src/features/ferramentas/`, com um filtro `?canal=` em cada aba e um seletor de Canal em cada diálogo.","Três botões de simulação (“Simular pedido”, “Simular clique” e “Simular entrada”) que só mudam a tela, porque as funções estão fora do registro de operações.","Não existe página pública para o Link de captação: clicar nele hoje não leva a lugar nenhum.","Da Sessão 4: o cliente da Evolution, o webhook protegido por Canal e os números conectados."],"pronto":"Ao escolher um número no topo de Ferramentas, aparecem os Grupos reais dele; criar um Grupo, mudar o nome e adicionar ou remover participante pela tela muda o grupo no WhatsApp; um grupo criado no celular aparece na tela em segundos; o Link de captação leva ao convite do grupo; nenhum botão “Simular” nem código de regra aparece na tela.","tarefas":[{"id":"6.1","n":"Levantar o que a Evolution faz com grupos","objetivo":"Saber o que dá para ligar antes de ligar. O domínio prevê Comunidades, Pedidos de Entrada e aprovação de entrada, e ninguém conferiu se a Evolution faz isso.","pronto":"Existe a tabela operação do domínio → chamada da Evolution, e a decisão sobre o que falta está tomada.","subs":[{"n":"Montar a tabela operação → chamada da Evolution","cam":["api"],"hoje":"O plano supunha que a Evolution faz tudo o que o domínio prevê.","fazer":["Na documentação da versão instalada, achar a chamada de cada gesto: criar grupo (`POST /group/create`), listar grupos com participantes (`GET /group/fetchAllGroups`), participantes (`GET /group/participants`), adicionar, remover, promover e rebaixar (`POST /group/updateParticipant` com `add`, `remove`, `promote` e `demote`), nome (`POST /group/updateGroupSubject`), descrição (`POST /group/updateGroupDescription`), foto (`POST /group/updateGroupPicture`), configurações (`POST /group/updateSetting` com `announcement` ou `not_announcement` e `locked` ou `unlocked`), link de convite (`GET /group/inviteCode` e `POST /group/revokeInviteCode`) e sair (`DELETE /group/leaveGroup`).","Marcar o que não tiver chamada: criar Comunidade, vincular Grupo a Comunidade, Grupo de avisos, listar, aprovar e recusar Pedido de Entrada, e a configuração “administradores aprovam entrada” (`administradoresAprovamEntrada`).","Testar cada chamada uma vez contra um número de homologação e anotar o formato da resposta."],"pronto":"A tabela está anexada a esta tarefa, com “existe”, “não existe” ou “existe com diferença” para cada operação exportada de `grupos.ts` e `comunidades.ts`.","nota":"Os caminhos acima são os da Evolution API v2. A tarefa existe justamente para não supor."},{"n":"O que fazer com o que a Evolution não faz?","cam":["dec","web"],"decisao":true,"hoje":"O domínio tem 13 operações de Comunidade e o fluxo de Pedido de Entrada (`receberPedidoDeEntrada`, `aprovarPedidoDeEntrada` e `recusarPedidoDeEntrada`, `grupos.ts:704-760`), e as telas os mostram.","opcoes":["(A) Esconder na tela o que não existe no provedor e deixar o domínio parado até haver suporte","(B) Deixar visível como “só na plataforma”, sem efeito no WhatsApp","(C) Implementar direto na biblioteca que a Evolution usa por baixo (Baileys), fora da API dela"],"muda":"(A) é o mais honesto e só custa esconder. (B) engana: a pessoa aprova um pedido que não existe no WhatsApp. (C) exige manter uma versão própria da Evolution: vários dias, e quebra a cada versão nova.","recomendo":"(A), revendo a cada versão nova da Evolution.","peso":"produto"}]},{"id":"6.2","n":"Capacidades por provedor","objetivo":"Cada número só oferece o que o provedor dele faz. Hoje as capacidades de Ferramentas são do tipo `whatsapp`, então um número oficial aceita criar Grupo e um não oficial aceita Flow.","pronto":"Criar Grupo num número oficial e publicar Flow num número não oficial são recusados pelo domínio.","subs":[{"n":"Fazer as capacidades de Ferramentas dependerem do provedor","cam":["dom"],"hoje":"`CAPACIDADES_DE_ATIVOS` (`packages/dominio/src/operations/ferramentas/capacidades.ts:35`) é indexado por `ChannelType`, e `recusaDoCanal` (`permissoes.ts:42-53`) lê `CAPACIDADES_DE_ATIVOS[canal.channelType]`. Há 9 leituras desse objeto no domínio e na tela.","fazer":["Criar `capacidadesDeAtivosDoCanal(canal)` em `capacidades.ts`, no mesmo molde de `capacidadesDoCanal` (`operations/conversations.ts:115`): parte do tipo e sobrepõe por provedor.","`whatsapp-nao-oficial`: grupos sim; Comunidades e Pedidos de Entrada conforme a decisão de 6.1; Flows não.","`whatsapp-cloud`: Flows sim; Grupos e Comunidades não.","Trocar as 9 leituras de `CAPACIDADES_DE_ATIVOS[...]` pela função nova, e a frase de `recusaDoCanal` para “Este número não administra grupos.” (e equivalentes)."],"pronto":"Testes no domínio: `criarGrupo` com um Canal `whatsapp-cloud` recusa com “Este número não administra grupos.”; `publicarVersao` de um Flow com Canal `whatsapp-nao-oficial` recusa."}]},{"id":"6.3","n":"Tirar o provedor de dentro das operações","objetivo":"As operações passam a receber o que o WhatsApp respondeu, em vez de inventar. Hoje elas geram o identificador do grupo e o link de convite no meio da regra, e o domínio não pode chamar o WhatsApp porque não faz entrada e saída.","pronto":"Nenhuma operação de `packages/dominio/src/operations/ferramentas/` importa `provedor-simulado.ts` fora dos testes e do seed.","subs":[{"n":"Separar a conferência do efeito em cada operação externa","cam":["dom"],"hoje":"`criarGrupo` gera o identificador com `gerarJid` e o link com `gerarEnderecoDeConvite` (`grupos.ts:156` e `:165`); `importarGruposDoCanal` lê `GRUPOS_NO_PROVEDOR` (`:298`); `sincronizarGrupo` inventa um link (`:382`); `regenerarLinkDeConvite` também (`:528`); `criarComunidade` gera dois identificadores (`comunidades.ts:70` e `:89`).","fazer":["Para cada operação com efeito no WhatsApp, criar uma função pura `conferir\u003cOperacao>(state, membroId, entrada)` que só valida e devolve o que pedir ao provedor. A operação atual passa a receber na entrada um campo `doProvedor` com o que o WhatsApp respondeu (identificador do grupo, link, lista de grupos, participantes).","Operações: `criarGrupo`, `importarGruposDoCanal`, `sincronizarGrupo`, `editarGrupo`, `adicionarParticipantes`, `removerParticipante`, `promoverParticipante`, `rebaixarParticipante`, `regenerarLinkDeConvite`, `enviarLinkDeConvite`, `sairDoGrupo` e `enviarMensagemAoGrupo`, mais as de Comunidade que a decisão de 6.1 mantiver.","Os eventos que já vêm de fora ficam como estão: `registrarEntradaNoGrupo` (`grupos.ts:795`), `registrarSaidaDoGrupo` (`:825`) e `receberPedidoDeEntrada` (`:704`).","`provedor-simulado.ts` fica só para os testes e o seed (`seed-ferramentas.ts`)."],"pronto":"Os testes do domínio passam com o `doProvedor` montado à mão, e um teste novo prova que `criarGrupo` grava o identificador que veio em `doProvedor`."}]},{"id":"6.4","n":"Rotas de Ferramentas que falam com o WhatsApp","objetivo":"Os gestos que mexem no WhatsApp passam por rotas próprias no `apps/api`. Hoje tudo vai por `POST /operacoes/:nome`, que aplica a operação sem efeito externo, e a tela aplica antes de o servidor confirmar.","pronto":"Criar um Grupo pela tela faz o grupo aparecer no celular do número escolhido, e `POST /operacoes/criarGrupo` não existe mais.","subs":[{"n":"Criar as rotas e o serviço de Grupos","cam":["api","dom"],"hoje":"Não há rota de Ferramentas: tudo passa por `POST /operacoes/:nome` (`apps/api/src/rotas/operacoes.ts`).","fazer":["Criar `apps/api/src/rotas/ferramentas.ts`, registrada em `apps/api/src/app.ts`, e o serviço `apps/api/src/servicos/ferramentas/grupos.ts`.","Cada rota: (1) roda `conferir\u003cOperacao>` sobre o estado; (2) chama a Evolution pelo cliente da Sessão 4, com a credencial do Canal tirada do cofre; (3) roda a operação com `doProvedor` dentro de `executar` (`apps/api/src/persistencia/unidade-de-trabalho.ts:116`).","Rotas: `POST /ferramentas/grupos`, `POST /ferramentas/canais/:canalId/importar-grupos`, `POST /ferramentas/grupos/:id/sincronizar`, `PATCH /ferramentas/grupos/:id`, `POST /ferramentas/grupos/:id/participantes`, `DELETE /ferramentas/grupos/:id/participantes/:participacaoId`, `POST /ferramentas/grupos/:id/participantes/:participacaoId/promover` e `.../rebaixar`, `POST /ferramentas/grupos/:id/link/regenerar`, `POST /ferramentas/grupos/:id/convites`, `POST /ferramentas/grupos/:id/sair` e `POST /ferramentas/grupos/:id/mensagens`.","Se a Evolution aceitou e a gravação falhou, registrar no log e marcar o Grupo para sincronizar: o WhatsApp não desfaz criar grupo.","Tirar essas operações de `OPERACOES` em `packages/dominio/src/operations/registro.ts` (bloco de `ferramentas/grupos.ts`, linhas 237-261), para ninguém criar um Grupo sem passar pelo WhatsApp. Ficam lá as que não saem da plataforma: captação, notas, arquivar, restaurar e lixeira."],"pronto":"Teste em `apps/api` com `criarServidorFalso` no lugar da Evolution: `POST /ferramentas/grupos` chama `/group/create` e grava o Grupo com o identificador devolvido; `POST /operacoes/criarGrupo` responde 404."},{"n":"Fazer as telas chamarem as rotas novas","cam":["web"],"hoje":"Os diálogos e popups chamam as operações pelo `run()` (`apps/web/src/dados/store.ts:373`), que aplica na tela na hora e depois manda para `POST /operacoes`.","fazer":["Criar `apps/web/src/dados/ferramentas.ts`, no molde de `apps/web/src/dados/crm/canais.ts`: uma função por rota, e `rehidratar()` depois do sucesso.","Trocar o `run(...)` por essas funções em `criar-grupo-dialog.tsx`, `importar-grupos-dialog.tsx`, `grupo-popup.tsx`, `participacoes.tsx`, `conversa-do-grupo.tsx` e no menu de sincronizar de `tela-de-ferramentas.tsx` (que hoje chama `sincronizarGrupo` e `sincronizarComunidade` direto).","Enquanto a chamada roda, o botão fica ocupado com “Enviando ao WhatsApp…”; na recusa, mostra a frase da api."],"pronto":"Criar um Grupo pela tela faz o grupo aparecer no celular do número escolhido, e a tela só mostra o Grupo depois que a api confirma."}]},{"id":"6.5","n":"Seletor de número","objetivo":"Escolher o número uma vez, no topo, e tudo vir dele. Hoje cada aba tem o seu filtro de Canal e cada diálogo pergunta o Canal de novo, misturando números oficiais e não oficiais.","pronto":"Trocar o número no topo troca os Grupos e Comunidades mostrados, e nenhum diálogo pergunta o número.","subs":[{"n":"Pôr o seletor no topo de Ferramentas","cam":["web"],"hoje":"Cada aba tem o seu filtro `?canal=` (`aba-grupos.tsx:44`, `aba-comunidades.tsx:25`, `aba-flows.tsx:25`), com todo Canal `whatsapp` ativo, de qualquer provedor (`aba-grupos.tsx:42`).","fazer":["Em `tela-de-ferramentas.tsx`, um `Select` no `PageHeader` com os Canais da aba: Grupos e Comunidades listam os `whatsapp-nao-oficial` conectados; Flows lista os `whatsapp-cloud` (Sessão 7).","O número escolhido fica em `?canal=` (para sobreviver ao F5, como pede `url.ts`) e a última escolha fica no `localStorage`, com leitura e escrita dentro de try/catch.","Tirar os filtros de Canal das três abas: elas leem o `?canal=` do topo.","Sem número conectado: estado vazio com o link para conectar um (`/crm/caixa-de-entrada/configuracoes/canais/conectar/whatsapp-nao-oficial`)."],"pronto":"Trocar o número no topo troca a lista de Grupos; recarregar a página mantém o número escolhido."},{"n":"Tirar os seletores de Canal dos diálogos","cam":["web"],"hoje":"`criar-grupo-dialog.tsx:203` (“Canal administrador”), `importar-grupos-dialog.tsx:54`, `criar-comunidade-dialog.tsx:60` e `criar-flow-dialog.tsx:59` (“Canal publicador”) pedem o Canal de novo.","fazer":["Os quatro diálogos recebem o Canal do topo e mostram só o nome dele, sem campo.","`definirCanalDoGrupo` (`grupos.ts:453`) continua no popup do Grupo, para trocar o número administrador."],"pronto":"Nenhum diálogo de criar ou importar tem campo de Canal, e o Grupo criado fica no número do topo."}]},{"id":"6.6","n":"Sincronização","objetivo":"O que está no WhatsApp aparece aqui e continua atualizado. Hoje importar lê uma lista fixa e nada muda sozinho.","pronto":"Um grupo criado no celular do número conectado aparece em Ferramentas em até 10 s, sem clicar em importar.","subs":[{"n":"Receber os eventos de grupo da Evolution","cam":["api"],"hoje":"A Sessão 4 ignora tudo o que vem de `@g.us`.","fazer":["Assinar no webhook da instância os eventos `GROUPS_UPSERT`, `GROUP_UPDATE` e `GROUP_PARTICIPANTS_UPDATE`.","`GROUPS_UPSERT` (o número entrou num grupo, ou alguém criou um no celular): `importarGruposDoCanal` só daquele grupo.","`GROUP_UPDATE`: nome, descrição e configurações pela `sincronizarGrupo` com `doProvedor`.","`GROUP_PARTICIPANTS_UPDATE`: `add` chama `registrarEntradaNoGrupo`; `remove` chama `registrarSaidaDoGrupo`; `promote` e `demote` mudam o papel da participação.","Tudo pela fila de entrada da Sessão 3, como as mensagens."],"pronto":"Teste em `apps/api` com os três eventos de exemplo; e, com o celular, criar um grupo faz ele aparecer na tela em até 10 s."},{"n":"Importar tudo ao conectar e conferir uma vez por dia","cam":["api"],"hoje":"Importar é um botão (`importar-grupos-dialog.tsx`) que lê `GRUPOS_NO_PROVEDOR`.","fazer":["Quando um Canal `whatsapp-nao-oficial` conecta (4.3), importar os grupos dele por `GET /group/fetchAllGroups` com participantes, respeitando `LIMITE_DE_GRUPOS_POR_ESPACO` (200, `capacidades.ts:53`).","Uma rotina diária confere cada Grupo e corrige o que divergiu, porque um webhook pode se perder."],"pronto":"Conectar um número que já está em 5 grupos faz os 5 aparecerem sem nenhum clique."},{"n":"Criar o endereço público do Link de captação","cam":["api"],"hoje":"Não existe página pública para o Link de captação: `apps/web/src/app/(publico)/` só tem `f/[segredo]` e `p/[segredo]`. `registrarClique` (`captacao.ts:165`) só roda pelo botão “Simular clique”.","fazer":["Rota pública `GET /captacao/:slug` no `apps/api`, sem login, com o limite de taxa das rotas públicas (Sessão 1): roda `registrarClique` dentro de `executar` e responde 302 para o link de convite do Grupo escolhido.","Quem clicou e entrou é casado depois pelo `GROUP_PARTICIPANTS_UPDATE` do item acima, e não por `simularEntradaPorClique`."],"pronto":"Abrir o endereço do link num celular leva ao convite do grupo no WhatsApp, e o contador de cliques do link sobe."},{"n":"Tabelas próprias para Grupos e Comunidades?","cam":["dec","banco","api"],"decisao":true,"hoje":"Grupos, Comunidades, Links de captação e Flows estão em `plataforma.registros` e vão inteiros em todo `GET /estado` e em cada `executar`.","opcoes":["(A) Tabelas próprias numa migração nova, com rotas REST, como o CRM na 007","(B) Continuam em `plataforma.registros`"],"muda":"(A) soma de 2 a 3 dias (tabelas, repositório, rotas de leitura e trocar as telas de `state.grupos` para HTTP), mas Grupos com centenas de participações deixam de pesar no carregamento de toda tela. (B) não custa nada agora, mas cada Grupo importado engorda o estado que todo usuário baixa.","recomendo":"(B) nesta sessão, medindo o tamanho do `GET /estado` depois de importar os grupos reais; (A) numa sessão própria se passar de 1 MB.","peso":"arrumacao"},{"n":"Como guardar a Conversa de um Grupo nas tabelas novas?","cam":["dec","banco"],"decisao":true,"hoje":"A Conversa de grupo é do modelo antigo: `conversaDoGrupoOuCriar` (`grupos.ts:844`) cria uma `Conversation` com `groupIdentifier` em `state.conversations`. A tabela nova `plataforma.conversas` exige `contato_id` (008, linha 78) e não tem campo de grupo, e a Sessão 3 tira o modelo antigo.","opcoes":["(A) Migração nova: `contato_id` passa a aceitar vazio e entra `grupo_id`, com a regra de que um dos dois existe","(B) Tabela própria para as mensagens de grupo","(C) Não guardar mensagens de grupo: Ferramentas só administra o grupo, e enviar ao grupo é só saída"],"muda":"(A) reaproveita o fio, o tempo real e a mídia da Caixa de Entrada (cerca de 1 dia), mas mexe no índice `conversas_nao_resolvida_uq`. (B) duplica o fio. (C) é o mais rápido, mas `enviarMensagemAoGrupo` e a aba de conversa do Grupo (`conversa-do-grupo.tsx`) perdem o histórico.","recomendo":"(A). Se a 3.1.3 ficar em (B), as Conversas de Grupo continuam no modelo antigo até esta sessão, e é aqui que elas passam para as tabelas novas.","peso":"produto"},{"n":"Levar a Conversa de Grupo para as tabelas novas e apagar o resto do modelo antigo de Grupos","cam":["dom","api","banco"],"hoje":"`conversaDoGrupoOuCriar` (`packages/dominio/src/operations/ferramentas/grupos.ts:844`) cria uma `Conversation` antiga em `state.conversations`, e `conversaDoGrupo` (`packages/dominio/src/derive-ferramentas.ts:145`) a procura lá.","fazer":["Aplicar a forma escolhida na decisão anterior (migração nova).","Trocar `conversaDoGrupoOuCriar` e `conversaDoGrupo` para ler e gravar em `plataforma.conversas`.","Copiar as Conversas de Grupo que já existem em `plataforma.registros` para a tabela nova e apagar as linhas antigas."],"pronto":"Uma consulta mostra zero linhas `colecao = 'conversations'` com `groupIdentifier` em `plataforma.registros`, e a aba de conversa do Grupo mostra o histórico vindo da tabela nova."}]},{"id":"6.7","n":"Limpeza","objetivo":"Tirar o que só existia para o protótipo. Hoje há botões que fingem ser o WhatsApp e códigos de regra (como `RN-FLW-01`) nos textos que a pessoa lê.","pronto":"Nenhum botão de simular e nenhum código de regra na tela de Ferramentas.","subs":[{"n":"Tirar os três botões de simulação","cam":["web","dom"],"hoje":"“Simular pedido” (`apps/web/src/features/ferramentas/pedidos-de-entrada.tsx:44-45`, diálogo em `:120-137`), “Simular clique” (`links-de-captacao.tsx:95`) e “Simular entrada” (`links-de-captacao.tsx:126`) chamam `receberPedidoDeEntrada`, `registrarClique` e `simularEntradaPorClique` pelo `run()`. Essas funções estão fora do registro (`packages/dominio/src/operations/registro.ts:226-233`), então o servidor não as executa: a tela muda e volta no próximo carregamento. (O plano anterior falava em 5 botões; são 3.)","fazer":["Apagar os três botões e o diálogo de pedido simulado.","Apagar `simularEntradaPorClique` (`captacao.ts:188`) do domínio; `registrarClique` fica, usada pela rota pública de 6.6.","Os Pedidos de Entrada passam a vir só do webhook, se a decisão de 6.1 os mantiver.","Atualizar o comentário de `tela-de-ferramentas.tsx:8` (“O provedor é simulado.”)."],"pronto":"Nenhuma ocorrência de “Simular” em `apps/web/src/features/ferramentas/` fora dos testes, e os testes de tela que clicavam nesses botões foram apagados ou trocados."},{"n":"Tirar os códigos de regra dos textos","cam":["web","dom"],"hoje":"Cerca de 60 códigos (como `RN-FLW-01`, `INV-COM-02`, `RN-GRP-08`) aparecem nos textos de `apps/web/src/features/ferramentas/`, e outros cerca de 50 nas frases de recusa de `packages/dominio/src/operations/ferramentas/` (ex.: “… (INV-COM-02).” em `comunidades.ts`), que a tela mostra no aviso.","fazer":["Apagar os códigos e as referências de seção, como “(20.3)”, dos textos visíveis nos dois lugares. Nos comentários do código eles ficam.","Acrescentar um teste em `apps/web` que renderiza as três abas de Ferramentas e os popups e falha se achar o padrão `RN-`, `INV-` ou `DO-` no texto."],"pronto":"O teste novo passa, e nenhuma frase de `fail(` em `operations/ferramentas/` contém `(RN-`, `(INV-` ou `(DO-`."}]}],"ajuste":"+2 dias: cerca de 12 rotas novas, telas passando a falar por HTTP, sincronização pelo webhook e a página pública do Link de captação."},{"id":"7","n":"WhatsApp oficial (Cloud API) e Flows","dias":[4,6],"dep":["3","6"],"meta":true,"desc":"Liga o WhatsApp oficial da Meta (Cloud API): um número da empresa conectado por token, com a janela de 24 h, os modelos de mensagem aprovados pela Meta para falar fora dela e os Flows (formulários interativos dentro do WhatsApp), que só existem na API oficial. Só começa com a empresa verificada na Meta e o número dedicado registrado (7.1).","partida":["O Canal `whatsapp-cloud` já nasce pela página de conectar; o quadro do token é só texto (`apps/web/src/features/crm/conectar-canal.ts:21-32`).","A janela de 24 h já é aplicada no servidor: `validarEnvio` (`packages/dominio/src/crm/mensagens.ts:162`) recusa fora dela, e o serviço passa `modelosAprovados: []` fixo (`apps/api/src/servicos/crm/mensagens.ts:119`). Fora da janela, nunca sai nada.","O modelo de mensagem só existe como tipo (`MessageTemplate`, `packages/dominio/src/types/crm.ts:368`) e no seed; o Canal da tabela nova chega à tela com `messageTemplates: []` (`apps/api/src/persistencia/canais-projetados.ts:55`).","A Caixa de Entrada já troca o texto livre por um seletor de modelo quando a janela fecha (`apps/web/src/features/crm/conversation-thread.tsx:345-357` e `:1298`), lendo `channel.messageTemplates` do modelo antigo.","Domínio de Flows pronto (`packages/dominio/src/operations/ferramentas/flows.ts`, 27 operações, com versões, telas e componentes) e construtor visual (`apps/web/src/features/ferramentas/flow-builder.tsx`). Publicar, enviar e receber resposta são simulados (`publicarVersao` `:624`, `enviarFlow` `:845`, `receberRespostaDeFlow` `:908`).","Da Sessão 3: interface de provedor, webhook com fila de entrada, porta de saída, mídia e CRM unificado. Da Sessão 4: `POST /canais/:id/conectar` e `proximoStatusDeEntrega`."],"pronto":"Um número oficial conectado pela tela conversa pela Caixa de Entrada; fora da janela de 24 h, a resposta só sai escolhendo um modelo aprovado, e chega; um Flow publicado pela tela aparece na conta da Meta, é enviado a um Contato e a resposta dele fica guardada na Conversa.","tarefas":[{"id":"7.1","n":"Pré-requisitos na Meta","objetivo":"Ter a conta da Meta pronta antes da sessão. Sem empresa verificada, app criado e número registrado, nada desta sessão pode ser testado, e a Meta leva de dias a semanas.","pronto":"Empresa verificada, app ao vivo, número registrado e os cinco dados de 7.1 entregues.","subs":[{"n":"Verificar a empresa no Meta Business","cam":["voce"],"hoje":"Não iniciado.","fazer":["Em business.facebook.com, abrir Configurações do negócio › Central de segurança › Verificação da empresa.","Enviar razão social e CNPJ exatamente como no cartão CNPJ, endereço, telefone e site; confirmar o domínio ou o telefone quando a Meta pedir.","Anotar nesta tarefa o ID do portfólio empresarial."],"pronto":"A Central de segurança mostra a empresa como verificada.","nota":"Começar na primeira semana do plano: a Meta pode levar de dias a semanas e às vezes pede documentos de novo."},{"n":"Separar o número dedicado","cam":["voce"],"hoje":"Não iniciado.","fazer":["Ter um número que receba SMS ou ligação e que não esteja em uso no aplicativo WhatsApp. Se estiver, apagar a conta do WhatsApp nele antes (não basta desinstalar).","Não usar nenhum dos números da Sessão 4.","Escolher o nome de exibição seguindo as regras da Meta: o nome da empresa ou da marca, como aparece no site."],"pronto":"Número e nome de exibição anotados nesta tarefa.","nota":"A Meta tem um modo de coexistência que deixa o mesmo número no aplicativo WhatsApp Business e na API. Conferir se está disponível para a conta antes de apagar a conta do aplicativo."},{"n":"Criar o app, registrar o número e gerar o token","cam":["voce"],"hoje":"Não iniciado.","fazer":["Em developers.facebook.com, criar um app do tipo Empresa, ligado ao portfólio verificado, e adicionar o produto WhatsApp.","Em WhatsApp › Configuração da API, adicionar o número dedicado, confirmar pelo código e definir o PIN de duas etapas (guardar o PIN).","No Meta Business, cadastrar uma forma de pagamento na conta do WhatsApp Business: a Meta cobra os modelos de mensagem.","Criar um usuário do sistema administrador, dar a ele o app e a conta do WhatsApp Business, e gerar um token permanente com as permissões `whatsapp_business_messaging` e `whatsapp_business_management`.","Publicar uma página de política de privacidade e pôr o app no modo Ao vivo: em modo de desenvolvimento a Meta não manda os webhooks de produção.","Entregar por um canal seguro, nunca por mensagem: ID do app, chave secreta do app, ID da conta do WhatsApp Business (WABA), ID do número (Phone Number ID) e o token. O token vai direto no formulário de conectar (7.2); a chave secreta, no `.env` do `apps/api`."],"pronto":"Na Configuração da API do app, o número aparece conectado, e um envio de teste da própria página da Meta chega ao seu celular.","nota":"Para usar o número da própria empresa não é preciso revisão de app. Ela só entra se outras empresas forem conectar números delas pela plataforma (ver a decisão de 7.2)."}]},{"id":"7.2","n":"Conexão e mensagens","objetivo":"Receber e enviar pela API oficial. Hoje o Canal oficial só existe no banco, desconectado, e nada fala com a Meta.","pronto":"Um número oficial conectado pela tela conversa pela Caixa de Entrada, com os tiques de entregue e lida.","subs":[{"n":"Como o número oficial se conecta?","cam":["dec","web","api"],"decisao":true,"hoje":"A página de conectar diz que o token “será pedido aqui quando a integração existir” (`conectar-canal.ts:26`).","opcoes":["(A) Manual: a pessoa cola o ID do número, o ID da WABA e o token do usuário do sistema num formulário","(B) Cadastro incorporado da Meta (Embedded Signup): um botão abre o login da Meta e devolve tudo sozinho"],"muda":"(A) cabe nesta sessão e serve para os números da própria empresa. (B) é o que serve para outras empresas conectarem os números delas, mas exige revisão de app, o app como Provedor de Tecnologia e cerca de 2 dias a mais.","recomendo":"(A) agora; (B) só se a plataforma for usada por outras empresas.","peso":"produto"},{"n":"Criar o cliente da Cloud API","cam":["api"],"hoje":"Não existe.","fazer":["Criar `apps/api/src/provedores/whatsapp-cloud/cliente.ts`, chamando a Graph API da Meta (`https://graph.facebook.com/\u003cversão>`, com a versão fixa na variável `META_GRAPH_VERSAO`) com o token do Canal tirado do cofre.","Funções: `enviarMensagem` (`POST /{phone-number-id}/messages`, com os tipos `text`, `image`, `audio`, `video`, `document`, `template`, `interactive` e `reaction`), `subirMidia` (`POST /{phone-number-id}/media`), `baixarMidia` (`GET /{media-id}` devolve um endereço temporário, baixado com o mesmo token), `marcarComoLida` (`POST /{phone-number-id}/messages` com `status: read`) e `dadosDoNumero` (`GET /{phone-number-id}`).","Os erros da Graph (`error.code`) viram transitório ou permanente, como pede a interface da Sessão 3; o código 131047 (mensagem fora da janela) vira a mesma recusa de janela de `validarEnvio`."],"pronto":"Testes em `apps/api/src/provedores/whatsapp-cloud/cliente.test.ts` contra `criarServidorFalso` cobrem cada função e um token vencido.","nota":"Conferir os nomes dos campos na versão da Graph API escolhida antes de codificar."},{"n":"Conectar pelo token","cam":["api"],"hoje":"`POST /canais/:id/conectar` (Sessão 4) só trata o não oficial.","fazer":["Para `whatsapp-cloud`, a rota recebe `phoneNumberId`, `wabaId` e `token`, guarda o token no cofre, chama `dadosDoNumero` e confere que `display_phone_number` é o `identificadorExterno` do Canal (por `conferirNumeroConectado`, da Sessão 4).","Inscreve o app na conta (`POST /{waba-id}/subscribed_apps`) para os webhooks chegarem.","Tudo certo: grava `conexao_confirmada` na hora (aqui não há QR code)."],"pronto":"Teste: com o servidor falso respondendo o número certo, o Canal fica `conectada`; com outro número, fica `desconectada` e a rota devolve “Este token é de outro número.”"},{"n":"Receber pelo webhook da Meta","cam":["api","infra"],"hoje":"Não existe.","fazer":["Na rota de webh
