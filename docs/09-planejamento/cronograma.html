 (`StructureTree`, `features/shell/app-shell.tsx:600`) já mostra a Lista nova."],"pronto":"Um teste em `store.test.ts` com transporte lento: depois de `run(createList)`, `data.lists` já tem a Lista antes de o transporte responder; se o transporte devolver `ok: false`, a Lista some e `lastResult.error` traz a mensagem.","nota":"Só com (B). O empurrão de mudanças entre telas abertas (trocar a pergunta a cada 5 s por tempo real) é da 3.4."},{"n":"Criar as tabelas de Espaço, Pasta e Lista","cam":["banco"],"hoje":"Espaço, Pasta e Lista são linhas de `plataforma.registros` com `colecao` igual a `spaces`, `folders` ou `lists` e o objeto inteiro em `dados` (jsonb).","fazer":["Migração nova com `plataforma.espacos`: `workspace_id`, `id`, `nome`, `descricao`, `icone`, `cor`, `ordem` (double precision), `privado` (boolean), `estado` (`ativo`, `arquivado`, `naLixeira`), `estado_antes_da_lixeira`, `arquivado_em`, `na_lixeira_em`, `modos` (jsonb), `bloqueios` (jsonb), `conjunto_de_status` (jsonb, obrigatório), `funcionalidades` (jsonb), `visualizacoes_padrao` (jsonb), `atalhos` (jsonb), `campos_herdados_fora` (jsonb), `proveniencia` (jsonb), `criado_por` (jsonb), `criado_em`, `atualizado_em`, chave `(workspace_id, id)`.","`plataforma.pastas`: as mesmas colunas (sem `atalhos`, com `conjunto_de_status` opcional) mais `pai_tipo` (`space` ou `folder`), `pai_id`, `espaco_id` e `sprint` (jsonb).","`plataforma.listas`: as colunas comuns (sem `bloqueios`) mais `pai_tipo`, `pai_id`, `espaco_id`, `modelo_de_tarefa`, `canais_de_atendimento`, `periodo_planejado`, `campos_editaveis_por_convidado` e `compartilhada_por_campos` (jsonb).","Índice único do nome entre irmãos fora da lixeira, com a mesma regra de `nameTaken` (`structure.ts:33`: sem diferença de maiúsculas).","Copiar os dados de `plataforma.registros` para as três tabelas e apagar as linhas copiadas na mesma migração."],"pronto":"`npm run migrar -w @n1/api -- --seco` lista a migração; aplicada em homologação, `select count(*)` de cada tabela bate com o de `plataforma.registros` antes dela.","nota":"Só com (A)."},{"n":"Criar o serviço e as rotas REST de contêiner","cam":["api"],"hoje":"Tudo passa por `POST /operacoes/:nome` com `createSpace`, `createFolder`, `createList`, `updateContainer`, `archiveContainer`, `unarchiveContainer`, `trashContainer` e `restoreContainer` (`apps/api/src/rotas/esquemas/estrutura.ts:92–99`).","fazer":["`apps/api/src/repositorios/estrutura/conteineres.ts`: o SQL das três tabelas, no padrão de `repositorios/crm/funis.ts`.","`apps/api/src/servicos/estrutura/conteineres.ts`: numa transação, trava o Espaço de Trabalho, monta o `DataState` com os contêineres das tabelas e o resto de `plataforma.registros`, roda a operação que já existe em `structure.ts` (a regra fica onde está), grava os contêineres nas tabelas e o resto (Tipos de Tarefa, concessões, Atividade, Tarefas da cascata) em `plataforma.registros`, e soma 1 à revisão do Espaço de Trabalho.","Rotas em `apps/api/src/rotas/estrutura/`: `GET`/`POST /espacos`, `PATCH /espacos/:id`, `POST /espacos/:id/arquivar`, `/desarquivar`, `/restaurar`, `DELETE /espacos/:id` (lixeira), e o mesmo para `/pastas` e `/listas`.","Tirar as 8 operações de `POST /operacoes/:nome`: o nome devolve 404 dizendo a rota nova."],"pronto":"Testes em `apps/api/src/rotas/estrutura/*.test.ts` no padrão dos do CRM: criar, editar, arquivar e enviar à lixeira cada um, e `POST /operacoes/createList` devolve 404.","nota":"Só com (A)."},{"n":"Projetar os contêineres das tabelas no `DataState`","cam":["api"],"hoje":"Os Canais da 008 fazem isso (`apps/api/src/persistencia/canais-projetados.ts`): entram em `GET /estado` e em `executar()`, nunca em `hidratar()`.","fazer":["Criar `apps/api/src/persistencia/conteineres-projetados.ts` no mesmo formato: carregar as três tabelas para `state.spaces`, `state.folders` e `state.lists` em `rotas/estado.ts` e em `executar()`.","Ao contrário dos Canais, a projeção também escreve: `overrideStatusSet`, `setContainerFeature`, `alterarModeloDaLista` e `definirCanaisDaLista` mudam o contêiner por `POST /operacoes`. Comparar a fotografia de antes com a de depois e gravar o que mudou nas tabelas, e tirar os projetados do estado antes de `gravar()`."],"pronto":"Um teste prova que `setContainerFeature` por `POST /operacoes` grava em `plataforma.listas` e que nenhuma linha `colecao = 'lists'` volta para `plataforma.registros`.","nota":"Só com (A)."},{"n":"Trocar as telas de contêiner para as rotas novas","cam":["web"],"hoje":"O diálogo de criação (`create-container-dialog.tsx:217`) e a Identidade e o Ciclo de vida (`identidade-e-ciclo-de-vida.tsx:68`, `:206`, `:217`, `:241`, `:262`) chamam as operações por `run`/`runConfirmado`.","fazer":["Criar `apps/web/src/dados/estrutura/conteineres.ts` com `criarEspaco`, `criarPasta`, `criarLista`, `editarConteiner`, `arquivar`, `desarquivar`, `enviarParaLixeira` e `restaurar`, sobre um `chamarApi` igual a `chamarCrm` (`dados/crm/cliente-crm.ts:50`).","As duas telas passam a chamá-las; depois de cada uma, o store aplica o registro devolvido em `data` (uma função nova `aplicarRegistro` em `store.ts`)."],"pronto":"Criar uma Lista pela tela grava uma linha em `plataforma.listas` e nenhuma em `plataforma.registros`.","nota":"Só com (A)."},{"n":"Medir de novo depois da mudança","cam":["api"],"hoje":"Os números de antes ficam anotados na primeira subtarefa.","fazer":"Repetir as mesmas medições, com os mesmos quatro gestos, depois do que a decisão escolheu.","pronto":"A tabela desta tarefa tem as colunas “antes” e “depois” preenchidas."}]},{"id":"2.3","n":"Mover e reordenar Pastas e Listas","objetivo":"Hoje só a Tarefa se move (`moveTask`, `packages/dominio/src/operations/tasks.ts:469`); Pasta e Lista ficam para sempre onde nasceram, e a ordem é a de criação. A ontologia descreve mover, promover, rebaixar e reordenar (RN-ESP-19, RN-SUB-11 e RN-SUB-12, “Reordenar” em `ontologia/02-estrutura-de-trabalho/espaco.md:222`). Esta tarefa cria as duas operações e o gesto na árvore.","pronto":"Arrastar uma Lista para outra Pasta na árvore leva as Tarefas junto, pede o mapeamento de Status quando o Conjunto muda, e a ordem nova continua depois de recarregar.","subs":[{"n":"Criar a operação `moveContainer` para Pasta e Lista","cam":["dom"],"hoje":"Não existe. `parentType` e `parentId` são `readonly` em `Folder` e `List` (`packages/dominio/src/types/structure.ts:221` e `:232`).","fazer":["Tirar `readonly` de `parentType` e `parentId` em `Folder` e `List`.","Criar `moveContainer(state, actingMemberId, tipo: \"folder\" | \"list\", id, destino: { parentType, parentId }, mapeamento?: StatusMapping[])` em `structure.ts`, reusando `StatusMapping` de `tasks.ts:455`.","Recusar quando: falta `administrar` no movido ou `criar` no destino; o destino não está efetivamente ativo; o nome já existe entre os irmãos do destino (`nameTaken`); uma Pasta com Subpastas iria para dentro de outra Pasta (RN-SUB-11) ou qualquer Pasta iria para dentro de uma Subpasta (RN-SUB-02); o destino bloqueia um aspecto que o movido ou um descendente sobrescreve (RN-ESP-09, via `blockedAbove`); o destino fica no mesmo lugar ou abaixo do próprio movido.","Se o Conjunto de Status herdado muda, exigir o mapeamento de cada Status em uso nas Tarefas abaixo, como `moveTask` faz, e aplicá-lo.","Valores de Campo cujas Definições deixam de valer passam a `state: \"arquivado\"` (B37), como em `moveTask`.","Uma Pasta que vai para o Espaço vira Pasta de nível 1 (“Subpasta promovida a Pasta”); uma Pasta sem Subpastas que vai para outra Pasta vira Subpasta (“Pasta rebaixada a Subpasta”). Cada caso grava a Atividade com esse nome; os outros gravam “Lista movida” ou “Pasta movida”, com origem e destino em `before` e `after`.","Registrar em `operations/registro.ts`, `operations/index.ts` e no esquema `apps/api/src/rotas/esquemas/estrutura.ts` (sem esquema o `satisfies EsquemasCompletos` não compila)."],"pronto":"Um teste novo `packages/dominio/src/operations/mover-conteiner.test.ts` cobre: Lista para outra Pasta com o mesmo Conjunto (as Tarefas ficam e não mudam de Status); para um Espaço com outro Conjunto sem mapeamento (recusa) e com mapeamento (Status trocados); Campo que deixa de valer (Valor arquivado); Pasta com Subpastas para dentro de Pasta (recusa); promoção e rebaixamento (Atividade com o nome certo); destino que bloqueia Status sobrescrito no movido (recusa)."},{"n":"Criar a operação `reorderContainers`","cam":["dom"],"hoje":"`order` nasce como o número de irmãos na criação (`structure.ts:93`, `:227`, `:352`) e nenhuma operação a muda. A árvore ordena por `order` (`features/shell/app-shell.tsx:645`).","fazer":["Criar `reorderContainers(state, actingMemberId, pai: { type: \"workspace\" | \"space\" | \"folder\", id }, ids: Id[])` em `structure.ts`: recebe a permutação completa dos irmãos (Pastas e Listas do mesmo pai, ou os Espaços do Espaço de Trabalho), como `PUT /funis/:id/etapas/ordem` faz com as Etapas.","Recusar se faltar ou sobrar id, se faltar `editar` no pai, ou se o pai não estiver ativo; gravar uma Atividade “Ordem alterada” no pai.","Registrar em `registro.ts`, `index.ts` e `esquemas/estrutura.ts`."],"pronto":"Teste em `mover-conteiner.test.ts`: reordenar três Listas de uma Pasta grava `order` 0, 1 e 2 na ordem pedida, e uma lista de ids incompleta é recusada."},{"n":"Arrastar e soltar na árvore e “Mover para…” no menu","cam":["web"],"hoje":"A árvore (`StructureTree`, `features/shell/app-shell.tsx:600`, com `TreeSpace` `:667`, `TreeFolder` `:764`, `TreeList` `:840` e o menu de cada item em `TreeRow` `:1040`, com o `ActionMenu` em `:1140`) não arrasta nada. A árvore de Chat ao lado já move Sessão entre pastas (`moveChatSessionToFolder`, `app-shell.tsx:931`).","fazer":["Arrastar uma Lista ou Pasta sobre outro item da árvore: soltar no meio de um Espaço ou Pasta chama `moveContainer`; soltar entre dois irmãos chama `reorderContainers`.","Item “Mover para…” no menu de Pasta e de Lista, abrindo um diálogo novo `features/estrutura/mover-conteiner-dialog.tsx` com a escolha do destino; quando o Conjunto de Status muda, o diálogo mostra a tabela de mapeamento, no mesmo formato de `move-task-dialog.tsx`.","A recusa do domínio aparece no diálogo ou num `Toast`, sem mover nada."],"pronto":"Arrastar a Lista “Propostas” para a Pasta “Clientes” na árvore move a Lista e as Tarefas dela; arrastar uma Pasta com Subpastas para dentro de outra Pasta mostra a recusa e nada muda."}]},{"id":"2.4","n":"Converter item do checklist em Subtarefa","objetivo":"A conversão existe e funciona, mas assusta e engana: o botão é vermelho, a confirmação exige digitar o nome do item, o botão aparece numa Lista sem Subtarefas e no limite de níveis, e a mensagem de limite pede uma escolha que a tela não oferece. Subitem de checklist nem aparece na tela, e nenhuma operação o cria. Depois desta tarefa, o botão só aparece quando dá para converter, e converter é um clique e uma confirmação.","pronto":"Numa Lista com Subtarefas, converter um item cria a Subtarefa e o aviso leva até ela; numa Lista sem Subtarefas ou numa Tarefa no último nível, o botão não aparece.","subs":[{"n":"Criar no domínio a recusa da conversão antes do clique","cam":["dom"],"hoje":"As recusas só aparecem depois da confirmação: `convertChecklistItem` (`packages/dominio/src/operations/tasks.ts:590`) recusa o item de segundo nível (`:606`) e o nível acima de `state.workspace.maxSubtaskDepth` (`:612`), e quem recusa a Lista sem Subtarefas é o `createTask` chamado por dentro (`tasks.ts:137`, “Esta Lista não usa Subtarefas.”).","fazer":["Criar `conversaoDeItemRecusada(state, actingMemberId, taskId)` em `packages/dominio/src/derive.ts`, devolvendo o motivo ou `undefined`: sem escrita na Tarefa, `features.subtarefas` desligada na Lista, ou `taskLevel(state, task) + 1 > state.workspace.maxSubtaskDepth` (`derive.ts:307`).","`convertChecklistItem` passa a chamar essa função primeiro.","Trocar a mensagem de `tasks.ts:614` (“Escolha outra Tarefa pai ou converta a partir de um nível acima.”) por “Esta Tarefa já está no nível N, o último permitido. O item não pode virar Subtarefa aqui.”"],"pronto":"Teste em `packages/dominio/src/operations/operations.test.ts`: `conversaoDeItemRecusada` devolve o motivo para Lista sem Subtarefas e para Tarefa no nível máximo, e `undefined` numa Tarefa de primeiro nível com Subtarefas ligadas; a mensagem nova aparece na recusa de `convertChecklistItem`."},{"n":"Mostrar o botão só quando a conversão é possível, na cor normal","cam":["web"],"hoje":"Em `apps/web/src/features/estrutura/tarefa-completa.tsx:1783` o botão “Converter em Subtarefa” aparece sempre que a Tarefa é editável, com `style={{ color: \"var(--erro)\" }}` (`:1789`). A confirmação é `destructive` (`:802`), exige digitar o texto do item (`:803–820`) e, ao converter, usa `run` e mostra “Item convertido em Subtarefa: X” sem caminho até ela (`:410–416`).","fazer":["Mostrar o botão só se `conversaoDeItemRecusada` devolver `undefined`.","Tirar a cor de erro do botão e o `destructive` da confirmação.","Trocar `run` por `runConfirmado` e pôr no aviso o link “Abrir” para a Subtarefa, com o id que o servidor devolveu.","A confirmação por texto digitado segue a decisão abaixo."],"pronto":"Numa Lista sem Subtarefas o botão não aparece; numa com Subtarefas ele aparece na cor normal, converter mostra o aviso com “Abrir”, e o link abre a Subtarefa nova."},{"n":"Manter a confirmação por nome digitado?","cam":["dec","web"],"decisao":true,"hoje":"Para converter, a pessoa digita o texto inteiro do item (`tarefa-completa.tsx:803`). A conversão não tem volta, mas não apaga nada: o item fica marcado como convertido, com o link para a Subtarefa. No ClickUp, converter é um clique no menu do item.","opcoes":["(A) Manter a digitação do nome","(B) Confirmar com um clique, sem digitar, com o aviso de que não há volta","(C) Converter direto, sem confirmação"],"muda":"(A) não muda nada. (B) e (C) custam minutos. Com (C), um clique errado deixa uma Subtarefa a mais para enviar à lixeira.","recomendo":"(B).","peso":"produto"},{"n":"O que fazer com os subitens de checklist?","cam":["dec","dom","web"],"decisao":true,"hoje":"O tipo prevê subitem (`ChecklistItem.parentItemId`, `types/structure.ts:282`), e `convertChecklistItem` leva os subitens para um Checklist da Subtarefa nova (`tasks.ts:627`). Mas nenhuma operação cria subitem (`addChecklistItem`, `tasks.ts:896`, não aceita pai), nenhum seed tem subitem, e a Tarefa completa esconde os que existirem (`tarefa-completa.tsx:1693`). Na prática, subitem não existe.","opcoes":["(A) Criar subitens: `addChecklistItem` aceita `parentItemId`, a tela mostra o subitem recuado sob o item, e um subitem também pode virar Subtarefa","(B) Deixar subitens fora: tirar `parentItemId` do tipo e a migração de subitens de `convertChecklistItem`"],"muda":"(A) custa cerca de 1 dia (domínio, esquema da API e tela) e entra nesta tarefa. (B) custa uma hora e simplifica o modelo; se um dia quiser subitens, eles voltam como trabalho novo.","recomendo":"(B) nesta sessão: ninguém usa subitem hoje, e o checklist de um nível cobre os seus testes.","peso":"produto"},{"n":"Converter também pelo cartão do Quadro?","cam":["dec","web"],"decisao":true,"hoje":"Só dá para converter com a Tarefa aberta (página, popup ou drawer, todos pela `tarefa-completa.tsx`). O cartão do Quadro (`features/estrutura/cartao-de-tarefa.tsx`) não mostra os itens do checklist.","opcoes":["(A) Sim: o cartão ganha um menu com os itens do checklist e “Converter em Subtarefa”","(B) Não: só com a Tarefa aberta"],"muda":"(A) custa cerca de meio dia de tela. (B) não custa nada.","recomendo":"(B): para converter a pessoa precisa ver o item no contexto, e a Tarefa aberta dá esse contexto.","peso":"arrumacao"}]},{"id":"2.5","n":"Remover a visualização de carga","objetivo":"A aba Carga soma a estimativa das Tarefas por Responsável e por semana, contra a capacidade semanal de cada Membro. Você pediu para tirá-la. Ela está espalhada por domínio, API e tela, e há Visualizações salvas que podem guardar o tipo `carga` no banco.","pronto":"Nenhuma Lista oferece a Carga; a API recusa salvar uma Visualização do tipo `carga`; nenhuma Visualização gravada tem esse tipo.","subs":[{"n":"Tirar o tipo `carga` e o cálculo `workload` do domínio","cam":["dom"],"hoje":"`View.kind` aceita `carga` (`packages/dominio/src/types/structure.ts:111`). `workload()` e `WorkloadCell` estão em `packages/dominio/src/derive.ts:1196–1227`. O teste “Carga: estimativa cai na semana do vencimento…” está em `operations/operations.test.ts:3361`.","fazer":["Tirar `carga` da união `View.kind`.","Apagar `workload` e `WorkloadCell` de `derive.ts`. `weekStartOf` (`derive.ts:1173`) fica: a Linha do tempo usa (`planning-views.tsx:71`).","Apagar do teste de `operations.test.ts:3361` a parte da carga; a parte de capacidade segue a decisão abaixo."],"pronto":"`npm run check` passa; `grep -rn workload packages apps --include='*.ts' --include='*.tsx'` não acha nada fora de `node_modules`."},{"n":"Tirar `carga` do esquema da API","cam":["api"],"hoje":"`VIEW_KIND` em `apps/api/src/rotas/esquemas/escala.ts:12` aceita `carga`, e a linha `:104` confere que o esquema é igual ao tipo do domínio.","fazer":"Tirar `carga` de `VIEW_KIND`; a conferência de `:104` passa a valer sozinha.","pronto":"Um teste em `apps/api/src/rotas/esquemas/escala.test.ts` prova que `saveView` com `kind: carga` é recusado com 400."},{"n":"Trocar as Visualizações gravadas do tipo `carga` para `lista`","cam":["banco"],"hoje":"Uma Visualização salva com a aba Carga aberta guarda `kind: carga` em `plataforma.registros` (`colecao = 'views'`). Depois da mudança, `abaDaView` (`apps/web/src/features/estrutura/tipo-de-visualizacao.ts:22`) devolveria uma aba que não existe.","fazer":["Contar antes: `select count(*) from plataforma.registros where colecao = 'views' and dados->>'kind' = 'carga';`.","Migração nova (só dados): `update plataforma.registros set dados = jsonb_set(dados, '{kind}', '\"lista\"') where colecao = 'views' and dados->>'kind' = 'carga';`. Pode ser a mesma migração de dados da 2.6 (Listas sem `blocks`)."],"pronto":"Depois da migração, a contagem acima dá 0."},{"n":"Tirar a aba Carga da tela","cam":["web"],"hoje":"A aba está em `listas/[lista]/page.tsx:658` (com os filtros das lentes em `:660` e `:662`) e desenha `CargaDeTrabalho` (`:993`; componente em `features/estrutura/planning-views.tsx:293`). `TipoDeAba` e `ROTULO_DA_ABA` têm `carga` (`tipo-de-visualizacao.ts:11` e `:19`). Não há teste de tela da Carga.","fazer":["Tirar `carga` de `TipoDeAba` e de `ROTULO_DA_ABA`.","Tirar `carga` do array de abas da página e simplificar os dois filtros: a financeira deixa de filtrar; a conversacional filtra só `linha`.","Apagar `CargaDeTrabalho` de `planning-views.tsx` e os imports que sobrarem (`workload`, `memberCapacityMinutes`)."],"pronto":"A Lista mostra 5 abas (Lista, Quadro, Calendário, Tabela, Linha do tempo); a Lista conversacional mostra 4."},{"n":"A capacidade semanal do Membro sai junto?","cam":["dec","dom","web"],"decisao":true,"hoje":"Cada Membro tem `weeklyCapacityMinutes` (`packages/dominio/src/types/workspace.ts:128`), editado por `setMemberCapacity` (`operations/planning.ts:42`) no `CapacityEditor` (`app/(shell)/configuracoes/membros/page.tsx:468`) e mostrado na coluna “Capacidade/sem” (`:346`). Só a Carga lê esse número.","opcoes":["(A) Sai junto: tipo, operação, esquema da API, editor e coluna","(B) Fica, para um uso futuro"],"muda":"(A) custa cerca de uma hora: tira `weeklyCapacityMinutes`, `memberCapacityMinutes`, `setMemberCapacity` (de `planning.ts`, `registro.ts`, `index.ts` e `apps/api/src/rotas/esquemas/planejamento.ts`), o `CapacityEditor`, a coluna e o trecho de capacidade do teste de `operations.test.ts:3373–3376`. (B) deixa um campo na tela de Membros que não muda nada.","recomendo":"(A).","peso":"arrumacao"}]},{"id":"2.6","n":"Fechar as lacunas do modelo da Estrutura","objetivo":"Comparando o modelo com o artefato “Estrutura de Trabalho N1” e com a ontologia, faltam cinco coisas: as Visualizações padrão do Espaço não têm onde morar; a Lista aceita bloqueio, que não tem efeito nela; nenhuma operação grava bloqueio; a descrição da Tarefa não aceita menção e o histórico não guarda o texto anterior; e o tempo registrado é somado só na tela, de dois jeitos diferentes. Cada lacuna sai com tipo, operação, teste e tela.","pronto":"Mudar as Visualizações no Espaço muda as abas das Listas abaixo; bloquear os Status num Espaço impede uma Lista de mudá-los; uma menção na descrição avisa a pessoa; o histórico mostra o texto anterior da descrição; e a Tarefa e o seu editor de tempo mostram o mesmo total.","subs":[{"n":"Criar as Visualizações padrão no Espaço, herdadas pelas Listas","cam":["dom","api"],"hoje":"`defaultViews` existe só como nome de aspecto (`ConfigurableAspect`, `types/structure.ts:84`) e como linha da tabela das Configurações; não há campo nem operação. Hoje a Lista abre na Visualização salva marcada `isDefault` dela, ou na aba Lista (`listas/[lista]/page.tsx:121–124`), e as abas são fixas. A ontologia diz que o Espaço define “quais tipos de Visualização estão disponíveis e qual é a inicial nas Listas descendentes que herdam” (`ontologia/02-estrutura-de-trabalho/espaco.md:94`), e que o aspecto substitui (RN-ESP-08).","fazer":["Em `types/structure.ts`: `type TipoDeVisualizacao = View[\"kind\"]` e `interface VisualizacoesPadrao { disponiveis: TipoDeVisualizacao[]; inicial: TipoDeVisualizacao }`; campo opcional `defaultViews?: VisualizacoesPadrao` em `StructuralContainerBase`; campo `views: VisualizacoesPadrao` em `EffectiveListConfig`.","Constante `VISUALIZACOES_DA_PLATAFORMA` (as cinco abas, inicial `lista`) para o Espaço que ainda não definiu: assim os dados atuais não precisam de migração.","`effectiveContainerConfig` (`derive.ts:176`) resolve `views` pelo ponto de definição mais próximo, como faz com `features`.","Operação `setContainerDefaultViews(state, actingMemberId, tipo, id, valor | null)` em `operations/configuration.ts`, ao lado de `setContainerFeature` (`:825`): exige administrar, contêiner ativo e `blockedAbove(…, \"defaultViews\")` vazio; recusa `disponiveis` vazio e `inicial` fora de `disponiveis`; `null` volta a herdar; grava `modes.defaultViews` e uma Atividade “Visualizações padrão alteradas” com antes e depois.","`saveView` (`operations/scale.ts:117`) recusa salvar uma Visualização de tipo que a Lista não tem disponível.","Registrar em `registro.ts`, `index.ts` e `apps/api/src/rotas/esquemas/configuracao.ts`."],"pronto":"Teste novo `packages/dominio/src/operations/visualizacoes-padrao.test.ts`: o Espaço tira o Calendário e as Listas abaixo deixam de tê-lo; uma Pasta sobrescreve e a Lista dela segue a Pasta; `null` volta ao Espaço; `inicial` fora de `disponiveis` é recusado; `saveView` de tipo indisponível é recusado."},{"n":"Usar as Visualizações padrão na Lista e editá-las nas Configurações","cam":["web"],"hoje":"As abas são uma lista fixa em `listas/[lista]/page.tsx:658`, filtrada só pela lente (financeira, conversacional). Não há editor.","fazer":["A página monta as abas de `config.views.disponiveis`, ainda filtradas pela lente.","A aba inicial passa a ser: a Visualização salva `isDefault` da Lista, se o tipo dela estiver disponível; senão, `config.views.inicial`.","Aba “Visualizações” nas Configurações (a da 2.1): uma caixa por tipo e a escolha da inicial, chamando `setContainerDefaultViews`, com “Voltar a herdar” quando o contêiner tem definição própria."],"pronto":"Desmarcar “Calendário” nas Configurações do Espaço Entrega faz a aba sumir de todas as Listas dele; escolher “Quadro” como inicial faz as Listas sem Visualização padrão própria abrirem no Quadro."},{"n":"Tirar o bloqueio da Lista","cam":["dom","banco"],"hoje":"`blocks` está em `StructuralContainerBase` (`types/structure.ts:184`), herdado também por `List`, e `createList` grava `blocks: {}` (`operations/structure.ts:358`). Bloquear impede os níveis ABAIXO de sobrescrever; abaixo da Lista só há Tarefa, que nunca define nada (ontologia, `espaco.md:344`). Bloqueio na Lista não tem efeito.","fazer":["Mover `blocks` de `StructuralContainerBase` para `Space` e `Folder`.","Tirar `blocks: {}` de `createList` e de `solicitacao-de-pagamento-evolver.ts:158`.","Em `blockedAbove` (`configuration.ts:42`) e em `instantiateListTemplate` (`operations/planning.ts:391`), ler `blocks` só de Espaço e Pasta.","Na migração de dados da 2.5: `update plataforma.registros set dados = dados - 'blocks' where colecao = 'lists';`."],"pronto":"`npm run check` passa (o tipo não deixa escrever `blocks` numa Lista); depois da migração, `select count(*) from plataforma.registros where colecao = 'lists' and dados ? 'blocks'` dá 0."},{"n":"Tirar o modo `bloqueado` que ninguém grava","cam":["dom","web"],"hoje":"`InheritanceMode` tem `herdado`, `sobrescrito` e `bloqueado` (`types/structure.ts:73`), e o bloqueio também mora em `blocks`. Nenhum código grava `modes[…] = \"bloqueado\"`; só `container-settings.tsx` lê, para pintar a etiqueta. Um contêiner pode sobrescrever e bloquear ao mesmo tempo, coisa que um modo único não expressa.","fazer":["Tirar `bloqueado` de `InheritanceMode`; o bloqueio fica só em `blocks`.","Tirar `MODE_LABEL.bloqueado` de `container-settings.tsx` (a tabela já sai na 2.1)."],"pronto":"`grep -rn 'bloqueado' packages/dominio/src/types/structure.ts` não acha nada; `npm run check` passa."},{"n":"Criar a operação `setContainerBlock` e o botão de bloquear","cam":["dom","api","web"],"hoje":"`blockedAbove` confere o bloqueio ao sobrescrever Status (`configuration.ts:660`), ao criar Campo (`:146`), ao criar Tipo de Tarefa (`:737`), ao mudar Funcionalidade (`:838`) e ao instanciar Template de Lista (`planning.ts:389`). Não confere ao criar Automação (`criarAutomacao`, `operations/ia/automacoes-editor.ts:194`). Nenhuma operação grava `blocks`: só o seed (`seed.ts:290`).","fazer":["Criar `setContainerBlock(state, actingMemberId, tipo: \"space\" | \"folder\", id, aspecto, bloqueado: boolean)` em `configuration.ts`: exige administrar e contêiner ativo.","Para os aspectos que substituem (`statusSet`, `features`, `defaultViews`), recusar enquanto algum descendente sobrescrever o aspecto, e listar quais na mensagem (RN-ESP-09). Para os que acumulam (`fieldDefinitions`, `taskTypes`, `automations`), bloquear vale só para o que for criado depois.","Função auxiliar `sobrescritasAbaixo(state, tipo, id, aspecto)` em `derive.ts`, usada pela operação e pela tela.","Passar a chamar `blockedAbove(…, \"automations\")` em `criarAutomacao` quando o escopo for Pasta ou Lista.","Atividade “Aspecto bloqueado” / “Aspecto desbloqueado” com o aspecto em `detail`.","Registrar em `registro.ts`, `index.ts` e `esquemas/configuracao.ts`.","Nas abas de aspecto das Configurações de Espaço e Pasta (2.1), um interruptor “Bloquear para os níveis abaixo”; com sobrescritas abaixo, ele fica desligado e mostra a lista delas, cada uma com link para as Configurações dela."],"pronto":"Teste novo `packages/dominio/src/operations/bloqueio-de-aspecto.test.ts`: bloquear Status num Espaço sem sobrescrita abaixo funciona e `overrideStatusSet` numa Lista dele passa a ser recusado; com uma Pasta que sobrescreve, o bloqueio é recusado e a mensagem nomeia a Pasta; bloquear Campos deixa os existentes e recusa um novo; bloquear Automações recusa `criarAutomacao` numa Lista abaixo."},{"n":"Aceitar menções na descrição da Tarefa","cam":["dom","api","web"],"hoje":"A descrição é texto simples, editada em `TaskTitleDescriptionEditor` (`apps/web/src/features/estrutura/task-editors.tsx:41`) e mostrada em `tarefa-completa.tsx:963–976`. Menção existe só no Comentário: `Comment.mentions` (`types/primitives.ts:189`), o menu do “@” do `CommentComposer` (`task-editors.tsx:471–520`) e `pendingMentions` (`derive.ts:1071`), que alimenta “Menções a você” em `app/(shell)/notificacoes/page.tsx:77`.","fazer":["Campo `descriptionMentions?: { type: \"member\"; id: Id }[]` em `Task` (`types/structure.ts`).","`UpdateTaskInput` (`tasks.ts:1419`) ganha `descriptionMentions`; `updateTask` grava junto com a descrição e recusa Membro inexistente, como `addTaskComment` faz (`tasks.ts:1764`). Atualizar o esquema de `updateTask` em `apps/api/src/rotas/esquemas/tarefas.ts`.","Tirar do `CommentComposer` a lógica do “@” para um hook `useMencoes` em `features/estrutura/mencoes.ts`, e usá-lo no editor da descrição.","Na Tarefa completa, o nome mencionado aparece destacado na descrição.","O aviso à pessoa mencionada segue a decisão abaixo."],"pronto":"Teste em `operations.test.ts`: `updateTask` com descrição “@Júlia revisar” e a menção grava `descriptionMentions`; Membro inexistente é recusado. Na tela, digitar “@Jú” na descrição abre o menu de Membros."},{"n":"Uma menção na descrição avisa a pessoa?","cam":["dec","dom","web"],"decisao":true,"hoje":"A menção num Comentário aparece em Notificações › “Menções a você” até a conversa ser resolvida (`pendingMentions`, `derive.ts:1071`). A descrição não tem “resolvido”, e não existe registro de “já vi”.","opcoes":["(A) Não avisa: a menção só destaca o nome","(B) Avisa em “Menções a você” enquanto o nome estiver na descrição e a Tarefa estiver aberta (fora de categoria terminal)"],"muda":"(A) não custa nada além da subtarefa acima. (B) custa cerca de 2 horas: `pendingMentions` passa a ler também `descriptionMentions`, e a tela de Notificações mostra o trecho da descrição.","recomendo":"(B): é o que o ClickUp faz, e a regra sai do dado, sem guardar estado novo.","peso":"produto"},{"n":"Guardar o texto anterior a cada edição da descrição","cam":["dom","web"],"hoje":"`updateTask` grava só “Descrição alterada”, sem `before` nem `after` (`packages/dominio/src/operations/tasks.ts:1458`). O Título grava os dois (`:1453`). A linha do tempo mostra `(antes → depois)` no meio da frase (`apps/web/src/features/tarefa/timeline.tsx:294`), o que não serve para um texto longo.","fazer":["Em `tasks.ts:1458`, gravar `before` e `after` com a descrição antiga e a nova, cortadas em 2.000 caracteres com “…” no fim.","Em `timeline.tsx`, para a ação “Descrição alterada”, mostrar só “Descrição alterada” e um botão “Ver alteração”, que abre o texto anterior e o novo, um embaixo do outro."],"pronto":"Teste em `operations.test.ts`: editar a descrição de “A” para “B” grava uma Atividade com `before: \"A\"` e `after: \"B\"`; uma descrição de 3.000 caracteres grava 2.000 e “…”. Na tela, “Ver alteração” mostra os dois textos."},{"n":"Calcular o tempo registrado no domínio","cam":["dom","web"],"hoje":"Há duas somas diferentes na tela: `tarefa-completa.tsx:1199` soma `durationMinutes` de todos os lançamentos (o aberto conta 0) e o editor `TaskTime` soma só os fechados (`features/estrutura/collaboration-editors.tsx:199`). Painéis e IA não têm de onde ler.","fazer":["Criar `tempoRegistrado(state, taskId)` em `packages/dominio/src/derive.ts`, devolvendo `{ minutos, lancamentos, emAndamento, minutosComSubtarefas }`: soma os fechados, diz se há cronômetro aberto e soma também as Subtarefas.","`tarefa-completa.tsx:1199` e `collaboration-editors.tsx:199` passam a usar a função."],"pronto":"Teste novo `packages/dominio/src/tempo-registrado.test.ts`: uma Tarefa com lançamentos de 30 e 45 min e um cronômetro aberto devolve 75 min e `emAndamento: true`; com uma Subtarefa de 20 min, `minutosComSubtarefas` é 95. Na tela, a linha “Rastrear tempo” e o editor mostram o mesmo número."}]},{"id":"2.7","n":"Itens relatados nos testes","objetivo":"O que você relatar nos testes da Estrutura entra aqui, um por subtarefa, no mesmo formato das outras.","pronto":"Cada item aprovado por você.","subs":[]}],"ajuste":"+5 dias: a conferência no código achou 42 subtarefas, incluindo mover e reordenar contêineres e as lacunas do modelo. Se a otimização for por tabelas próprias, soma mais 2 a 3 dias."},{"id":"3","n":"Base da mensageria e unificação do CRM","dias":[4,13],"dep":["1"],"desc":"Duas coisas, nesta ordem. Primeiro, acabar com as duas bases do CRM: as telas novas (`/crm/contatos`, `/crm/empresas`, `/crm/negocios`, `/crm/funis`) já leem as tabelas da 007, mas a Caixa de Entrada, a Tarefa conversacional, Meus negócios, Busca, Lixeira, Notificações, Início, Ferramentas, IA, Painel e Contas a receber ainda leem `state.contacts`, `state.conversations`, `state.deals`, `state.funnels` e `state.channels`, guardados em `plataforma.registros`. Depois, construir uma vez só o que os quatro provedores (Sessões 4, 7, 8 e 9) usam: porta de entrada, porta de saída, tempo real e mídia. Esta sessão recebeu da Sessão 5 o trabalho de levar a Tarefa conversacional para as tabelas novas (tarefa 3.3).","partida":["Tabelas `plataforma.canais`, `plataforma.conversas` e `plataforma.mensagens` (008), com as rotas `GET/POST /conversas`, `POST /conversas/:id/resolver`, `POST /conversas/:id/reabrir` e `GET/POST /mensagens`. Nenhuma tela chama as de Conversa e Mensagem: `apps/web/src/dados/crm/` não tem cliente para elas.","Mensagem repetida já é barrada pelo índice `mensagens_id_externo_uq`, em `(workspace_id, canal_id, id_externo)`.","`registrarRecebida` (`apps/api/src/servicos/crm/mensagens.ts:141`) grava a recebida, mas não tem rota, exige uma Conversa já existente, não acha nem cria Contato e não reabre Conversa resolvida.","A janela de 24 h é decidida por (tipo, provedor) em `validarEnvio` (`packages/dominio/src/crm/mensagens.ts:162`) e aplicada por `ServicoDeMensagens.enviar` (`servicos/crm/mensagens.ts:91`). O envio só grava: nada sai do sistema.","Há o molde de fila com `for update skip locked` (`reivindicar`, `apps/api/src/persistencia/outbox-worker.ts:157`) e o upload em duas fases por URL assinada (`apps/api/src/servicos/storage-uploads.ts`), hoje só para Formulário e anexo de Tarefa.","O modelo antigo é lido por cerca de 70 arquivos de `apps/web/src` e 33 de `packages/dominio/src` (sem contar testes). A ponte `apps/api/src/persistencia/canais-projetados.ts` traduz os Canais novos para `state.channels`, em `GET /estado` e em `executar()`."],"pronto":"Uma chamada simulada ao webhook de um Canal cria (ou acha) o Contato em `plataforma.contatos`, abre ou reabre a Conversa em `plataforma.conversas` e aparece na Caixa de Entrada de outra aba em menos de 2 s, com o áudio tocando; a resposta escrita na tela passa pela fila e chega ao provedor de teste; e uma busca por `state.contacts`, `state.conversations`, `state.deals` e `state.channels` em `packages/` e `apps/` não acha nada (salvo o que a decisão sobre Grupos e Flows, na 3.1, deixar para as Sessões 6 e 7).","tarefas":[{"id":"3.1","n":"Decidir o corte e dar ao modelo novo o que falta","objetivo":"As tabelas novas não guardam várias coisas que as telas antigas usam: notas, consentimento, mesclagem, estrela e leitura da Conversa, Conversa de Grupo, vários Contatos por Negócio. Antes de trocar qualquer tela, é preciso decidir o que vem junto e criar as colunas e tabelas numa migração nova.","pronto":"As quatro decisões têm resposta escrita e a migração nova está aplicada em homologação.","subs":[{"n":"Como fazer o corte?","cam":["dec"],"decisao":true,"hoje":"Há duas bases de Contatos, Empresas, Negócios, Funis, Canais e Conversas. Uma Conversa aberta pelo fio da Caixa (`startConversation`, `packages/dominio/src/operations/conversations.ts:694`) ou por “Iniciar conversa” em Meus negócios (`iniciarConversa`, `packages/dominio/src/operations/iniciar-conversa.ts:52`) grava na base antiga; uma aberta por `POST /conversas` grava na nova.","opcoes":["(A) De uma vez: preparar tudo, rodar o script de migração (3.5) em homologação e trocar todas as telas no mesmo deploy","(B) Tela por tela, com as duas bases convivendo"],"muda":"(A) concentra o risco num dia, mas não precisa de ponte nova e acaba logo. (B) exige que cada tela traduza ids antigos e novos enquanto a outra base ainda grava: cerca de +2 dias de pontes que depois são jogadas fora.","recomendo":"(A), primeiro em homologação. A produção nasce sem dados de demonstração (`bootstrap:gestao`), então o que há de real no modelo antigo deve ser pouco; o modo `--seco` do script conta antes.","peso":"produto"},{"n":"O que o modelo novo precisa ganhar antes de o antigo sair?","cam":["dec"],"decisao":true,"hoje":"As fichas novas avisam o que a 007 não guarda (`apps/web/src/features/crm/ficha-de-contato.tsx:11`, `ficha-de-negocio.tsx:8`): Tags, Consentimentos, Comentários, Anexos, mesclagem, temperatura, vários Contatos por Negócio com papel e histórico de Etapas. A Conversa da 008 não tem estrela, leitura, rascunho nem Tags. Tudo isso existe no modelo antigo, e alguma tela usa.","opcoes":["(A) Trazer tudo antes do corte","(B) Trazer só o que a Caixa usa no dia a dia ou que a mensageria exige: notas do Contato, consentimento, mesclagem, transferir Identificador, mover Conversa, atribuir, estrela, leitura e lixeira da Conversa","(C) Não trazer nada: as telas perdem esses recursos"],"muda":"(A) cerca de +4 dias. (B) cerca de +2 dias; Tags, vários Contatos por Negócio, histórico de Etapas, Requisitos de Etapa e Anexos de Empresa e Negócio somem da tela até uma sessão própria. (C) +0, mas a porta de entrada vai criar Contatos duplicados sem jeito de juntá-los.","recomendo":"(B). As subtarefas da 3.2 e a migração abaixo estão escritas para (B).","peso":"produto"},{"n":"Quando a Conversa de Grupo e as Mensagens de Flow saem do modelo antigo?","cam":["dec"],"decisao":true,"hoje":"As Ferramentas acham a Conversa do Grupo por `groupIdentifier` (`conversaDoGrupo`, `packages/dominio/src/derive-ferramentas.ts:145`) e contam envios e respostas de Flow pelas Mensagens antigas (`enviosDoFlow`, `:275`; `respostasDoFlow`, `:287`; `receiveMessage` em `operations/ferramentas/flows.ts:922`). A 008 não aceita Conversa sem Contato (`contato_id not null`) e a Mensagem nova não tem campo de Flow.","opcoes":["(A) Migração nova: `conversas.contato_id` aceita nulo quando há `identificador_de_grupo`, e `mensagens` ganha `flow` e `resposta_de_flow` (jsonb); as Ferramentas passam inteiras para as tabelas","(B) Conversas de Grupo e Mensagens de Flow ficam no modelo antigo até as Sessões 6 e 7, que já refazem essas telas com o provedor real; aqui só os Contatos e Canais das Ferramentas passam para os ids novos"],"muda":"(A) cerca de +1,5 dia aqui, e o modelo antigo sai por inteiro nesta sessão. (B) +0 aqui; um resto de `Conversation` (só Grupo e Flow) vive até a Sessão 7. Com (B), a Sessão 6 decide como guardar a Conversa de Grupo nas tabelas novas (6.6.5) e a leva para lá, e a Sessão 7 faz o mesmo com as Mensagens de Flow.","recomendo":"(B): as Sessões 6 e 7 vão reescrever Grupos e Flows; fazer duas vezes é desperdício.","peso":"arrumacao"},{"n":"Meus negócios continua como Listas espelho?","cam":["dec"],"decisao":true,"hoje":"A Pasta “Meus negócios” tem uma Lista por Funil antigo, achada pelo formato do id (`funilDaLista`: `lst_funil_\u003cx>` ↔ `fnl_\u003cx>`, `operations/iniciar-conversa.ts:30`), e cada Negócio aparece como Tarefa espelho no quadro (`QuadroNegocios`, `apps/web/src/features/estrutura/quadro-negocios.tsx:32`), com a `DealScreen` antiga embutida (`app/(shell)/estrutura/listas/[lista]/page.tsx:1131`). O CRM novo já tem quadro próprio em `/crm/funis/[funil]` (`features/crm/quadro-do-funil.tsx`). Os Funis novos têm id UUID: a regra do formato do id quebra.","opcoes":["(A) Manter as Listas espelho: a Lista ganha o campo `funilId` (id de `plataforma.funis`) e a Tarefa espelho aponta para o Negócio novo","(B) Aposentar as Listas espelho: “Meus negócios” vira o quadro de `/crm/funis/[funil]` com o filtro “meus”, e as Reuniões continuam como Tarefas ligadas ao Negócio novo"],"muda":"(A) cerca de +1 dia e mantém duas telas para o mesmo Negócio. (B) cerca de +0,5 dia e some uma tela; quem trabalha pela Lista muda de lugar.","recomendo":"(B), se a equipe já usa o quadro do Funil novo; (A), se o dia a dia é pela Lista.","peso":"produto"},{"n":"Escrever a migração nova com o que as decisões pedirem","cam":["banco"],"hoje":"A 007 e a 008 estão aplicadas e são imutáveis. `contatos_estado_ck` (007) não aceita `mesclado`; não há tabela de consentimento, de nota, de marcação de Conversa, de fila de entrada nem de de-para de ids.","fazer":["`plataforma.contatos`: colunas `mesclado_em_id text` e `mesclado_em timestamptz`; recriar `contatos_estado_ck` aceitando `mesclado`.","`plataforma.contato_consentimentos` (só inserção): `contato_id`, `finalidade_id` (o item de Catálogo `finalidadeConsentimento`), `tipo_de_canal` (`whatsapp`, `instagram`, `email` ou `todos`), `decisao` (`concedido` ou `revogado`), `em`, `origem`, `evidencia_mensagem_id`, `registrado_por`, `registrado_em`.","`plataforma.contato_notas`: `contato_id`, `conteudo`, `autor_id`, `criado_em`.","`plataforma.conversa_marcacoes`: chave `(workspace_id, conversa_id, membro_id)`, com `estrela boolean` e `lida_ate timestamptz`. Estrela e leitura são por Membro, como o `starredBy` antigo.","`plataforma.webhooks_recebidos` (fila de entrada, ver 3.6) e o índice único do evento `mensagem.enviar.v1` em `plataforma.integration_outbox` (ver 3.7).","`plataforma.crm_de_para` (`workspace_id`, `colecao_antiga`, `id_antigo`, `tabela_nova`, `id_novo`, `migrado_em`; chave `(workspace_id, colecao_antiga, id_antigo)`) e `plataforma.registros_crm_antigo` (cópia de segurança das linhas antigas, mesmo formato de `registros`), para o script da 3.5."],"pronto":"`npm run migrar -w @n1/api -- --seco` lista só a migração nova em homologação; depois de aplicada, um teste em `apps/api/src/persistencia/` prova que `contatos_estado_ck` aceita `mesclado` e que `contato_consentimentos` recusa `decisao = 'talvez'`.","nota":"Se a decisão sobre Grupos e Flows for (A), entram aqui também `conversas.identificador_de_grupo` e `mensagens.flow` / `mensagens.resposta_de_flow`."}]},{"id":"3.2","n":"Levar ao modelo novo as operações que só existem no antigo","objetivo":"Mesclar Contatos, transferir um Identificador, mover uma Conversa, registrar consentimento e os gestos da Caixa (atribuir, estrela, lixeira) só existem sobre `state.contacts` e `state.conversations`. Sem eles no modelo novo, a porta de entrada cria duplicados que ninguém junta e a Caixa perde gestos que usa hoje.","pronto":"Cada operação tem a regra em `packages/dominio/src/crm/`, a rota no `apps/api` e teste de serviço contra o Postgres real.","subs":[{"n":"Criar o caminho para gestos que gravam nas tabelas do CRM e em `plataforma.registros` no mesmo commit","cam":["api"],"hoje":"As rotas do CRM gravam por `comTransacao` (`apps/api/src/servicos/crm/transacao.ts`) e as operações do Espaço por `executar()` (`apps/api/src/persistencia/unidade-de-trabalho.ts:116`): são duas transações. Mesclar Contatos (que move Vínculos de Tarefa) e criar Tarefa conversacional (Tarefa em `registros`, Conversa em `plataforma.conversas`) precisam das duas juntas.","fazer":["Criar `apps/api/src/servicos/crm/gesto-misto.ts` com `executarGestoMisto(workspaceId, { lerDoCrm, operacao, gravarNoCrm })`.","`lerDoCrm(cliente)` roda logo depois de `hidratar()`, no mesmo `PoolClient`, e o que devolve chega à `operacao` pura (Contato, Canal, Conversa já conferidos). Para isso `executar()` ganha a opção `lerDoCrm`.","`gravarNoCrm(cliente, valor)` roda pela opção `aoConfirmar` que já existe (`unidade-de-trabalho.ts:74`): mesmo cliente, antes do `commit`.","Os ids das linhas novas do CRM são gerados antes (`randomUUID`), para a operação pura já gravar o Vínculo com o id certo.","Erro em `gravarNoCrm` desfaz tudo; um `23505` (unicidade) vira 409 com a frase do domínio."],"pronto":"Teste em `apps/api/src/servicos/crm/gesto-misto.test.ts`: forçar erro em `gravarNoCrm` deixa `plataforma.registros` e `plataforma.conversas` sem nenhuma linha nova."},{"n":"Mesclar Contatos no modelo novo","cam":["dom","api","web"],"hoje":"`mergeContacts` (`packages/dominio/src/operations/contacts.ts:143`) mexe só em `state.contacts` e nos Vínculos. O diálogo `apps/web/src/features/crm/merge-contacts-dialog.tsx` só abre na ficha antiga (`features/crm/legado/ficha-de-contato-legado.tsx:171`).","fazer":["Domínio: `validarMesclagem(sobrevivente, absorvido)` em `packages/dominio/src/crm/contatos.ts`: os dois diferentes, `ativo` ou `arquivado`, nenhum `mesclado`. Com teste das recusas.","API: rota `POST /contatos/:id/mesclar` com `{ absorvidoId }`, por `executarGestoMisto`. Nas tabelas: passa ao sobrevivente os Identificadores, as Conversas (resolvendo antes a do absorvido que colidir em `conversas_nao_resolvida_uq`), os Negócios (`negocios.contato_id`) e os vínculos com Empresa; marca o absorvido `mesclado` com `mesclado_em_id`. Em `registros`: troca o `toId` dos Vínculos de Tarefa do absorvido para o sobrevivente.","`GET /contatos/:id` de um `mesclado` devolve `mescladoEmId`, e `app/(shell)/crm/contatos/[contato]/page.tsx` redireciona para o sobrevivente.","Web: ação “Mesclar com…” em `features/crm/ficha-de-contato.tsx`, reaproveitando `merge-contacts-dialog.tsx` com o seletor de Contato de `dados/crm/contatos.ts` (`useContatos`)."],"pronto":"Mesclar A em B pela ficha: as Conversas e Negócios de A aparecem em B, a Tarefa conversacional de A mostra B e abrir `/crm/contatos/\u003cA>` leva a B. Um teste de serviço cobre a colisão de Conversa aberta no mesmo Canal.","nota":"“Restaurar cópia” de um mesclado (`restoreMergedCopy`, `contacts.ts:403`) e “marcar como distintos” (`markContactsAsDistinct`, `:713`) não são trazidos: só a ficha antiga os oferece."},{"n":"Transferir um Identificador para outro Contato","cam":["dom","api","web"],"hoje":"`transferContactIdentifier` (`packages/dominio/src/operations/contacts.ts:93`) muda só quem recebe as próximas mensagens (DO-CON-12): as Conversas passadas ficam no Contato de origem. Só a ficha antiga oferece (`features/crm/transfer-identifier-dialog.tsx`).","fazer":["Rota `POST /contatos/:id/identificadores/:identificadorId/transferir` com `{ paraContatoId }` em `apps/api/src/rotas/crm/contatos.ts`, chamando o método novo `transferirIdentificador` de `servicos/crm/contatos.ts`.","Troca `contato_identificadores.contato_id`; o Identificador só chega como principal se o destino não tiver um principal do mesmo tipo (`rebaixarPrincipal` já existe no repositório).","Recusa destino `mesclado` ou na lixeira, com a frase em `packages/dominio/src/crm/contatos.ts`.","Na ficha nova, ação “Transferir” na linha do Identificador, reaproveitando o diálogo."],"pronto":"Teste de serviço: depois de transferir o WhatsApp de A para B, uma recebida desse número (3.6) cai numa Conversa de B, e a Conversa antiga continua em A."},{"n":"Registrar e respeitar consentimento","cam":["dom","api","web"],"hoje":"O consentimento é uma lista no Contato antigo (`ConsentRecord`, `packages/dominio/src/types/crm.ts:59`), lida por `marketingConsentMissing` (`packages/dominio/src/derive.ts:443`), que `sendMessage` e o fio (`features/crm/conversation-thread.tsx:352`) usam para barrar modelo de marketing. Não existe operação que registre consentimento: só o seed preenche.","fazer":["Domínio: `consentimentoVigente(registros, finalidadeId, tipoDeCanal)` em `packages/dominio/src/crm/consentimentos.ts` (novo), com a mesma conta de `marketingConsentMissing`: vale o registro mais recente da finalidade para o tipo do Canal ou para `todos`.","API: `GET` e `POST /contatos/:id/consentimentos` sobre `plataforma.contato_consentimentos`. Revogar é inserir um registro `revogado`; nada é apagado.","`ServicoDeMensagens.enviar` (`servicos/crm/mensagens.ts:91`) recusa com 409 `SEM_CONSENTIMENTO` quando o modelo usado é de marketing e não há consentimento vigente. Os modelos chegam na Sessão 7; a regra já fica pronta e testada.","Web: seção “Consentimentos” na ficha nova, com o histórico e o botão de registrar."],"pronto":"Teste de domínio dos casos concedido, revogado depois e “todos”; registrar pela ficha grava uma linha em `plataforma.contato_consentimentos`."},{"n":"Mover uma Conversa para outro Contato","cam":["api","web"],"hoje":"`moveConversationToContact` (`packages/dominio/src/operations/conversations.ts:495`) troca o Contato e recusa se o destino já tem Conversa não resolvida no mesmo Canal, a menos que ela seja resolvida no mesmo ato. A tela é `features/crm/move-conversation-dialog.tsx`, aberta em `app/(shell)/crm/caixa-de-entrada/[conversa]/page.tsx:360`.","fazer":["Rota `POST /conversas/:id/mover` com `{ contatoId, resolverExistente }` em `apps/api/src/rotas/crm/conversas.ts`.","No serviço, numa transação: destino `ativo`; se ele tem Conversa aberta no mesmo Canal, resolvê-la quando `resolverExistente`, senão 409 `CONVERSA_JA_ABERTA`; trocar `conversas.contato_id`. As Mensagens e o Canal não mudam (INV-CXE-04).","O diálogo passa a chamar a rota."],"pronto":"Testes de serviço dos dois caminhos, com e sem Conversa aberta no destino."},{"n":"Dar à Conversa nova os gestos da Caixa que faltam","cam":["api"],"hoje":"Para a Conversa da 008 só há abrir, resolver e reabrir. A Caixa antiga também atribui (`assignConversation`, `[conversa]/page.tsx:157`), manda para a lixeira (`trashConversation`, `:391`), restaura (`restoreConversation`, `app/(shell)/configuracoes/lixeira/page.tsx:189`) e marca estrela (`toggleConversationStar`, `features/crm/inbox-columns.tsx:420`).","fazer":["Rotas em `apps/api/src/rotas/crm/conversas.ts`: `POST /conversas/:id/atribuir` com `{ tipo: 'membro' | 'agente', id }` ou `null`; `POST /conversas/:id/lixeira` (só Conversa resolvida, `conversas_lixeira_ck`); `POST /conversas/:id/restaurar`; `PUT /conversas/:id/marcacao` com `{ estrela?, lidaAte? }`, gravando em `conversa_marcacoes` do Membro da sessão.","`GET /conversas` ganha os filtros `atribuidoId`, `filaId`, `comEstrela` e `q` (título), e cada item traz `naoLidas` (recebidas depois de `lida_ate`) e o nome do Contato."],"pronto":"Testes de rota de cada gesto; uma Conversa na lixeira não aparece em `GET /conversas?estado=ativo`.","nota":"Rascunhos (`Draft`, inclusive os que um Agente sugere, e `discardDraft` em `conversation-thread.tsx:482`) ficam para a Sessão 16, que define o Agente na Caixa."},{"n":"Guardar as notas do Contato nas tabelas","cam":["api","web"],"hoje":"`addContactNote` (`packages/dominio/src/operations/contacts.ts:761`) é chamado pelo fio (`features/crm/conversation-thread.tsx:768`) e pela Reunião (`app/(shell)/crm/reunioes/[reuniao]/page.tsx:738`) e grava no Contato antigo.","fazer":["Rotas `GET` e `POST /contatos/:id/notas` sobre `plataforma.contato_notas`.","O fio e a Reunião passam a chamar `POST /contatos/:id/notas`; a ficha nova mostra as notas."],"pronto":"Uma nota escrita no fio aparece na ficha nova do Contato e grava uma linha em `plataforma.contato_notas`."},{"n":"Passar ao sucessor o que o Membro removido tem nas tabelas","cam":["api","web"],"hoje":"`previewSuccession` (`packages/dominio/src/operations/members.ts:23`) e `removeMember` (`:217`) passam ao sucessor os Contatos, Empresas, Negócios e Conversas ANTIGOS. Nas tabelas, `proprietario_id` e `atribuido_id` continuam apontando para quem saiu.","fazer":["Em `apps/api/src/rotas/operacoes.ts`, a chamada de `removeMember` passa um `aoConfirmar` que, no mesmo cliente, troca `proprietario_id` em `contatos`, `empresas` e `negocios` e `atribuido_id` nas `conversas` abertas para o sucessor.","Rota `GET /membros/:id/sucessao-no-crm` com as contagens; o diálogo de `app/(shell)/configuracoes/membros/page.tsx:95` mostra esses números no lugar dos de `previewSuccession`."],"pronto":"Teste de rota: remover um Membro dono de 2 Contatos e 1 Negócio deixa os três com o sucessor em `plataforma.contatos` e `plataforma.negocios`."}]},{"id":"3.3","n":"Levar a Tarefa conversacional para as tabelas novas","objetivo":"A Tarefa conversacional cria a Conversa na base antiga e lê Contato, Canal, Conversa e Negócio de `state.*`. Aqui ela passa a abrir a Conversa em `plataforma.conversas` e a ler tudo pela api. Este trabalho estava na Sessão 5 (5.1) e na 3.1 antiga, duplicado.","pronto":"Criar, trocar o Canal e ligar ou criar o Negócio de uma Tarefa conversacional não grava nada em `registros` nas coleções `conversations` e `deals`, e o cartão da Lista mostra Contato, Canal e última Mensagem vindos da api.","subs":[{"n":"A Conversa da Tarefa pode nascer sem Mensagem?","cam":["dec"],"decisao":true,"hoje":"`criarTarefaConversacional` abre a Conversa com `startConversation`, que cria uma Conversa vazia ou reaproveita a aberta. O serviço novo (`criar`, `apps/api/src/servicos/crm/conversas.ts:158`) exige a primeira Mensagem (INV-CXE-05) e recusa com 409 `CONVERSA_JA_ABERTA` se já existe uma aberta no par (Contato, Canal).","opcoes":["(A) O diálogo pede a primeira Mensagem quando não há Conversa aberta; havendo, reaproveita sem mensagem nova","(B) Abrir Conversa vazia só por este caminho, como exceção a INV-CXE-05"],"muda":"(A) mantém a regra da 008 e acrescenta um campo ao diálogo; no WhatsApp oficial, fora da janela, essa primeira Mensagem terá de ser modelo (Sessão 7). (B) não muda o diálogo, mas põe Conversas mudas na Caixa.","recomendo":"(A).","peso":"produto"},{"n":"Trocar as leituras da Tarefa conversacional por ids","cam":["dom"],"hoje":"`contatoDaTarefa` (`packages/dominio/src/derive-conversacional.ts:70`), `conversaDaTarefa` (`:83`), `canalDaTarefa` (`:94`), `negocioDaTarefa` (`:105`) e `ultimaMensagemDaTarefa` (`:120`) seguem o Vínculo e buscam o registro em `state.contacts`, `state.conversations`, `state.channels` e `state.deals`. `vinculoRefusal` (`operations/tasks.ts:70`) confere os alvos de Vínculo nessas mesmas coleções.","fazer":["Criar `vinculosDoCrmDaTarefa(state, task)` → `{ contatoId?, conversaId?, negocioId? }`, que só lê `state.links`, com as mesmas regras de hoje (Subtarefa lê a raiz; o papel “… da Tarefa” vem primeiro).","Apagar `contatoAlcancado` (`:54`): quem resolve um `mesclado` passa a ser a api.","`canaisDaLista` (`:166`) e `canaisDaListaQueAlcancam` (`:175`) passam a receber `canais: readonly Canal[]` (tipo de `crm/canais.ts`) em vez de ler `state.channels`.","`VinculoDeNascimento` (`operations/tasks.ts:61`) ganha `alvoConferido: true`, preenchido por quem já conferiu o alvo na tabela; `vinculoRefusal` deixa de procurar em `state.contacts`, `state.conversations` e `state.deals`."],"pronto":"`packages/dominio/src/derive-conversacional.test.ts`, reescrito, passa com um estado de teste sem `contacts`, `conversations`, `channels` e `deals`."},{"n":"Criar a leitura em lote das Tarefas conversacionais","cam":["api","web"],"hoje":"O cartão (`apps/web/src/features/estrutura/cartao-conversacional.tsx:42-45`), a tabela (`tabela-de-tarefas.tsx:290`), o cartão de Reunião (`cartao-de-tarefa.tsx:53`) e a ficha (`tarefa-completa.tsx:336-339`) montam Contato, Canal, Negócio e última Mensagem a partir do `DataState` em memória.","fazer":["Rota `POST /tarefas-conversacionais/resumo` em `apps/api/src/rotas/crm/tarefas-conversacionais.ts` (novo), recebendo `{ vinculos: [{ taskId, contatoId?, conversaId?, negocioId? }] }` (até 200).","Devolve por Tarefa: o nome do Contato (seguindo `mesclado_em_id`), o Canal (nome, tipo, provedor, conexão), a última Mensagem não interna (trecho, direção, `criadoEm`) e o Negócio (título, Etapa). Confere o Papel e ignora ids de outro Espaço.","Web: `apps/web/src/dados/crm/tarefas-conversacionais.ts` com `useResumoDasTarefas(tarefas)` (SWR), usado pelo cartão, pela tabela, pelo cartão de Reunião e pela ficha.","A página da Lista (`app/(shell)/estrutura/listas/[lista]/page.tsx:496`) conta Contatos distintos pelos ids dos Vínculos, sem chamar a api."],"pronto":"Abrir uma Lista conversacional com 50 Tarefas faz uma chamada só ao resumo; um teste de rota prova que um id de outro Espaço volta vazio."},{"n":"Trocar a criação da Tarefa conversacional para as tabelas novas","cam":["dom","api","web"],"hoje":"`criarTarefaConversacional` (`packages/dominio/src/operations/tarefas-conversacionais.ts:154`) procura o Contato em `state.contacts` e o Canal em `state.channels`, abre a Conversa com `startConversation` (grava em `plataforma.registros`) e cria a Tarefa com Vínculos para esses ids antigos. É chamada pelo diálogo da Lista (`features/estrutura/nova-tarefa-conversacional-dialog.tsx:134`) e pelo fio da Caixa (`features/crm/conversation-thread.tsx:834`).","fazer":["Extrair de `criar` (`servicos/crm/conversas.ts:158`) a função `abrirConversaNoCliente(cliente, membro, entrada, id?)`, usada por `POST /conversas` e pela rota nova.","Criar `POST /tarefas-conversacionais` em `rotas/crm/tarefas-conversacionais.ts`, por `executarGestoMisto`: `lerDoCrm` confere o Contato em `plataforma.contatos`, o Canal em `plataforma.canais` e a Conversa aberta do par (`abertaDoPar`, `repositorios/crm/conversas.ts:138`); a operação pura cria a Tarefa com Vínculos para os ids novos; `gravarNoCrm` abre a Conversa (com a primeira Mensagem, conforme a decisão) quando não havia uma aberta.","No domínio, `criarTarefaConversacional(state, membro, input, referencias)` recebe `{ contato: { id, nome }, canal: { id, nome, conexao }, conversaId, negocio? }` e deixa de chamar `startConversation`.","O diálogo e o botão do fio passam a chamar a rota; o seletor de Contato usa `useContatos` e o de Canal usa `useCanais` (`dados/crm/canais.ts`)."],"pronto":"Criar uma Tarefa pela Lista grava uma linha em `plataforma.conversas` e nenhuma Conversa nova em `plataforma.registros`; um teste em `apps/api` prova isso, e outro prova que uma recusa da Tarefa não deixa Conversa nova."},{"n":"Trocar o Canal da Tarefa pela api","cam":["dom","api","web"],"hoje":"`trocarCanalDaTarefa` (`operations/tarefas-conversacionais.ts:255`) abre a Conversa no Canal novo com `startConversation` e troca o Vínculo. A ficha chama em `features/estrutura/tarefa-completa.tsx:1288`.","fazer":["Rota `POST /tarefas-conversacionais/:taskId/canal` com `{ canalId, mensagem? }`, por `executarGestoMisto`: reaproveita a Conversa aberta do Contato no Canal novo ou abre uma; a operação pura só troca o Vínculo “conversa da Tarefa”.","A Conversa anterior continua na Caixa, sem mudança."],"pronto":"Trocar de WhatsApp para E-mail na ficha deixa a Conversa antiga na Caixa e o Vínculo apontando para uma Conversa de `plataforma.conversas`; teste de rota."},{"n":"Ligar e criar o Negócio da Tarefa pela api","cam":["dom","api","web"],"hoje":"`vincularNegocioATarefa` (`operations/tarefas-conversacionais.ts:306`) confere o Negócio em `state.deals` pelos `contactLinks` (`negocioDoContato`, `:148`); `criarNegocioDaTarefa` (`:362`) cria pelo `createDeal` antigo. A ficha chama em `tarefa-completa.tsx:728` e `:1398`.","fazer":["Rota `POST /tarefas-conversacionais/:taskId/negocio` com `{ negocioId }` ou `null`: a api confere em `plataforma.negocios` que o Negócio está `ativo` e que `contato_id` é o Contato da Tarefa (a 007 tem um Contato só por Negócio, `negocios_dono_ck`); o domínio troca o Vínculo.","Rota `POST /tarefas-conversacionais/:taskId/negocio/novo` com `{ funilId, titulo?, valor? }`: cria o Negócio na 1ª Etapa pelo mesmo código de `servicos/crm/negocios.ts` e grava o Vínculo, por `executarGestoMisto`.","O seletor de Negócio da ficha usa `useNegocios({ contatoId })` (`dados/crm/negocios.ts`)."],"pronto":"Criar Negócio pela ficha grava uma linha em `plataforma.negocios` e o Vínculo “Negócio da Tarefa” com esse id; se o Vínculo for recusado, o Negócio não fica (teste).","nota":"Um Negócio cujo dono é a Empresa do Contato não aparece para ligar. Se isso fizer falta, é decisão à parte."},{"n":"Conferir os Canais da Lista conversacional na tabela","cam":["dom","api","web"],"hoje":"`definirCanaisDaLista` (`operations/tarefas-conversacionais.ts:102`) chama `validarCanaisDeAtendimento` (`operations/canais.ts:133`), que procura os ids em `state.channels`; só funciona porque `executar()` projeta os Canais novos (`unidade-de-trabalho.ts:137`). O mesmo vale para `canalForaDaLista` (`canais.ts:150`) e `nomesDosCanais` (`operations/structure.ts:406`). A tela é `features/estrutura/canais-de-atendimento.tsx`.","fazer":["As três funções passam a receber `canais: readonly Canal[]`.","Em `apps/api/src/rotas/operacoes.ts`, as operações que precisam de Canal (`definirCanaisDaLista` e a criação de Lista conversacional) usam a opção `lerDoCrm` de `executar()` para ler `plataforma.canais` (`todos`, `repositorios/crm/canais.ts:268`) dentro da transação; o que vier do navegador nesse argumento é descartado.","Na execução local da tela, os Canais vêm de `useCanais`."],"pronto":"Com `canais-projetados.ts` desligado, marcar um Canal novo na Lista funciona e um id inexistente é recusado; teste em `apps/api/src/rotas/operacoes.test.ts`."}]},{"id":"3.4","n":"Trocar as telas para o modelo novo","objetivo":"Cerca de 70 arquivos da tela leem o modelo antigo. Cada grupo abaixo diz quais arquivos mudam e para que rota. Com a decisão (A) da 3.1, todos entram no mesmo deploy.","pronto":"Nenhum arquivo de `apps/web/src` lê `contacts`, `companies`, `deals`, `funnels`, `channels` ou `conversations` do store (salvo Grupos e Flows, se a decisão for (B)).","subs":[{"n":"Caixa de Entrada: lista e gestos da Conversa","cam":["web"],"hoje":"`app/(shell)/crm/caixa-de-entrada/page.tsx:22` filtra `data.conversations`; `features/crm/inbox-columns.tsx` monta as colunas e a estrela (`:420`); `[conversa]/page.tsx` atribui (`:157`), reabre (`:321`), resolve (`:332`), manda para a lixeira (`:391`) e move (`:360`) com operações antigas.","fazer":["Criar `apps/web/src/dados/crm/conversas.ts`, no molde de `dados/crm/contatos.ts`: `useConversas(filtro)`, `useConversa(id)`, `abrirConversa`, `resolverConversa`, `reabrirConversa`, `atribuirConversa`, `moverConversa`, `marcarConversa`, `conversaParaLixeira` e `restaurarConversa`.","A lista e as colunas leem `useConversas`; a página da Conversa lê `useConversa`, e cada botão chama a função correspondente."],"pronto":"Responder, resolver, reabrir, atribuir, mover e marcar estrela pela Caixa não muda `select count(*) from plataforma.registros where colecao = 'conversations'`; testes em `inbox-columns.test.tsx` com o cliente da api falso."},{"n":"Caixa de Entrada: fio e envio","cam":["web","dom"],"hoje":"`features/crm/conversation-thread.tsx` abre Conversa com `startConversation` (`:371`, `:389`), envia com `sendMessage` (`:424`), descarta rascunho (`:482`), grava nota (`:768`), cria Tarefa (`:834`) e confere consentimento (`:352`), tudo no modelo antigo. As abas por Canal vêm de `canaisDoFio` (`derive-conversacional.ts:218`), que lê `state.channels`.","fazer":["Criar `apps/web/src/dados/crm/mensagens.ts` com `useMensagens(conversaId)` (`GET /mensagens?conversaId=`) e `enviarMensagem` (`POST /mensagens`).","Abrir Conversa pelo fio passa a ser `abrirConversa` com a primeira Mensagem; nota vai para `POST /contatos/:id/notas`; “Criar Tarefa” vai para `POST /tarefas-conversacionais`; consentimento usa `consentimentoVigente`.","`canaisDoFio`, `canaisDeResposta` e `canalPadraoDeResposta` (`derive-conversacional.ts:271`) passam a receber os Canais de `useCanais` e os Identificadores do `ContatoDetalhado`.","O descarte de rascunho sai do fio até a Sessão 16."],"pronto":"Responder no fio grava uma linha em `plataforma.mensagens`; `conversation-thread.test.tsx` passa com o cliente da api falso e sem `conversations` no store."},{"n":"Caixa de Entrada: configurações, Filas e Canais","cam":["web"],"hoje":"`crm/caixa-de-entrada/configuracoes/page.tsx:145` conta Conversas antigas; `configuracoes/filas/[fila]/page.tsx` (`:43` a `:172`) lista Conversas e Contatos antigos da Fila; `configuracoes/canais/[canal]/page.tsx:127` salva com `configurarCanal` antigo; o popup legado das Listas (`features/crm/adicionar-canal-dialog.tsx:95`) cria Canal `conectada` em `registros` com `criarCanal` antigo.","fazer":["As contagens e a lista da Fila usam `GET /conversas?filaId=`.","A ficha do Canal salva por `PATCH /canais/:id`.","O popup legado passa a usar `criarCanal` de `dados/crm/canais.ts:76` (nasce `desconectada`, como a página de conexão) ou leva o usuário para `/crm/caixa-de-entrada/configuracoes/canais/conectar`.","Filas (`Queue`) e a Caixa (`Inbox`, com `reopenWindowHours`) continuam em `plataforma.registros`: são configuração, e a 008 guarda só o id da Fila (`fila_id`)."],"pronto":"Criar um Canal pelo popup das Listas grava em `plataforma.canais` e nada em `registros` na coleção `channels`."},{"n":"Fichas de Contato, Empresa e Negócio só no modelo novo","cam":["web"],"hoje":"Quando a api devolve 404, a página abre a ficha antiga: `crm/contatos/[contato]/page.tsx:27-30` (`FichaDeContatoLegado`), `crm/empresas/[empresa]/page.tsx:30` (`FichaDeEmpresaLegado`) e `crm/negocios/[negocio]/page.tsx:27-31` (`DealScreen`, que move, ganha, perde e reabre com operações antigas em `deal-screen.tsx:274-325`). `contact-card.tsx:176` grava a qualificação com `setContactCatalogValue`.","fazer":["Tirar o caminho de reserva das três páginas: 404 mostra “não encontrado”.","Apagar `features/crm/legado/ficha-de-contato-legado.tsx`, `legado/ficha-de-empresa-legado.tsx`, `deal-screen.tsx`, `restore-copy-dialog.tsx` e `import-contacts-dialog.tsx` (este último não é montado em lugar nenhum).","`contact-card.tsx` grava a qualificação por `PATCH /contatos/:id` com `{ qualificacao }`."],"pronto":"Abrir `/crm/contatos/\u003cid antigo>` mostra “Contato não encontrado.”; os arquivos apagados não existem e `npm run check -w @n1/web` passa."},{"n":"Meus negócios e Reuniões","cam":["web","dom"],"hoje":"`estrutura/listas/[lista]/page.tsx` monta `QuadroNegocios` (`:949`), `IniciarConversaDialog` (`:1089`) e a `DealScreen` embutida (`:1131`); `quadro-negocios.tsx` usa `DealCard` e `dealOfTask` (`:32`); `crm/reunioes/[reuniao]/page.tsx` lê `state.deals`, `contacts`, `companies` e `funnels` (`:138` a `:215`). `iniciarConversa` cria Negócio, Tarefa espelho e Conversa no modelo antigo.","fazer":["Com (B) da decisão de Meus negócios: tirar a Pasta “Meus negócios” do seed e da navegação, apagar `QuadroNegocios`, `deal-card.tsx`, `iniciar-conversa-dialog.tsx` e `operations/iniciar-conversa.ts`, e pôr o filtro “meus” (`proprietario_id` = Membro da sessão) no quadro de `/crm/funis/[funil]`.","Com (A): a Lista ganha `funilId`; `funilDaLista` lê esse campo; o quadro lê `useNegocios({ funilId })`; `iniciarConversa` vira rota `POST /negocios/iniciar-conversa` por `executarGestoMisto` (Negócio e Conversa nas tabelas, Tarefa espelho em `registros`).","Nos dois casos, a Reunião lê Negócio, Contato e Empresa pela api (`useNegocio`, `useContato`) a partir do Vínculo."],"pronto":"Abrir uma Reunião mostra o Negócio de `plataforma.negocios`; com (B), `/crm/meus-negocios` não existe mais; com (A), mover um cartão no quadro da Lista chama `POST /negocios/:id/mover`."},{"n":"Busca, Lixeira e Notificações","cam":["web","api"],"hoje":"`app/(shell)/buscar/page.tsx:112-153` procura em `state.contacts`, `companies`, `deals` e `conversations`; `configuracoes/lixeira/page.tsx:101-134` lista os antigos na lixeira e restaura com `restoreContact` (`:186`) e `restoreConversation` (`:189`); `notificacoes/page.tsx:139-144` mostra “Conversas atribuídas a você” das antigas.","fazer":["Busca: `GET /contatos?q=`, `GET /empresas?q=` e `GET /negocios?q=` (já aceitam `q`) e `GET /conversas?q=` (novo, da 3.2).","Lixeira: a mesma lista com `estado=na_lixeira` em cada rota; restaurar por `POST /contatos/:id/restaurar`, `/empresas/:id/restaurar`, `/negocios/:id/restaurar` e `/conversas/:id/restaurar`.","Notificações: `GET /conversas?atribuidoId=\u003cMembro>&situacao=aberta`."],"pronto":"Buscar o nome de um Contato criado pela ficha nova o encontra; um Contato enviado à lixeira pela ficha nova aparece na Lixeira e volta ao restaurar."},{"n":"Início, Configurações e Painel","cam":["web","dom"],"hoje":"Início: `derive-resumo.ts:70`, `:134` e `:448`, `features/inicio/panorama-do-robo.ts:25-37` e `resumo-do-inicio.tsx:502` e `:561` leem Conversas e Contatos antigos. Configurações: `configuracoes/campos/page.tsx:102-107`, `tags/page.tsx:68-71` e `catalogos/page.tsx:54-55` contam uso nos registros antigos; `configuracoes/page.tsx:110` mostra `workspace.defaultFunnelId` (Funil antigo); `features/configuracoes/governance-access-dialog.tsx:221` concede acesso a Funil antigo. Painel: `widgetReading` (`derive.ts:744-760`) lê `state.deals`, `conversations` e `contacts`.","fazer":["As funções de `derive-resumo.ts` e `widgetReading` passam a receber as linhas como argumento (`conversas`, `contatos`, `negocios`); a tela as busca com `useConversas`, `useContatos` e `useNegocios`.","As páginas de Campos, Tags e Catálogos deixam de contar uso no CRM: a 007 não usa essas definições (os Campos adicionais do CRM são chaves livres).","O Funil padrão vem de `useFunis` (`plataforma.funis.padrao`); `defaultFunnelId` sai do `Workspace`.","O diálogo de acesso deixa de oferecer Funil: o Funil novo é governado por `privado` e pelo Papel (`podeNoCrm`)."],"pronto":"Início, Configurações e os Painéis de demonstração abrem sem `deals`, `contacts` e `conversations` no store, com os números vindos da api.","nota":"Para o Painel, isto é uma ponte para ele não quebrar quando o CRM antigo sair. A Sessão 20 (tarefa 20.3) troca a ponte pela leitura no servidor."},{"n":"Ferramentas: Contatos e Canais pelos ids novos","cam":["dom","web","api"],"hoje":"As operações de `packages/dominio/src/operations/ferramentas/` (`grupos.ts:110`, `:139`, `:256`, `:278`, `:296`, `participacoes.ts`, `comunidades.ts`, `permissoes.ts`, `provedor-simulado.ts`) acham Canal e Contatos dos Participantes em `state.channels` e `state.contacts`; `contatosComWhatsApp` (`derive-ferramentas.ts:318`) filtra `identidadeDeWhatsApp`. As telas em `apps/web/src/features/ferramentas/` (abas, popups, `criar-grupo-dialog.tsx`, `importar-grupos-dialog.tsx`, `participacoes.tsx`, `pedidos-de-entrada.tsx`) seguem o mesmo caminho.","fazer":["As operações recebem `canais` e `contatos` já conferidos, pela opção `lerDoCrm` em `rotas/operacoes.ts` (como na 3.3).","`Grupo.canalId` e o Contato da Participação passam a guardar ids de `plataforma.canais` e `plataforma.contatos` (o script da 3.5 reescreve os existentes).","`contatosComWhatsApp` vira `GET /contatos?comIdentificador=whatsapp` (filtro novo).","Com (B) da decisão de Grupos e Flows, `conversaDoGrupo`, `enviosDoFlow`, `respostasDoFlow` e `receiveMessage` de `flows.ts:922` continuam no `Conversation` antigo, isolado num arquivo `types/conversa-de-grupo.ts`, até as Sessões 6 e 7."],"pronto":"Criar um Grupo com dois Contatos da ficha nova grava as Participações com os ids de `plataforma.contatos`; os testes de `operations/ferramentas/` passam sem `state.contacts`."},{"n":"IA: alvos, escopos e âncoras pelos ids novos","cam":["dom","web"],"hoje":"`operations/ai.ts:989-997` e `operations/ia/agentes.ts:371-377` dão nome ao alvo (Negócio, Contato, Empresa, Conversa) pelo modelo antigo; `ia/agentes.ts:144` percorre `state.conversations`; `derive-ia.ts:309` confere Automação com escopo Funil em `state.funnels`. Na tela: `features/ia/ancora-do-chat.tsx:44-50`, `agentes/agente-completo.tsx`, `agentes/ensaiar-dialog.tsx`, `automacoes/automacao-spec.ts:455`, `editor-de-automacao.tsx` e `nova-automacao-dialog.tsx`.","fazer":["O nome do alvo vem de uma rota em lote `POST /crm/nomes` com `{ alvos: [{ tipo, id }] }` (até 200), que a tela chama.","O escopo Funil das Automações e Agentes guarda o id de `plataforma.funis`; `derive-ia.ts` recebe a lista de Funis ativos como argumento.","A âncora do Chat em Negócio, Contato ou Conversa usa `useNegocio`, `useContato` e `useConversa`; o Canal das Automações vem de `useCanais`."],"pronto":"Ancorar um Chat num Negócio novo mostra o título certo; os testes de `operations/ia/` passam sem `deals`, `contacts` e `conversations` no estado."},{"n":"Contas a receber: o cliente pelas tabelas","cam":["dom","api","web"],"hoje":"O cliente da conta a receber é um Contato ou Empresa antigo: `clienteDe` (`packages/dominio/src/operations/financeiro.ts:1747`) e `createReceivableSeries` (`:1808`) leem `state.contacts`; `features/estrutura/financeiro/serie-dialog.tsx:78` e `lens.ts:176` mostram o nome; a importação do ClickUp monta o catálogo de clientes de `state.contacts` e `state.companies` (`apps/api/src/importacao/clickup/importar-contas-a-receber.ts:62`; `operations/importacao-contas-a-receber.ts:173`).","fazer":["`clienteDe` devolve só `{ tipo: 'contact' | 'company', id }` do Vínculo “cliente”; o nome vem de `POST /crm/nomes`.","`createReceivableSeries` recebe o cliente conferido pela opção `lerDoCrm` em `rotas/operacoes.ts` (Contato `ativo` em `plataforma.contatos`).","`construirCatalogoDeClientes` lê `plataforma.contatos` e `plataforma.empresas` com `estado = 'ativo'`.","O seletor de cliente do `serie-dialog.tsx` usa `useContatos`."],"pronto":"Criar uma série de contas para um Contato da ficha nova grava o Vínculo “cliente” com o id de `plataforma.contatos`; `contas-a-receber.test.ts` da importação passa lendo as tabelas."}]},{"id":"3.5","n":"Migrar os dados antigos e remover o modelo antigo","objetivo":"Os registros antigos precisam ir para as tabelas com os ids trocados em todos os lugares que apontam para eles. Depois disso, tipos, operações, coleções e a ponte de Canais saem do código.","pronto":"Homologação e produção rodaram o script; `npm run check` passa sem o modelo antigo.","subs":[{"n":"Escrever o script de migração do CRM antigo","cam":["api","banco"],"hoje":"Os dados antigos estão em `plataforma.registros`, nas coleções `contacts`, `companies`, `contactCompanyLinks`, `funnels`, `deals`, `channels` e `conversations` (com as Mensagens dentro de cada Conversa). Não existe script de cópia.","fazer":["Criar `apps/api/src/importacao/crm-antigo/migrar-crm-antigo.ts` e `.cli.ts`, com o comando `npm run migrar:crm-antigo -w @n1/api -- --espaco \u003cid> [--seco]`. `--seco` só conta e lista o que não tem destino.","Uma transação por Espaço. Cada registro copiado grava uma linha em `plataforma.crm_de_para`; rodar de novo pula o que já está lá.","Contato → `contatos`: `firstName`/`lastName` → `nome`/`sobrenome`; `ownerMemberId` → `proprietario_id`; `creationMode` (`automaticoPorMensagem` → `automatico_mensagem`; `automaticoPorAutomacaoOuAgente` e `automaticoPorGrupo` → `automatico_automacao`; `desdobradoDeMesclagem` → `manual`); `lifecycle` (`naLixeira` → `na_lixeira`; `mesclado` → `mesclado` com `mesclado_em_id` pelo de-para); `qualificationId` → `qualificacao`; `fieldValues` → `campos_adicionais` pelo nome do Campo; `consents` → `contato_consentimentos`; `comments` → `contato_notas`.","Identificadores: `telefone` → `telefone`, `email` → `email`, `identidadeDeWhatsApp` → `whatsapp`, `usuarioDeInstagram` → `instagram`. `perfilDeLinkedIn`, `perfilDeTikTok` e `identificadorDeChatDoSite` não têm tipo na 007 e vão para o relatório de não migrados.","Empresa → `empresas` e `empresa_identificadores` (`documentoFiscal` → `documento_fiscal`); `ContactCompanyLink` → `contato_empresa` (`role` → `cargo`).","Funil → `funis` e `etapas` (nome, ordem, probabilidade); Negócio → `negocios` com `funil_id` e `etapa_id` pelo de-para. Dono: `companyId` → `empresa_id`; sem Empresa, o Contato principal de `contactLinks` → `contato_id` (`negocios_dono_ck` exige um só).","Canal: os de tipo `whatsapp`, `instagram` e `email` sem `relational` → `canais`, com o provedor padrão do tipo (`PROVEDOR_PADRAO_DO_TIPO`) e `conexao = 'desconectada'`. `linkedin` e `chatDoSite` não cabem em `canais_tipo_ck` e vão para o relatório.","Conversa → `conversas` (sem as de Grupo, se a decisão for (B)); sem `contactId`, vai para o relatório; na lixeira, entra `resolvida` e `na_lixeira` (`conversas_lixeira_ck`). Cada `Message` → `mensagens`, em ordem de `createdAt`; recebida sem `externalId` ganha `id_externo = 'migrado:\u003cid antigo>'`, porque a 008 exige id externo na recebida.","Reescrever o que fica em `registros` apontando para ids antigos: `links` (`toId` de `contact`, `company`, `deal`, `conversation`), `tasks[].provenance.sourceId`, `lists[].canaisDeAtendimento`, `grupos[].canalId` e Participações, escopos `funnel` de Automações, Agentes e Painéis, e `grants` de Funil.","Por fim, copiar as linhas antigas para `plataforma.registros_crm_antigo` e apagá-las de `plataforma.registros`. Isso é obrigatório: `hidratar()` (`apps/api/src/persistencia/repositorio.ts:96`) carrega qualquer coleção que estiver no banco, então linha que fica volta no `GET /estado`."],"pronto":"Teste de integração `apps/api/src/importacao/crm-antigo/migrar-crm-antigo.test.ts` sobre um Espaço semeado: depois de rodar, `select colecao, count(*) from plataforma.registros where colecao in ('contacts','companies','deals','funnels','channels','conversations','contactCompanyLinks') group by 1` volta vazio, todo Vínculo de Tarefa aponta para um id que existe nas tabelas, e rodar de novo não muda nada."},{"n":"Rodar a migração em homologação e em produção","cam":["voce","infra"],"hoje":"—","fazer":["Backup do banco antes (Sessão 1).","Em homologação: `--seco`, conferir com você o relatório de não migrados, rodar, abrir Caixa, fichas, Listas conversacionais e Contas a receber.","Em produção: o mesmo, junto com o deploy das telas trocadas (3.4)."],"pronto":"Você aprova o relatório de não migrados e a conferência das telas nos dois ambientes."},{"n":"Tirar o CRM antigo do seed","cam":["dom"],"hoje":"`seed.ts`, `seed-comercial.ts`, `seed-pos-venda.ts`, `seed-produto.ts`, `seed-ferramentas.ts` e `seed-contas-a-receber.ts` (este em `:223`) criam Contatos, Empresas, Negócios, Funis, Canais e Conversas antigos para a demonstração.","fazer":["Tirar do seed tudo o que é do CRM antigo.","Para o ambiente de desenvolvimento: rodar o script da subtarefa anterior uma vez sobre um Espaço semeado com a versão atual e salvar o resultado como `apps/api/src/bootstrap/crm-demo.sql` (só dados), aplicado por `npm run bootstrap:crm-demo -w @n1/api`."],"pronto":"`npm run check -w @n1/dominio` passa com o seed novo; um Espaço de desenvolvimento novo, depois de `bootstrap:crm-demo`, mostra Contatos e Conversas na Caixa."},{"n":"Remover o modelo antigo","cam":["dom","api","web"],"hoje":"Os dois modelos convivem; a ponte `canais-projetados.ts` existe só por isso.","fazer":["Em `packages/dominio/src/types/crm.ts`: apagar `Contact`, `Company`, `Deal`, `Funnel`, `Stage`, `Channel`, `Conversation`, `Message`, `Participant`, `Draft`, `ContactCompanyLink`, `CompanyCompanyLink`, `DistinctFromLink` e afins. Ficam `Queue`, `Inbox` e `BusinessHours` (Filas e Caixa continuam em `registros`).","Mover `ChannelType`, `ProvedorDeCanal`, `ChannelCapabilities`, `CHANNEL_CAPABILITIES` e `capacidadesDoCanal` (`operations/conversations.ts:20` e `:115`, usados por `apps/api/src/servicos/crm/mensagens.ts:37`) para `packages/dominio/src/crm/capacidades.ts`, e ajustar `provedores-de-canal.ts`.","Apagar `operations/contacts.ts`, `conversations.ts`, `deals.ts`, `iniciar-conversa.ts`, `criarCanal` e `configurarCanal` de `operations/canais.ts`, e `marketingConsentMissing` (`derive.ts:443`); tirar essas operações de `OPERACOES` (`operations/registro.ts:420`) e de `apps/api/src/rotas/esquemas-de-argumentos.ts`.","Tirar `contacts`, `companies`, `deals`, `funnels`, `contactCompanyLinks`, `companyCompanyLinks`, `distinctFromLinks`, `channels` e `conversations` de `DataState` (`state.ts`) e de `TODAS` (`colecoes.ts`).","Apagar `apps/api/src/persistencia/canais-projetados.ts` e o teste, as chamadas em `rotas/estado.ts:41` e `persistencia/unidade-de-trabalho.ts:137` e `:189`, e `canalAntigoEmConflito` (`repositorios/crm/referencias.ts:63`).","Atualizar `CONTEXT.md` da raiz (parágrafos da Fase 7 e 8 sobre convivência) e `apps/api/src/persistencia/CONTEXT.md` (seção “A ponte dos Canais”)."],"pronto":"`npm run check` passa; uma busca por `state.contacts`, `state.conversations`, `state.deals`, `state.channels` e `canais-projetados` em `packages/` e `apps/` não acha nada (salvo o resto de Grupos e Flows, se a decisão for (B))."}]},{"id":"3.6","n":"Porta de entrada de mensagens","objetivo":"Hoje não existe endereço para um provedor entregar mensagem: `registrarRecebida` não tem rota e só grava numa Conve
