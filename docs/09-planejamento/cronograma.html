ook da Sessão 3, o tratador `whatsapp-cloud`: no `GET`, responder `hub.challenge` quando `hub.verify_token` é igual à variável `META_WEBHOOK_VERIFY_TOKEN`; no `POST`, conferir a assinatura `X-Hub-Signature-256` contra `META_APP_SECRET` sobre o corpo cru, antes de qualquer leitura.","A conferência de assinatura fica em `apps/api/src/provedores/meta/assinatura.ts`, para o Instagram (Sessão 8) usar a mesma.","Achar o Canal pelo `metadata.phone_number_id` do evento.","Traduzir `messages` (texto, mídia, `context.id` da mensagem citada, `reaction`, `interactive`) para o recebimento da Sessão 3, e `statuses` (`sent`, `delivered`, `read`, `failed`) para `proximoStatusDeEntrega`.","Responder 200 logo depois de pôr na fila de entrada: a Meta reenvia se demorar.","No painel do app da Meta, em WhatsApp › Configuração, cadastrar o endereço do webhook e o token de verificação e assinar o campo `messages`."],"pronto":"Teste: corpo com assinatura errada recebe 401 e não entra na fila; um evento `messages` de exemplo cria a Mensagem na Conversa do Contato."},{"n":"Formulário de conectar da Cloud API","cam":["web"],"hoje":"Só o quadro reservado “Token de acesso e número verificado” (`conectar-canal.ts:28-31`) e três passos genéricos (`:23-27`).","fazer":["Na ficha do Canal `whatsapp-cloud` (`[canal]/page.tsx`), o botão “Conectar” abre um formulário com três campos (ID do número, ID da conta do WhatsApp Business e token), cada um dizendo onde achar o dado no painel da Meta.","O token é campo de senha, nunca volta da api e não aparece em log.","Trocar os passos de `ORIENTACAO_DO_PROVEDOR` para `whatsapp-cloud` pelos passos de 7.1."],"pronto":"Você conecta o número oficial pela tela, sem ajuda, e o Canal fica “conectada”."},{"n":"Exigir modelo também antes da primeira mensagem do Contato","cam":["dom","web"],"hoje":"`validarEnvio` libera texto livre quando o Contato nunca mandou nada (`ultimaRecebidaEm === null`, `packages/dominio/src/crm/mensagens.ts:166`). No WhatsApp oficial é o contrário: a empresa só abre conversa com modelo aprovado.","fazer":["Em `validarEnvio`, com `requiresTemplateOutsideWindow` verdadeiro e nenhuma recebida, exigir modelo como se estivesse fora da janela.","Ajustar a frase da Caixa de Entrada (`conversation-thread.tsx:409-415`) para o caso “o Contato ainda não mandou mensagem”."],"pronto":"Teste em `packages/dominio/src/crm/mensagens.test.ts`: numa Conversa nova de um Canal `whatsapp-cloud`, sem recebida, texto livre é recusado e modelo aprovado passa."}]},{"id":"7.3","n":"Modelos de mensagem","objetivo":"Falar com o cliente depois das 24 h usando modelos aprovados pela Meta. Hoje não há onde guardar modelo, o servidor passa uma lista vazia, e por isso nada sai fora da janela.","pronto":"Fora da janela, a resposta escolhe um modelo aprovado, preenche as variáveis e chega ao celular.","subs":[{"n":"Criar as tabelas de modelos e de respostas de Flow","cam":["banco","dom"],"hoje":"A 008 deixou modelos de fora de propósito (comentário da linha 17). O tipo `MessageTemplate` (`types/crm.ts:368`) só tem `providerId`, `name`, `language`, `body`, `category` e `approval`: não tem onde guardar variáveis, cabeçalho e botões.","fazer":["Migração nova com `plataforma.modelos_de_mensagem`: `workspace_id`, `id`, `canal_id` (FK composta para `plataforma.canais`), `id_no_provedor`, `nome`, `idioma`, `categoria` (`utilidade`, `marketing`, `autenticacao`), `estado` (`aprovado`, `pendente`, `rejeitado`, `pausado`, `desativado`), `motivo_rejeicao`, `componentes` (jsonb, como a Meta devolve), `quantidade_de_variaveis` e `sincronizado_em`; único por (`workspace_id`, `canal_id`, `nome`, `idioma`).","Na mesma migração, `plataforma.respostas_de_flow` (ver 7.4): `workspace_id`, `id`, `mensagem_id` (FK composta para `plataforma.mensagens`), `flow_id`, `versao_id`, `valores` (jsonb), `nao_conforme` e `recebida_em`.","No domínio, `packages/dominio/src/crm/modelos.ts` com o tipo `ModeloDeMensagem` em camelCase e `validarVariaveis(modelo, valores)`: quantidade certa e nenhuma vazia."],"pronto":"`npm run migrar -w @n1/api -- --seco` lista a migração nova, ela está aplicada em homologação, e há testes de `validarVariaveis`."},{"n":"Sincronizar os modelos com a Meta","cam":["api"],"hoje":"Não existe.","fazer":["`sincronizarModelos(canal)` em `apps/api/src/provedores/whatsapp-cloud/modelos.ts`: lê `GET /{waba-id}/message_templates` (paginado) e grava na tabela nova, apagando os que sumiram na Meta.","Roda ao conectar o Canal, de hora em hora e quando chega o webhook `message_template_status_update` (assinar esse campo no painel do app).","Rota `GET /canais/:id/modelos` em `apps/api/src/rotas/crm/canais.ts`, para a tela."],"pronto":"Um modelo criado no Gerenciador do WhatsApp aparece em `GET /canais/:id/modelos`, e quando a Meta o aprova o estado muda sozinho."},{"n":"Criar modelos pela plataforma?","cam":["dec","web","api"],"decisao":true,"hoje":"A ficha do Canal só lista modelos (`[canal]/page.tsx:210-252`), sem criar.","opcoes":["(A) Só sincronizar: os modelos são criados no Gerenciador do WhatsApp, na Meta","(B) Criar e mandar para aprovação pela plataforma (`POST /{waba-id}/message_templates`)"],"muda":"(A) cabe nesta sessão. (B) soma cerca de 1,5 dia: formulário com corpo, variáveis com exemplo, cabeçalho e botões, e as regras de categoria da Meta.","recomendo":"(A) agora; (B) se os modelos mudarem toda semana.","peso":"produto"},{"n":"Usar os modelos aprovados no envio","cam":["dom","api"],"hoje":"`modelosAprovados: []` está fixo em `apps/api/src/servicos/crm/mensagens.ts:119`. `NovaMensagem` (`packages/dominio/src/crm/mensagens.ts:103`) e o esquema `NOVA_MENSAGEM` (`apps/api/src/rotas/crm/mensagens.ts:40`) não têm campo de modelo.","fazer":["Acrescentar `modeloId` e `variaveis` a `NovaMensagem` e ao esquema da rota.","No serviço, ler os ids aprovados do Canal na tabela nova e passar em `modelosAprovados`; validar as variáveis com `validarVariaveis`.","Gravar `modelo_usado` (`idNoProvedor` e `nome`, coluna que a 008 já tem) e o texto final, com as variáveis preenchidas, em `conteudo`.","O provedor envia como mensagem `template`, com os `components` e os parâmetros.","Na recusa `JANELA_EXPIRADA`, devolver a lista de modelos aprovados do Canal."],"pronto":"Teste em `apps/api/src/servicos/crm/mensagens.test.ts`: fora da janela, sem modelo, dá 409 `JANELA_EXPIRADA` com a lista de modelos; com modelo aprovado e variáveis, grava `modelo_usado` e sai pelo provedor."},{"n":"Escolher o modelo na Caixa de Entrada","cam":["web"],"hoje":"O seletor existe (`conversation-thread.tsx:345-357` e `:1298`), mas lê `channel.messageTemplates`, que chega vazio para o Canal da tabela nova, e não pede variáveis. (O plano anterior dizia que não existia.)","fazer":["Ler os modelos aprovados de `GET /canais/:id/modelos` (função nova em `apps/web/src/dados/crm/canais.ts`).","Ao escolher, mostrar a prévia do corpo e um campo por variável (`{{1}}`, `{{2}}`…), pré-preenchendo `{{1}}` com o primeiro nome do Contato.","Na ficha do Canal (`[canal]/page.tsx:210-252`), a lista de modelos lê a mesma rota e mostra o motivo de rejeição."],"pronto":"Numa Conversa com a janela fechada, escolher um modelo, preencher a variável e enviar faz a mensagem chegar ao celular."}]},{"id":"7.4","n":"Flows","objetivo":"Mandar formulários interativos pelo WhatsApp e guardar as respostas. Hoje o construtor monta o Flow, mas publicar, enviar e receber são de mentira, e o documento gerado não está no formato que a Meta aceita.","pronto":"Um Flow publicado pela tela aparece na Meta, é enviado a um Contato, e a resposta fica guardada e pode ser copiada para o Contato por uma Automação.","subs":[{"n":"Quais Flows entram nesta sessão?","cam":["dec"],"decisao":true,"hoje":"O domínio tem Flows simples (telas que navegam e concluem) e Flows com ponto de troca de dados (`definirPontoDeTrocaDeDados`, `flows.ts:224`), em que o WhatsApp chama um servidor nosso a cada tela, com o corpo cifrado.","opcoes":["(A) Só Flows sem ponto de troca de dados","(B) Os dois"],"muda":"(A) cabe nesta sessão. (B) soma cerca de 2 dias: o endereço público, a cifra com a chave enviada à Meta e responder em poucos segundos a cada tela.","recomendo":"(A), escondendo o ponto de troca de dados na tela até haver um caso de uso.","peso":"produto"},{"n":"Gerar o JSON do Flow no formato da Meta","cam":["dom"],"hoje":"`definicaoPublicavel` (`packages/dominio/src/operations/ferramentas/flows-validacao.ts:249`) gera um documento com os nomes do domínio em português (`type: c.tipo`, como `campoDeTexto`, `formulario` e `rodape`, e propriedades como `rotulo`), que a Meta não aceita.","fazer":["Nova função `flowJsonDaMeta(flow, versao)` em `packages/dominio/src/operations/ferramentas/flow-json-meta.ts`, que traduz cada `TipoDeComponente` (`types/ferramentas.ts:240`) para o componente da Meta (ex.: `titulo` → `TextHeading`, `campoDeTexto` → `TextInput`, `areaDeTexto` → `TextArea`, `escolhaUnica` → `RadioButtonsGroup`, `multiplaEscolha` → `CheckboxGroup`, `menuSuspenso` → `Dropdown`, `seletorDeData` → `DatePicker`, `consentimento` → `OptIn`, `formulario` → `Form`, `condicional` → `If`, `rodape` → `Footer`) e cada `TipoDeAcao` para a ação da Meta (`navegar` → `navigate`, `concluir` → `complete`, `trocaDeDados` → `data_exchange`, `abrirEndereco` → `open_url`, `atualizarDados` → `update_data`).","`version` sai de `versaoDeEsquemaDoFlow` (`capacidades.ts:44`, hoje 6.3).","Componente sem equivalente na versão do esquema: a validação de `flows-validacao.ts` recusa antes de publicar."],"pronto":"Teste com o Flow do seed (`seed-ferramentas.ts`): o JSON gerado, colado no construtor de Flows do Gerenciador do WhatsApp, não mostra erro.","nota":"Conferir a tabela de componentes e ações na documentação da versão de esquema escolhida."},{"n":"Publicar o Flow na Meta","cam":["api","web","dom"],"hoje":"`publicarVersao` (`flows.ts:624`) inventa o id com `gerarIdentificadorDeFlow` e marca `publicado` sem falar com ninguém.","fazer":["Rota `POST /ferramentas/flows/:id/publicar` em `apps/api/src/rotas/ferramentas.ts`, no padrão de 6.4: conferir no domínio; criar o Flow na Meta na primeira vez (`POST /{waba-id}/flows`, com nome e categoria); subir o JSON (`POST /{flow-id}/assets`, arquivo `flow.json`); ler `validation_errors` e, se houver, devolver as mensagens; publicar (`POST /{flow-id}/publish`); gravar com `publicarVersao` recebendo o id real em `doProvedor`.","`despublicarFlow` (`flows.ts:662`) chama `POST /{flow-id}/deprecate`; `sincronizarFlow` (`flows.ts:796`) lê `GET /{flow-id}` para o estado na Meta.","Tirar `publicarVersao`, `despublicarFlow`, `sincronizarFlow` e `enviarFlow` de `OPERACOES` em `registro.ts`; o botão de publicar de `flow-builder.tsx` e de `flow-popup.tsx` chama a rota."],"pronto":"Publicar pela tela faz o Flow aparecer como publicado no Gerenciador do WhatsApp; um erro de validação da Meta aparece na tela com o texto dela."},{"n":"Enviar o Flow e receber a resposta","cam":["api","dom"],"hoje":"`enviarFlow` (`flows.ts:845`) grava no modelo antigo pelo `sendMessage` e confere a capacidade por `CHANNEL_CAPABILITIES[canal.channelType]` (`:859`), que deixa o não oficial enviar Flow. `receberRespostaDeFlow` (`:908`) inventa o id da resposta com `gerarIdentificadorDeResposta`.","fazer":["Trocar a conferência de `:859` por `capacidadesDeAtivosDoCanal` (6.2).","Enviar pela porta de saída uma mensagem `interactive` do tipo `flow`, com `flow_id`, `flow_cta` (o rótulo do botão), `flow_action: navigate`, a tela inicial e `flow_token` igual ao id da Mensagem enviada. Fora da janela, só por modelo com botão de Flow.","No webhook da Cloud API, a mensagem `interactive` do tipo `nfm_reply` traz `response_json`: achar a Mensagem de origem pelo `flow_token` e chamar `receberRespostaDeFlow` com os valores e o id da mensagem como `identificadorDeRespostaDoProvedor`.","Gravar a resposta estruturada em `plataforma.respostas_de_flow` (7.3), porque `plataforma.mensagens` não tem campo para ela."],"pronto":"Enviar um Flow a um Contato real, preencher no celular e concluir grava uma linha em `plataforma.respostas_de_flow`, e a resposta aparece no fio da Conversa."},{"n":"Copiar as respostas para o Contato por Automação","cam":["dom","web"],"hoje":"Pela regra RN-FLW-14, o Contato não muda sozinho com a resposta: `receberRespostaDeFlow` emite o evento `respostaDeFlowRecebida` (`flows.ts:943`) para as Automações. Mas a ação `contato.definirCampo` (`runAction` em `packages/dominio/src/operations/ferramentas/automacoes.ts`) só grava um valor fixo (`spec.value`), não o que o Contato respondeu. (O plano anterior mandava gravar no Contato direto, o que fere a regra.)","fazer":["Escrever no catálogo de Automações em código (Sessão 18) a Automação “Copiar resposta de Flow para o Contato”: gatilho no evento `respostaDeFlowRecebida` (`flows.ts:943`), parâmetros “qual Flow” e “de qual campo do Flow para qual Campo do Contato”.","Ela grava no Contato da tabela nova (`plataforma.contatos`), conforme a unificação da Sessão 3.","Não mexer no editor visual de Automações: ele sai na Sessão 18, como decidido em 19/10."],"pronto":"Teste: uma Automação “Resposta de Flow recebida → definir o Campo E-mail com o campo `email` do Flow” grava no Contato o e-mail que veio na resposta.","nota":"Se a Sessão 7 vier antes da 16, esta Automação nasce como exemplo do catálogo e a 18.2 reaproveita o formato."},{"n":"Levar as Mensagens de Flow para as tabelas novas e apagar o resto do modelo antigo","cam":["dom","api","banco"],"hoje":"Envios e respostas de Flow são contados pelas Mensagens antigas: `enviosDoFlow` e `respostasDoFlow` (`packages/dominio/src/derive-ferramentas.ts:275` e `:287`) e `receiveMessage` (`packages/dominio/src/operations/ferramentas/flows.ts:922`).","fazer":["Trocar as três funções para ler e gravar nas tabelas de respostas de Flow criadas na 7.3.","Copiar o que existir em `plataforma.registros` e apagar as linhas antigas.","Com isso, o tipo `Conversation` antigo deixa de ter uso: apagar o tipo, as operações e a coleção `conversations` de `colecoes.ts` e `state.ts`."],"pronto":"`npm run check` passa sem o tipo `Conversation` antigo, e um Flow enviado e respondido aparece contado na tela do Flow."}]}],"ajuste":"+2 dias: Cloud API, modelos de mensagem e Flows, incluindo traduzir o Flow para o formato da Meta. Pode virar duas sessões: Cloud API e modelos (4 dias) e Flows (3 dias)."},{"id":"8","n":"Instagram","dias":[3,3],"dep":["3"],"meta":true,"desc":"Mensagens diretas (Direct) de uma conta profissional do Instagram entram e saem pela Caixa de Entrada. O Instagram tem regras próprias: só se responde a quem escreveu primeiro, dentro de 24 h, e não existe modelo aprovado para falar depois disso. E a pessoa chega identificada por um número interno do Instagram, não pelo @.","partida":["O provedor `instagram-graph` existe (`packages/dominio/src/provedores-de-canal.ts:32`), e o Canal nasce pela página de conectar com o @ da conta como identificador (`identificadorCanonico`, `packages/dominio/src/operations/canais.ts:92-99`).","As capacidades do tipo `instagram` (`packages/dominio/src/operations/conversations.ts:37-52`): janela de 24 h, status `enviada` e `lida`, reações e mídia só de imagem, vídeo e áudio. Mas `requiresTemplateOutsideWindow: true` faz a recusa falar em “Mensagem de modelo”, que o Instagram não tem.","O Contato tem o identificador do tipo `instagram` em `plataforma.contato_identificadores` (`apps/api/migracoes/007-crm.sql:113`), pensado para o @ digitado na ficha.","Da Sessão 3: interface de provedor, webhook com fila de entrada, porta de saída e mídia. Da Sessão 7, se já feita: a conferência de assinatura da Meta em `apps/api/src/provedores/meta/assinatura.ts` e o app da Meta."],"pronto":"Uma mensagem mandada ao Direct da conta conectada aparece na Caixa de Entrada no Contato certo, com o @ e o nome; a resposta chega no Instagram; e depois de 24 h sem mensagem do Contato a tela explica que só ele pode reabrir a conversa.","tarefas":[{"id":"8.1","n":"Pré-requisitos","objetivo":"Ter a conta e as permissões de mensagem antes da sessão. A permissão de mensagens pode depender de revisão da Meta, que leva semanas.","pronto":"Conta profissional pronta, produto Instagram no app da Meta e a permissão de mensagens funcionando.","subs":[{"n":"Preparar a conta do Instagram e o app da Meta","cam":["voce"],"hoje":"Não iniciado.","fazer":["No aplicativo do Instagram, mudar a conta para profissional (Empresa ou Criador de conteúdo), se ainda não for.","No mesmo aplicativo, permitir o acesso de ferramentas conectadas às mensagens (fica em Configurações, na parte de mensagens; o nome do item muda com a versão do aplicativo).","Se a decisão de 8.2 for o login do Facebook: ligar a conta a uma Página do Facebook no Meta Business.","No app da Meta da Sessão 7 (o mesmo serve; se a Sessão 7 ainda não foi feita, criar como em 7.1), adicionar o produto Instagram.","Entregar: o @ da conta e acesso de administrador ao app para quem vai desenvolver."],"pronto":"A conta aparece como profissional e o app da Meta tem o produto Instagram."},{"n":"Pedir a permissão de mensagens, se for preciso","cam":["voce"],"hoje":"Não iniciado.","fazer":["No painel do app, ver se a permissão de mensagens (`instagram_business_manage_messages` no login do Instagram, ou `instagram_manage_messages` no login do Facebook) está em acesso padrão ou avançado.","Se a conta conectada for de quem tem papel no app, o acesso padrão pode bastar. Se não, pedir o acesso avançado na Revisão do app, com um vídeo da tela mostrando uma mensagem chegando e sendo respondida (dá para gravar em homologação no fim da sessão).","A empresa precisa estar verificada (7.1) e o app no modo Ao vivo."],"pronto":"A permissão aparece aprovada, ou o acesso padrão funciona com a conta da empresa.","nota":"A revisão costuma levar de 1 a 4 semanas: pedir logo depois da verificação da empresa."}]},{"id":"8.2","n":"Conexão","objetivo":"Ligar a conta profissional do Instagram pela ficha do Canal. Hoje a página de conectar só tem um texto reservado e o `apps/api` não tem nenhum login da Meta.","pronto":"Você conecta a conta pela tela e a ficha mostra “Conectado como @conta”.","subs":[{"n":"Login do Instagram ou do Facebook?","cam":["dec"],"decisao":true,"hoje":"Os passos de hoje (`apps/web/src/features/crm/conectar-canal.ts:45-56`) supõem o login do Facebook com uma Página ligada.","opcoes":["(A) API do Instagram com login do Instagram: a pessoa entra com a conta do Instagram, sem Página do Facebook","(B) API do Instagram com login do Facebook: entra pela conta do Facebook que administra a Página ligada"],"muda":"(A) é mais simples para quem conecta e não depende de Página. (B) serve se a empresa já administra tudo pela Página e quer o mesmo token para o Messenger depois. O resto da sessão muda pouco: endereços da API e nomes das permissões.","recomendo":"(A).","peso":"produto"},{"n":"Ligar a conta pelo login da Meta","cam":["api"],"hoje":"Não existe login OAuth no `apps/api`.","fazer":["Rota `GET /canais/:id/instagram/autorizar`: redireciona ao login escolhido em 8.2, com um `state` aleatório guardado por 10 min (contra falsificação).","Rota de volta `GET /canais/instagram/retorno`: troca o código pelo token, troca o token curto pelo de longa duração, guarda no cofre, lê o @ da conta e confere com o `identificadorExterno` do Canal (por `conferirNumeroConectado`, da Sessão 4, generalizada para identificador).","Inscreve a conta nos webhooks de mensagens (campo `messages`) e grava `conexao_confirmada`.","Rotina que renova o token de longa duração antes de vencer (cerca de 60 dias) e põe o Canal `com_erro` se a renovação falhar."],"pronto":"Teste com `criarServidorFalso` no lugar da Meta: o retorno grava a credencial cifrada e o Canal fica `conectada`; um `state` desconhecido é recusado."},{"n":"Botão de conectar na ficha do Canal","cam":["web"],"hoje":"Só o quadro reservado “Autorização da conta” com texto (`conectar-canal.ts:52-55`).","fazer":["Na ficha do Canal `instagram-graph` (`[canal]/page.tsx`), o botão “Conectar” leva à rota de autorizar; na volta, a ficha mostra “Conectado como @conta”.","Trocar os passos de `ORIENTACAO_DO_PROVEDOR` para `instagram-graph` pelos de 8.1."],"pronto":"Você conecta a conta pela tela, sem ajuda."}]},{"id":"8.3","n":"Mensagens","objetivo":"Receber e responder o Direct. Hoje nada fala com o Instagram, a identidade do Contato não tem onde ficar e a regra da janela fala de um modelo que não existe lá.","pronto":"Uma mensagem direta chega no Contato certo e é respondida; fora das 24 h, a tela explica por que não dá para responder.","subs":[{"n":"Como guardar a identidade do Contato no Instagram?","cam":["dec","banco","dom"],"decisao":true,"hoje":"O webhook identifica quem mandou por um id próprio da conta conectada (IGSID), não pelo @, e o @ pode mudar. O tipo `instagram` de `plataforma.contato_identificadores` (007, linha 113) foi pensado para o @ digitado na ficha.","opcoes":["(A) Migração nova: mais um tipo de identificador, para o id do Instagram, com o @ em `valor_exibido`","(B) Guardar o id no tipo `instagram` mesmo, e o @ em `valor_exibido`"],"muda":"(A) separa o @ digitado à mão do id do webhook, e o recebimento acha o Contato pelo id. Custa a migração que muda o `check` de tipos (meio dia). (B) não tem migração, mas mistura @ e id no mesmo campo, e a busca por @ quebra.","recomendo":"(A).","peso":"arrumacao"},{"n":"Receber pelo webhook","cam":["api"],"hoje":"Não existe.","fazer":["Tratador `instagram-graph` na rota de webhook da Sessão 3: verificação por `GET` (`hub.challenge`) e assinatura `X-Hub-Signature-256` pela mesma função de `apps/api/src/provedores/meta/assinatura.ts` (criar aqui se a Sessão 7 ainda não criou).","Achar o Canal pelo id da conta em `entry[].id`.","Traduzir `messaging[].message` (texto, anexos de imagem, vídeo e áudio, `reply_to`), `messaging[].read` e as reações para o recebimento da Sessão 3. Mensagem com `is_echo` (mandada pela própria conta, inclusive pelo aplicativo) vira `enviada`, sem duplicar a que a plataforma mandou.","Contato novo: buscar nome e @ pela API de perfil (`GET /{igsid}` com `fields=name,username`) e gravar o identificador decidido acima.","No painel do app da Meta, cadastrar o endereço do webhook do Instagram e assinar o campo `messages`."],"pronto":"Teste com um evento de exemplo: cria o Contato com o @ e o nome, e a Mensagem na Conversa do Canal."},{"n":"Enviar","cam":["api"],"hoje":"Não existe.","fazer":["Implementar `enviar` da interface de provedor em `apps/api/src/provedores/instagram/`: `POST /{ig-id}/messages` com `recipient.id` igual ao id do Contato e `message.text` ou `message.attachment`.","Respeitar as mídias de `capacidadesDoCanal` (`sendableMediaTypes` do Instagram: imagem, vídeo e áudio).","Ler a confirmação de leitura (`messaging[].read`) por `proximoStatusDeEntrega`."],"pronto":"Uma resposta escrita na Caixa de Entrada chega no Direct e, quando lida, aparece como lida."},{"n":"Corrigir a regra da janela do Instagram","cam":["dom","web"],"hoje":"As capacidades do `instagram` (`conversations.ts:38-40`) dizem `requiresTemplateOutsideWindow: true`; fora da janela, `validarEnvio` responde “Este Canal não tem Mensagem de modelo aprovada”, e o Instagram não tem modelo.","fazer":["Trocar em `ChannelCapabilities` (`packages/dominio/src/types/crm.ts`) o booleano `requiresTemplateOutsideWindow` por um campo de três valores para “depois da janela”: `livre`, `so_modelo` (WhatsApp oficial) e `bloqueado` (Instagram).","`validarEnvio` (`packages/dominio/src/crm/mensagens.ts:162`) responde, no `bloqueado`: “Passaram 24 h desde a última mensagem do Contato: só ele pode reabrir a conversa.” O mesmo vale antes da primeira mensagem dele.","A Caixa de Entrada (`conversation-thread.tsx:345-357`) desliga o campo com essa frase, sem seletor de modelo."],"pronto":"Teste em `mensagens.test.ts`: Instagram fora da janela recusa com a frase nova; WhatsApp oficial continua pedindo modelo; não oficial e e-mail continuam livres.","nota":"A Meta permite responder até 7 dias depois com a etiqueta `HUMAN_AGENT`, para atendimento humano, se o app tiver essa permissão. Fica fora desta sessão."}]}]},{"id":"9","n":"E-mail","dias":[3,4],"dep":["3"],"desc":"Uma caixa de e-mail que a empresa já tem vira Canal: os e-mails que chegam viram Conversas na Caixa de Entrada, e a resposta sai pela mesma caixa, no mesmo fio, com assunto e cópias. Antes de tudo é preciso saber de que serviço são as caixas, porque o Microsoft 365 não aceita mais entrar por senha.","partida":["O provedor `email-imap-smtp` existe (`packages/dominio/src/provedores-de-canal.ts:33`), e o Canal nasce com o endereço como identificador (`identificadorCanonico`, `packages/dominio/src/operations/canais.ts:88-91`).","A 008 já tem em `plataforma.mensagens` as colunas `assunto`, `enderecos_adicionais` (para, cópia e cópia oculta) e `em_resposta_a_id` (linhas 148-150), e o tipo `EnderecoAdicional` existe (`packages/dominio/src/crm/mensagens.ts:67`).","A Caixa de Entrada já mostra um campo de assunto quando o Canal tem `hasSubjectAndCopies` (`apps/web/src/features/crm/conversation-thread.tsx:1182-1190`), mas o envio não o leva: `NovaMensagem` (`mensagens.ts:103`) e o esquema `NOVA_MENSAGEM` (`apps/api/src/rotas/crm/mensagens.ts:40-47`, `strict`) não têm assunto nem endereços.","As capacidades do `email` (`packages/dominio/src/operations/conversations.ts:73-87`): sem janela, com assunto e cópias, qualquer arquivo e vários por mensagem, corpo formatado.","Da Sessão 3: interface de provedor, fila de entrada, porta de saída, mídia e CRM unificado. Da Sessão 4: `POST /canais/:id/conectar`."],"pronto":"Um e-mail mandado para a caixa conectada vira Conversa no Contato do remetente; a resposta escrita na Caixa de Entrada chega a ele com o mesmo assunto e aparece no mesmo fio no programa de e-mail dele; um anexo vai e volta; e a resposta seguinte dele cai na mesma Conversa.","tarefas":[{"id":"9.1","n":"Escolher como a caixa se conecta","objetivo":"Decidir o jeito de entrar na caixa. O resto da sessão depende disso, e o plano anterior supunha que IMAP com senha serve para qualquer caixa, o que não vale para o Microsoft 365.","pronto":"As caixas estão listadas e a decisão está tomada.","subs":[{"n":"Dizer quais caixas e de que serviço","cam":["voce"],"hoje":"Não se sabe que serviço de e-mail a empresa usa.","fazer":["Listar as caixas que vão virar Canal (ex.: contato@, financeiro@).","Dizer de que serviço é cada uma: Google Workspace (Gmail), Microsoft 365 (Outlook) ou outro (hospedagem com IMAP).","Para Gmail: confirmar que a conta tem verificação em duas etapas e que o administrador do Workspace permite senha de app e IMAP."],"pronto":"Lista anotada nesta tarefa."},{"n":"IMAP/SMTP com senha, ou login do Google e da Microsoft?","cam":["dec"],"decisao":true,"hoje":"Não há nenhuma integração de e-mail. A Microsoft desligou o acesso IMAP por senha no Microsoft 365: lá só se entra com login OAuth (a conta autoriza o app, sem senha).","opcoes":["(A) IMAP/SMTP com senha ou senha de app: serve para Gmail com senha de app e para hospedagens comuns, não para Microsoft 365","(B) IMAP/SMTP com login OAuth do Google e da Microsoft: o mesmo protocolo, entrando pela conta em vez da senha","(C) APIs próprias de cada um (Gmail API e Microsoft Graph)"],"muda":"(A) é o mais rápido e cabe nos 3 dias, mas deixa o Microsoft 365 de fora. (B) cobre os três casos e soma cerca de 1,5 dia (dois logins e renovação de token; o Google pode exigir verificação do app para o acesso ao e-mail). (C) dá aviso instantâneo de e-mail novo, mas é uma integração por serviço e exige valor novo em `provedor` (migração).","recomendo":"(A) se a lista de 9.1 não tiver Microsoft 365; (B) se tiver.","peso":"produto"}]},{"id":"9.2","n":"Conexão","objetivo":"Ligar uma caixa de e-mail pela ficha do Canal. Hoje a página só tem um texto reservado e nada testa servidor nenhum.","pronto":"Você conecta uma caixa pela tela, e uma senha errada é avisada na hora.","subs":[{"n":"Guardar a credencial e testar a conexão","cam":["api"],"hoje":"Não existe.","fazer":["`POST /canais/:id/conectar` (Sessão 4) recebe, para `email-imap-smtp`: servidor, porta e segurança do IMAP e do SMTP, usuário e senha (ou o token do login, se a decisão for (B)).","Testar antes de gravar: abrir a sessão IMAP (biblioteca `imapflow`) e listar a caixa de entrada; abrir a sessão SMTP (biblioteca `nodemailer`, função `verify`).","Se os dois responderem, guardar a credencial no cofre e gravar `conexao_confirmada`; se não, devolver qual dos dois falhou e a frase do servidor, sem a senha."],"pronto":"Teste com servidores IMAP e SMTP de teste: senha errada devolve “O servidor IMAP recusou o usuário ou a senha.” e nada é gravado; senha certa deixa o Canal `conectada`."},{"n":"Formulário de conexão","cam":["web"],"hoje":"Só o quadro reservado “Servidores IMAP e SMTP” com texto (`apps/web/src/features/crm/conectar-canal.ts:64-67`).","fazer":["Na ficha do Canal `email-imap-smtp` (`[canal]/page.tsx`), o botão “Conectar” abre o formulário de IMAP e SMTP.","Preencher sozinho servidor e porta pelo domínio do endereço: Gmail (`imap.gmail.com` 993 e `smtp.gmail.com` 465) e Outlook (`outlook.office365.com` 993 e `smtp.office365.com` 587).","A senha é campo de senha e nunca volta da api."],"pronto":"Você conecta uma caixa pela tela, sem ajuda."}]},{"id":"9.3","n":"Receber","objetivo":"O e-mail que chega vira Conversa, e as respostas ficam no mesmo fio. Hoje nada lê caixa nenhuma, e o recebimento da Sessão 3 junta por Contato e Canal, sem olhar os cabeçalhos do e-mail.","pronto":"Um e-mail novo aparece na Caixa de Entrada em até 2 min, e uma troca de três e-mails fica numa Conversa só.","subs":[{"n":"Guardar onde a leitura parou","cam":["banco"],"hoje":"Não existe.","fazer":["Migração nova com `plataforma.cursores_de_canal`: `workspace_id`, `canal_id`, `pasta`, `uidvalidity`, `ultimo_uid` e `atualizado_em`.","Serve para ler só o que é novo e não repetir e-mail quando o processo reinicia."],"pronto":"Migração aplicada em homologação."},{"n":"Buscar os e-mails novos","cam":["api"],"hoje":"Não existe.","fazer":["Leitor em `apps/api/src/provedores/email/leitor.ts`: uma sessão IMAP por Canal conectado, escutando a caixa de entrada (`IDLE`) e, como reserva, conferindo a cada 2 min.","Para cada e-mail com UID maior que o do cursor: ler o MIME com a biblioteca `mailparser` e pôr na fila de entrada da Sessão 3 com `idExterno` igual ao `Message-ID`, o `assunto`, `remetenteExterno` igual ao endereço do `From` e os endereços de `To` e `Cc` em `enderecosAdicionais`; depois, avançar o cursor.","Corpo: o texto puro vai para `conteudo`; o HTML vai para a mídia como anexo `text/html` e só aparece na tela depois de limpo (sem scripts e sem imagens remotas carregando sozinhas).","Ignorar respostas automáticas (`Auto-Submitted`) e avisos de não entrega, para não abrir Conversa com o servidor.","Ligado pela variável `EMAIL_LEITOR_ATIVO`, desligado no ambiente local, e iniciado em `apps/api/src/index.ts`."],"pronto":"Mandar um e-mail para a caixa conectada faz a Conversa aparecer em até 2 min; reiniciar o `apps/api` não cria Mensagem repetida."},{"n":"Juntar as respostas na mesma Conversa","cam":["dom"],"hoje":"O recebimento da Sessão 3 acha a Conversa aberta do par Contato e Canal (`abertaDoPar`, `apps/api/src/repositorios/crm/conversas.ts:138`) e não olha cabeçalhos.","fazer":["Função pura `mensagemRespondida(cabecalhos, buscarPorIdExterno)` em `packages/dominio/src/crm/mensagens.ts`: procura o `In-Reply-To` e, se não achar, cada id de `References`, do último para o primeiro, entre as Mensagens do Canal.","Achou: a Mensagem nova vai para a Conversa daquela (reabrindo se estiver resolvida) e grava `em_resposta_a_id`. Não achou: segue a regra da Sessão 3 (Conversa aberta do par, ou nova).","Assunto começando com “Re:” sem cabeçalho não junta sozinho, para não misturar e-mails de assuntos iguais por acaso."],"pronto":"Teste em `mensagens.test.ts` com uma troca de três e-mails (enviado, resposta, resposta da resposta): os três ficam na mesma Conversa, cada um apontando para o anterior."}]},{"id":"9.4","n":"Enviar","objetivo":"A resposta sai pela caixa conectada, no mesmo fio, com assunto, cópias e anexos. Hoje o assunto digitado na tela não chega ao servidor e nada envia e-mail.","pronto":"A resposta aparece no Gmail do remetente na mesma conversa, e um PDF vai e volta.","subs":[{"n":"Levar assunto e cópias no envio","cam":["dom","api","web"],"hoje":"`NovaMensagem` (`packages/dominio/src/crm/mensagens.ts:103-108`) só tem `conversaId`, `direcao`, `conteudo` e `emRespostaAId`; o esquema `NOVA_MENSAGEM` (`apps/api/src/rotas/crm/mensagens.ts:40-47`) é `strict` e recusa qualquer campo a mais; o assunto digitado na tela (`conversation-thread.tsx:1182-1190`) não chega ao servidor.","fazer":["Acrescentar `assunto` e `enderecosAdicionais` a `NovaMensagem` e ao esquema, aceitos só quando o Canal tem `hasSubjectAndCopies` (`validarNovaMensagem` recusa nos outros).","Resposta sem assunto: usar “Re: ” mais o assunto da última recebida.","O serviço `enviar` (`apps/api/src/servicos/crm/mensagens.ts:91`) grava as duas colunas.","A tela manda os dois campos e ganha os campos de cópia e cópia oculta."],"pronto":"Teste em `apps/api/src/servicos/crm/mensagens.test.ts`: uma Mensagem `enviada` num Canal de e-mail grava `assunto` e `enderecos_adicionais`; num Canal de WhatsApp, o assunto é recusado."},{"n":"Enviar pelo SMTP mantendo o fio","cam":["api"],"hoje":"Não existe.","fazer":["Implementar `enviar` da interface de provedor em `apps/api/src/provedores/email/`: `nodemailer` com a credencial do cofre; `From` igual ao endereço do Canal; `Message-ID` gerado por nós e gravado em `id_externo` antes de enviar; `In-Reply-To` e `References` com o `Message-ID` da Mensagem respondida e os anteriores do fio.","Corpo em texto e em HTML simples (o texto da tela com as quebras de linha).","Gravar uma cópia na pasta de enviados por IMAP (`APPEND`), para o e-mail aparecer em Enviados no programa de e-mail; a pasta é a que o servidor marca como de enviados."],"pronto":"A resposta enviada pela Caixa de Entrada aparece no Gmail do remetente dentro da mesma conversa, e na pasta Enviados da caixa conectada.","nota":"No Gmail, o envio por SMTP já guarda em Enviados: pular o `APPEND` quando o servidor for do Google, senão aparece duas vezes."},{"n":"Anexos","cam":["api"],"hoje":"A mídia da Sessão 3 guarda e serve arquivos; o e-mail aceita qualquer tipo e vários por mensagem (`sendableMediaTypes` do `email`, `conversations.ts:85`).","fazer":["Na entrada: cada anexo do MIME vira arquivo pela mídia da Sessão 3, com nome e tipo; as imagens embutidas no corpo (`cid:`) também.","Na saída: os anexos da Mensagem vão como partes do e-mail, lidos do armazenamento.","Recusar acima de 20 MB no total, com a frase “O e-mail passa de 20 MB: muitos servidores recusam.”"],"pronto":"Um PDF recebido abre na Conversa, e um PDF enviado chega ao remetente."},{"n":"Validar com a caixa real","cam":["voce"],"hoje":"—","fazer":["Conectar em homologação uma das caixas da lista de 9.1.","Mandar de outro endereço um e-mail com anexo, responder pela Caixa de Entrada, responder de volta pelo programa de e-mail."],"pronto":"Os três e-mails ficam numa Conversa só, o anexo abre, e a conversa aparece inteira no programa de e-mail do remetente."}]}],"ajuste":"+1 dia, ou +2 se a decisão for login OAuth, que o Microsoft 365 exige."},{"id":"10","n":"Canal Reunião: investigação","dias":[2,2],"dep":["5"],"desc":"Na Lista conversacional entra um Canal novo, “Reunião”: o closer cria uma sala de vídeo e manda o link para o cliente entrar, e um gestor pode entrar na chamada sem que o closer nem o cliente vejam. Antes de implementar, dois dias para decidir a base: um serviço pronto, como o LiveKit, ou a conexão WebRTC feita do zero. O resultado define a Sessão 11.","partida":["Os tipos de Canal são só `whatsapp`, `instagram` e `email` (`packages/dominio/src/provedores-de-canal.ts`), e o banco recusa outros (`canais_tipo_ck`, migração 008, linha 45).","A Lista conversacional define os Canais por onde as conversas nascem (`canaisDeAtendimento`, em `List`, `packages/dominio/src/types/structure.ts`).","Existe a tela da chamada do Closer (`apps/web/src/app/(shell)/crm/reunioes/[reuniao]/page.tsx`), mas sem vídeo: o próprio arquivo diz que o protótipo não tem mídia nem servidor. A “Reunião” é uma Tarefa do Tipo Reunião ligada ao Negócio."],"pronto":"A decisão “LiveKit ou WebRTC próprio” tomada, e a Sessão 11 escrita com as tarefas e a duração que saírem da investigação.","tarefas":[{"id":"10.1","n":"Testar as duas opções","objetivo":"Ver funcionando, com o caso real: closer e cliente na sala, e um gestor entrando sem aparecer.","pronto":"Uma página com o resultado de cada opção: o que funcionou, o custo e o esforço.","subs":[{"n":"Testar o LiveKit","cam":["infra","api"],"hoje":"Não existe nenhuma chamada de vídeo no produto.","fazer":["Criar uma sala de teste no LiveKit Cloud (ou num LiveKit no nosso servidor, em Docker).","Gerar um link de entrada para um convidado sem conta (o cliente), com um token de curta duração gerado pelo `apps/api`.","Testar a entrada oculta: um terceiro participante que vê e ouve, não publica áudio nem vídeo e não aparece para os outros. Conferir na documentação do LiveKit a permissão de participante oculto.","Testar no celular do cliente (navegador, sem instalar nada) e com rede ruim.","Anotar o custo (LiveKit Cloud cobra por minuto de participante; o servidor próprio custa a máquina) e se a gravação é possível."],"pronto":"Closer, cliente e um gestor oculto numa chamada de teste, com o resultado anotado."},{"n":"Levantar o custo do WebRTC próprio","cam":["api"],"hoje":"Não existe.","fazer":["Listar o que teria de ser construído: servidor de sinalização (quem entra, quem sai), servidores STUN e TURN (para atravessar redes de empresa e de celular) e um servidor que distribui o vídeo entre os participantes (SFU), porque com o gestor oculto já são três pessoas.","Estimar o esforço de construir e o custo de manter cada peça, incluindo as quedas de conexão e a qualidade no celular."],"pronto":"Estimativa em dias e em custo mensal, na mesma página."},{"n":"Confirmar as regras de gravação e da entrada oculta","cam":["voce"],"hoje":"Não há regra definida.","fazer":["Definir se as chamadas são gravadas e se a gravação vai para a IA (transcrição, resumo).","Confirmar com quem cuida de LGPD e do jurídico na Tria como fica a entrada oculta do gestor e a gravação: por exemplo, se o convite e a página da sala avisam que a chamada pode ser acompanhada e gravada."],"pronto":"Regras escritas na página.","nota":"A entrada sem aviso numa chamada com cliente pode ter implicação legal. Vale fechar isso antes de construir."}]},{"id":"10.2","n":"Decidir a base","objetivo":"Escolher a base com o resultado dos testes.","pronto":"Decisão tomada e a Sessão 11 reescrita com ela.","subs":[{"n":"LiveKit ou WebRTC próprio?","cam":["dec"],"decisao":true,"hoje":"Nenhuma das duas existe no produto.","opcoes":["(A) LiveKit Cloud: o LiveKit hospeda as salas e cobra por uso","(B) LiveKit no nosso servidor: mesmo código, nós mantemos a máquina","(C) WebRTC próprio, feito do zero"],"muda":"Define a base da Sessão 11. A duração e as tarefas da Sessão 11 saem desta investigação.","recomendo":"(A) para começar; (B) se o custo por minuto pesar.","peso":"produto"},{"n":"Escrever a Sessão 11 com o resultado","cam":["voce"],"hoje":"A Sessão 11 está no cronograma só como marcador de 1 dia, sem tarefas.","fazer":"Com a decisão tomada, me mandar o resultado: eu escrevo as tarefas e as subtarefas da Sessão 11 e ajusto a duração e as datas.","pronto":"Sessão 11 com tarefas, subtarefas e duração."}]}]},{"id":"11","n":"Canal Reunião: implementação","dias":[1,1],"dep":["10"],"bloqueio":"Só começa depois da investigação (Sessão 10). O 1 dia é só um marcador no cronograma: a duração real e as subtarefas ainda não são conhecidas e saem da Sessão 10.","desc":"A implementação do Canal Reunião na Lista conversacional. O que será feito, em quantos dias e com quais subtarefas depende do resultado da investigação (Sessão 10).","partida":["A tela da chamada do Closer existe sem vídeo (`apps/web/src/app/(shell)/crm/reunioes/[reuniao]/page.tsx`)."],"pronto":"A definir depois da investigação.","tarefas":[{"id":"11.1","n":"A definir depois da investigação","objetivo":"As tarefas, as subtarefas e a duração desta sessão saem da Sessão 10. Quando a investigação terminar, você me manda o resultado e eu escrevo esta sessão.","pronto":"Sessão escrita com o resultado da investigação.","subs":[]}]},{"id":"12","n":"Superadmin, usuários e permissões","dias":[5,7],"dep":["1"],"desc":"Vem logo antes das sessões de IA, para que os Agentes já nasçam respeitando quem pode o quê. Hoje um convite cria o Membro `pendente`, mas não manda e-mail, e não existe operação que o torne `ativo`: o convidado recebe 403 ao entrar. Não dá para criar Papel nem Equipe pela tela, nem dar acesso a um Espaço, Pasta ou Lista depois de criado. Não há “esqueci a senha”. O servidor atende um Espaço só (`WORKSPACE_ID`). E todo Membro vê todos os módulos no menu, menos o Financeiro.","partida":["Tipos `Member`, `Role`, `Grant`, `Team` e `Workspace` em `packages/dominio/src/types/workspace.ts`; `Member.state` com `pendente`, `ativo`, `suspenso` e `removido` (linha 13).","Operações em `packages/dominio/src/operations/members.ts`: `inviteMember` (`:420`), `alterarEmailDoConvite` (`:128`), `alterarPapelDoMembro` (`:173`), `removeMember` com sucessor (`:217`), `transferWorkspaceOwnership` (`:376`), `deleteRole` (`:572`) e `grantGovernanceAccess` (`:722`).","Login real por e-mail e senha em `/entrar` (`apps/web/src/app/entrar/actions.ts`, `signInWithPassword`); `apps/web/src/proxy.ts` manda para `/entrar` quem não tem sessão.","Telas: `/configuracoes/membros` convida e remove; `/configuracoes/membros/[membro]` muda o Papel e o e-mail do convite; `/configuracoes/papeis` só lista e exclui; `/configuracoes/equipes` só lista.","O CRM novo recusa por Papel no servidor (`podeNoCrm`, `packages/dominio/src/crm/permissoes.ts:57`); o Financeiro recusa quem não alcança a Pasta (`apps/api/src/rotas/financeiro.ts`)."],"pronto":"Um Administrador convida um e-mail pela tela; a pessoa recebe o e-mail, cria a senha, entra e vê no menu só os módulos do Papel dela; chamar a rota de um módulo não liberado devolve 403; um Papel e uma Equipe criados pela tela mudam o que o Membro faz; quem esquece a senha a redefine sozinho.","tarefas":[{"id":"12.1","n":"Definir o escopo","objetivo":"Cinco respostas mudam o tamanho da sessão: se haverá várias empresas, o que é o Superadmin, como os módulos são liberados, se a lista de permissões do Papel passa a valer e o que um Membro suspenso pode. Elas precisam sair no primeiro dia.","pronto":"As cinco decisões respondidas e anotadas no `CONTEXT.md` da fase.","subs":[{"n":"A plataforma vai atender mais de uma empresa?","cam":["dec"],"decisao":true,"hoje":"Só a Tria, num Espaço fixo: `buildApp` lê `WORKSPACE_ID` (`apps/api/src/app.ts:101`) e o hook resolve o Membro sempre dentro dele (`plugins/autenticacao.ts:78`). As tabelas já têm `workspace_id`, e `plataforma.registros` também.","opcoes":["(A) Sim, em breve: cada cliente com o seu Espaço de Trabalho","(B) Não por agora: só a Tria"],"muda":"(A) soma cerca de 2 dias: o servidor passa a descobrir o Espaço pelo usuário, as rotas públicas passam a achar o Espaço pelo segredo, e a tela ganha um seletor de Espaço. (B) mantém o Espaço fixo.","recomendo":"Responder pelo plano comercial. Se não houver cliente novo nos próximos 3 meses, (B).","peso":"produto"},{"n":"O Superadmin fica acima das empresas?","cam":["dec"],"decisao":true,"hoje":"Ninguém fica acima do Espaço; o Proprietário é o topo. Um Espaço novo só nasce por script (`npm run bootstrap:gestao -w @n1/api`).","opcoes":["(A) Sim: o Superadmin é da plataforma, cria empresas e gere os usuários de todas","(B) Não: “Superadmin” é o Proprietário ou um Administrador do Espaço, com a tela de Membros completa"],"muda":"(A) só faz sentido se a anterior for (A): soma uma tabela de Superadmins, uma área `/plataforma` e um registro de auditoria fora do Espaço (cerca de 1,5 dia). (B) não cria conceito novo.","recomendo":"Seguir a anterior: várias empresas → (A); só a Tria → (B).","peso":"produto"},{"n":"Como os módulos são liberados?","cam":["dec"],"decisao":true,"hoje":"O menu tem seis assuntos (`ASSUNTOS`, `apps/web/src/features/shell/app-shell.tsx:116`): Trabalho, CRM, IA, Ferramentas, Painéis e Financeiro. Só o Financeiro some, para quem não alcança a Pasta (`app-shell.tsx:365`).","opcoes":["(A) Por Papel: cada Papel liga ou desliga cada um dos seis módulos, e os Papéis personalizados viram os perfis (Comercial, Financeiro, Gestão)","(B) Por Membro: seis chaves na ficha de cada pessoa","(C) Os dois: o Papel dá o padrão e a ficha do Membro só pode tirar"],"muda":"(A) custa cerca de 1 dia e um caso novo vira um Papel novo. (B) custa o mesmo, mas a configuração fica espalhada pessoa a pessoa. (C) soma meio dia a (A).","recomendo":"(A).","peso":"produto"},{"n":"A lista de permissões do Papel passa a valer?","cam":["dec"],"decisao":true,"hoje":"`Role.permissions` (`workspace.ts:62`) é lida em só dois lugares: o Convidado que comenta (`packages/dominio/src/derive.ts:971`) e o Convidado que muda só o Status (`packages/dominio/src/operations/tasks.ts:1233`), os dois usados pelo “Agente do pipeline” do Financeiro. Quem decide o resto é a base do Papel e o acesso ao Espaço, Pasta ou Lista.","opcoes":["(A) Ler a lista em todas as conferências (`taskWriteRefusal`, `containerAdminRefusal`, `podeNoCrm`)","(B) O Papel personalizado escolhe base e módulos; a lista fica só para os dois casos que já a usam, e a tela não a oferece"],"muda":"(A) soma cerca de 3 dias e mexe em toda conferência do domínio. (B) não soma nada; um Papel personalizado restringe por módulo e por base, não ação a ação.","recomendo":"(B), e voltar ao assunto se surgir um caso que módulo e base não resolvem.","peso":"produto"},{"n":"O que um Membro suspenso pode fazer?","cam":["dec"],"decisao":true,"hoje":"O código trata `suspenso` como “só consulta”: o hook deixa entrar (`plugins/autenticacao.ts:85`), `podeNoCrm` deixa ler e recusa escrever (`permissoes.ts:67` e `:71`), e a Sessão 1 barra a escrita em `POST /operacoes`. Mas não existe operação que suspenda alguém.","opcoes":["(A) Só consulta: entra, vê, não altera nada","(B) Sem acesso: não entra, como um removido, mas volta com o histórico ao ser reativado"],"muda":"(A) só cria as operações de suspender e reativar. (B) também muda `plugins/autenticacao.ts:85` e `podeNoCrm` para recusar o suspenso, cerca de meio dia a mais.","recomendo":"(B): quem suspende alguém quase sempre quer cortar o acesso.","peso":"produto"}]},{"id":"12.2","n":"Modelo de dados","objetivo":"Guardar que módulos cada Papel libera e, se a 12.1 decidir por várias empresas, quem é Superadmin e em que Espaço cada usuário está. Hoje não existe conceito de módulo no domínio.","pronto":"Tipos e regras no domínio com testes; as tabelas novas, se houver, aplicadas em homologação.","subs":[{"n":"Criar o tipo `Modulo` e a regra `membroAcessaModulo`","cam":["dom"],"hoje":"Não existe. As chaves dos módulos só existem na tela (`Assunto.chave`, `app-shell.tsx:102`).","fazer":["Em `packages/dominio/src/types/workspace.ts`: `export type Modulo = “trabalho” | “crm” | “ia” | “ferramentas” | “paineis” | “financeiro”` e o campo `Role.modulos?: readonly Modulo[]`; ausente quer dizer todos, o que mantém os Papéis de hoje como estão.","Criar `packages/dominio/src/derive-modulos.ts` com `membroAcessaModulo(state, memberId, modulo)`: o Papel do Membro libera o módulo; para `financeiro`, o Membro também precisa alcançar a Pasta (`memberReachesContainer`, como `vePastaFinanceiro` faz hoje).","A tela (`app-shell.tsx`) e a api passam a chamar essa função; ninguém repete a regra."],"pronto":"Teste em `packages/dominio/src/derive-modulos.test.ts`: Papel com `modulos: [“trabalho”]` não acessa `crm`; Papel sem `modulos` acessa tudo; Papel com `financeiro`, sem alcance à Pasta, não acessa `financeiro`."},{"n":"Criar as tabelas de Superadmin e de empresa","cam":["banco"],"hoje":"Não existem. Um usuário já pode ser Membro de mais de um Espaço, porque o Membro mora em `plataforma.registros` com `workspace_id` e `dados->>'userId'` (índice `registros_members_user_id_idx`, migração `002`).","fazer":"Numa migração nova, depois da `009`: `plataforma.superadmins (user_id text primary key, criado_em, criado_por)`; o primeiro Superadmin entra por SQL à mão.","pronto":"Migração aplicada em homologação, com o primeiro Superadmin gravado.","nota":"Só se a 12.1 escolher (A) nas duas primeiras decisões."},{"n":"Tirar o Espaço fixo do servidor","cam":["api","web"],"hoje":"`app.ts:101` lê `WORKSPACE_ID` e passa o valor ao hook de autenticação e às rotas públicas de Formulário e Tarefa. O CORS só aceita os cabeçalhos `authorization` e `content-type` (`app.ts:172`).","fazer":["No hook (`plugins/autenticacao.ts`), ler o Espaço do cabeçalho `x-espaco`, conferir que o usuário é Membro dele (consulta em `plataforma.registros` por `colecao = 'members'` e `dados->>'userId'`) e, sem cabeçalho, usar o único Espaço do usuário ou responder 400 pedindo a escolha.","Acrescentar `x-espaco` a `allowedHeaders` do CORS.","As rotas públicas acham o Espaço pelo segredo do Formulário ou da Tarefa, não pela configuração.","Na web, um seletor de Espaço no menu do usuário; `apps/web/src/dados/transporte.ts` passa a mandar `x-espaco`."],"pronto":"Teste em `apps/api/src/plugins/autenticacao.test.ts`: um usuário Membro de dois Espaços recebe o Espaço certo pelo cabeçalho e 403 para um Espaço de que não é Membro.","nota":"Só se a 12.1 decidir por várias empresas."}]},{"id":"12.3","n":"Ciclo de vida do usuário","objetivo":"Hoje “Convite enviado” (`apps/web/src/app/(shell)/configuracoes/membros/page.tsx:113`) não envia nada: `convidarMembro` (`apps/api/src/servicos/convidar-membro.ts`) só procura o e-mail no Supabase Auth e grava o Membro `pendente`. Não há operação de aceitar, e o hook responde 403 “Seu convite ainda não foi aceito.” (`plugins/autenticacao.ts:86-88`). Também não há “esqueci a senha”, troca de senha nem como suspender. Esta tarefa liga o convite de ponta a ponta e fecha esses buracos.","pronto":"Um convite feito pela tela chega por e-mail; a pessoa clica, cria a senha, informa o nome e cai no Início como Membro `ativo`; outra pessoa redefine a senha esquecida sozinha.","subs":[{"n":"Configurar o envio de e-mail do Supabase Auth","cam":["voce","infra"],"hoje":"Não conferi o SMTP do projeto. O envio padrão do Supabase tem limite baixo de e-mails por hora e serve só para teste.","fazer":["Em Authentication › Emails › SMTP Settings, configurar um SMTP próprio, com remetente do domínio da Tria.","Nos modelos “Invite user” e “Reset password”, apontar o link para `{{ .SiteURL }}/entrar/confirmar?token_hash={{ .TokenHash }}&type=invite` e `…&type=recovery`.","Em URL Configuration, pôr o endereço de produção da web como Site URL e os de homologação nas Redirect URLs."],"pronto":"Um e-mail de teste enviado pelo painel chega na caixa de entrada, não no spam."},{"n":"Enviar o convite por e-mail de verdade","cam":["api"],"hoje":"`convidarMembro` chama `resolverUsuarioPorEmail` (`apps/api/src/autenticacao/resolver-usuario.ts:31`), que procura o e-mail em `auth.admin.listUsers`, e depois `inviteMember` dentro de `executar`. Nenhum e-mail sai.","fazer":["Em `convidarMembro`, quando o e-mail não tem usuário, chamar `clienteAdmin().auth.admin.inviteUserByEmail(email, { redirectTo: \u003corigem da web>/entrar/confirmar })` antes da transação e passar o `user.id` devolvido como `userId` para `inviteMember`.","Se `inviteMember` recusar, apagar o usuário recém-criado com `auth.admin.deleteUser`.","Quando o e-mail já tem usuário, não mandar convite: a pessoa entra com a senha que já tem e o aceite acontece no primeiro acesso (subtarefa seguinte).","Criar a rota `POST /membros/:id/convite` (só Administrador ou Proprietário, Membro `pendente`) que reenvia o e-mail, e um botão “Reenviar convite” em `configuracoes/membros/[membro]/page.tsx`."],"pronto":"Teste em `apps/api/src/servicos/convidar-membro.test.ts` com o cliente do Auth falso: convidar um e-mail novo chama `inviteUserByEmail` uma vez e grava o Membro com o `userId` devolvido; uma recusa do domínio apaga o usuário criado."},{"n":"Aceitar o convite no primeiro acesso","cam":["dom","api"],"hoje":"Não existe operação de aceite; o comentário em `members.ts:515-518` diz que ela “não é operação desta fase”. O hook barra `pendente` em toda rota.","fazer":["Criar `aceitarConvite(state, actingMemberId, { nome })` em `packages/dominio/src/operations/members.ts`: o Membro que chama precisa estar `pendente` e ter `userId`; passa a `ativo`, ganha `joinedAt`, perde `invitedIdentity`, e o `displayName` vira o nome informado; grava a Atividade “Convite aceito”.","Criar a rota `POST /convites/aceitar` no `apps/api`, com `config: { aceitaPendente: true }`; no hook (`plugins/autenticacao.ts:85`), deixar passar o `pendente` só nas rotas com essa marca. A rota roda `executar` com `aceitarConvite`.","Registrar a operação em `registro.ts` e o schema em `apps/api/src/rotas/esquemas/membros.ts`: `ESQUEMAS satisfies EsquemasCompletos` não compila sem ele."],"pronto":"Teste em `apps/api` (Postgres local): com o token de um Membro pendente, `GET /estado` dá 403, `POST /convites/aceitar` dá 200, e o `GET /estado` seguinte dá 200 com o Membro `ativo`."},{"n":"Criar as páginas de confirmar o link e de criar a senha","cam":["web"],"hoje":"Só existe `/entrar` (`apps/web/src/app/entrar/page.tsx` e `actions.ts`). As rotas públicas do `proxy.ts` são `/entrar` e `/sair` (`apps/web/src/proxy.ts:17`).","fazer":["Criar `apps/web/src/app/entrar/confirmar/route.ts`: lê `token_hash` e `type`, chama `supabase.auth.verifyOtp` com o cliente do servidor (`@/autenticacao/cliente-servidor`) e redireciona para `/entrar/nova-senha?tipo=\u003ctype>`; link vencido leva a `/entrar` com a frase “Este link venceu. Peça outro a quem te convidou.”","Criar `apps/web/src/app/entrar/nova-senha/page.tsx` com ação no servidor: nova senha (mínimo 8 caracteres) e confirmação, `supabase.auth.updateUser({ password })`; se `tipo=invite`, pede também o nome e chama `POST /convites/aceitar`; no fim, vai para `/`.","Pôr `/entrar/confirmar` e `/entrar/esqueci` em `PUBLICAS` no `proxy.ts`."],"pronto":"Em homologação, o fluxo vai do e-mail de convite até o Início sem erro, e o Membro aparece `ativo` em `/configuracoes/membros`.","nota":"Antes de escrever, ler o guia de route handlers e de ações no servidor em `node_modules/next/dist/docs/` (`AGENTS.md`: este Next 16 tem mudanças)."},{"n":"Criar o “Esqueci a senha”","cam":["web"],"hoje":"A tela de entrar não tem o link; não existe página de redefinição.","fazer":["Link “Esqueci a senha” em `entrar/page.tsx` para `/entrar/esqueci`.","Página `apps/web/src/app/entrar/esqueci/page.tsx` com ação que chama `supabase.auth.resetPasswordForEmail(email, { redirectTo: \u003corigem>/entrar/confirmar })` e responde sempre “Se o e-mail estiver cadastrado, enviamos um link.”, sem dizer se o e-mail existe (mesmo cuidado de `actions.ts`).","O link do e-mail cai em `/entrar/nova-senha?tipo=recovery`, da subtarefa anterior."],"pronto":"Em homologação, uma pessoa pede o link, troca a senha e entra com a senha nova; a senha antiga é recusada."},{"n":"Trocar a senha em Minha conta","cam":["web"],"hoje":"`apps/web/src/app/(shell)/minha-conta/page.tsx` mostra o Membro e a Memória de Usuário; não mexe em senha.","fazer":"Uma seção “Senha” com senha atual, nova e confirmação; a ação confere a atual com `signInWithPassword` no e-mail da sessão e grava a nova com `updateUser({ password })`.","pronto":"A senha nova vale no próximo login; com a senha atual errada, aparece “Senha atual incorreta.” e nada muda."},{"n":"Suspender e reativar um Membro","cam":["dom","api","web"],"hoje":"O estado `suspenso` existe (`workspace.ts:13`), mas nenhuma operação chega nele.","fazer":["Criar `suspenderMembro(state, actingMemberId, memberId)` e `reativarMembro(…)` em `members.ts`: só Administrador ou Proprietário; não suspende o Proprietário (`workspace.ownerMemberId`) nem a si mesmo; `ativo` → `suspenso` e volta; Atividade em cada ato; o Membro continua nas Equipes (RN-ET-12 aceita `suspenso`).","Registrar as duas em `registro.ts` e os schemas em `apps/api/src/rotas/esquemas/membros.ts`.","Se a 12.1 escolher “sem acesso”, `plugins/autenticacao.ts:85` passa a recusar `suspenso` com “Seu acesso foi suspenso.” e `podeNoCrm` (`permissoes.ts:67`) deixa de aceitar leitura.","Botões “Suspender” e “Reativar” em `configuracoes/membros/[membro]/page.tsx`."],"pronto":"Testes no domínio (recusas e ida e volta) e um teste de rota: o Membro suspenso recebe a resposta que a 12.1 decidiu em `GET /estado` e 403 em `POST /operacoes`; reativado, volta a gravar."},{"n":"Fechar o redirecionamento aberto do login","cam":["web"],"hoje":"`apps/web/src/app/entrar/actions.ts:29` aceita qualquer `para` que comece com `/` e não com `//`. Um `para` como `/\\evil.com` passa, e o navegador lê a barra invertida como barra: depois do login, a pessoa vai para outro site.","fazer":"Extrair a regra para `apps/web/src/autenticacao/destino-seguro.ts`: aceitar só caminho que comece com uma `/`, sem `//` nem `\\`, e cuja `new URL(para, origem)` tenha a mesma origem; senão, `/`.","pronto":"Teste em `destino-seguro.test.ts`: `/crm` passa; `//evil.com`, `/\\evil.com` e `https://evil.com` viram `/`."}]},{"id":"12.4","n":"Papéis, Equipes e acessos pela tela","objetivo":"Papéis personalizados, Equipes e Concessões só nascem por dados iniciais ou ao criar um contêiner (`state.grants.push` em `structure.ts:135`, `:241`, `:375`, `members.ts:337` e `:767`). A tela de Papéis só lista e exclui (`configuracoes/papeis/page.tsx`) e a de Equipes só lista (`configuracoes/equipes/page.tsx`). Administradores passam a criar e editar os três pela tela.","pronto":"Um Papel criado pela tela, sem o módulo CRM, tira o CRM do menu de quem o recebe; uma Equipe criada pela tela recebe acesso a uma Lista privada e os Membros dela passam a ver a Lista.","subs":[{"n":"Criar e editar Papel personalizado","cam":["dom","api"],"hoje":"Só existe `deleteRole` (`members.ts:572`). Um Papel de sistema é imutável (`Role.system`, `workspace.ts:60`).","fazer":["Criar `createRole(state, actingMemberId, { nome, base, modulos })` e `updateRole(state, actingMemberId, roleId, { nome?, modulos? })` em `members.ts`: só Administrador ou Proprietário; `base` entre `administrador`, `membro` e `convidado`, nunca `proprietario`; nome único no Espaço; Papel de sistema recusa edição; a base não muda depois de criada; Atividade em cada ato.","Registrar as duas em `registro.ts` e os schemas em `apps/api/src/rotas/esquemas/membros.ts`."],"pronto":"Testes no domínio: cria, edita nome e módulos, recusa nome repetido, base Proprietário e edição de Papel de sistema."},{"n":"Criar e editar Equipe","cam":["dom","api"],"hoje":"Não há operação de Equipe; o tipo `Team` (`workspace.ts:75`) só nasce pelo seed.","fazer":["Criar `createTeam`, `updateTeam` (nome e descrição), `addMemberToTeam`, `removeMemberFromTeam` e `deleteTeam` num arquivo novo `packages/dominio/src/operations/equipes.ts`: só Administrador ou Proprietário; só Membro `ativo` ou `suspenso` entra (RN-ET-12); `deleteTeam` recusa enquanto a Equipe tiver Concessões e diz quantas.","Registrar e criar os schemas, como na subtarefa anterior."],"pronto":"Testes no domínio de cada operação, incluindo a recusa de um Membro `removido` e de apagar Equipe com Concessão."},{"n":"Conceder e revogar acesso a um Espaço, Pasta ou Lista","cam":["dom","api"],"hoje":"Uma Concessão só nasce ao criar o contêiner (`structure.ts`), ao transferir na sucessão (`members.ts:337`) ou no acesso de governança (`grantGovernanceAccess`, `members.ts:722`).","fazer":["Criar `concederAcesso(state, actingMemberId, { subjectKind, subjectId, action, resourceType, resourceId })` e `revogarAcesso(state, actingMemberId, grantId)` em `packages/dominio/src/operations/acessos.ts`: quem chama precisa administrar o contêiner (`containerAdminRefusal`, `derive.ts:1053`); `subjectKind` entre `member`, `team` e `role`; `action` entre `ver`, `comentar`, `editar` e `administrar`; `scope: “subarvore”`, `origin: “concessaoDireta”`; Atividade em cada ato.","`revogarAcesso` recusa tirar a última concessão `administrar` de um contêiner privado, que ficaria sem ninguém (B38a: privado sem concessão não existe para ninguém).","Registrar e criar os schemas."],"pronto":"Teste no domínio: conceder `ver` de uma Lista privada a uma Equipe faz `memberReachesContainer` ser verdadeiro para os Membros dela; revogar volta a falso."},{"n":"Telas de Papéis, Equipes e acessos editáveis","cam":["web"],"hoje":"`configuracoes/papeis/page.tsx` (154 linhas) tem só “Excluir”; `configuracoes/equipes/page.tsx` (113 linhas) não tem botão; não há diálogo de acesso a contêiner (o `share-task-dialog.tsx` é do link público da Tarefa).","fazer":["Em Papéis: botão “Novo Papel” e “Editar”, com diálogo de nome, base e as seis chaves de módulo.","Em Equipes: “Nova Equipe”, “Editar” e a lista de Membros com adicionar e tirar.","Criar `apps/web/src/features/estrutura/acessos-do-conteiner-dialog.tsx`, aberto pelo menu das páginas de Espaço, Pasta e Lista, que lista as Concessões e permite conceder e revogar."],"pronto":"Pela tela, em homologação: criar um Papel, uma Equipe com dois Membros e dar à Equipe acesso a uma Lista privada; os dois Membros passam a ver a Lista depois de recarregar.","nota":"A Sessão 2 limpa as páginas de Espaço, Pasta e Lista: combinar onde fica o botão de acessos."}]},{"id":"12.5","n":"Área de gestão de usuários","objetivo":"Ter um lugar onde quem gere usuários faz tudo: convidar, reenviar convite, mudar Papel, suspender, reativar e remover. Se a 12.1 decidir por Superadmin acima das empresas, essa área também cria empresas.","pronto":"Quem gere usuários faz o ciclo completo de uma pessoa (convite, aceite, Papel, suspensão, remoção) sem sair da área, e cada ato aparece em `/configuracoes/auditoria`.","subs":[{"n":"Completar `/configuracoes/membros`","cam":["web"],"hoje":"A lista (`configuracoes/membros/page.tsx`, 526 linhas) convida e remove; a ficha (`membros/[membro]/page.tsx`, 403 linhas) muda Papel e e-mail do convite.","fazer":"Filtro por estado (pendente, ativo, suspenso, removido); na ficha, os botões “Reenviar convite”, “Suspender” e “Reativar” (tarefa 12.3) e os módulos que o Papel libera, só para leitura.","pronto":"Pela tela, em homologação, uma pessoa passa por pendente, ativo, suspenso, ativo e removido."},{"n":"Criar empresa com o primeiro Proprietário","cam":["api","web"],"hoje":"Só por script: `npm run bootstrap:gestao -w @n1/api` (`apps/api/src/bootstrap/gestao.cli.ts`), que monta o Espaço “Gestão” do Financeiro.","fazer":["Rota `POST /plataforma/espacos`, só para quem está em `plataforma.superadmins`: cria o Espaço com nome e o Proprietário por e-mail, que recebe o convite da 12.3.","Tela `apps/web/src/app/(shell)/plataforma/page.tsx` com a lista de Espaços e o formulário."],"pronto":"Uma empresa criada pela tela, e o Proprietário dela entra pelo convite.","nota":"Só se a 12.1 decidir por várias empresas e por Superadmin da plataforma."},{"n":"Registrar as ações de gestão de usuários","cam":["dom"],"hoje":"`inviteMember` e `alterarPapelDoMembro` já gravam Atividade (`members.ts:530` e `:205`), e `/configuracoes/auditoria` existe.","fazer":"Garantir que toda operação nova desta sessão (`aceitarConvite`, `suspenderMembro`, `reativarMembro`, `createRole`, `updateRole`, as de Equipe e as de acesso) grava Atividade com quem, quando, antes e depois.","pronto":"Teste no domínio para cada operação nova conferindo a Atividade gravada; as ações de teste aparecem em `/configuracoes/auditoria`."}]},{"id":"12.6","n":"Aplicar o acesso por módulo","objetivo":"Quem não tem o módulo não o vê no menu nem o usa por fora da tela. Hoje só o Financeiro é escondido (`app-shell.tsx:365`) e recusado (`rotas/financeiro.ts`); CRM, IA, Ferramentas e Painéis abrem para todos.","pronto":"Um Membro com Papel sem CRM não vê o assunto CRM, cai na página “sem acesso” ao abrir `/crm/contatos` e recebe 403 em `GET /contatos` e em `POST /operacoes/createDeal`.","subs":[{"n":"Esconder no menu e nas páginas","cam":["web"],"hoje":"`app-shell.tsx:365` filtra só o Financeiro, por `vePastaFinanceiro`. As páginas abrem para qualquer Membro.","fazer":["Trocar o filtro de `assuntosVisiveis` por `membroAcessaModulo(data, memberId, a.chave)`.","No `AppShell`, quando o módulo da rota atual (`assuntoDe(pathname)`) não está liberado, mostrar um estado “Você não tem acesso a este módulo. Fale com quem administra o Espaço.” no lugar da página."],"pronto":"Teste de componente em `apps/web`: com um Papel só de Trabalho, o trilho mostra só Trabalho, e a rota `/crm/contatos` mostra o estado sem acesso."},{"n":"Recusar na api por módulo","cam":["api","dom"],"hoje":"As rotas do CRM conferem só a base do Papel (`exigir`, `servicos/crm/acesso.ts:39`); `POST /operacoes` não sabe a que módulo uma operação pertence.","fazer":["Em `packages/dominio/src/operations/registro.ts`, um mapa `MODULO_DA_OPERACAO` com tipo `Record\u003cNomeDeOperacao, Modulo>`, para que uma operação nova sem módulo não compile.","Em `operacoes.ts`, antes do despacho, responder 403 quando `membroAcessaModulo` recusa o módulo da operação.","Em `exigir`, conferir o módulo `crm` (a consulta `papelDoMembro`, `apps/api/src/repositorios/crm/membros.ts:20`, passa a devolver `modulos` do Papel).","Em `rotas/financeiro.ts`, conferir o módulo `financeiro` junto com o alcance à Pasta.","Em `visibilidadePara`, não mandar as coleções de módulo desligado: `contacts`, `companies`, `deals`, `conversations` e `channels` sem CRM; `agents`, `chatSessions`, `automations`, `documents` e `skills` sem IA; `grupos`, `comunidades`, `flows` e `linksDeCaptacao` sem Ferramentas; `panels` sem Painéis."],"pronto":"Testes de rota: um Membro sem CRM recebe 403 em `GET /contatos` e em `POST /operacoes/createDeal`, e o `GET /estado` dele vem sem `contacts`; um Membro com CRM continua recebendo tudo."}]}],"ajuste":"+2 dias se for só a Tria (convite real, Papéis e Equipes editáveis, módulos). Cerca de +4 se a plataforma atender várias empresas."},{"id":"T","n":"Reunião 1 de escopo da IA","trilha":true,"inicioFixo":"2026-10-19","duracao":1,"dep":[],"realizada":true,"desc":"Realizada em 19/10. Abaixo, o que ficou decidido, o que cada decisão muda no plano e os pontos que merecem atenção. O que não foi decidido foi para o levantamento de escopo da IA (T2), com prazos.","partida":["Nenhuma IA de verdade estava ligada ao produto: as telas existiam, mas as respostas eram texto pronto ou não aconteciam."],"pronto":"Realizada em 19/10. Seis decisões registradas.","tarefas":[{"id":"T.1","n":"O que foi decidido","objetivo":"As seis decisões da reunião de 19/10, com o que cada uma muda no plano.","pronto":"Decisões registradas.","subs":[{"n":"O que é um Plugin","cam":["dec"],"decisao":true,"decidido":"Um pacote que junta Skills, Conhecimento e Automações e se instala num Agente de uma vez.","muda":"Plugin vira um tipo novo no domínio e uma tela própria, na Sessão 18. A aba atual “Plugins”, que só lista Ferramentas, passa a se chamar “Ferramentas”.","atencao":"Na sua nota, o Plugin não inclui Ferramentas nem Integrações. Um Plugin que dependa de uma Integração (por exemplo, um Plugin Financeiro que usa o Omie) só funciona onde ela estiver conectada."},{"n":"O que é uma Integração","cam":["dec"],"decisao":true,"decidido":"Uma conexão que o time escolhe colocar, em dois níveis: da empresa (todos usam a mesma, como o Omie) e pessoal (cada pessoa conecta a sua, como a Google Agenda). Começa com Omie, Google Agenda e Miro. Usar o Composio, se der.","muda":"Entra uma sessão nova, a Sessão 15 · Integrações. Hoje a Integração não tem dono (`Integration`, `packages/dominio/src/types/workspace.ts:182`) e conectar só troca o estado na tela; ela ganha o nível empresa ou pessoal e passa a conectar de verdade.","atencao":"O Composio tem Google Agenda e Miro e foi feito para conexões por usuário, mas não tem o Omie: a página do toolkit não existe. O Omie fica como Ferramenta nossa, chamando a API do Omie com a chave da empresa guardada no cofre da Sessão 1. Preço por chamada e onde os tokens dos usuários ficam guardados ainda precisam ser confirmados: as fontes que achei se contradizem. Por isso o levantamento de escopo da IA traz uma prova de conceito do Composio (T2.2)."},{"n":"O que é o Conhecimento","cam":["dec"],"decisao":true,"decidido":"Banco vetorial padrão.","muda":"Confirma o `pgvector` no Postgres que já usamos, na Sessão 17. Falta escolher o modelo que gera os embeddings (decisão 17.4.1)."},{"n":"O que é uma Automação","cam":["dec"],"decisao":true,"decidido":"Uma rotina escrita em código pelo time, sem botão de criar na tela. O Agente consegue acioná-la. A lista das Automações ainda vai ser definida.","muda":"A Sessão 18 troca o editor visual por um catálogo em código e deixa o Agente acionar as Automações. Saem as tarefas antigas de completar o editor: ramificar, acionar pela tela e consertar Notificar e Aguardar.","atencao":"Hoje existe um editor visual de 1.310 linhas, e as Automações do Financeiro rodam sozinhas, por evento e por horário. Ficaram em aberto duas perguntas: uma Automação também roda sozinha ou só quando um Agente chama? E o que acontece com as do Financeiro? A Sessão 18 fica bloqueada até a lista chegar."},{"n":"O que é uma Habilidade","cam":["dec"],"decisao":true,"decidido":"Uma Skill em arquivo .md.","muda":"A Habilidade de hoje (com versões, contratos de entrada e saída e requisitos de Ferramenta, `packages/dominio/src/types/ai.ts:58-84`) vira um texto `SKILL.md`: nome e descrição no cabeçalho e as instruções no corpo. É o mesmo formato dos Agent Skills do Claude. Entra na Sessão 14, e a aba “Habilidades” passa a se chamar “Skills”."},{"n":"O que um Agente pode receber","cam":["dec"],"decisao":true,"decidido":"Cinco poderes: Ferramenta, Base de conhecimento, Integração, Plugin e Skill. Avaliar se existe um framework para construir os Agentes.","muda":"O Construtor, na Sessão 14, passa a ter um passo para cada poder. A escolha do framework é o primeiro item do levantamento (T2.1), em 20/10.","atencao":"Dois pontos: falta decidir se uma Ferramenta nova se cria só no código ou também pela tela (por exemplo, uma chamada HTTP configurada com endereço e credencial), o que foi para o levantamento (T2.4). E as Automações também precisam entrar como poder, porque a sua nota diz que o Agente as aciona."}]}],"vocab":[["Agente","O funcionário virtual. Recebe poderes: Ferramentas, Conhecimento, Integrações, Plugins, Skills e as Automações que pode acionar.","Atendente comercial que responde leads no WhatsApp"],["Ferramenta","Uma ação que o Agente executa no sistema ou fora dele: ler e gravar registros, chamar um endereço HTTP.","Criar uma Tarefa; consultar uma conta no Omie"],["Skill","Um arquivo .md com as instruções de como fazer um trabalho.","qualificar-lead.md"],["Conhecimento","A biblioteca que o Agente consulta, buscada por significado num banco vetorial.","Tabela de preços, política de reembolso"],["Automação","Uma rotina escrita em código pelo time, que o Agente pode acionar. Não se cria pela tela.","A lista ainda vai ser definida por você"],["Integração","Uma conexão com um sistema de fora. Da empresa (todos usam a mesma) ou pessoal (cada um conecta a sua).","Omie (empresa); Google Agenda (pessoal); Miro"],["Plugin","Um pacote que junta Skills, Conhecimento e Automações e se instala num Agente de uma vez.","Plugin Financeiro: Skill de conferência, base do plano de contas e a Automação de lançamento"]],"sigla":"R1"},{"id":"T2","sigla":"LV","selo":"Pesquisa","n":"Levantamento de escopo da IA","trilha":true,"inicioFixo":"2026-10-20","fimFixo":"2026-10-22","dep":["T"],"desc":"Três dias de pesquisa, não de desenvolvimento. Você pesquisa cada ponto que ficou aberto na Reunião 1 e decide no dia marcado para ele. Cada item diz o que pesquisar, as opções, o que cada opção muda no plano e a minha recomendação. Quando decidir um item, me mande a resposta: eu registro no planejamento (o item vira “Decidida”) e ajusto as sessões que ele afeta.","partida":["Seis decisões tomadas na Reunião 1 (19/10).","18 decisões em aberto e a lista de Automações, agrupadas por assunto abaixo."],"pronto":"Todos os itens decididos e registrados no planejamento até qui 22/10.","tarefas":[{"id":"T2.1","n":"Base da IA: framework e modelo","inicio":"2026-10-20","prazo":"2026-10-20","objetivo":"As duas escolhas que tudo o mais da IA usa. Precisam vir primeiro.","pronto":"Framework e modelo decididos.","subs":[{"n":"Qual framework usar para os Agentes?","cam":["dec"],"decisao":true,"prazo":"2026-10-20","bloqueia":"13","pesquisar":["Ler a documentação do Tool Runner do SDK da Anthropic (TypeScript), de Managed Agents e do Claude Agent SDK.","Responder para cada um: o Agente roda no nosso servidor, com a permissão de quem pergunta? Dá para pedir aprovação antes de uma Ferramenta que grava? A resposta chega aos poucos na tela? Como se mede o custo?","Opcional: uma prova de conceito no `apps/api`, com uma Ferramenta que lista as Tarefas do Membro. Posso fazer em paralelo enquanto você pesquisa os outros itens."],"hoje":"Não há IA ligada ao produto.","opcoes":["(A) SDK da Anthropic com o Tool Runner, rodando no nosso servidor","(B) Managed Agents: a Anthropic roda o Agente e um ambiente de arquivos para ele","(C) Claude Agent SDK: o Claude Code como biblioteca"],"muda":"Define a base da Sessão 13 e de todas as sessões de IA depois dela.","recomendo":"(A). As Ferramentas são operações do nosso domínio e precisam rodar no nosso servidor, com a permissão do Membro. O Tool Runner dá o laço pronto e um ponto para pedir aprovação antes de executar. O mesmo SDK aceita servidores MCP, como o do Composio.","peso":"produto"},{"n":"Qual modelo de IA usar?","cam":["dec"],"decisao":true,"prazo":"2026-10-20","bloqueia":"13","pesquisar":["Ver a página de preços da Anthropic.","No Console da Anthropic, fazer a mesma tarefa típica (por exemplo, resumir uma Conversa e sugerir a resposta) nos três modelos e comparar qualidade e tempo."],"hoje":"Os três modelos que aparecem no seletor do Chat são fictícios.","opcoes":["(A) Um só, o mais forte: Claude Opus 5.5 (US$ 4 por milhão de tokens de entrada e US$ 20 de saída)","(B) Dois: Claude Haiku 5.5 (US$ 0,10 e US$ 0,50) para respostas simples e Claude Opus 5.5 para tarefas complexas, com cada Agente escolhendo o seu","(C) Um só, intermediário: Claude Sonnet 5.5 (US$ 2 e US$ 10)"],"muda":"A Sessão 13 liga o produto aos modelos escolhidos. Preços da tabela da Anthropic de outubro de 2026.","recomendo":"(B).","peso":"produto"}]},{"id":"T2.2","n":"Integrações","inicio":"2026-10-20","prazo":"2026-10-20","objetivo":"Como as Integrações da empresa e as pessoais funcionam, e se o Composio serve.","pronto":"As três escolhas feitas.","subs":[{"n":"Usar o Composio para Google Agenda e Miro?","cam":["dec"],"decisao":true,"prazo":"2026-10-20","bloqueia":"15","pesquisar":["Criar uma conta gratuita no Composio, conectar a sua Google Agenda e um quadro do Miro, e testar uma ação de cada (listar eventos, listar quadros).","Anotar: o preço do plano que serve; onde ficam guardados os tokens das pessoas; se dá para rodar no nosso servidor; como uma conexão fica “da empresa” ou “de uma pessoa”.","Conferir se a Google Agenda e o Miro têm servidor MCP oficial, que seria a alternativa sem o Composio.","Lembrar: o Composio não tem o Omie."],"hoje":"Nenhuma Integração conecta de verdade: conectar só troca o estado na tela.","opcoes":["(A) Composio para tudo o que ele tiver; o Omie e o que faltar viram Ferramentas nossas","(B) Integrações nossas para tudo, uma por uma"],"muda":"Com (A), a Sessão 15 faz só a ponte com o Composio e as telas de conexão, e cada Integração nova do catálogo dele custa pouco; em troca, paga-se por chamada e depende-se de um serviço de fora. Com (B), cada Integração é código nosso, cerca de 1 a 2 dias por Integração.","recomendo":"(A), se o preço e o lugar onde os dados ficam forem aceitáveis.","peso":"produto"},{"n":"Onde a pessoa conecta as Integrações?","cam":["dec"],"decisao":true,"prazo":"2026-10-20","bloqueia":"15","pesquisar":["Ver como o ClickUp, o HubSpot ou o Notion separam as integrações da empresa das pessoais."],"ver":"Configurações › Integrações e IA › Personalizar › Integrações.","hoje":"Duas telas listam as mesmas Integrações: IA › Personalizar › Integrações e Configurações › Integrações.","opcoes":["(A) As da empresa em Configurações › Integrações (só administrador); as pessoais em Minha conta › Conexões (cada um a sua)","(B) Tudo numa tela só, com uma coluna “empresa / pessoal”"],"muda":"Define as telas da Sessão 15. Nos dois casos, a aba de Integrações de IA › Personalizar sai do menu.","recomendo":"(A).","peso":"arrumacao"},{"n":"Quando o Agente usa uma Integração pessoal, de quem é a conexão?","cam":["dec"],"decisao":true,"prazo":"2026-10-20","bloqueia":"15","pesquisar":["Pensar em três casos reais da Tria. Por exemplo: o Agente marca uma reunião, na agenda de quem? Cria uma nota no Miro, no quadro de quem?"],"hoje":"Ainda não existe conexão pessoal.","opcoes":["(A) De quem está conversando com o Agente no Chat; num atendimento de cliente pela Caixa de Entrada, só as conexões da empresa","(B) Sempre a do dono do Agente"],"muda":"Define a regra de permissão das Integrações nas Sessões 15 e 16. Com (B), um Agente compartilhado usaria a agenda do dono para todo mundo.","recomendo":"(A).","peso":"produto"}]},{"id":"T2.3","n":"Custo, memória e telas do Chat","inicio":"2026-10-21","prazo":"2026-10-21","objetivo":"O que a Sessão 13 precisa saber para ligar a IA com segurança: quanto gastar, o que guardar e o que a pessoa vê.","pronto":"As três escolhas feitas, com os valores do teto.","subs":[{"n":"Quanto a IA pode gastar por mês?","cam":["dec"],"decisao":true,"prazo":"2026-10-21","bloqueia":"13","pesquisar":["Estimar quantas conversas com IA a Tria terá por dia: no Chat interno e, mais tarde, no atendimento a clientes.","Multiplicar pelo custo de uma resposta medido no teste do modelo (T2.1)."],"hoje":"Não há limite, porque não há IA ligada.","opcoes":["Teto mensal por empresa, por Agente ou os dois: diga o valor em reais","Ao chegar no teto: (A) só avisa; (B) pausa o Agente; (C) passa a pedir aprovação para tudo"],"muda":"A Sessão 13 grava quanto cada resposta custou e confere o teto antes de chamar a IA.","recomendo":"Os dois tetos; aviso ao chegar em 80% e pausa em 100%.","peso":"produto"},{"n":"O que o Agente lembra de uma conversa para outra?","cam":["dec"],"decisao":true,"prazo":"2026-10-21","bloqueia":"14","pesquisar":["Listar o que vale o Agente lembrar (por exemplo, como o cliente prefere ser chamado, o que ele já comprou).","Confirmar com quem cuida de LGPD na Tria por quanto tempo guardar o histórico."],"hoje":"Existe um espaço de memória do Agente, mas nada grava nele. O histórico de cada trabalho do Agente fica guardado para sempre.","opcoes":["Entre conversas: (A) o Agente guarda fatos úteis, e a pessoa pode ver e apagar; ou (B) cada conversa começa do zero","Histórico de cada trabalho do Agente: guardar por 90 dias, 1 ano ou para sempre"],"muda":"Define a memória da Sessão 14 e a limpeza automática da Sessão 19.","recomendo":"(A), e guardar o histórico por 1 ano.","peso":"produto"},{"n":"O que a pessoa vê no Chat depois de mandar uma mensagem?","cam":["dec"],"decisao":true,"prazo":"2026-10-21","bloqueia":"13","pesquisar":["Usar o Claude.ai, o ChatGPT e o Copilot numa tarefa com várias etapas
